      # ───────────────────────────────────────────────────────────── 9.5
      - order: 5
        id: mg9-005
        slug: expected-sarsa-and-double-q-learning
        title: Expected SARSA and Double Q-learning
        subtitle: Two fixes to the basic updates, one for noise and one for a bias hidden in the max, each measured.
        tags: [game-studio, machine-learning, reinforcement-learning, expected-sarsa, double-q-learning, maximization-bias]
        aliases: expected sarsa double q-learning maximization bias overestimation max of noisy estimates double estimator step size variance
        timeToComplete: 50
        coreConcept: >-
          Expected SARSA replaces SARSA's sampled next action with an average over what the policy might do,
          R + γ Σ π(a′|S′) Q(S′, a′): the same expectation with less noise, so it tolerates larger step sizes. Double
          Q-learning fixes a bias in Q-learning: the max of noisy estimates is too high on average, so Q-learning
          overrates actions whose estimates are lucky. It keeps two tables, lets one choose the best next action and the
          other value it, so the choice and the valuation do not share the same luck.
        prerequisites: [mg9-004]
        nextLesson: mg9-006
        hook:
          question: >-
            Ten slot machines all pay nothing on average. You try each once and pick the one that paid most. How much do
            you expect it to pay next time, and how much did you think it would?
          realWorldContext: >-
            Overestimation from a max is everywhere: the winner's curse in auctions, the best-looking result among many
            experiments. In reinforcement learning it led to Double Q-learning (van Hasselt, 2010) and Double DQN (2016),
            now standard. Sutton & Barto, sections 6.6–6.7.
        intuition:
          prose:
            - >-
              **The max is biased.** Cell 1: ten actions, every one truly worth 0; estimate each from a single noisy sample and
              take the largest. On average that largest estimate is 1.54, not 0 (with 5 samples each, 0.70; with 20, 0.35).
              Whichever estimate happens to be high is the one the max picks. Before running it, predict whether the max is
              near 0: it is not, and it shrinks only as estimates get better.
            - >-
              **Double estimation.** Choose the best action with one set of estimates, and read its value from a second,
              independent set: on average 0.003, close to the truth. The second set has no reason to share the first's luck.
            - >-
              **Maximization bias in Q-learning** (Sutton & Barto, Example 6.7; cell 2). From A, right ends the episode with
              0; left leads to B, where ten actions each end with a reward around −0.1, noisily. Left is worse, but
              $\max_a Q(B, a)$ is pushed up by B's luckiest action, so Q-learning goes left up to 96% of the time early on
              (86% in the first 50 episodes, averaged over 300 runs). With ε = 0.1 the best possible is 5%. Double
              Q-learning keeps two tables, each updated on half the steps, with the target
              $R + \gamma Q_B(S', \arg\max_a Q_A(S', a))$ for table A (and the mirror for B): it peaks at 53% and falls fast.
            - >-
              **Expected SARSA.** SARSA's target depends on the single A′ it happens to choose; Expected SARSA averages over
              the policy, $R + \gamma \sum_{a'} \pi(a' \mid S') Q(S', a')$, which is SARSA's target with the noise of A′
              removed. Cell 3 on the cliff: with α = 1 (each update replaces the old value with the target), SARSA's return
              collapses to −102.7 per episode while Expected SARSA's improves to −24.8. In Game Studio's Compare the same
              settings give −91.1 ± 15.4 against −22.3 ± 2.1.
          callouts:
            - type: procedure
              title: "Procedure: choosing among the four updates"
              body: >-
                Step 1. Rewards noisy, many actions? Q-learning may overestimate: try Double Q-learning.
                Step 2. Learning on-policy (exploration costs)? Prefer Expected SARSA to SARSA: same answer, less noise.
                Step 3. Large step sizes help early learning: Expected SARSA tolerates them best.
                Step 4. Compare the candidates over seeds, on both the learning return and the greedy score.
            - type: warning
              title: Double Q-learning is not two Q-learners
              body: >-
                The two tables must cross: the table being updated chooses the action, the other one values it. Using the
                same table for both is ordinary Q-learning with half the data. Act on their sum (or average).
            - type: warning
              title: Expected SARSA's average uses the current policy
              body: >-
                The probabilities π(a′|S′) are the exploring policy's, at the current ε (or τ). With ε = 0 it is exactly
                Q-learning.
            - type: insight
              title: "What the picture shows (cell 4)"
              body: >-
                Misconception it contradicts: "more data fixes a biased estimate quickly". Q-learning's line climbs to 96%
                left before it slowly comes down; the bias is strongest exactly when estimates are new.
            - type: insight
              title: In the ML Lab
              body: >-
                ML Lab lesson 37.4 measures the same overestimation on its gridworld (a learned value of 4.89 against a true
                4.64). [Open the ML Lab](#/lab/ml-lab).
          visualizations:
            - id: JSNotebook
              title: "Build it: bias and noise"
              caption: The max of noisy estimates, Example 6.7, step sizes on the cliff, and the bias over time.
              props:
                lesson:
                  title: Expected SARSA and Double Q-learning
                  subtitle: Two fixes, measured.
                  cells:
                    - type: js
                      instruction: |-
                        ### 1. The max of noisy estimates
                        Predict first: is the max near 0?
                      startCode: |-
                        const seeded = (seed) => { let a = seed >>> 0; return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296 } }
                        const normal = (rand) => Math.sqrt(-2 * Math.log(1 - rand())) * Math.cos(2 * Math.PI * rand())
                        const mean = (xs) => xs.reduce((a, b) => a + b, 0) / xs.length

                        // The max of noisy estimates is biased. Ten actions, every one truly worth 0. Estimate each from n noisy samples
                        // (spread 1) and take the largest estimate, as Q-learning's max does. Predict first: is the max near 0?
                        // Double estimation: choose the best action with one set of samples, and value it with a second, independent set.
                        const rand = seeded(7)
                        for (const n of [1, 5, 20]) {
                          const single = [], double = []
                          for (let trial = 0; trial < 2000; trial++) {
                            const est = () => Array.from({ length: 10 }, () => mean(Array.from({ length: n }, () => normal(rand))))
                            const A = est(), B = est()
                            single.push(Math.max(...A))
                            double.push(B[A.indexOf(Math.max(...A))])
                          }
                          console.log(n + ' samples each: max of the estimates ' + mean(single).toFixed(3) + ', double estimate ' + mean(double).toFixed(3) + ' (truth 0)')
                        }
                    - type: js
                      instruction: |-
                        ### 2. Maximization bias
                        Predict first: how often each goes left.
                      startCode: |-
                        const seeded = (seed) => { let a = seed >>> 0; return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296 } }
                        const normal = (rand) => Math.sqrt(-2 * Math.log(1 - rand())) * Math.cos(2 * Math.PI * rand())
                        const mean = (xs) => xs.reduce((a, b) => a + b, 0) / xs.length

                        // Sutton & Barto's Example 6.7. From A: right ends the episode with 0; left goes to B with 0. B has 10 actions, each
                        // ending the episode with a reward drawn around −0.1 (spread 1). So left is worse on average, but some of B's
                        // noisy estimates will look positive. ε 0.1, α 0.1, γ 1. A is state 0, B is state 1.
                        function run(method, episodes, seed) {
                          const rand = seeded(seed), QA = [[0, 0], new Array(10).fill(0)], QB = [[0, 0], new Array(10).fill(0)], lefts = []
                          const sum = (s) => QA[s].map((q, a) => q + (method === 'double' ? QB[s][a] : 0))
                          const greedyOf = (row) => { const best = Math.max(...row), ties = []; row.forEach((q, a) => { if (q === best) ties.push(a) }); return ties[Math.floor(rand() * ties.length)] }
                          const choose = (s) => (rand() < 0.1 ? Math.floor(rand() * QA[s].length) : greedyOf(sum(s)))
                          for (let ep = 0; ep < episodes; ep++) {
                            const a = choose(0)
                            lefts.push(a === 0 ? 1 : 0)
                            const steps = a === 0 ? [[0, 0, 1], [1, choose(1), -1]] : [[0, 1, -1]]   // [state, action, next state (−1: end)]
                            for (const [s, act, next] of steps) {
                              const r = s === 1 ? -0.1 + normal(rand) : 0
                              if (method === 'double' && rand() < 0.5) {
                                const target = r + (next < 0 ? 0 : QA[next][greedyOf(QB[next])])
                                QB[s][act] += 0.1 * (target - QB[s][act])
                              } else {
                                const target = r + (next < 0 ? 0 : method === 'double' ? QB[next][greedyOf(QA[next])] : Math.max(...QA[next]))
                                QA[s][act] += 0.1 * (target - QA[s][act])
                              }
                            }
                          }
                          return lefts
                        }
                        const share = (method, upTo) => mean(Array.from({ length: 300 }, (_, k) => mean(run(method, 300, k + 1).slice(0, upTo))))

                        // Predict first: how often does each go left in its first 10, 50 and 300 episodes? (The best possible with ε 0.1 is
                        // 5%: left only by a random step.)
                        for (const method of ['q', 'double']) {
                          console.log((method === 'q' ? 'Q-learning       ' : 'Double Q-learning') + ': left in the first 10 episodes ' + Math.round(share(method, 10) * 100) + '%, first 50 ' + Math.round(share(method, 50) * 100) + '%, all 300 ' + Math.round(share(method, 300) * 100) + '%')
                        }
                    - type: js
                      instruction: |-
                        ### 3. Step sizes on the cliff
                        Predict first: SARSA at α = 1.
                      startCode: |-
                        const seeded = (seed) => { let a = seed >>> 0; return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296 } }
                        const normal = (rand) => Math.sqrt(-2 * Math.log(1 - rand())) * Math.cos(2 * Math.PI * rand())
                        const mean = (xs) => xs.reduce((a, b) => a + b, 0) / xs.length

                        const MOVES = [[0, -1], [1, 0], [0, 1], [-1, 0]], START = 3, CHEST = 47
                        function move(s, a) {
                          const x = Math.min(11, Math.max(0, Math.floor(s / 4) + MOVES[a][0])), y = Math.min(3, Math.max(0, (s % 4) + MOVES[a][1]))
                          if (y === 3 && x > 0 && x < 11) return { next: START, reward: -100, done: false }
                          return { next: x * 4 + y, reward: -1, done: x * 4 + y === CHEST }
                        }
                        function train(method, alpha, seed, episodes = 500) {
                          const rand = seeded(seed), Q = Array.from({ length: 48 }, () => [0, 0, 0, 0]), returns = [], eps = 0.1
                          const greedyOf = (row) => { const best = Math.max(...row), ties = []; row.forEach((q, a) => { if (q === best) ties.push(a) }); return ties[Math.floor(rand() * ties.length)] }
                          const choose = (s) => (rand() < eps ? Math.floor(rand() * 4) : greedyOf(Q[s]))
                          const expected = (row) => { const best = Math.max(...row), ties = row.filter((q) => q === best).length; return row.reduce((t, q) => t + (eps / 4 + (q === best ? (1 - eps) / ties : 0)) * q, 0) }
                          for (let ep = 0; ep < episodes; ep++) {
                            let s = START, a = choose(s), total = 0
                            for (let t = 0; t < 1000; t++) {
                              const r = move(s, a), a2 = choose(r.next)
                              const future = r.done ? 0 : method === 'sarsa' ? Q[r.next][a2] : method === 'expected' ? expected(Q[r.next]) : Math.max(...Q[r.next])
                              Q[s][a] += alpha * (r.reward + future - Q[s][a])
                              total += r.reward
                              if (r.done) break
                              s = r.next; a = method === 'sarsa' ? a2 : choose(s)
                            }
                            returns.push(total)
                          }
                          return returns
                        }

                        // Expected SARSA's target averages over what the policy might do next instead of sampling one A′, so it is less
                        // noisy, and it tolerates a large step size. Average return per episode over all 500 (5 seeds), by α.
                        // Predict first: what happens to SARSA at α = 1?
                        for (const method of ['sarsa', 'expected', 'q']) {
                          const row = [0.1, 0.5, 1].map((alpha) => mean([1, 2, 3, 4, 5].map((seed) => mean(train(method, alpha, seed)))).toFixed(1))
                          console.log((method === 'sarsa' ? 'SARSA         ' : method === 'expected' ? 'Expected SARSA' : 'Q-learning    ') + ' α 0.1: ' + row[0] + ', α 0.5: ' + row[1] + ', α 1: ' + row[2])
                        }
                    - type: js
                      instruction: |-
                        ### 4. See it
                        Going left, episode by episode.
                      startCode: |-
                        const seeded = (seed) => { let a = seed >>> 0; return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296 } }
                        const normal = (rand) => Math.sqrt(-2 * Math.log(1 - rand())) * Math.cos(2 * Math.PI * rand())
                        const mean = (xs) => xs.reduce((a, b) => a + b, 0) / xs.length

                        // Sutton & Barto's Example 6.7. From A: right ends the episode with 0; left goes to B with 0. B has 10 actions, each
                        // ending the episode with a reward drawn around −0.1 (spread 1). So left is worse on average, but some of B's
