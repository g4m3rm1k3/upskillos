        math:
          prose:
            - >-
              **Under the hood (optional).** The value of a policy satisfies the Bellman expectation equation
              $V^\pi(s) = \mathbb{E}_\pi[R_{t+1} + \gamma V^\pi(S_{t+1}) \mid S_t = s]$, because $G_t = R_{t+1} + \gamma G_{t+1}$.
              Monte Carlo estimates the left-hand form $\mathbb{E}[G_t]$ from samples of $G_t$; TD(0) estimates the
              right-hand form from samples of $R_{t+1} + \gamma V(S_{t+1})$, with its own V standing in for $V^\pi$.
            - >-
              Both are stochastic approximation: $V \leftarrow V + \alpha(\text{sample} - V)$ is a running average. With
              step sizes that satisfy $\sum_t \alpha_t = \infty$ and $\sum_t \alpha_t^2 < \infty$ (such as $1/n$), tabular
              TD(0) converges to $V^\pi$ with probability 1 for any fixed policy; with a constant small α it converges in
              the mean. On a fixed batch of data, batch TD finds the value of the maximum-likelihood Markov model of the data
              (the certainty-equivalence estimate) while batch MC finds the values that best fit the returns seen.
            - >-
              The TD error links the two: the Monte Carlo error is the discounted sum of TD errors,
              $G_t - V(S_t) = \sum_{k=t}^{T-1} \gamma^{k-t}\delta_k$ (exactly, if V does not change during the episode).
              TD applies each piece as it arrives instead of all at the end.
          equations:
            - label: Monte Carlo
              latex: 'V(S_t) \leftarrow V(S_t) + \alpha\,[G_t - V(S_t)]'
            - label: TD(0)
              latex: 'V(S_t) \leftarrow V(S_t) + \alpha\,[R_{t+1} + \gamma V(S_{t+1}) - V(S_t)]'
            - label: TD error
              latex: '\delta_t = R_{t+1} + \gamma V(S_{t+1}) - V(S_t)'
            - label: MC error as TD errors
              latex: 'G_t - V(S_t) = \sum_{k=t}^{T-1} \gamma^{k-t} \delta_k'
            - label: Q-learning
              latex: 'Q(S_t, A_t) \leftarrow Q(S_t, A_t) + \alpha\,[R_{t+1} + \gamma \max_{a''} Q(S_{t+1}, a'') - Q(S_t, A_t)]'
          callouts: []
          visualizations: []
        rigor:
          prose:
            - >-
              Formal statement: for a finite MDP and a fixed policy, tabular TD(0) with Robbins–Monro step sizes converges to
              $V^\pi$ with probability 1 (Dayan, 1992; Jaakkola, Jordan & Singh, 1994).
            - >-
              Invariant: in the random walk, the true values are the unique solution of $V(s) = \tfrac12 V(s-1) + \tfrac12 V(s+1)$
              with $V = 0$ off the left and 1 off the right: a straight line, $V(s) = (s+1)/6$.
            - >-
              Geometric picture: each update pulls one coordinate of the value vector towards a noisy target; Monte Carlo's
              targets scatter around the truth, TD's scatter less but around the current estimate, which moves.
            - >-
              Where it goes: lesson 9.2 asks how the agent should explore while it learns, 9.3 applies all of this to
              Breakout from scratch, and 9.4 compares the two TD control methods, SARSA and Q-learning.
          callouts: []
          visualizations: []
        examples:
          - id: mg9-001-ex1
            title: A TD(0) update
            difficulty: easy
            problem: V(C) = 0.5, the walk steps to D (reward 0) where V(D) = 0.6; α = 0.1, γ = 1. New V(C)?
            steps:
              - expression: '\delta = 0 + 1 \times 0.6 - 0.5 = 0.1'
                annotation: The TD error.
                strategyTitle: "Step 1: δ"
              - expression: '0.5 + 0.1 \times 0.1 = 0.51'
                annotation: Move α of the way.
                strategyTitle: "Step 2: update"
            answer: 0.51 (the challenge's first case).
          - id: mg9-001-ex2
            title: A Monte Carlo update
            difficulty: medium
            problem: The episode C, D, E then off the right end (reward 1). V = 0.5 everywhere, α = 0.1, γ = 1. MC's new V(C)?
            steps:
              - expression: 'G_0 = 0 + 0 + 1 = 1'
                annotation: The return from C.
                strategyTitle: "Step 1: the return"
              - expression: '0.5 + 0.1 \times (1 - 0.5) = 0.55'
                annotation: Towards the return.
                strategyTitle: "Step 2: update"
            answer: 0.55. TD(0) would leave V(C) at 0.5 after this episode, since V(D) = V(C).
          - id: mg9-001-ex3
            title: The MC error is a sum of TD errors
            difficulty: hard
            problem: With V fixed during the episode C → D → off the right end (γ = 1), show G_0 − V(C) = δ_0 + δ_1.
            steps:
              - expression: '\delta_0 = 0 + V(D) - V(C),\ \delta_1 = 1 + 0 - V(D)'
                annotation: The two TD errors.
                strategyTitle: "Step 1: δs"
              - expression: '\delta_0 + \delta_1 = 1 - V(C) = G_0 - V(C)'
                annotation: "V(D) cancels, so the sum telescopes."
                strategyTitle: "Step 2: add"
            answer: The intermediate estimates cancel, leaving the return minus the first estimate.
        challenges:
          - id: mg9-001-ch1
            title: Why bootstrap?
            difficulty: easy
            problem: Give one advantage of TD over Monte Carlo in a game that never ends.
            hint: When does Monte Carlo update?
            answer: Monte Carlo cannot update until an episode ends; TD updates after every step, so it learns in continuing tasks and early in long episodes.
            walkthrough: []
          - id: mg9-001-ch2
            title: The step size
            difficulty: medium
            problem: Why does TD(0) with α = 0.1 level off near an error of 0.05 on the random walk, while α = 0.05 keeps improving?
            hint: What does a constant α do with the latest sample?
            answer: With a constant α the estimate keeps moving a fixed fraction towards each new noisy target, so it jitters around the truth; a smaller α averages over more samples and jitters less, but learns more slowly at first.
            walkthrough: []
          - id: mg9-001-ch3
            title: Terminal states
            difficulty: hard
            problem: Explain why bootstrapping from the state after a terminal step is wrong, but bootstrapping after a time-limit cut-off is right.
            hint: Does the game have a future at that point?
            answer: >-
              A terminal state has value 0 by definition: nothing can follow it, so the target is R. An episode stopped by a
              step limit had not ended; the state reached still has a future, so its estimate belongs in the target, or the
              agent learns that running out of time is the same as ending.
            walkthrough: []
        semantics:
          core:
            - { symbol: "V^π(s)", meaning: "Expected return from s, following π." }
            - { symbol: "G_t", meaning: "The actual return from step t (Monte Carlo's target)." }
            - { symbol: "R + γV(S′)", meaning: "TD(0)'s target: one real reward and an estimate." }
            - { symbol: "δ", meaning: "The TD error: target − estimate." }
            - { symbol: "α", meaning: "Step size: how far each update moves." }
            - { symbol: "bootstrapping", meaning: "Using an estimate inside a target." }
          rulesOfThumb:
            - Every TD update is target − estimate, times α.
            - Terminal next state means target = R.
            - TD learns during the episode; Monte Carlo after it.
            - Tune α against noise; average results over runs.
        misconceptions:
          - falseBelief: Monte Carlo is always more accurate because it uses real returns.
            whyStudentsThinkIt: Real outcomes sound better than guesses.
