                          const ok = typeof got === 'number' && Math.abs(got - c.want) < 1e-9
                          passed += ok
                          console.log((ok ? '✓' : '✗') + ' case ' + (i + 1) + ': got ' + (typeof got === 'number' ? +got.toFixed(6) : got) + (ok ? '' : ', want ' + c.want + ': ' + c.why))
