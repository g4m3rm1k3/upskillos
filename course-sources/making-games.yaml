                    - type: challenge
                      instruction: |-
                        ### 5. Challenge: Double Q-learning's target
                        The cases below check it.
                      startCode: |-
                        // Write Double Q-learning's target for the table being updated: the updated table picks the best next action, and
                        // the OTHER table says what it is worth. (When the step ends the episode, the target is the reward alone.)
                        function doubleTarget(reward, mineNext, otherNext, done, gamma) {
                          return 0
                        }

                        // ── The check (leave this part as it is) ──
                        const cases = [
                          { args: [-1, [1, 5, 2], [3, 0, 4], false, 1], want: -1, why: 'my table picks action 1 (5); the other table values it at 0: −1 + 0' },
                          { args: [0, [2, 1], [7, 9], false, 0.5], want: 3.5, why: 'my table picks action 0 (2); the other says 7: 0.5 × 7' },
                          { args: [4, [9, 9], [1, 1], true, 1], want: 4, why: 'the step ended the episode: the reward alone' },
                          { args: [1, [0, 3, 3], [5, 2, 2], false, 1], want: 3, why: 'my table picks action 1 (the first of the tied 3s); the other values it at 2' },
                        ]
                        let passed = 0
                        for (const [i, c] of cases.entries()) {
                          const got = doubleTarget(...c.args)
                          const ok = typeof got === 'number' && Math.abs(got - c.want) < 1e-9
                          passed += ok
                          console.log((ok ? '✓' : '✗') + ' case ' + (i + 1) + ': got ' + (typeof got === 'number' ? +got.toFixed(6) : got) + (ok ? '' : ', want ' + c.want + ': ' + c.why))
                        }
                        console.log(passed === cases.length ? '✓ All 4 cases pass: that is Double Q-learning.' : passed + ' of 4 cases pass.')
                      solutionCode: |-
                        // Write Double Q-learning's target for the table being updated: the updated table picks the best next action, and
                        // the OTHER table says what it is worth. (When the step ends the episode, the target is the reward alone.)
                        function doubleTarget(reward, mineNext, otherNext, done, gamma) {
                          if (done) return reward
                          const best = mineNext.indexOf(Math.max(...mineNext))
                          return reward + gamma * otherNext[best]
                        }

                        // ── The check (leave this part as it is) ──
                        const cases = [
                          { args: [-1, [1, 5, 2], [3, 0, 4], false, 1], want: -1, why: 'my table picks action 1 (5); the other table values it at 0: −1 + 0' },
                          { args: [0, [2, 1], [7, 9], false, 0.5], want: 3.5, why: 'my table picks action 0 (2); the other says 7: 0.5 × 7' },
                          { args: [4, [9, 9], [1, 1], true, 1], want: 4, why: 'the step ended the episode: the reward alone' },
                          { args: [1, [0, 3, 3], [5, 2, 2], false, 1], want: 3, why: 'my table picks action 1 (the first of the tied 3s); the other values it at 2' },
                        ]
                        let passed = 0
                        for (const [i, c] of cases.entries()) {
                          const got = doubleTarget(...c.args)
                          const ok = typeof got === 'number' && Math.abs(got - c.want) < 1e-9
                          passed += ok
                          console.log((ok ? '✓' : '✗') + ' case ' + (i + 1) + ': got ' + (typeof got === 'number' ? +got.toFixed(6) : got) + (ok ? '' : ', want ' + c.want + ': ' + c.why))
                        }
                        console.log(passed === cases.length ? '✓ All 4 cases pass: that is Double Q-learning.' : passed + ' of 4 cases pass.')
            - id: GameStudioTask
              title: Four ways to update
              props:
                task: all-four
                lesson: mg9-005
                checkpoint: cp-mg9-005-4
        math:
          prose:
            - >-
              **Under the hood (optional).** For estimates $\hat{Q}(a) = Q(a) + \epsilon_a$ with zero-mean noise,
              $\mathbb{E}[\max_a \hat{Q}(a)] \ge \max_a \mathbb{E}[\hat{Q}(a)] = \max_a Q(a)$ (Jensen's inequality: max is
              convex), with equality only without noise. Q-learning's target uses this max at every step, and the excess
              propagates backwards through bootstrapping.
            - >-
              The double estimator $\hat{Q}_B(\arg\max_a \hat{Q}_A(a))$ is unbiased for the value of the action A chooses,
              and on average no higher than $\max_a Q(a)$: it can underestimate, but does not overestimate.
            - >-
              Expected SARSA's target is the conditional expectation of SARSA's over A′, so it has the same mean and no
              more variance (the law of total variance); with lower variance a larger α converges without chasing noise.
          equations:
            - label: Overestimation
              latex: '\mathbb{E}[\max_a \hat{Q}(a)] \ge \max_a Q(a)'
            - label: Double Q-learning (update A)
              latex: 'Q_A(S, A) \leftarrow Q_A(S, A) + \alpha\,[R + \gamma\,Q_B(S'', \arg\max_a Q_A(S'', a)) - Q_A(S, A)]'
            - label: Expected SARSA
              latex: 'Q(S, A) \leftarrow Q(S, A) + \alpha\,[R + \gamma \textstyle\sum_{a''} \pi(a'' \mid S'')\,Q(S'', a'') - Q(S, A)]'
          callouts: []
          visualizations: []
        rigor:
          prose:
            - >-
              Formal statement: tabular Double Q-learning converges to $Q^*$ under the same conditions as Q-learning (van
              Hasselt, 2010); Expected SARSA converges under SARSA's conditions and, with a greedy target policy, is
              Q-learning.
            - >-
              Invariant: with no noise in rewards or transitions, all four updates have the same fixed point for a greedy
              target policy; the differences are in how fast and how steadily they get there.
            - >-
              Geometric picture: the max picks the highest of a cloud of points scattered around the truth, always from its
              upper edge; the double estimator picks with one cloud and reads from another.
            - >-
              Where it goes: 9.6 turns comparisons like these into experiments you can report.
          callouts: []
          visualizations: []
        examples:
          - id: mg9-005-ex1
            title: A Double Q target
            difficulty: easy
            problem: "Updating table A. Q_A(S′, ·) = [1, 5, 2], Q_B(S′, ·) = [3, 0, 4], R = −1, γ = 1. Target?"
            steps:
              - expression: '\arg\max_a Q_A(S'', a) = 1'
                annotation: A chooses (value 5).
                strategyTitle: "Step 1: A chooses"
              - expression: '-1 + Q_B(S'', 1) = -1 + 0 = -1'
                annotation: B values it.
                strategyTitle: "Step 2: B values"
            answer: −1 (Q-learning's would be −1 + 5 = 4).
          - id: mg9-005-ex2
            title: An Expected SARSA target
            difficulty: medium
            problem: Q(S′, ·) = [−9, −8, −40, −10], ε-greedy with ε = 0.1, R = −1, γ = 1. Target?
            steps:
              - expression: '\pi = [0.025, 0.925, 0.025, 0.025]'
                annotation: ε/4 each, plus 0.9 for the best.
                strategyTitle: "Step 1: probabilities"
              - expression: '-1 + (0.025 \cdot -9 + 0.925 \cdot -8 + 0.025 \cdot -40 + 0.025 \cdot -10) = -9.875'
                annotation: The policy's average.
                strategyTitle: "Step 2: average"
            answer: −9.875, as lesson 9.4's cell 1 printed.
          - id: mg9-005-ex3
            title: The size of the bias
            difficulty: hard
            problem: Two actions worth 0, each estimated from one sample with noise ±1 (each sign equally likely). Expected max?
            steps:
              - expression: '\tfrac14(1) + \tfrac14(1) + \tfrac14(1) + \tfrac14(-1) = 0.5'
                annotation: The max is −1 only when both are −1.
                strategyTitle: "Step 1: cases"
            answer: 0.5, though both are worth 0.
        challenges:
          - id: mg9-005-ch1
            title: Why two tables cross
            difficulty: easy
            problem: Why must the other table value the action the first one chose?
            hint: Whose luck would it share?
            answer: The chosen action is the one whose estimate is lucky in the first table; the second table's estimate of it has independent noise, so it is not inflated.
            walkthrough: []
          - id: mg9-005-ch2
            title: SARSA's noise
            difficulty: medium
            problem: Why does SARSA suffer more than Expected SARSA when α = 1?
            hint: What does α = 1 do with one noisy target?
            answer: With α = 1 each update replaces the value with one target; SARSA's target depends on one random A′, so values jump about; Expected SARSA's target averages over A′.
            walkthrough: []
          - id: mg9-005-ch3
            title: Shrinking bias
            difficulty: hard
            problem: Cell 1's max estimate falls from 1.54 to 0.70 to 0.35 as samples go from 1 to 5 to 20. Why roughly halving each time?
            hint: How does an average's noise shrink with n?
            answer: The noise of an average of n samples shrinks like 1/√n; 1/√5 ≈ 0.45 and 1/√20 ≈ 0.22 of the single-sample noise, and the max's excess scales with the noise.
            walkthrough: []
        semantics:
          core:
            - { symbol: "max bias", meaning: "The max of noisy estimates is too high on average." }
            - { symbol: "Q_A, Q_B", meaning: "Double Q-learning's two tables." }
            - { symbol: "Σ π Q", meaning: "Expected SARSA's average over next actions." }
            - { symbol: "double estimator", meaning: "Choose with one estimate, value with another." }
          rulesOfThumb:
            - Suspect overestimation when rewards are noisy and actions many.
            - Expected SARSA over SARSA when you can compute π.
            - Report both learning return and greedy score.
        misconceptions:
          - falseBelief: Q-learning's values are unbiased because each update is.
            whyStudentsThinkIt: Each target is a sample.
            correctionExample: The max inside the target picks lucky estimates (cell 1).
            contrastCase: Without noise there is no bias.
          - falseBelief: Double Q-learning learns twice as fast.
            whyStudentsThinkIt: Two tables.
            correctionExample: Each table gets half the updates; the gain is less bias, not speed.
            contrastCase: Its policy uses both tables' sum.
