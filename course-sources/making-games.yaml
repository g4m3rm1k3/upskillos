# Building Games with Game Studio: the course around Game Studio (named by the user, 2026-10-01).
# Plan: docs/game-studio-course-plan.md. Each lesson teaches one idea, then sends the learner to Game
# Studio with a task (the GameStudioTask card, src/courses/making-games/viz/GameStudioTask.jsx); the
# task's checks tick as they work, and "Back to the lesson" returns here.
#
#   npm run course:create -- course-sources/making-games.yaml --dry-run
#   npm run course:create -- course-sources/making-games.yaml --force   (after editing; review the diff)

schemaVersion: 1

course:
  id: making-games
  label: Building Games with Game Studio
  description: >-
    Learn to build games in Game Studio, one idea at a time: each lesson explains it, you try it in the editor
    with checks that tick as you work, then come back to see why it works. It ends with Tetris, built step by step.
  icon: "🎮"
  color: sky
  domain: cs

chapters:
  - number: 1
    slug: first-steps
    lessons:
      # ───────────────────────────────────────────────────────────── 1.1
      - order: 1
        id: mg1-001
        slug: scenes-nodes-and-positions
        title: Scenes, Nodes and Positions
        subtitle: Put a character exactly where you want it, and know why (0, 0) is in the top-left corner.
        tags:
          - game-studio
          - nodes
          - coordinates
        aliases: game studio editor scene tree inspector sprite2d position coordinates y down top-left origin
        timeToComplete: 25
        coreConcept: >-
          A game is a tree of nodes, and every visible node has a position: two numbers saying how far right and
          how far down it is from the top-left corner of the game area.
        prerequisites: []
        nextLesson: mg1-002

        hook:
          question: >-
            A game window is 960 pixels wide and 540 pixels tall. Which two numbers put a character in its exact
            middle, and which way does the second number count?
          realWorldContext: >-
            Every 2D game engine (Godot, Unity, Phaser, Game Studio) places things with x and y numbers. Getting
            the direction of y wrong is the most common first mistake, and it makes characters fall upwards and
            menus appear off the screen.

        intuition:
          prose:
            - >-
              Start with a game area 960 pixels wide and 540 tall. A green astronaut sits at x = 480, y = 270.
              The x number says how far right it is from the left edge: 480 of 960 is half way. The y number says
              how far **down** it is from the top edge: 270 of 540 is half way down. So (480, 270) is the middle.
            - >-
              Now move it to (480, 100). Before reading on, predict: does it go up or down on the screen? It goes
              **up**. y = 100 is only 100 pixels below the top edge, closer to the top than 270 was. In a game, a
              bigger y means lower on the screen, the opposite of a graph in a maths book.
            - >-
              The point (0, 0) is called the **origin**. In Game Studio it is the top-left corner of the game area,
              drawn as a blue rectangle in the viewport. Every position is measured from it: x to the right, y down.
            - >-
              The astronaut itself is a **node**: one thing in the game, with a type and properties. This one is a
              Sprite2D, the type that shows a picture. Its properties include `texture` (which picture) and
              `position` (where). A **scene** is a tree of nodes: the scene tree on the left shows it.
            - >-
              Three panels do the work. The **scene tree** lists the nodes; **+ Add…** above it adds one under the
              node selected. The **viewport** in the middle shows them; you can drag them there. The **Inspector**
              on the right shows the selected node's properties as fields you can type into.
          callouts:
            - type: procedure
              title: "Procedure: Place a node at an exact position"
              body: |-
                Step 1. Add the node: + Add… above the scene tree, then pick its type (Sprite2D for a picture).
                Step 2. Select it in the scene tree, so the Inspector shows its properties.
                Step 3. Give it what it needs to be seen: for a Sprite2D, choose a texture.
                Step 4. Name it: double-click it in the scene tree and type a name (names are case-sensitive).
                Step 5. Type its position in the Inspector: x is pixels right of the left edge, y is pixels down from the top.
                Step 6. Check it in the viewport against the blue game-area rectangle.
            - type: warning
              title: y counts downwards
              body: >-
                If you think of y as "up", everything lands mirrored top-to-bottom. A character meant to be near the
                bottom at y = 50 appears near the top instead. Near the bottom of a 540-tall area is y ≈ 500.
            - type: insight
              title: Godot's names
              body: >-
                Game Studio uses Godot's names on purpose: Sprite2D, the scene tree, the Inspector, and +y pointing
                down are all the same in Godot, so what you learn here carries straight over.
          visualizations:
            - id: GameStudioTask
              title: Put a character on the screen
              props:
                task: first-sprite
                lesson: mg1-001
                checkpoint: cp-mg1-001-4

        math:
          prose:
            - >-
              **Under the hood (optional).** A position is a pair of numbers $(x, y)$. In screen coordinates the
              origin is the top-left corner, $x$ grows to the right and $y$ grows downward. The middle of an area
              of width $W$ and height $H$ is $(W/2, H/2)$; for $960 \times 540$ that is $(480, 270)$.
            - >-
              Maths books draw $y$ upward, with the origin at the bottom-left. A point at maths height $y_m$ in an
              area of height $H$ is at screen height $y_s = H - y_m$, because it is $y_m$ above the bottom edge and
              the bottom edge is $H$ below the top. So $y_m = 100$ in a 540-tall area is $y_s = 440$: near the bottom.
            - >-
              Converting back uses the same formula, $y_m = H - y_s$, because subtracting from $H$ twice returns
              where you started: $H - (H - y) = y$. A transformation that undoes itself like this is called an
              involution.
            - >-
              Moving a node by $(dx, dy)$ adds to each number separately: $(x + dx, y + dy)$. Moving the astronaut
              from the middle by $(0, -170)$ gives $(480, 100)$: a negative $dy$ means up the screen.
          equations: []
          callouts: []
          visualizations: []

        rigor:
          prose:
            - >-
              Formally, screen coordinates are a basis for the plane with origin at the area's top-left corner, unit
              vector $(1, 0)$ one pixel right and $(0, 1)$ one pixel down. A position is a vector in that basis,
              valid for any real numbers: a node at $(-50, 270)$ exists, it is just left of the visible area.
            - >-
              What does not change when you switch between maths and screen coordinates is distance:
              $\sqrt{dx^2 + dy^2}$ is the same in both, because flipping $y$ only changes the sign of $dy$, and
              squaring removes the sign. That is why speeds and sizes need no conversion, only directions do.
            - >-
              Geometrically, the conversion $y \mapsto H - y$ is a reflection in the horizontal line $y = H/2$,
              followed by nothing else: the middle row of the screen stays where it is, and the top and bottom swap.
            - >-
              Later, nodes inside other nodes have positions relative to their parent. The screen position is then
              the parent's transform applied to the child's position: the same idea as here, with the parent's
              position as the origin. Chapter 6 uses this for scenes inside scenes.
          callouts: []
          visualizations: []

        examples:
          - id: mg1-001-ex1
            title: The middle of the game area
            difficulty: easy
            problem: The game area is 960 × 540. Where must the Hero sprite go to be exactly in the middle?
            steps:
              - expression: 'x = \tfrac{960}{2} = 480'
                annotation: Half the width is the middle across, counted from the left edge.
                strategyTitle: "Step 1: Halve the width"
              - expression: 'y = \tfrac{540}{2} = 270'
                annotation: Half the height is the middle down, counted from the top edge (y grows downward).
                strategyTitle: "Step 2: Halve the height"
              - expression: '(x, y) = (480, 270)'
                annotation: Type 480 and 270 into the Inspector's position fields with Hero selected.
                strategyTitle: "Step 3: Type it in the Inspector"
            answer: Hero goes at (480, 270), half way across and half way down the 960 × 540 game area.
          - id: mg1-001-ex2
            title: Near the bottom-right corner
            difficulty: medium
            problem: >-
              Place a coin 40 pixels in from the right edge and 40 pixels up from the bottom edge of a 960 × 540
              game area.
            steps:
              - expression: 'x = 960 - 40 = 920'
                annotation: The right edge is at x = 960; 40 pixels in from it is 40 less.
                strategyTitle: "Step 1: Measure x from the right edge"
              - expression: 'y = 540 - 40 = 500'
                annotation: Up from the bottom edge means a smaller y, because y counts down from the top.
                strategyTitle: "Step 2: Measure y from the bottom edge"
              - expression: '(920, 500)'
                annotation: Check in the viewport that the coin sits just inside the blue rectangle's bottom-right corner.
                strategyTitle: "Step 3: Check it in the viewport"
            answer: The coin goes at (920, 500); "up from the bottom" became a subtraction from 540.
          - id: mg1-001-ex3
            title: A position from a maths graph
            difficulty: hard
            problem: >-
              A level designer sketched a platform on graph paper at (300, 120), with y measured up from the bottom
              of a 540-tall game. Where is it in Game Studio?
            steps:
              - expression: 'x_s = x_m = 300'
                annotation: Both systems measure x from the left edge to the right, so x does not change.
                strategyTitle: "Step 1: Keep x"
              - expression: 'y_s = H - y_m = 540 - 120 = 420'
                annotation: 120 above the bottom edge is 420 below the top edge.
                strategyTitle: "Step 2: Flip y with H − y"
              - expression: '(300, 420)'
                annotation: The platform is in the lower part of the screen, as the sketch showed.
                strategyTitle: "Step 3: Check the picture matches"
            answer: The platform is at (300, 420) in Game Studio's coordinates.

        challenges:
          - id: mg1-001-ch1
            title: The top-left quarter
            difficulty: easy
            problem: Where is the middle of the top-left quarter of a 960 × 540 game area?
            hint: The top-left quarter is 480 wide and 270 tall, starting at (0, 0).
            answer: Its middle is (240, 135), half of 480 across and half of 270 down.
            walkthrough:
              - expression: '(\tfrac{480}{2}, \tfrac{270}{2}) = (240, 135)'
                annotation: The quarter starts at the origin, so its middle is half its own size in each direction.
          - id: mg1-001-ch2
            title: Which way did it move?
            difficulty: medium
            problem: >-
              A sprite's position changes from (480, 270) to (430, 320). Describe the move on screen in words.
            hint: Work out the change in x and the change in y separately, and remember which way y counts.
            answer: It moved 50 pixels left and 50 pixels down, diagonally towards the bottom-left.
            walkthrough:
              - expression: 'dx = 430 - 480 = -50,\quad dy = 320 - 270 = +50'
                annotation: A negative dx is left; a positive dy is down, because y grows downward.
          - id: mg1-001-ch3
            title: Debug the falling title
            difficulty: hard
            problem: >-
              A learner wanted a title 60 pixels below the top of the screen and typed y = 480, thinking "540 minus
              60". The title appears near the bottom. What went wrong, and what should y be?
            hint: Which edge is y measured from in Game Studio?
            answer: >-
              They converted as if y counted up from the bottom; in Game Studio y already counts down from the top,
              so 60 below the top is simply y = 60.
            walkthrough:
              - expression: 'y = 60'
                annotation: No conversion is needed when the distance is already measured from the top edge.

        semantics:
          core:
            - symbol: node
              meaning: One thing in the game, with a type that decides what it does and properties that set how.
            - symbol: scene
              meaning: A tree of nodes that is saved as one file and can be run as a game.
            - symbol: Sprite2D
              meaning: The node type that shows a picture (its texture) at its position.
            - symbol: position (x, y)
              meaning: Where a node is; x counts pixels right from the left edge, y counts pixels down from the top.
            - symbol: origin (0, 0)
              meaning: The point every position is measured from; in Game Studio, the game area's top-left corner.
          rulesOfThumb:
            - Bigger y means lower on the screen; if something is upside down, check the sign of y first.
            - The middle of the game area is half the width and half the height.
            - Measure "from the right" as width minus distance and "from the bottom" as height minus distance.
            - Name nodes as you make them; checks, scripts and you will look for them by name.

        misconceptions:
          - falseBelief: A bigger y moves a node up the screen, as on a graph.
            whyStudentsThinkIt: Maths lessons draw y upward from an origin at the bottom-left.
            correctionExample: In a 540-tall game, y = 500 is 40 pixels above the bottom edge, near the bottom.
            contrastCase: >-
              Placing a ground strip at y = 20 "to be low" puts it at the top of the screen, so a player standing
              on it would hang from the ceiling.
          - falseBelief: The origin (0, 0) is in the middle of the screen.
            whyStudentsThinkIt: Graphs often centre the axes, and the camera later follows the player.
            correctionExample: A node at (0, 0) shows its centre exactly on the top-left corner of the game area.
            contrastCase: To be in the middle a node needs (480, 270) in a 960 × 540 game, not (0, 0).

        transferPrompts:
          - situation: >-
              You are given a 640 × 360 game instead of 960 × 540 and asked to put a sign in the middle.
            competingTechniques:
              - Halve this game's width and height
              - Reuse (480, 270) from the bigger game
            whyThisTechniqueWins: >-
              The middle depends on the area's size; (320, 180) is the middle of 640 × 360, while (480, 270) would
              sit right of and below it.
          - situation: >-
              A maths tool gives you a list of points with y measured up from the bottom, for a 540-tall level.
            competingTechniques:
              - Convert each y with 540 − y
              - Type the numbers in as they are
            whyThisTechniqueWins: >-
              Typing them in unchanged mirrors the level top-to-bottom; 540 − y measures the same distances from the
              top edge, which is what Game Studio expects.

        debugging:
          - commonError: Typing a position into the wrong node's Inspector.
            symptom: The node you meant to move stays put while another one jumps.
            whyItHappened: The Inspector always shows the node selected in the scene tree, which was not the one in mind.
            repairStrategy: Click the node's name in the scene tree first and read its name at the top of the Inspector.
          - commonError: Naming the node "hero" when the task asks for "Hero".
            symptom: The task says there is no Sprite2D called Hero, although you can see it.
            whyItHappened: Names are case-sensitive, so hero and Hero are different names.
            repairStrategy: Double-click the node and retype the name exactly, including capitals.

        mastery:
          targetLevel: 3
          solveIndependently: Place any node at a position described in words, such as "40 pixels in from the right edge".
          explainVerbally: Explain why a bigger y is lower on the screen, and where the origin is.
          detectIncorrectApplication: Spot a position that was converted as if y counted upward, and fix it.
          transferToUnfamiliar: Convert graph-paper coordinates (y up) into Game Studio's for a game of any height.

        assessment:
          questions:
            - id: mg1-001-assess-1
              type: choice
              text: In a 960 × 540 game, a node at (100, 500) is near which corner?
              options:
                - The bottom-left
                - The top-left
                - The bottom-right
                - The top-right
              answer: The bottom-left
              hint: x = 100 is near the left edge; y = 500 is near the bottom because y counts down from the top.

        quiz:
          - id: mg1-001-quiz-1
            type: choice
            text: Where is (0, 0) in Game Studio's game area?
            options:
              - The top-left corner
              - The middle
              - The bottom-left corner
              - Wherever the camera points
            answer: The top-left corner
            hints:
              - The blue rectangle in the viewport starts at the origin.
            reviewSection: "Intuition — the origin paragraph"
          - id: mg1-001-quiz-2
            type: choice
            text: A sprite moves from (200, 300) to (200, 250). Which way did it go on screen?
            options:
              - Up by 50 pixels
              - Down by 50 pixels
              - Left by 50 pixels
              - It did not move
            answer: Up by 50 pixels
            hints:
              - y got smaller, and smaller y is higher on the screen.
            reviewSection: "Intuition — Warning: y counts downwards"
          - id: mg1-001-quiz-3
            type: choice
            text: Which node type shows a picture?
            options:
              - Sprite2D
              - Node2D
              - Camera2D
              - Label
            answer: Sprite2D
            hints:
              - Its texture property chooses the picture.
            reviewSection: "Intuition — the node paragraph"
          - id: mg1-001-quiz-4
            type: choice
            text: What is the middle of a 640 × 360 game area?
            options:
              - (320, 180)
              - (480, 270)
              - (640, 360)
              - (180, 320)
            answer: (320, 180)
            hints:
              - Halve this area's width and height; (480, 270) is the middle of a different size.
            reviewSection: "Examples — The middle of the game area"
          - id: mg1-001-quiz-5
            type: choice
            text: >-
              Which of these is NOT a correct way to put a node 40 pixels above the bottom of a 540-tall game?
            options:
              - Setting y to 40
              - Setting y to 500
              - Setting y to 540 − 40
              - Dragging it until the Inspector shows y = 500
            answer: Setting y to 40
            hints:
              - y = 40 is 40 pixels below the top edge, not above the bottom one.
            reviewSection: "Examples — Near the bottom-right corner"
          - id: mg1-001-quiz-6
            type: choice
            text: >-
              A graph-paper point is at maths height 90 in a 540-tall game. What is its y in Game Studio?
            options:
              - "450"
              - "90"
              - "630"
              - "-90"
            answer: "450"
            hints:
              - Use y_s = H − y_m. A near-miss is to keep 90, forgetting that the two systems measure from different edges.
            reviewSection: "Under the hood — converting from maths coordinates"

        checkpoints:
          - id: cp-mg1-001-1
            label: Read the middle-of-the-screen example
            type: read
          - id: cp-mg1-001-2
            label: Read why y counts downwards
            type: read
          - id: cp-mg1-001-3
            label: Read the procedure for placing a node
            type: read
          - id: cp-mg1-001-4
            label: Complete "Put a character on the screen" in Game Studio
            type: lab
          - id: cp-mg1-001-5
            label: Move Hero to (480, 100) in Game Studio and check your prediction
            type: lab
          - id: cp-mg1-001-6
            label: Work through the bottom-right corner example
            type: example
          - id: cp-mg1-001-7
            label: Work through the graph-paper example
            type: example
          - id: cp-mg1-001-8
            label: Attempt the falling-title debugging challenge
            type: challenge

      # ───────────────────────────────────────────────────────────── 1.2
      - order: 2
        id: mg1-002
        slug: run-and-stop
        title: Run and Stop
        subtitle: What happens when you press Run, and why changes made while the game runs are not kept.
        tags:
          - game-studio
          - game-loop
          - editor
        aliases: run stop play test game loop frames per second editor runtime project settings background
        timeToComplete: 20
        coreConcept: >-
          The editor holds the game's design; Run starts a separate copy of it that plays frame by frame, and Stop
          throws that copy away, so only changes made in the editor are kept.
        prerequisites:
          - mg1-001
        nextLesson: mg1-003

        hook:
          question: >-
            You press Run, and while the game plays you drag the hero somewhere else. Then you press Stop. Where is
            the hero now?
          realWorldContext: >-
            Every engine separates editing from playing. Game designers rely on it to experiment freely while a
            game runs, and are caught out by it when an hour of tuning vanishes on Stop.

        intuition:
          prose:
            - >-
              Your project has Hero at (480, 270). Press **▶ Run** (or F5). The game starts in the middle of the
              editor, and Hero appears at (480, 270). Nothing moves yet, because nothing tells it to.
            - >-
              While it runs, the Inspector shows some values in purple. Purple values are the **running game's**:
              they change as the game plays. They are not saved. Press **■ Stop** (or F8) and the editor's own
              values come back.
            - >-
              Before reading on, predict: if a script moves Hero to (700, 270) while the game runs, where is Hero
              after Stop? It is back at (480, 270). Run gave the game a **copy** of the project. The copy changed;
              the project did not.
            - >-
              While running, the game repeats one thing many times a second: it updates every node, then draws the
              picture. One repeat is a **frame**. At 60 frames per second each frame lasts $1/60$ of a second,
              about 16.7 milliseconds.
            - >-
              Changes that should last are made in the editor, when the game is stopped. The background colour is
              one: **Project › Project settings…** holds it, with the game's size, and saving keeps it.
          callouts:
            - type: procedure
              title: "Procedure: Change something and test it"
              body: |-
                Step 1. With the game stopped, make the change in the editor (a property, a setting, a script).
                Step 2. Press ▶ Run (F5) to play the game as a player would.
                Step 3. Watch for the change; purple values in the Inspector are what the running game has now.
                Step 4. Press ■ Stop (F8). The editor's values are in charge again.
                Step 5. If it was wrong, change it in the editor and run again. Save (Ctrl+S) when it is right.
            - type: warning
              title: Changes while running are thrown away
              body: >-
                Tuning a value while the game runs is a good way to find the right number, but Stop undoes it.
                Write the number down, stop, then type it into the editor.
          visualizations:
            - id: GameStudioTask
              title: Run your game
              props:
                task: run-and-stop
                lesson: mg1-002
                checkpoint: cp-mg1-002-4

        math:
          prose:
            - >-
              **Under the hood (optional).** A game runs as a loop. Each pass, a **frame**, does two things: update
              every node by the time since the last frame, then draw. If frames come $f$ times a second, each lasts
              $T = 1/f$ seconds: $1/60 \approx 0.0167$ s at 60 fps, $1/144 \approx 0.0069$ s on a fast screen.
            - >-
              In $t$ seconds there are $f \cdot t$ frames. Ten seconds at 60 fps is 600 frames; at 144 fps it is
              1440. The number of frames depends on the screen, which is why the next lesson measures movement in
              seconds rather than frames.
            - >-
              Run copies the project into a sandboxed frame (an iframe) and builds the nodes from the copy. The
              editor keeps the original. Stop deletes the sandbox, and with it every change the game made. This is
              the same reason a spreadsheet's "preview" never edits your file.
          equations: []
          callouts: []
          visualizations: []

        rigor:
          prose:
            - >-
              Formally, the running game is a state machine: a state (every node's properties) and a step function
              that maps the state at frame $n$ to frame $n + 1$ given the elapsed time and the input. Run sets the
              initial state from the project; Stop discards the state.
            - >-
              The invariant is the project itself: no step of the running game writes to it. That is what makes it
              safe to experiment while the game runs, and also why those experiments vanish.
            - >-
              Picture two copies side by side: the editor's scene on the left, unchanging, and the running copy on
              the right, changing every 16.7 ms. The purple Inspector values are a window onto the right-hand copy.
            - >-
              Later lessons rely on this separation. A script's ready() starts from the project's values every Run,
              and a saved game (chapter 6) must be written on purpose, because nothing the running game does is
              kept by itself.
          callouts: []
          visualizations: []

        examples:
          - id: mg1-002-ex1
            title: How long is one frame?
            difficulty: easy
            problem: A game runs at 60 frames per second. How long does one frame last?
            steps:
              - expression: 'T = \tfrac{1}{f}'
                annotation: If 60 frames fit in one second, each one gets one sixtieth of it.
                strategyTitle: "Step 1: One second shared between the frames"
              - expression: 'T = \tfrac{1}{60} \approx 0.0167\ \text{s} = 16.7\ \text{ms}'
                annotation: Multiply by 1000 to turn seconds into milliseconds.
                strategyTitle: "Step 2: Put in the numbers"
            answer: One frame lasts about 0.0167 seconds, or 16.7 milliseconds.
          - id: mg1-002-ex2
            title: Frames in a short game
            difficulty: medium
            problem: You run your game for 5 seconds on a 144 fps screen. How many frames are drawn?
            steps:
              - expression: 'n = f \cdot t'
                annotation: Frames per second times seconds counts the frames.
                strategyTitle: "Step 1: Frames are rate times time"
              - expression: 'n = 144 \times 5 = 720'
                annotation: The same 5 seconds on a 60 fps screen would be 300 frames.
                strategyTitle: "Step 2: Put in the numbers"
            answer: 720 frames are drawn; a 60 fps screen would draw 300 in the same time.
          - id: mg1-002-ex3
            title: Where did the tuning go?
            difficulty: hard
            problem: >-
              While the game ran, you dragged a platform from y = 400 to y = 360 until a jump just reached it, then
              pressed Stop. The platform is back at 400. How do you keep the change?
            steps:
              - expression: '\text{running copy: } y = 360,\quad \text{project: } y = 400'
                annotation: The drag changed the running copy only; the project still says 400.
                strategyTitle: "Step 1: Say which copy changed"
              - expression: '\text{Stop, then set } y = 360 \text{ in the Inspector}'
                annotation: With the game stopped, the Inspector edits the project.
                strategyTitle: "Step 2: Make the change in the editor"
              - expression: '\text{Run again: } y = 360'
                annotation: The next Run copies the new value, and Save keeps it.
                strategyTitle: "Step 3: Run to confirm, then save"
            answer: Stop, type 360 into the platform's y in the Inspector, run to confirm, and save.

        challenges:
          - id: mg1-002-ch1
            title: A slow screen
            difficulty: easy
            problem: How long is one frame at 30 frames per second?
            hint: Share one second between the frames.
            answer: One frame lasts 1/30 of a second, about 33.3 milliseconds.
            walkthrough:
              - expression: 'T = \tfrac{1}{30} \approx 0.0333\ \text{s}'
                annotation: Fewer frames a second means each frame lasts longer.
          - id: mg1-002-ch2
            title: Which change survives?
            difficulty: medium
            problem: >-
              You change the background colour in Project settings, then press Run, then move Hero while running,
              then press Stop. Which of the two changes is still there?
            hint: Which change was made in the editor, and which in the running copy?
            answer: >-
              The background colour stays, because it was set in the editor; Hero's move is gone, because it was
              made in the running copy.
            walkthrough: []
          - id: mg1-002-ch3
            title: Count frames backwards
            difficulty: hard
            problem: >-
              A test counts 900 frames in 15 seconds. What frame rate was the game running at, and how long was each
              frame?
            hint: Rearrange n = f · t for f, then use T = 1/f.
            answer: It ran at 60 frames per second, so each frame lasted about 16.7 milliseconds.
            walkthrough:
              - expression: 'f = \tfrac{n}{t} = \tfrac{900}{15} = 60,\quad T = \tfrac{1}{60}'
                annotation: Divide frames by seconds for the rate, then invert the rate for the frame time.

        semantics:
          core:
            - symbol: Run (F5)
              meaning: Starts a copy of the project as a game, in a sandbox inside the editor.
            - symbol: Stop (F8)
              meaning: Ends the running copy and throws away every change it made.
            - symbol: frame
              meaning: One pass of the game loop, which updates every node and then draws the picture.
            - symbol: f (frames per second)
              meaning: How many frames the game draws each second; 60 on most screens.
            - symbol: T = 1/f
              meaning: How long one frame lasts, in seconds.
          rulesOfThumb:
            - Make lasting changes with the game stopped; use the running game only to try numbers out.
            - Purple Inspector values are the running game's and will not be saved.
            - More frames per second means shorter frames, not a longer game.
            - Run after every small change, so a mistake is found while you still remember what you changed.

        misconceptions:
          - falseBelief: Moving a node while the game runs moves it in the project too.
            whyStudentsThinkIt: It is the same node in the same window, and it really did move.
            correctionExample: Drag Hero from x = 480 to x = 700 while running, press Stop, and x is 480 again.
            contrastCase: Moving Hero with the game stopped changes the project, and the next Run starts it at 700.
          - falseBelief: A game at 120 fps runs twice as long as one at 60 fps.
            whyStudentsThinkIt: Twice as many frames sounds like twice as much game.
            correctionExample: In 1 second, 120 fps draws 120 frames of 1/120 s each; 60 fps draws 60 of 1/60 s.
            contrastCase: Both games last exactly 1 second; only the number of pictures in that second differs.

        transferPrompts:
          - situation: >-
              You want to find the jump height that just clears a gap, trying many values quickly.
            competingTechniques:
              - Tune it while the game runs, write the number down, then set it in the editor
              - Edit the value in the editor and press Run for every try
            whyThisTechniqueWins: >-
              Tuning live finds the number fastest, as long as you copy the final number into the editor after Stop.
          - situation: >-
              A friend says your game "lost its colour" when they reopened it, though it looked right when you ran it.
            competingTechniques:
              - Check whether the colour was set in Project settings and saved
              - Assume the running game saves its own changes
            whyThisTechniqueWins: >-
              Only the project, edited with the game stopped and saved, is kept; a colour set by the running game is
              gone when it stops.

        debugging:
          - commonError: Tuning values while the game runs and expecting them to stay.
            symptom: After Stop, everything snaps back to how it was before Run.
            whyItHappened: The running game is a copy; Stop throws it away.
            repairStrategy: Note the numbers that worked, stop, type them into the Inspector, then save.
          - commonError: Pressing Run before the main scene is set.
            symptom: Game Studio says to set a main scene first, and nothing starts.
            whyItHappened: Run plays the main scene, and the project does not have one yet.
            repairStrategy: Open Project › Project settings… and choose the scene in Main scene, or star it in Files.

        mastery:
          targetLevel: 2
          solveIndependently: Change a project setting, run the game to check it, and stop it.
          explainVerbally: Explain why a change made while the game runs is gone after Stop.
          detectIncorrectApplication: Recognise when a lost change was made in the running copy rather than the editor.
          transferToUnfamiliar: Compute frame times and frame counts for any frame rate and duration.

        assessment:
          questions:
            - id: mg1-002-assess-1
              type: choice
              text: After Stop, which values does the editor show?
              options:
                - The project's values, from before Run
                - The values the running game ended with
                - An average of the two
              answer: The project's values, from before Run
              hint: The running game was a copy, and Stop threw the copy away.

        quiz:
          - id: mg1-002-quiz-1
            type: choice
            text: What does a frame consist of?
            options:
              - Updating every node, then drawing the picture
              - Saving the project, then running it
              - Loading one image
              - One second of game time
            answer: Updating every node, then drawing the picture
            hints:
              - A frame is one pass of the game loop.
            reviewSection: "Intuition — the frame paragraph"
          - id: mg1-002-quiz-2
            type: choice
            text: How long is one frame at 60 frames per second?
            options:
              - About 16.7 milliseconds
              - About 60 milliseconds
              - 1 second
              - About 1.67 milliseconds
            answer: About 16.7 milliseconds
            hints:
              - T = 1/60 seconds; multiply by 1000 for milliseconds.
            reviewSection: "Examples — How long is one frame?"
          - id: mg1-002-quiz-3
            type: choice
            text: What do purple values in the Inspector mean?
            options:
              - They are the running game's values, and will not be saved
              - They are values with errors
              - They are the saved values
              - They are values set by a script in the editor
            answer: They are the running game's values, and will not be saved
            hints:
              - They only appear while the game runs.
            reviewSection: "Intuition — Warning: changes while running are thrown away"
          - id: mg1-002-quiz-4
            type: choice
            text: Where do you change the game's background colour so it is kept?
            options:
              - Project › Project settings…, with the game stopped
              - In the Inspector while the game runs
              - In the Output panel
              - Anywhere, as long as the game is running
            answer: Project › Project settings…, with the game stopped
            hints:
              - Lasting changes are made in the editor.
            reviewSection: "Intuition — Procedure: Change something and test it"
          - id: mg1-002-quiz-5
            type: choice
            text: >-
              Which of these changes is NOT kept after Stop?
            options:
              - A node dragged in the viewport while the game ran
              - A position typed into the Inspector before Run
              - A background colour set in Project settings before Run
              - A script saved before Run
            answer: A node dragged in the viewport while the game ran
            hints:
              - Only one of these was made in the running copy.
            reviewSection: "Intuition — the prediction paragraph"
          - id: mg1-002-quiz-6
            type: choice
            text: A game draws 600 frames in 5 seconds. What is its frame rate?
            options:
              - 120 frames per second
              - 60 frames per second
              - 3000 frames per second
              - 600 frames per second
            answer: 120 frames per second
            hints:
              - f = n / t. A near-miss is 60, the usual rate, but 600 / 5 is 120.
            reviewSection: "Under the hood — frames in t seconds"

        checkpoints:
          - id: cp-mg1-002-1
            label: Read what Run does
            type: read
          - id: cp-mg1-002-2
            label: Read why changes while running are not kept
            type: read
          - id: cp-mg1-002-3
            label: Read what a frame is
            type: read
          - id: cp-mg1-002-4
            label: Complete "Run your game" in Game Studio
            type: lab
          - id: cp-mg1-002-5
            label: Move Hero while running, stop, and check it returned
            type: lab
          - id: cp-mg1-002-6
            label: Work through the frame-time example
            type: example
          - id: cp-mg1-002-7
            label: Work through the lost-tuning example
            type: example
          - id: cp-mg1-002-8
            label: Attempt the count-frames-backwards challenge
            type: challenge

      # ───────────────────────────────────────────────────────────── 1.3
      - order: 3
        id: mg1-003
        slug: your-first-script
        title: Your First Script
        subtitle: Make Hero move at 100 pixels a second, the same on every screen, with update(dt).
        tags:
          - game-studio
          - scripting
          - javascript
          - delta-time
        aliases: script class extends sprite2d ready update dt delta time speed pixels per second frame rate independent
        timeToComplete: 30
        coreConcept: >-
          A script is a class whose update(dt) runs every frame; moving by speed × dt each frame moves the same
          distance every second, whatever the frame rate.
        prerequisites:
          - mg1-002
        nextLesson: mg1-004

        hook:
          question: >-
            Two players run your game, one on a 60 fps laptop and one on a 144 fps monitor. Your hero moves 2
            pixels every frame. Who wins the race across the screen, and by how much?
          realWorldContext: >-
            Early PC games tied movement to frames, and became unplayably fast on newer computers. Every engine since
            gives scripts the frame's duration, dt, so that speed is measured in seconds.

        intuition:
          prose:
            - >-
              Hero is at x = 480. Every frame, add 2 to x. After 60 frames x is 600: Hero moved 120 pixels. At 60
              frames per second, that took one second, so the speed is 120 pixels per second.
            - >-
              Before reading on, predict: on a 144 fps screen, how far does the same code move Hero in one second?
              144 frames × 2 pixels = 288 pixels. The faster screen makes Hero more than twice as fast. That is the
              bug this lesson fixes.
            - >-
              A **script** is code attached to a node. In Game Studio it is a JavaScript **class** that extends the
              node's type: `export default class Hero extends Sprite2D`. Inside, `this` is the node, so
              `this.position` is Hero's position.
            - >-
              Game Studio calls two methods for you. `ready()` runs once, when the game starts. `update(dt)` runs
              every frame, and `dt` is the time since the last frame in seconds: 1/60 ≈ 0.0167 at 60 fps.
            - >-
              The fix is to move by **speed × dt** each frame. With speed = 100: at 60 fps each frame moves
              100 × (1/60) ≈ 1.67 pixels, and 60 of them make 100. At 144 fps each moves 0.69, and 144 of them make
              100. Same distance per second, on any screen.
          callouts:
            - type: procedure
              title: "Procedure: Move a node at a steady speed"
              body: |-
                Step 1. Select the node and press New script in the Inspector; the script opens with ready() and update(dt).
                Step 2. Add a field for the speed in pixels per second: speed = 100;
                Step 3. In update(dt), work out this frame's distance: this.speed * dt.
                Step 4. Set the position with x increased by that distance: this.position = { x: this.position.x + this.speed * dt, y: this.position.y };
                Step 5. Run, and check the speed against a known distance (100 px in 1 s).
            - type: warning
              title: A number per frame is not a speed
              body: >-
                Adding a fixed number each frame ties the speed to the screen: 2 per frame is 120 px/s at 60 fps and
                288 px/s at 144 fps. Always multiply by dt.
            - type: definition
              title: Class, field and method
              body: >-
                A class describes a kind of object. A field (speed = 100) is a value each object keeps. A method
                (update) is something it can do. Game Studio makes one object of your class for the node.
          visualizations:
            - id: GameStudioTask
              title: Make Hero move
              props:
                task: first-script
                lesson: mg1-003
                checkpoint: cp-mg1-003-4

        math:
          prose:
            - >-
              **Under the hood (optional).** Let the frames last $dt_1, dt_2, \ldots, dt_n$ seconds. They add up to
              the elapsed time: $dt_1 + dt_2 + \cdots + dt_n = t$. Moving by $v \cdot dt_i$ in frame $i$ gives a
              total distance $v \cdot dt_1 + \cdots + v \cdot dt_n$.
            - >-
              Factor out $v$: the total is $v (dt_1 + \cdots + dt_n) = v \cdot t$. That is distance = speed × time,
              true however many frames there were and however long each one was. This is why the result does not
              depend on the frame rate.
            - >-
              With a fixed step $s$ per frame instead, the total is $n \cdot s = f t s$, because there are $f t$
              frames in $t$ seconds. It grows with the frame rate $f$: at $s = 2$, $t = 1$, it is 120 at 60 fps and
              288 at 144 fps.
            - >-
              The game checks this exactly: the task runs your script at 30 and at 144 frames per second and
              measures how far Hero went in one second. With speed × dt both are 100 pixels, to within rounding.
          equations: []
          callouts: []
          visualizations: []

        rigor:
          prose:
            - >-
              Formally, update(dt) is a numerical integration of position over time: $x_{n+1} = x_n + v \, dt_n$
              (Euler's method). For constant $v$ it is exact, because the velocity does not change inside a frame.
            - >-
              The invariant is distance per second, $v$. The number of frames and their lengths vary from screen to
              screen; their sum, the elapsed time, does not, and the method only ever uses that sum.
            - >-
              On a graph of position against time, each frame is a short straight segment of slope $v$. Whatever
              the segment lengths, consecutive segments of the same slope form one straight line.
            - >-
              When speed itself changes, as with gravity in chapter 2, Euler's method is no longer exact: the error
              depends on $dt$. That is why physics runs at a fixed step of 1/60 s, a topic for that chapter.
          callouts: []
          visualizations: []

        examples:
          - id: mg1-003-ex1
            title: One frame's distance
            difficulty: easy
            problem: Hero's speed is 100 pixels per second. How far does it move in one frame at 60 fps?
            steps:
              - expression: 'dt = \tfrac{1}{60} \approx 0.0167\ \text{s}'
                annotation: dt is the time since the last frame; at 60 fps it is a sixtieth of a second.
                strategyTitle: "Step 1: Find dt"
              - expression: 'v \cdot dt = 100 \times \tfrac{1}{60} \approx 1.67\ \text{px}'
                annotation: This is what `this.speed * dt` works out each frame.
                strategyTitle: "Step 2: Multiply speed by dt"
            answer: Hero moves about 1.67 pixels each frame, which adds up to 100 pixels over 60 frames.
          - id: mg1-003-ex2
            title: The same second on two screens
            difficulty: medium
            problem: Show that speed × dt moves Hero 100 pixels in one second at both 30 fps and 144 fps.
            steps:
              - expression: '30 \times \left(100 \times \tfrac{1}{30}\right) = 30 \times 3.33 = 100'
                annotation: Fewer, longer frames each move further.
                strategyTitle: "Step 1: 30 frames of 1/30 s"
              - expression: '144 \times \left(100 \times \tfrac{1}{144}\right) = 144 \times 0.694 = 100'
                annotation: More, shorter frames each move less.
                strategyTitle: "Step 2: 144 frames of 1/144 s"
              - expression: '100 = 100'
                annotation: "The task checks exactly this: it runs your script at 30 and 144 fps."
                strategyTitle: "Step 3: Compare"
            answer: Both screens move Hero 100 pixels in one second, because frames × (speed × dt) = speed × time.
          - id: mg1-003-ex3
            title: Fixing a frame-tied speed
            difficulty: hard
            problem: >-
              A script does `this.position = { x: this.position.x + 3, y: this.position.y }` and the designer liked
              the speed on their 60 fps laptop. Rewrite it so every screen gets that speed.
            steps:
              - expression: '3 \times 60 = 180\ \text{px/s}'
                annotation: The speed the designer saw was 3 pixels per frame times 60 frames per second.
                strategyTitle: "Step 1: Find the speed they liked"
              - expression: 'x \leftarrow x + 180 \cdot dt'
                annotation: Add a field `speed = 180;` and use `this.position.x + this.speed * dt`.
                strategyTitle: "Step 2: Multiply that speed by dt"
              - expression: '144 \times 180 \times \tfrac{1}{144} = 180'
                annotation: On a 144 fps screen it is now 180 px/s too, instead of 432.
                strategyTitle: "Step 3: Check on another screen"
            answer: Use speed = 180 and move by this.speed * dt; every screen then moves 180 pixels per second.

        challenges:
          - id: mg1-003-ch1
            title: Slower hero
            difficulty: easy
            problem: How far does a hero with speed 50 move in 4 seconds?
            hint: Distance is speed × time.
            answer: It moves 200 pixels, because 50 × 4 = 200.
            walkthrough:
              - expression: '50 \times 4 = 200'
                annotation: The frame rate does not appear, because speed × dt adds up to speed × time.
          - id: mg1-003-ch2
            title: Crossing the screen
            difficulty: medium
            problem: >-
              Hero starts at x = 0 with speed 240. How long until it reaches the right edge of a 960-wide game?
            hint: Rearrange distance = speed × time for time.
            answer: It takes 4 seconds, because 960 / 240 = 4.
            walkthrough:
              - expression: 't = \tfrac{960}{240} = 4\ \text{s}'
                annotation: Time is distance divided by speed.
          - id: mg1-003-ch3
            title: Diagnose the race
            difficulty: hard
            problem: >-
              Two testers report the same race: one finished in 8 seconds, the other in 3.3 seconds. The code adds 2
              to x every frame and the track is 960 pixels. What were their frame rates?
            hint: With a fixed step, speed is step × frames per second.
            answer: >-
              About 60 fps and 144 fps: 960 / (2 × 60) = 8 s and 960 / (2 × 144) ≈ 3.3 s; multiplying by dt would
              make both take the same time.
            walkthrough:
              - expression: 'f = \tfrac{960}{2 \cdot t}: \quad \tfrac{960}{16} = 60,\ \tfrac{960}{6.67} \approx 144'
                annotation: Solve t = 960 / (2f) for f with each tester's time.

        semantics:
          core:
            - symbol: script
              meaning: A class attached to a node that gives it behaviour; this inside it is the node.
            - symbol: ready()
              meaning: Runs once when the game starts, for setting things up.
            - symbol: update(dt)
              meaning: Runs every frame; the place to change things over time.
            - symbol: dt
              meaning: The seconds since the last frame, about 0.0167 at 60 fps; frames' dt add up to the elapsed time.
            - symbol: speed × dt
              meaning: This frame's distance, so that the total per second is the speed on any screen.
          rulesOfThumb:
            - Every change over time in update(dt) is multiplied by dt.
            - Keep speeds in fields measured per second, so they read like real speeds.
            - Check movement against a known distance and time, such as 100 px in 1 s.
            - If a game feels faster on a better screen, look for a change without dt.

        misconceptions:
          - falseBelief: update(dt) runs once per second.
            whyStudentsThinkIt: Speeds are written per second, so the code looks like it describes one second.
            correctionExample: At 60 fps, update runs 60 times a second, each time with dt ≈ 0.0167.
            contrastCase: If update ran once a second, Hero would jump 100 pixels at a time instead of gliding.
          - falseBelief: Multiplying by dt makes a game slower.
            whyStudentsThinkIt: dt is a small number, and multiplying by a small number shrinks things.
            correctionExample: Speed 100 × dt 0.0167 is 1.67 px a frame, and 60 frames make exactly 100 px.
            contrastCase: The per-frame step is small, but there are many frames; the per-second speed is the field's value.

        transferPrompts:
          - situation: >-
              A cloud should drift across the sky so it takes exactly 30 seconds, on every player's screen.
            competingTechniques:
              - A speed in pixels per second multiplied by dt
              - A fixed number of pixels added each frame
            whyThisTechniqueWins: >-
              speed × dt makes the crossing take distance / speed seconds everywhere; a fixed step takes longer on
              slow screens and less on fast ones.
          - situation: >-
              A timer should count down from 10 seconds to 0 in update.
            competingTechniques:
              - Subtract dt from the timer each frame
              - Subtract 1 from the timer each frame
            whyThisTechniqueWins: >-
              The dts add up to real seconds, so subtracting dt reaches 0 after 10 seconds; subtracting 1 reaches 0
              after 10 frames, a sixth of a second.

        debugging:
          - commonError: Writing this.position.x += 2 without dt.
            symptom: The task says Hero moved different distances at 30 and 144 frames a second.
            whyItHappened: A fixed step per frame makes the speed depend on how many frames there are.
            repairStrategy: Replace the 2 with this.speed * dt and add a speed field in pixels per second.
          - commonError: Spelling the class's method Update or update() without dt.
            symptom: Nothing moves, or dt is undefined and Hero's position becomes NaN.
            whyItHappened: Game Studio calls exactly update(dt); a different name is never called, and a missing parameter has no value.
            repairStrategy: Write update(dt) exactly, lower-case, with dt between the brackets.

        mastery:
          targetLevel: 3
          solveIndependently: Write a script that moves a node at a given speed in pixels per second.
          explainVerbally: Explain why speed × dt gives the same distance per second at any frame rate.
          detectIncorrectApplication: Spot movement that is tied to the frame rate and fix it.
          transferToUnfamiliar: Use dt for any change over time, such as a countdown or a fading colour.

        assessment:
          questions:
            - id: mg1-003-assess-1
              type: choice
              text: At 60 fps, what is dt?
              options:
                - About 0.0167 seconds
                - 60 seconds
                - 1 second
                - About 16.7 seconds
              answer: About 0.0167 seconds
              hint: dt is the time of one frame, 1/60 of a second.

        quiz:
          - id: mg1-003-quiz-1
            type: choice
            text: How often does update(dt) run?
            options:
              - Once every frame
              - Once when the game starts
              - Once a second
              - Only when a key is pressed
            answer: Once every frame
            hints:
              - ready() is the one that runs once.
            reviewSection: "Intuition — the ready and update paragraph"
          - id: mg1-003-quiz-2
            type: choice
            text: Hero adds 2 pixels to x every frame. How fast is it at 144 fps?
            options:
              - 288 pixels per second
              - 120 pixels per second
              - 2 pixels per second
              - 144 pixels per second
            answer: 288 pixels per second
            hints:
              - Frames per second times pixels per frame. 120 is the near-miss, the speed at 60 fps.
            reviewSection: "Intuition — the prediction paragraph"
          - id: mg1-003-quiz-3
            type: choice
            text: Which line moves Hero right at 100 pixels per second on any screen, with speed = 100?
            options:
              - "this.position = { x: this.position.x + this.speed * dt, y: this.position.y }"
              - "this.position = { x: this.position.x + this.speed, y: this.position.y }"
              - "this.position = { x: this.position.x + dt, y: this.position.y }"
              - "this.position = { x: this.speed * dt, y: this.position.y }"
            answer: "this.position = { x: this.position.x + this.speed * dt, y: this.position.y }"
            hints:
              - It must add to the old x, and the amount must be speed × dt.
            reviewSection: "Intuition — Procedure: Move a node at a steady speed"
          - id: mg1-003-quiz-4
            type: choice
            text: Inside Hero's script, what is this?
            options:
              - The Hero node itself
              - The whole game
              - The script file
              - The scene tree
            answer: The Hero node itself
            hints:
              - this.position is Hero's position.
            reviewSection: "Intuition — the script paragraph"
          - id: mg1-003-quiz-5
            type: choice
            text: >-
              Which of these does NOT need multiplying by dt in update?
            options:
              - Setting a sprite's texture when a key is pressed
              - Moving at 200 pixels per second
              - Counting a timer down in seconds
              - Turning at 90 degrees per second
            answer: Setting a sprite's texture when a key is pressed
            hints:
              - dt is for amounts per second; a one-off change is not an amount per second.
            reviewSection: "Rules of thumb — every change over time is multiplied by dt"
          - id: mg1-003-quiz-6
            type: choice
            text: Why does speed × dt give the same distance per second on every screen?
            options:
              - Because the dts of all the frames add up to the elapsed time
              - Because every screen runs at 60 fps
              - Because dt is always 1/60
              - Because the engine skips frames on fast screens
            answer: Because the dts of all the frames add up to the elapsed time
            hints:
              - Factor the speed out of the sum of the frames' distances.
            reviewSection: "Under the hood — factoring out v"

        checkpoints:
          - id: cp-mg1-003-1
            label: Read the 2-pixels-per-frame example
            type: read
          - id: cp-mg1-003-2
            label: Read what ready and update(dt) do
            type: read
          - id: cp-mg1-003-3
            label: Read why speed × dt works on every screen
            type: read
          - id: cp-mg1-003-4
            label: Complete "Make Hero move" in Game Studio
            type: lab
          - id: cp-mg1-003-5
            label: Change speed to 200 in Game Studio and predict where Hero is after 1 second
            type: lab
          - id: cp-mg1-003-6
            label: Work through the two-screens example
            type: example
          - id: cp-mg1-003-7
            label: Work through the frame-tied speed fix
            type: example
          - id: cp-mg1-003-8
            label: Attempt the diagnose-the-race challenge
            type: challenge

      # ───────────────────────────────────────────────────────────── 1.4
      - order: 4
        id: mg1-004
        slug: input-actions
        title: Steering with Input Actions
        subtitle: Move with the arrow keys or WASD, at the same speed in every direction, diagonals included.
        tags:
          - game-studio
          - input
          - vectors
          - normalization
        aliases: input actions keyboard arrow keys wasd move_left move_right input.vector direction normalize diagonal speed
        timeToComplete: 30
        coreConcept: >-
          Scripts ask about named actions instead of keys, and turn four of them into a direction of length 1, so
          moving by direction × speed × dt is equally fast in every direction.
        prerequisites:
          - mg1-003
        nextLesson: mg2-001

        hook:
          question: >-
            Hero moves 100 pixels a second when you hold →, and 100 when you hold ↓. How fast does it go when you
            hold both?
          realWorldContext: >-
            Many early games let players move faster diagonally, and speedrunners still exploit it. Input actions
            and normalized directions are how every modern engine avoids it, and let players choose their keys.

        intuition:
          prose:
            - >-
              Hold → and Hero should go right. Write the direction as two numbers: (1, 0) means one step right and
              none down. Holding ↓ gives (0, 1). Moving by direction × 100 × dt goes 100 pixels a second either way.
            - >-
              Before reading on, predict: hold → and ↓ together, the direction is (1, 1). How far is that in one
              second at speed 100? Each second Hero goes 100 right and 100 down. That is the diagonal of a
              100-by-100 square: about 141 pixels. Diagonals are 41% faster.
            - >-
              The length of a direction (x, y) is $\sqrt{x^2 + y^2}$, by Pythagoras. (1, 0) has length 1, but (1, 1)
              has length $\sqrt{2} \approx 1.414$. To fix it, divide each number by the length: (1, 1) becomes
              (0.707, 0.707), which has length 1. Making a direction length 1 is called **normalizing** it.
            - >-
              Scripts should not ask about keys either. An **input action** is a name, such as `move_left`, bound to
              keys: ← and A. The script asks `input.isPressed('move_left')`, and a player can rebind the keys in
              **Project › Project settings…** without the script changing.
            - >-
              Game Studio does both jobs in one call: `input.vector('move_left', 'move_right', 'move_up',
              'move_down')` looks at the four actions and gives a direction already normalized, or (0, 0) when no
              key is held. `direction.scale(this.speed * dt)` turns it into this frame's step.
          callouts:
            - type: procedure
              title: "Procedure: Steer a node with the keyboard"
              body: |-
                Step 1. Open the node's script; keep the speed field (pixels per second).
                Step 2. In update(dt), get a direction: const direction = input.vector('move_left', 'move_right', 'move_up', 'move_down');
                Step 3. Turn it into this frame's step: direction.scale(this.speed * dt).
                Step 4. Add the step to the position: this.position = this.position.add(direction.scale(this.speed * dt));
                Step 5. Run and check: no key, no movement; each arrow, 100 px/s; two arrows together, still 100 px/s.
            - type: warning
              title: Adding two directions yourself
              body: >-
                If you build the direction by adding (1, 0) and (0, 1) for two held keys, you get (1, 1), of length
                1.414. Normalize the sum, or use input.vector, which already does.
            - type: definition
              title: Vector
              body: >-
                A vector is a pair of numbers (x, y) treated as one thing: a position, a step or a direction. Game
                Studio's Vec2 has add, scale, length and normalized, so you can work with whole vectors at once.
          visualizations:
            - id: GameStudioTask
              title: Steer Hero with the keyboard
              props:
                task: input-actions
                lesson: mg1-004
                checkpoint: cp-mg1-004-4

        math:
          prose:
            - >-
              **Under the hood (optional).** A direction is a vector $\mathbf{d} = (x, y)$. Its length is
              $|\mathbf{d}| = \sqrt{x^2 + y^2}$: the two numbers are the sides of a right-angled triangle, and the
              length is its hypotenuse, by Pythagoras' theorem.
            - >-
              Moving by $\mathbf{d} \cdot v \cdot dt$ each frame covers $|\mathbf{d}| \cdot v$ pixels per second,
              because scaling a vector by a number scales its length by that number. With $|\mathbf{d}| = 1$ that is
              exactly $v$. With $\mathbf{d} = (1, 1)$ it is $\sqrt{2}\, v \approx 141$ at $v = 100$.
            - >-
              Normalizing divides by the length: $\hat{\mathbf{d}} = \mathbf{d} / |\mathbf{d}|$. Its length is
              $|\mathbf{d}| / |\mathbf{d}| = 1$. For $(1, 1)$: $(1/\sqrt{2}, 1/\sqrt{2}) \approx (0.707, 0.707)$,
              and $0.707^2 + 0.707^2 = 0.5 + 0.5 = 1$.
            - >-
              The zero vector $(0, 0)$ has length 0 and cannot be divided by it. input.vector returns $(0, 0)$ when no
              key is held, and Vec2's normalized() does the same for a zero vector, so standing still never divides
              by zero.
          equations: []
          callouts: []
          visualizations: []

        rigor:
          prose:
            - >-
              Formally, normalization maps every non-zero vector $\mathbf{d}$ to the unit vector
              $\mathbf{d}/|\mathbf{d}|$ with the same direction; it is undefined at $\mathbf{0}$, which input.vector
              handles by returning $\mathbf{0}$.
            - >-
              The invariant is direction: $\mathbf{d}$ and $\hat{\mathbf{d}}$ point the same way, because one is a
              positive multiple of the other. Only the length changes, to 1, which is what makes speed the same in
              every direction.
            - >-
              Geometrically, the eight directions from four keys lie on a square of side 2 around the origin;
              normalizing pulls the four corners in to the unit circle, so all eight lie on it.
            - >-
              A gamepad stick gives directions anywhere inside the circle, with length meaning "how far pushed".
              There, a length below 1 is wanted (walking slowly), and only lengths above 1 are reduced: clamping
              instead of normalizing. Chapter 2's velocity uses the same vector operations.
          callouts: []
          visualizations: []

        examples:
          - id: mg1-004-ex1
            title: The length of a diagonal
            difficulty: easy
            problem: How long is the direction (1, 1)?
            steps:
              - expression: '|(1, 1)| = \sqrt{1^2 + 1^2}'
                annotation: The two numbers are the sides of a right-angled triangle; the length is the long side.
                strategyTitle: "Step 1: Use Pythagoras"
              - expression: '= \sqrt{2} \approx 1.414'
                annotation: Longer than 1, so moving by it is about 41% faster than moving by (1, 0).
                strategyTitle: "Step 2: Work it out"
            answer: The direction (1, 1) is about 1.414 long, not 1.
          - id: mg1-004-ex2
            title: Normalizing the diagonal
            difficulty: medium
            problem: Normalize (1, 1), and check that the result has length 1.
            steps:
              - expression: '\tfrac{(1, 1)}{\sqrt{2}} = (0.707, 0.707)'
                annotation: Divide each number by the length, 1.414.
                strategyTitle: "Step 1: Divide by the length"
              - expression: '\sqrt{0.707^2 + 0.707^2} = \sqrt{0.5 + 0.5} = 1'
                annotation: Measuring again gives 1, so this direction moves at exactly the speed.
                strategyTitle: "Step 2: Check the length"
            answer: (1, 1) normalized is about (0.707, 0.707), which has length 1.
          - id: mg1-004-ex3
            title: A step for one frame
            difficulty: hard
            problem: >-
              → and ↓ are held. Speed is 100 and dt is 1/60. What does `direction.scale(this.speed * dt)` give,
              and how far is that step?
            steps:
              - expression: '\mathbf{d} = (0.707, 0.707)'
                annotation: input.vector gives the normalized direction for → and ↓ together.
                strategyTitle: "Step 1: The direction"
              - expression: '100 \times \tfrac{1}{60} = 1.667'
                annotation: speed × dt is this frame's distance.
                strategyTitle: "Step 2: This frame's distance"
              - expression: '(0.707, 0.707) \times 1.667 = (1.18, 1.18),\quad |(1.18, 1.18)| = 1.667'
                annotation: Scaling the direction by the distance gives the step, and its length is that distance.
                strategyTitle: "Step 3: Scale the direction"
            answer: The step is about (1.18, 1.18), a distance of 1.667 pixels, the same as a straight step.

        challenges:
          - id: mg1-004-ch1
            title: Straight left
            difficulty: easy
            problem: Which direction does input.vector give when only ← is held, and how long is it?
            hint: Left is negative x.
            answer: It gives (−1, 0), which has length 1.
            walkthrough:
              - expression: '|(-1, 0)| = \sqrt{1 + 0} = 1'
                annotation: A single key already gives a direction of length 1.
          - id: mg1-004-ch2
            title: Up and left
            difficulty: medium
            problem: Normalize (−1, −1). Which way does it point on screen?
            hint: Divide by the length, then remember that negative y is up.
            answer: It is about (−0.707, −0.707), pointing up and to the left.
            walkthrough:
              - expression: '\tfrac{(-1, -1)}{\sqrt{2}} \approx (-0.707, -0.707)'
                annotation: Negative x is left and negative y is up the screen.
          - id: mg1-004-ch3
            title: Debug the speedy diagonal
            difficulty: hard
            problem: >-
              A script builds the direction with input.axis('move_left', 'move_right') for x and
              input.axis('move_up', 'move_down') for y, then moves by it times speed × dt. The task says diagonals
              go 141 px a second. Fix it.
            hint: input.axis gives each number separately; together they make (1, 1) on a diagonal.
            answer: >-
              Normalize the direction before scaling it (new Vec2(x, y).normalized()), or use input.vector, which
              returns it normalized; the diagonal then moves 100 px a second.
            walkthrough:
              - expression: '|(1, 1)| = 1.414 \;\Rightarrow\; \tfrac{(1, 1)}{1.414} = (0.707, 0.707)'
                annotation: Dividing by the length brings the diagonal back to length 1.

        semantics:
          core:
            - symbol: input action
              meaning: A name such as move_left bound to keys; scripts ask about the name, players choose the keys.
            - symbol: input.vector(left, right, up, down)
              meaning: The direction the four actions point, normalized, or (0, 0) when none is held.
            - symbol: vector (x, y)
              meaning: Two numbers treated as one, for a position, a step or a direction.
            - symbol: "|d| = √(x² + y²)"
              meaning: A vector's length, the hypotenuse of the triangle its two numbers make.
            - symbol: normalize
              meaning: Divide a vector by its length so it keeps its direction and has length 1.
          rulesOfThumb:
            - Ask about actions, never keys, so players can rebind them.
            - A direction should be length 1 before you multiply it by a speed.
            - If diagonals feel fast, print the direction's length; 1.414 means it was not normalized.
            - Build the step as direction × speed × dt, then add it to the position.

        misconceptions:
          - falseBelief: Holding two arrow keys moves at the same speed as one, without doing anything.
            whyStudentsThinkIt: Each key is set up to move 100 px a second, so both together feel like 100 too.
            correctionExample: (1, 1) × 100 moves 100 right and 100 down each second, which is 141 px along the diagonal.
            contrastCase: Normalized, (0.707, 0.707) × 100 moves 70.7 right and 70.7 down, which is 100 px along the diagonal.
          - falseBelief: Normalizing changes which way the vector points.
            whyStudentsThinkIt: All the numbers change, so it seems the direction must have changed too.
            correctionExample: (2, 0) normalized is (1, 0); both point right, only the length changed from 2 to 1.
            contrastCase: Swapping x and y, (0, 2), would change the direction; dividing both by the same number never does.

        transferPrompts:
          - situation: >-
              An enemy should walk towards the player at 80 px a second, from wherever it is.
            competingTechniques:
              - Normalize (player − enemy) and scale it by 80 × dt
              - Add (player − enemy) × dt to the enemy's position
            whyThisTechniqueWins: >-
              (player − enemy) is longer when the player is far away, so using it directly makes the enemy faster
              at a distance; normalizing keeps 80 px a second at any distance.
          - situation: >-
              Players ask to use I, J, K and L to move instead of the arrow keys.
            competingTechniques:
              - Bind the keys to the existing actions in Project settings
              - Change every script to check for the new keys
            whyThisTechniqueWins: >-
              Scripts ask about move_left and friends, so binding new keys to those actions needs no code change.

        debugging:
          - commonError: Adding the direction to the position without speed × dt.
            symptom: Hero shoots off the screen, moving one pixel every frame (60 px/s at 60 fps, more on fast screens).
            whyItHappened: A direction is length 1; without scaling it is a step of one pixel per frame.
            repairStrategy: Scale it first, this.position.add(direction.scale(this.speed * dt)).
          - commonError: Misspelling an action, input.vector('move_left', 'move_rigth', …).
            symptom: Game Studio reports there is no input action "move_rigth", and points to the Input map.
            whyItHappened: Actions are looked up by name; a misspelt name does not exist.
            repairStrategy: Copy the name from Project › Project settings… › Input map.

        mastery:
          targetLevel: 3
          solveIndependently: Write a script that steers a node with input.vector at a given speed.
          explainVerbally: Explain why an unnormalized diagonal is about 41% faster.
          detectIncorrectApplication: Recognise a direction that is not length 1 from its symptom and fix it.
          transferToUnfamiliar: Normalize any vector, such as the direction from an enemy to the player.

        assessment:
          questions:
            - id: mg1-004-assess-1
              type: choice
              text: What is the length of (0.6, 0.8)?
              options:
                - "1"
                - "1.4"
                - "0.7"
                - "0.2"
              answer: "1"
              hint: 0.36 + 0.64 = 1, and the square root of 1 is 1.

        quiz:
          - id: mg1-004-quiz-1
            type: choice
            text: Unnormalized, how fast does Hero go diagonally with speed 100?
            options:
              - About 141 pixels per second
              - 100 pixels per second
              - 200 pixels per second
              - About 70.7 pixels per second
            answer: About 141 pixels per second
            hints:
              - The length of (1, 1) is √2 ≈ 1.414. 200 is the near-miss of adding the two speeds.
            reviewSection: "Intuition — the prediction paragraph"
          - id: mg1-004-quiz-2
            type: choice
            text: What does normalizing a vector do?
            options:
              - Keeps its direction and makes its length 1
              - Makes both numbers equal
              - Rounds both numbers to whole pixels
              - Turns it to point right
            answer: Keeps its direction and makes its length 1
            hints:
              - Divide by the length.
            reviewSection: "Intuition — Definition: Vector"
          - id: mg1-004-quiz-3
            type: choice
            text: Why do scripts ask about input actions instead of keys?
            options:
              - So players can change the keys without changing the scripts
              - Because keys cannot be read in JavaScript
              - Because actions are faster
              - So that diagonals are normalized
            answer: So players can change the keys without changing the scripts
            hints:
              - Actions are names bound to keys in Project settings.
            reviewSection: "Intuition — the input action paragraph"
          - id: mg1-004-quiz-4
            type: choice
            text: What does input.vector return when no key is held?
            options:
              - (0, 0)
              - (1, 0)
              - An error
              - (1, 1)
            answer: (0, 0)
            hints:
              - Standing still is the zero vector, which is not normalized because it cannot be.
            reviewSection: "Under the hood — the zero vector"
          - id: mg1-004-quiz-5
            type: choice
            text: >-
              Which of these directions would NOT give the speed you set if scaled by speed × dt?
            options:
              - (1, 1)
              - (0.707, 0.707)
              - (0, −1)
              - (0.6, 0.8)
            answer: (1, 1)
            hints:
              - Work out each length; only one is not 1.
            reviewSection: "Examples — The length of a diagonal"
          - id: mg1-004-quiz-6
            type: choice
            text: Which line steers Hero correctly?
            options:
              - "this.position = this.position.add(input.vector('move_left', 'move_right', 'move_up', 'move_down').scale(this.speed * dt))"
              - "this.position = this.position.add(input.vector('move_left', 'move_right', 'move_up', 'move_down'))"
              - "this.position = input.vector('move_left', 'move_right', 'move_up', 'move_down').scale(this.speed * dt)"
              - "this.position = this.position.add(input.vector('move_left', 'move_right', 'move_up', 'move_down').scale(this.speed))"
            answer: "this.position = this.position.add(input.vector('move_left', 'move_right', 'move_up', 'move_down').scale(this.speed * dt))"
            hints:
              - It must add a step to the old position, and the step is direction × speed × dt.
            reviewSection: "Intuition — Procedure: Steer a node with the keyboard"

        checkpoints:
          - id: cp-mg1-004-1
            label: Read the diagonal prediction
            type: read
          - id: cp-mg1-004-2
            label: Read how normalizing fixes the diagonal
            type: read
          - id: cp-mg1-004-3
            label: Read what input actions are for
            type: read
          - id: cp-mg1-004-4
            label: Complete "Steer Hero with the keyboard" in Game Studio
            type: lab
          - id: cp-mg1-004-5
            label: Bind I, J, K and L to the move actions in Project settings and try them
            type: lab
          - id: cp-mg1-004-6
            label: Work through the normalizing example
            type: example
          - id: cp-mg1-004-7
            label: Work through the one-frame step example
            type: example
          - id: cp-mg1-004-8
            label: Attempt the speedy-diagonal debugging challenge
            type: challenge

  # ═══════════════════════════════════════════════════════════════ Chapter 2: Physics
  - number: 2
    slug: physics
    lessons:
      # ───────────────────────────────────────────────────────────── 2.1
      - order: 1
        id: mg2-001
        slug: bodies-and-walls
        title: Bodies, Shapes and Walls
        subtitle: A player you move with the keys, and a wall it cannot walk through.
        tags: [game-studio, physics, collision]
        aliases: characterbody2d staticbody2d collisionshape2d moveandslide walls collision minimum translation vector
        timeToComplete: 30
        coreConcept: >-
          A body is a node the physics engine knows about; its collision shape is what bumps into things. A
          CharacterBody2D moves when its script calls moveAndSlide(), and stops at solid bodies such as a StaticBody2D.
        prerequisites: [mg1-004]
        nextLesson: mg2-002
        hook:
          question: >-
            Hero walks right at 200 pixels a second towards a wall. Nothing in your script mentions the wall. How
            does Hero know to stop, and exactly where does it stop?
          realWorldContext: >-
            Every platformer, top-down adventure and racing game needs things that cannot pass through each other.
            Engines do this once, for every body, so a script only says where it wants to go.
        intuition:
          prose:
            - >-
              Hero is 16 pixels wide, standing at x = 300. A wall 20 pixels wide stands at x = 600. Hero moves right at
              200 pixels a second. Its right edge is at 300 + 8 = 308; the wall's left edge is at 600 − 10 = 590. The
              gap is 282 pixels, so after about 1.4 seconds the two edges meet.
            - >-
              Before reading on, predict: where is Hero's centre when it stops? Its right edge sits on the wall's left
              edge, at 590, so its centre is 8 pixels to the left: x = 582. It stops there however fast it was going.
            - >-
              For this to happen, both need a **collision shape**: a CollisionShape2D under the node, a rectangle or a
              circle. The picture is what you see; the shape is what bumps. A sprite with no shape walks through
              everything.
            - >-
              The two are different kinds of **body**. Hero is a **CharacterBody2D**: a body your script moves. The
              wall is a **StaticBody2D**: a body that never moves, and only gets in the way.
            - >-
              The script sets `this.velocity`, in pixels per second, then calls `this.moveAndSlide()`. That moves Hero
              by velocity × dt, and if the move would overlap a solid body, pushes Hero back out. It runs in
              `physicsUpdate(dt)`, which Game Studio calls at a fixed 60 steps a second.
          callouts:
            - type: procedure
              title: "Procedure: Make a body that walls stop"
              body: |-
                Step 1. Add a CharacterBody2D for the moving thing, and name it (Player).
                Step 2. Under it, add a Sprite2D for the picture and a CollisionShape2D for the shape; size the shape to the picture.
                Step 3. Give it a script (New script gives arrow-key movement): set this.velocity, then call this.moveAndSlide() in physicsUpdate(dt).
                Step 4. Add a StaticBody2D for each wall, with its own CollisionShape2D.
                Step 5. Run, walk into the wall, and check that the body stops at the wall's edge.
            - type: warning
              title: No shape, no collision
              body: >-
                A body without a CollisionShape2D, or with a shape of size 0, passes through everything. If Player
                walks through the wall, select each in turn and check there is a shape under it, and that it has a size.
            - type: insight
              title: Godot's names
              body: >-
                CharacterBody2D, StaticBody2D, CollisionShape2D, velocity and moveAndSlide() are Godot's names and work
                the same way there.
          visualizations:
            - id: GameStudioTask
              title: A player who cannot walk through walls
              props: { task: stop-at-walls, lesson: mg2-001, checkpoint: cp-mg2-001-4 }
        math:
          prose:
            - >-
              **Under the hood (optional).** Two rectangles with centres $x_A$, $x_B$ and widths $w_A$, $w_B$ overlap
              across when $|x_A - x_B| < \tfrac{w_A + w_B}{2}$. The overlap across is
              $o_x = \tfrac{w_A + w_B}{2} - |x_A - x_B|$, and down is $o_y = \tfrac{h_A + h_B}{2} - |y_A - y_B|$. They
              overlap only when both are positive.
            - >-
              To separate them, the engine pushes along the axis with the smaller overlap, by exactly that much. This
              shortest push is the **minimum translation vector**. For Hero moving into the wall, $o_x$ is a few pixels
              while $o_y$ is large, so the push is sideways, back to $x = 582$.
            - >-
              Then it slides: the part of the velocity going into the wall is removed. With $\mathbf{n}$ the wall's
              surface direction (length 1, pointing out of it), the new velocity is
              $\mathbf{v} - (\mathbf{v} \cdot \mathbf{n})\,\mathbf{n}$ when $\mathbf{v} \cdot \mathbf{n} < 0$. Walking
              diagonally into a wall with $\mathbf{v} = (200, 100)$ and $\mathbf{n} = (-1, 0)$:
              $\mathbf{v} \cdot \mathbf{n} = -200$, so $\mathbf{v}$ becomes $(0, 100)$, sliding along the wall.
          equations: []
          callouts: []
          visualizations: []
        rigor:
          prose:
            - >-
              Formally, for convex shapes $A$ and $B$, a translation $\mathbf{t}$ separates them when $A + \mathbf{t}$
              and $B$ have disjoint interiors; the minimum translation vector is the shortest such $\mathbf{t}$. For two
              axis-aligned rectangles it lies along an axis, with length $\min(o_x, o_y)$.
            - >-
              Sliding keeps the tangential part of the velocity and removes the normal part. The invariant is the
              tangential speed: walking along a wall loses no speed along it.
            - >-
              Geometrically, $(\mathbf{v} \cdot \mathbf{n})\mathbf{n}$ is the projection of $\mathbf{v}$ onto the
              normal, and subtracting it leaves the projection onto the wall's line.
            - >-
              Real engines also test the path, not just the end position, so a very fast body cannot jump over a thin
              wall in one step ("tunnelling"). At 60 steps a second and game speeds, Game Studio's steps are short
              enough that this rarely matters.
          callouts: []
          visualizations: []
        examples:
          - id: mg2-001-ex1
            title: Where it stops
            difficulty: easy
            problem: Player is 16 wide; a wall 20 wide is centred at x = 600. Player walks right into it. Where is its centre?
            steps:
              - expression: '600 - \tfrac{20}{2} = 590'
                annotation: The wall's left edge is half its width left of its centre.
                strategyTitle: "Step 1: The wall's edge"
              - expression: '590 - \tfrac{16}{2} = 582'
                annotation: Player's right edge touches it, so its centre is half Player's width further left.
                strategyTitle: "Step 2: Back off by half the body"
            answer: Player stops with its centre at x = 582.
          - id: mg2-001-ex2
            title: Which way is the push?
            difficulty: medium
            problem: >-
              After a step, Player (16 × 22, centre 584, 270) overlaps the wall (20 × 200, centre 600, 270). Which
              way and how far is it pushed?
            steps:
              - expression: 'o_x = \tfrac{16 + 20}{2} - |584 - 600| = 18 - 16 = 2'
                annotation: The overlap across is the half-widths summed, less the distance between centres.
                strategyTitle: "Step 1: Overlap across"
              - expression: 'o_y = \tfrac{22 + 200}{2} - |270 - 270| = 111'
                annotation: The overlap down is far bigger.
                strategyTitle: "Step 2: Overlap down"
              - expression: 'o_x < o_y \Rightarrow \text{push } 2 \text{ px left}'
                annotation: The smaller overlap gives the shortest push, back to x = 582.
                strategyTitle: "Step 3: Push along the smaller overlap"
            answer: It is pushed 2 pixels left, to x = 582.
          - id: mg2-001-ex3
            title: Sliding along a wall
            difficulty: hard
            problem: >-
              Player moves with velocity (200, 100) into a wall whose surface faces left, n = (−1, 0). What velocity is
              left after the slide?
            steps:
              - expression: '\mathbf{v} \cdot \mathbf{n} = 200 \times (-1) + 100 \times 0 = -200'
                annotation: Negative means it is moving into the wall.
                strategyTitle: "Step 1: How much goes into the wall"
              - expression: '\mathbf{v} - (\mathbf{v} \cdot \mathbf{n})\mathbf{n} = (200, 100) - (-200)(-1, 0) = (0, 100)'
                annotation: The part into the wall is removed; the part along it stays.
                strategyTitle: "Step 2: Remove it"
            answer: The velocity becomes (0, 100), so Player slides down along the wall at 100 px/s.
        challenges:
          - id: mg2-001-ch1
            title: From the left
            difficulty: easy
            problem: A 24-wide player walks left into a wall 40 wide centred at x = 100. Where does its centre stop?
            hint: Find the wall's right edge first.
            answer: At x = 132, because the wall's right edge is at 120 and the player's half-width is 12.
            walkthrough:
              - expression: '100 + 20 + 12 = 132'
                annotation: Right edge of the wall, plus half the player.
          - id: mg2-001-ch2
            title: Floor or wall?
            difficulty: medium
            problem: >-
              A body 16 × 16 at (100, 92) overlaps a floor 400 × 20 centred at (200, 108). Which way is it pushed, and
              how far?
            hint: Compare the overlap across and down.
            answer: Up by 2 pixels, because the overlap down (18 − 16 = 2) is smaller than the overlap across (208 − 100 = 108).
            walkthrough: []
          - id: mg2-001-ch3
            title: Debug the ghost
            difficulty: hard
            problem: >-
              A learner's Player walks straight through the wall. Player has a CharacterBody2D with a Sprite2D under it;
              the wall is a StaticBody2D with a CollisionShape2D. What is missing?
            hint: "What does the engine collide: pictures or shapes?"
            answer: Player has no CollisionShape2D, so it has no shape to collide with; add one under Player.
            walkthrough: []
        semantics:
          core:
            - { symbol: "CharacterBody2D", meaning: "A body your script moves with velocity and moveAndSlide()." }
            - { symbol: "StaticBody2D", meaning: "A body that never moves and blocks others, such as a wall or floor." }
            - { symbol: "CollisionShape2D", meaning: "The rectangle or circle that bumps into things; the picture does not." }
            - { symbol: "moveAndSlide()", meaning: "Moves by velocity × dt, pushes out of solid bodies, and slides along them." }
            - { symbol: "physicsUpdate(dt)", meaning: "Called 60 times a second exactly; where movement and physics go." }
          rulesOfThumb:
            - Size the collision shape to the picture, or a little smaller, so contacts look right.
            - Move bodies in physicsUpdate, not update, so they step at the physics rate.
            - If something passes through a wall, check both have shapes first.
            - Set velocity in pixels per second; moveAndSlide multiplies by dt for you.
        misconceptions:
          - falseBelief: The sprite's picture is what collides.
            whyStudentsThinkIt: You can see the picture touch the wall.
            correctionExample: A Sprite2D with no CollisionShape2D under its body passes through a wall at x = 600 untouched.
            contrastCase: A shape 2 pixels wide under an invisible body still stops at the wall.
          - falseBelief: A fast body stops further into the wall than a slow one.
            whyStudentsThinkIt: In real life, faster things hit harder and dent further.
            correctionExample: At 200 or 600 px/s, a 16-wide player stops with its centre at x = 582 at a wall edge of 590.
            contrastCase: Only the overlap is pushed out, so the stopping place depends on the sizes, not the speed.
        transferPrompts:
          - situation: You want a crate that the player can stand on but which never moves.
            competingTechniques: [A StaticBody2D with a shape, A Sprite2D on its own]
            whyThisTechniqueWins: A StaticBody2D with a shape blocks and supports bodies; a sprite alone is only a picture.
          - situation: An enemy should walk along a corridor and stop at its walls, steered by its own script.
            competingTechniques: [A CharacterBody2D with moveAndSlide, Changing its position directly]
            whyThisTechniqueWins: Setting position directly ignores walls; moveAndSlide pushes it out of them and slides it along.
        debugging:
          - commonError: Setting this.position instead of this.velocity.
            symptom: Player moves, but walks through walls.
            whyItHappened: Changing position directly skips collision; only moveAndSlide checks for walls.
            repairStrategy: Set this.velocity in pixels per second and call this.moveAndSlide() in physicsUpdate.
          - commonError: Putting the CollisionShape2D beside the body instead of under it.
            symptom: The task says Player has no shape; nothing collides.
            whyItHappened: A shape belongs to the body it is a child of.
            repairStrategy: Drag the CollisionShape2D onto Player in the scene tree so it is indented under it.
        mastery:
          targetLevel: 3
          solveIndependently: Build a body and walls that stop it, and predict where it stops.
          explainVerbally: Explain why the shape, not the picture, collides, and what moveAndSlide does.
          detectIncorrectApplication: Spot movement that sets position directly and so ignores walls.
          transferToUnfamiliar: Work out the push and slide for any overlap and any wall direction.
        assessment:
          questions:
            - id: mg2-001-assess-1
              type: choice
              text: Which node type never moves and blocks other bodies?
              options: [StaticBody2D, CharacterBody2D, Sprite2D, Area2D]
              answer: StaticBody2D
              hint: Walls and floors do not move; a character is moved by its script.
        quiz:
          - id: mg2-001-quiz-1
            type: choice
            text: What actually bumps into walls?
            options: [The CollisionShape2D, The Sprite2D, The script, The node's name]
            answer: The CollisionShape2D
            hints: [The picture is only what you see.]
            reviewSection: "Intuition — the collision shape paragraph"
          - id: mg2-001-quiz-2
            type: choice
            text: A 16-wide player walks right into a wall whose left edge is at x = 590. Where is its centre?
            options: ["582", "590", "598", "574"]
            answer: "582"
            hints: ["Half the player's width to the left of the edge. 590 is the near-miss: it is the edge."]
            reviewSection: "Examples — Where it stops"
          - id: mg2-001-quiz-3
            type: choice
            text: How often does physicsUpdate(dt) run?
            options: ["60 times a second exactly", "Once a frame, however fast the screen", "Once a second", "Only when bodies touch"]
            answer: 60 times a second exactly
            hints: [Physics steps at a fixed rate.]
            reviewSection: "Intuition — the moveAndSlide paragraph"
          - id: mg2-001-quiz-4
            type: choice
            text: Overlaps are 3 across and 40 down. Which way is the push?
            options: ["Across, by 3", "Down, by 40", "Diagonally", "Neither"]
            answer: "Across, by 3"
            hints: [The minimum translation vector takes the smaller overlap.]
            reviewSection: "Under the hood — the minimum translation vector"
          - id: mg2-001-quiz-5
            type: choice
            text: Which of these does NOT stop a CharacterBody2D at a wall?
            options: [Setting this.position each frame, Setting velocity and calling moveAndSlide(), A wall with a shape, A player with a shape]
            answer: Setting this.position each frame
            hints: [Only moveAndSlide checks for walls.]
            reviewSection: "Debugging — setting position instead of velocity"
          - id: mg2-001-quiz-6
            type: choice
            text: Velocity (300, 0) into a floor whose normal is (0, −1). What is left after the slide?
            options: ["(300, 0)", "(0, 0)", "(300, 300)", "(0, 300)"]
            answer: "(300, 0)"
            hints: ["v · n = 0, so nothing goes into the floor and nothing is removed."]
            reviewSection: "Under the hood — sliding"
        checkpoints:
          - { id: cp-mg2-001-1, label: "Read where a body stops at a wall", type: read }
          - { id: cp-mg2-001-2, label: "Read what a collision shape is for", type: read }
          - { id: cp-mg2-001-3, label: "Read the procedure for walls", type: read }
          - { id: cp-mg2-001-4, label: "Complete \"A player who cannot walk through walls\" in Game Studio", type: lab }
          - { id: cp-mg2-001-5, label: "Walk diagonally into the wall in Game Studio and watch it slide", type: lab }
          - { id: cp-mg2-001-6, label: "Work through the push example", type: example }
          - { id: cp-mg2-001-7, label: "Work through the slide example", type: example }
          - { id: cp-mg2-001-8, label: "Attempt the ghost debugging challenge", type: challenge }

      # ───────────────────────────────────────────────────────────── 2.2
      - order: 2
        id: mg2-002
        slug: gravity-and-jumping
        title: Gravity and Jumping
        subtitle: Fall, land, walk and jump, and know exactly how high a jump goes.
        tags: [game-studio, physics, platformer]
        aliases: gravity jump platformer isonfloor velocity y physics.gravity jump height v squared over 2g euler
        timeToComplete: 30
        coreConcept: >-
          Gravity is a steady change in vertical velocity: every physics step adds gravity × dt to velocity.y. A jump
          sets velocity.y to a negative number once, and only from the floor; gravity does the rest.
        prerequisites: [mg2-001]
        nextLesson: mg2-003
        hook:
          question: >-
            Your player jumps by setting its upward speed to 360 pixels a second, with gravity 980. Can it reach a
            platform 64 pixels up? What about 70?
          realWorldContext: >-
            Platformer designers place every ledge using exactly this sum. A jump that misses a ledge by three pixels
            is the most common level-design bug, and it is arithmetic, not luck.
        intuition:
          prose:
            - >-
              Start with Player falling. Each physics step lasts 1/60 of a second. Gravity is 980 pixels per second per
              second, so each step adds 980 × 1/60 ≈ 16.3 to velocity.y. After one second of falling it is moving down
              at 980 pixels a second.
            - >-
              A jump sets velocity.y to −360 (negative is up). Every step, gravity adds 16.3 back. Before reading on,
              predict: how many steps until it stops rising? 360 ÷ 16.3 ≈ 22 steps, about 0.37 seconds. Then it falls.
            - >-
              While rising it slows steadily, so it covers its average speed, 180 px/s, for 0.37 s: about 66 pixels.
              That is the jump's height. A 64-pixel ledge is reachable; a 70-pixel one is not.
            - >-
              The player must jump only from the floor. After moveAndSlide(), `this.isOnFloor()` says whether the body
              is standing on something. And `input.isJustPressed('jump')` is true only on the step Space goes down.
            - >-
              Left and right come from `input.axis('move_left', 'move_right')`, which gives −1, 0 or 1. Multiply by the
              speed for velocity.x; ↑ and ↓ no longer move the player, because gravity owns velocity.y.
          callouts:
            - type: procedure
              title: "Procedure: Make a platformer player"
              body: |-
                Step 1. In physicsUpdate(dt), read the velocity: const v = this.velocity.
                Step 2. Walking: v.x = input.axis('move_left', 'move_right') * this.speed.
                Step 3. Gravity: v.y += physics.gravity * dt.
                Step 4. Jumping: if (input.isJustPressed('jump') && this.isOnFloor()) v.y = -this.jumpSpeed.
                Step 5. Write it back and move: this.velocity = v; this.moveAndSlide().
                Step 6. Run: Player should land, walk, and jump only from the floor.
            - type: warning
              title: Jumping in mid-air
              body: >-
                Without the isOnFloor() test, holding or tapping Space in the air jumps again and again: the player
                flies. Without isJustPressed, holding Space jumps again the moment it lands.
          visualizations:
            - id: GameStudioTask
              title: Gravity and jumping
              props: { task: gravity-and-jumping, lesson: mg2-002, checkpoint: cp-mg2-002-4 }
        math:
          prose:
            - >-
              **Under the hood (optional).** With constant gravity $g$, velocity changes at a steady rate:
              $v(t) = v_0 + g t$. Taking up as negative, a jump starts at $v_0 = -360$ and stops rising when $v = 0$,
              at $t = 360 / 980 \approx 0.367$ s.
            - >-
              The height is the area under the speed: a triangle of base $t$ and height $v_0$, so
              $h = \tfrac{1}{2} v_0 t = \tfrac{v_0^2}{2g}$. With $v_0 = 360$ and $g = 980$:
              $h = \tfrac{129600}{1960} \approx 66.1$ px.
            - >-
              The engine steps instead of flowing: each step adds $g\,\Delta t$ to $v$, then moves by $v\,\Delta t$.
              Rising, the steps move $\Delta t\,(360 - 16.3k)$ for $k = 1$ to 22. Adding them gives about 63.1 px. The
              stepped jump is about $v_0 \Delta t / 2 \approx 3$ px lower than the smooth one.
          equations: []
          callouts: []
          visualizations: []
        rigor:
          prose:
            - >-
              Formally, the update $v_{n+1} = v_n + g\Delta t$, $y_{n+1} = y_n + v_{n+1}\Delta t$ is the semi-implicit
              Euler method. Its peak height is $\Delta t \sum_k (v_0 - k g \Delta t)$, which approaches $v_0^2/2g$ as
              $\Delta t \to 0$.
            - >-
              The fixed step is the invariant that makes jumps repeatable: at 1/60 s every time, the same jump reaches
              the same 63.1 px on every screen and every run.
            - >-
              Geometrically, position against time is a parabola, a downward-opening curve whose top is the peak. The
              stepped version is a polygon inscribed in it.
            - >-
              Real games bend these rules on purpose: stronger gravity when falling, a lower jump when Space is let go
              early, a few frames' grace after walking off a ledge ("coyote time"). Each is a change to $g$ or $v$.
          callouts: []
          visualizations: []
        examples:
          - id: mg2-002-ex1
            title: Speed after half a second
            difficulty: easy
            problem: Player starts falling from rest. Gravity is 980. How fast is it moving after 0.5 s?
            steps:
              - expression: 'v = g t = 980 \times 0.5 = 490'
                annotation: Gravity adds 980 px/s of downward speed every second.
                strategyTitle: "Step 1: Speed grows steadily"
            answer: It is falling at 490 pixels per second.
          - id: mg2-002-ex2
            title: How high a jump goes
            difficulty: medium
            problem: The jump speed is 360 and gravity 980. How high does the smooth jump go, and when does it peak?
            steps:
              - expression: 't = \tfrac{v_0}{g} = \tfrac{360}{980} \approx 0.367\ \text{s}'
                annotation: It rises until gravity has taken all 360 px/s away.
                strategyTitle: "Step 1: Time to the top"
              - expression: 'h = \tfrac{v_0^2}{2g} = \tfrac{360^2}{1960} \approx 66.1\ \text{px}'
                annotation: The average rising speed, 180, times the rising time.
                strategyTitle: "Step 2: Height"
            answer: It peaks after about 0.37 s, about 66 pixels up.
          - id: mg2-002-ex3
            title: A jump for a given ledge
            difficulty: hard
            problem: A ledge is 96 pixels up. What jump speed reaches it with gravity 980, with 8 pixels to spare?
            steps:
              - expression: 'h = 96 + 8 = 104'
                annotation: Aim a little higher than the ledge, and remember the stepped jump is about 3 px lower.
                strategyTitle: "Step 1: The height wanted"
              - expression: 'v_0 = \sqrt{2 g h} = \sqrt{2 \times 980 \times 104} \approx 451'
                annotation: Rearranging h = v₀²/2g.
                strategyTitle: "Step 2: Solve for the speed"
            answer: A jump speed of about 451 reaches 104 pixels, clearing the 96-pixel ledge.
        challenges:
          - id: mg2-002-ch1
            title: Double the speed
            difficulty: easy
            problem: If the jump speed doubles from 360 to 720, how many times higher is the jump?
            hint: Height grows with the square of the speed.
            answer: Four times higher, about 264 pixels, because h = v₀²/2g.
            walkthrough:
              - expression: '\tfrac{720^2}{360^2} = 4'
                annotation: Doubling the speed quadruples the height.
          - id: mg2-002-ch2
            title: The moon
            difficulty: medium
            problem: With gravity 160 instead of 980, how high does a 360 jump go?
            hint: Use h = v₀²/2g.
            answer: About 405 pixels, because 129600 ÷ 320 = 405.
            walkthrough: []
          - id: mg2-002-ch3
            title: Debug the flying player
            difficulty: hard
            problem: >-
              A player keeps rising while Space is held, and can jump again in mid-air. Its jump line is
              if (input.isPressed('jump')) v.y = -360. What two changes fix it?
            hint: One is about when the key counts; the other is about where the player is.
            answer: >-
              Use input.isJustPressed('jump') so a jump happens once per press, and add && this.isOnFloor() so it
              happens only from the floor.
            walkthrough: []
        semantics:
          core:
            - { symbol: "physics.gravity", meaning: "How fast falling speeds up, in px/s per second (980 unless Project settings change it)." }
            - { symbol: "velocity.y", meaning: "Vertical speed in px/s; negative is up, positive is down." }
            - { symbol: "isOnFloor()", meaning: "True after moveAndSlide when the body is standing on something." }
            - { symbol: "h = v₀²/2g", meaning: "How high a jump of speed v₀ goes under gravity g." }
            - { symbol: "input.axis(neg, pos)", meaning: "−1, 0 or 1 from two actions: −1 left, 1 right." }
          rulesOfThumb:
            - Gravity changes velocity, never position directly.
            - Jump with isJustPressed and isOnFloor together.
            - Height grows with the square of the jump speed.
            - Leave a few pixels of spare height above the ledges a jump must reach.
        misconceptions:
          - falseBelief: Gravity moves the player down by the same distance every step.
            whyStudentsThinkIt: Walking moves the same distance each step, so falling seems the same.
            correctionExample: After 0.5 s falling it moves 8.2 px a step; after 1 s, 16.3 px a step.
            contrastCase: Falling speeds up because gravity adds to velocity, not to position.
          - falseBelief: A jump twice as fast goes twice as high.
            whyStudentsThinkIt: Most things in a game scale in proportion.
            correctionExample: 360 reaches 66 px; 720 reaches 264 px, four times higher.
            contrastCase: Height is v₀²/2g, so it grows with the square.
        transferPrompts:
          - situation: A designer wants the player to just reach a ledge 150 px up.
            competingTechniques: [Solve v₀ = √(2gh) with a little spare, Try numbers until it works]
            whyThisTechniqueWins: The formula gives the speed in one step and shows how much spare height there is.
          - situation: A ball should fall faster and faster, then land.
            competingTechniques: [Add gravity × dt to velocity.y each step, Add a fixed number to position.y each step]
            whyThisTechniqueWins: Adding to velocity makes it speed up like a real fall; adding to position falls at one speed.
        debugging:
          - commonError: Setting v.y = 980 * dt instead of v.y += 980 * dt.
            symptom: Player sinks slowly at one speed and never speeds up.
            whyItHappened: Assigning replaces the speed each step instead of adding to it.
            repairStrategy: Use += so gravity accumulates.
          - commonError: Testing isOnFloor() before calling moveAndSlide() in the first step.
            symptom: The first jump after starting does nothing.
            whyItHappened: isOnFloor reports the last moveAndSlide; before any, it is false.
            repairStrategy: Accept it on the first step, or call moveAndSlide every step so isOnFloor is always fresh.
        mastery:
          targetLevel: 3
          solveIndependently: Build a platformer player and choose a jump speed for a given ledge.
          explainVerbally: Explain why falling speeds up and why height grows with the square of the speed.
          detectIncorrectApplication: Spot a jump that works in mid-air, and fix it.
          transferToUnfamiliar: Predict jumps under other gravities, such as a moon level.
        assessment:
          questions:
            - id: mg2-002-assess-1
              type: choice
              text: With jump speed 360 and gravity 980, can a jump reach a ledge 70 px up?
              options: ["No, it peaks at about 66 px", "Yes, it reaches 360 px", "Yes, any jump reaches it", "Only at 144 fps"]
              answer: "No, it peaks at about 66 px"
              hint: h = 360² ÷ (2 × 980) ≈ 66.
        quiz:
          - id: mg2-002-quiz-1
            type: choice
            text: How much does gravity 980 add to velocity.y in one physics step?
            options: [About 16.3, "980", About 0.27, "60"]
            answer: About 16.3
            hints: [980 × 1/60.]
            reviewSection: "Intuition — the falling paragraph"
          - id: mg2-002-quiz-2
            type: choice
            text: Which sign makes the player go up?
            options: [Negative velocity.y, Positive velocity.y, Negative velocity.x, Either]
            answer: Negative velocity.y
            hints: [y grows downwards on the screen.]
            reviewSection: "Intuition — the jump paragraph"
          - id: mg2-002-quiz-3
            type: choice
            text: What does the jump test need besides isJustPressed('jump')?
            options: [this.isOnFloor(), this.isOnWall(), input.axis, physics.gravity > 0]
            answer: this.isOnFloor()
            hints: [Only from the floor.]
            reviewSection: "Intuition — Warning: jumping in mid-air"
          - id: mg2-002-quiz-4
            type: choice
            text: What is the smooth height of a 360 jump at gravity 980?
            options: [About 66 px, About 132 px, About 33 px, 360 px]
            answer: About 66 px
            hints: [v₀²/2g; 132 is the near-miss of forgetting the 2.]
            reviewSection: "Under the hood — the triangle"
          - id: mg2-002-quiz-5
            type: choice
            text: Which of these does NOT belong in a platformer's physicsUpdate?
            options: [Moving ↑ and ↓ with input.axis, Adding gravity to velocity.y, Jumping from the floor, Calling moveAndSlide()]
            answer: Moving ↑ and ↓ with input.axis
            hints: [Gravity owns the vertical speed.]
            reviewSection: "Intuition — the walking paragraph"
          - id: mg2-002-quiz-6
            type: choice
            text: Why does the stepped jump reach about 63 px, not 66?
            options: [Each step moves at the speed after gravity has already been added, The screen is too slow, Gravity is wrong, Rounding of pixels]
            answer: Each step moves at the speed after gravity has already been added
            hints: [Semi-implicit Euler is a little behind the smooth curve rising.]
            reviewSection: "Under the hood — stepping"
        checkpoints:
          - { id: cp-mg2-002-1, label: "Read how gravity changes speed", type: read }
          - { id: cp-mg2-002-2, label: "Read how high a jump goes", type: read }
          - { id: cp-mg2-002-3, label: "Read the platformer procedure", type: read }
          - { id: cp-mg2-002-4, label: "Complete \"Gravity and jumping\" in Game Studio", type: lab }
          - { id: cp-mg2-002-5, label: "Change the jump speed to 451 in Game Studio and reach a higher ledge", type: lab }
          - { id: cp-mg2-002-6, label: "Work through the jump-height example", type: example }
          - { id: cp-mg2-002-7, label: "Work through the ledge example", type: example }
          - { id: cp-mg2-002-8, label: "Attempt the flying-player challenge", type: challenge }

      # ───────────────────────────────────────────────────────────── 2.3
      - order: 3
        id: mg2-003
        slug: areas-and-pickups
        title: Areas and Pickups
        subtitle: Things that notice the player without stopping it, such as coins.
        tags: [game-studio, physics, areas]
        aliases: area2d bodyentered pickups coins queuefree overlap trigger zone
        timeToComplete: 25
        coreConcept: >-
          An Area2D is a region that notices bodies entering and leaving it but never blocks them. Its script's
          bodyEntered(body) runs once when a body starts to overlap it: the place to collect a coin, open a door or
          take damage.
        prerequisites: [mg2-002]
        nextLesson: mg2-004
        hook:
          question: >-
            A coin must vanish and add 1 to the score when the player touches it, but the player must walk straight
            through it. A wall would stop the player. What kind of node is the coin?
          realWorldContext: >-
            Pickups, checkpoints, spikes, doors that open as you approach, the zone that ends a level: all are
            regions that notice you without stopping you. Godot calls them areas; Unity calls them triggers.
        intuition:
          prose:
            - >-
              Player is 16 × 22 at x = 300, walking right on the floor. A coin 18 × 18 sits at x = 360. Their edges meet
              when the centres are 8 + 9 = 17 pixels apart, at Player x = 343. At that moment the coin's
              `bodyEntered(body)` runs, with `body` set to Player.
            - >-
              Before reading on, predict: does Player slow down when it reaches the coin? No. The coin is an
              **Area2D**: it only notices. Player keeps walking at full speed, straight through.
            - >-
              The coin removes itself with `this.queueFree()`. Queued means at the end of this frame, so the rest of
              the frame's code still finds it; then it is gone from the game.
            - >-
              To count it, the coin tells Player: `body.collect()`. Player's own `collect()` adds 1 to its `coins` field
              and shows it in a Label. The coin needs to know only that Player can collect.
            - >-
              Check who entered. A coin should ignore an enemy that walks into it: `if (body.name !== 'Player') return`.
          callouts:
            - type: procedure
              title: "Procedure: Make a pickup"
              body: |-
                Step 1. Add an Area2D (Coin) with a Sprite2D and a CollisionShape2D under it.
                Step 2. Give Coin a script with bodyEntered(body).
                Step 3. Ignore bodies that should not collect it: if (body.name !== 'Player') return.
                Step 4. Tell the collector, body.collect(), then remove the pickup, this.queueFree().
                Step 5. In Player's script, write collect(): add 1 to a field and show it in a Label.
            - type: warning
              title: An area is not a body
              body: >-
                Using a StaticBody2D for a coin makes Player bump into it and stop. Using an Area2D for a floor makes
                Player fall through it. Areas notice; bodies block.
          visualizations:
            - id: GameStudioTask
              title: Coins to collect
              props: { task: collect-coins, lesson: mg2-003, checkpoint: cp-mg2-003-4 }
        math:
          prose:
            - >-
              **Under the hood (optional).** After each physics step the engine tests every area against every body
              its mask can see. Two rectangles overlap when both $|x_A - x_B| < \tfrac{w_A + w_B}{2}$ and
              $|y_A - y_B| < \tfrac{h_A + h_B}{2}$. Two circles overlap when the distance between centres is less than
              the sum of their radii: $\sqrt{(x_A - x_B)^2 + (y_A - y_B)^2} < r_A + r_B$.
            - >-
              The area keeps the set of bodies inside it. Comparing this step's set with last step's gives the news:
              in now but not before means bodyEntered; in before but not now means bodyExited. So bodyEntered runs
              once per visit, not every step.
            - >-
              Touching is not overlapping: at exactly $|x_A - x_B| = \tfrac{w_A + w_B}{2}$ the edges meet but nothing
              enters. That is why a body resting against a wall is not "inside" it.
          equations: []
          callouts: []
          visualizations: []
        rigor:
          prose:
            - >-
              Formally, bodyEntered fires for body $b$ at step $n$ exactly when $b \in S_n$ and $b \notin S_{n-1}$,
              where $S_n$ is the set of bodies overlapping the area after step $n$; bodyExited is the reverse.
            - >-
              The invariant is the set difference: however long a body stands inside, it entered once. Events come
              from changes, not states.
            - >-
              Geometrically, overlap is a test of whether two shapes share interior points. For two axis-aligned
              rectangles it splits into two independent interval tests, one per axis.
            - >-
              Testing every area against every body takes about areas × bodies tests a step. Large games divide space
              into cells first ("broad phase") and only test pairs in the same cells. With a few hundred nodes it is
              not needed.
          callouts: []
          visualizations: []
        examples:
          - id: mg2-003-ex1
            title: When the coin is reached
            difficulty: easy
            problem: Player (16 wide) walks right; a coin 18 wide is centred at x = 360. At what Player x does bodyEntered run?
            steps:
              - expression: '\tfrac{16 + 18}{2} = 17'
                annotation: The centres must be closer than half the widths added.
                strategyTitle: "Step 1: The touching distance"
              - expression: '360 - 17 = 343'
                annotation: Just past 343 they overlap, and the coin hears about it.
                strategyTitle: "Step 2: From the coin's centre"
            answer: bodyEntered runs as soon as Player's x passes 343.
          - id: mg2-003-ex2
            title: Two round things
            difficulty: medium
            problem: A ball of radius 13 at (100, 100) and a round area of radius 20 at (125, 120). Do they overlap?
            steps:
              - expression: 'd = \sqrt{25^2 + 20^2} = \sqrt{1025} \approx 32.0'
                annotation: The distance between centres, by Pythagoras.
                strategyTitle: "Step 1: Distance between centres"
              - expression: '32.0 < 13 + 20 = 33'
                annotation: Less than the radii added, so they overlap, by about 1 pixel.
                strategyTitle: "Step 2: Compare with the radii"
            answer: Yes, they overlap by about 1 pixel, so bodyEntered would run.
          - id: mg2-003-ex3
            title: Who counts?
            difficulty: hard
            problem: >-
              An enemy walks into a coin, then Player does. The coin's script is bodyEntered(body) { body.collect();
              this.queueFree() }. What goes wrong, and what fixes it?
            steps:
              - expression: '\text{enemy enters} \Rightarrow \texttt{enemy.collect()}'
                annotation: The enemy has no collect method, so this is an error, and the enemy "takes" the coin.
                strategyTitle: "Step 1: Follow the enemy"
              - expression: '\text{if body.name} \ne \text{Player: return}'
                annotation: Checking who entered first means only Player collects.
                strategyTitle: "Step 2: Check the body"
            answer: The enemy triggers it and calls a method it lacks; check that the body is Player first.
        challenges:
          - id: mg2-003-ch1
            title: Tall coin
            difficulty: easy
            problem: A coin 10 wide is centred at x = 500. A player 20 wide walks left from x = 600. At what x does it reach the coin?
            hint: Half the widths added.
            answer: At x = 515, because the centres must be within 15 pixels.
            walkthrough:
              - expression: '500 + \tfrac{20 + 10}{2} = 515'
                annotation: Coming from the right, add the touching distance.
          - id: mg2-003-ch2
            title: Once or every step?
            difficulty: medium
            problem: Player stands inside a healing zone for 2 seconds. How many times does bodyEntered run?
            hint: Events come from changes.
            answer: Once, when Player first overlapped it; staying inside is not a new entry.
            walkthrough: []
          - id: mg2-003-ch3
            title: The wall that should be a door
            difficulty: hard
            problem: >-
              A learner made a level exit as a StaticBody2D with a script that has bodyEntered. Player bumps into it
              and nothing happens. Explain and fix.
            hint: Which node types call bodyEntered?
            answer: >-
              Only an Area2D calls bodyEntered, and a StaticBody2D blocks Player instead; make the exit an Area2D
              with the same shape and script.
            walkthrough: []
        semantics:
          core:
            - { symbol: "Area2D", meaning: "A region that notices bodies entering and leaving but never blocks them." }
            - { symbol: "bodyEntered(body)", meaning: "Runs once when a body starts to overlap the area." }
            - { symbol: "bodyExited(body)", meaning: "Runs once when a body stops overlapping it." }
            - { symbol: "queueFree()", meaning: "Removes the node at the end of this frame." }
            - { symbol: "overlap", meaning: "Sharing interior points; touching edges is not overlapping." }
          rulesOfThumb:
            - If it should notice, use an Area2D; if it should block, use a body.
            - Check who entered before doing anything.
            - Let the collector count; let the pickup only say it was collected.
            - Remove pickups with queueFree, so the frame finishes cleanly.
        misconceptions:
          - falseBelief: bodyEntered runs every step a body is inside.
            whyStudentsThinkIt: The body is still touching the area on every step.
            correctionExample: Standing 2 s in a zone calls bodyEntered once, not 120 times.
            contrastCase: To act every step while inside, track it yourself between bodyEntered and bodyExited.
          - falseBelief: An Area2D slows the player down a little.
            whyStudentsThinkIt: Overlapping feels like a collision.
            correctionExample: Walking through a coin at 200 px/s, Player is still at 200 px/s.
            contrastCase: Only bodies (Static, Character, Rigid) push and slide.
        transferPrompts:
          - situation: Spikes should hurt the player once each time it lands on them.
            competingTechniques:
              - An Area2D whose bodyEntered calls body.hurt()
              - A StaticBody2D that checks distance in update
            whyThisTechniqueWins: The area reports each new touch once, and the player can stand among spikes without being blocked.
          - situation: A door should open when the player comes within 50 px.
            competingTechniques:
              - An Area2D 100 px wide around the door
              - Compare positions every frame in the player's script
            whyThisTechniqueWins: The area's shape is the trigger zone, visible in the editor, and the door needs no code in the player.
        debugging:
          - commonError: Calling queueFree() before body.collect().
            symptom: Usually works, but collect is sometimes skipped in other designs where removal is immediate.
            whyItHappened: The order states intent poorly; code after removal runs on a node that is going.
            repairStrategy: Tell the collector first, then remove the pickup.
          - commonError: The coin's shape is far smaller than its picture.
            symptom: Player visibly walks over the coin and nothing happens.
            whyItHappened: Only the shape is tested, and Player never reaches it.
            repairStrategy: Size the CollisionShape2D to the picture.
        mastery:
          targetLevel: 3
          solveIndependently: Build a pickup that counts and disappears.
          explainVerbally: Explain the difference between an area and a body, and why bodyEntered runs once.
          detectIncorrectApplication: Recognise a trigger built from a body, and fix it.
          transferToUnfamiliar: Use areas for spikes, doors and level exits.
        assessment:
          questions:
            - id: mg2-003-assess-1
              type: choice
              text: Which node lets the player walk through it but notices when it does?
              options: ["Area2D", "StaticBody2D", "CharacterBody2D", "Sprite2D"]
              answer: "Area2D"
              hint: Areas notice; bodies block.
        quiz:
          - id: mg2-003-quiz-1
            type: choice
            text: When does bodyEntered(body) run?
            options: ["Once, when a body starts to overlap", "Every step while overlapping", "When the game starts", "When the body stops"]
            answer: "Once, when a body starts to overlap"
            hints:
              - Events come from changes.
            reviewSection: "Under the hood — entering and leaving"
          - id: mg2-003-quiz-2
            type: choice
            text: What does queueFree() do?
            options: ["Removes the node at the end of the frame", "Hides it but keeps it", "Pauses it", "Removes it and every other coin"]
            answer: "Removes the node at the end of the frame"
            hints:
              - Queued means later this frame.
            reviewSection: "Intuition — the queueFree paragraph"
          - id: mg2-003-quiz-3
            type: choice
            text: A coin 18 wide at x = 360; Player 16 wide comes from the left. When does it enter?
            options: ["Past x = 343", "Past x = 351", "At x = 360", "Past x = 342"]
            answer: "Past x = 343"
            hints:
              - Half the widths added is 17; 351 is the near-miss of using only the coin's half-width.
            reviewSection: "Examples — When the coin is reached"
          - id: mg2-003-quiz-4
            type: choice
            text: Who should add 1 to the score?
            options: ["Player's collect(), called by the coin", "The coin, by reading Player's field", "The floor", "The Label"]
            answer: "Player's collect(), called by the coin"
            hints:
              - The collector keeps its own count.
            reviewSection: "Intuition — the collect paragraph"
          - id: mg2-003-quiz-5
            type: choice
            text: Which of these is NOT a good use of an Area2D?
            options: ["A floor to stand on", "A coin", "Spikes", "A level exit"]
            answer: "A floor to stand on"
            hints:
              - A floor must block; an area never does.
            reviewSection: "Intuition — Warning: an area is not a body"
          - id: mg2-003-quiz-6
            type: choice
            text: Circles of radius 10 and 12 have centres 22 apart. Do they overlap?
            options: ["No, they only touch", "Yes", "Yes, by 22", "Only if both are areas"]
            answer: "No, they only touch"
            hints:
              - 22 equals 10 + 12, and touching is not overlapping.
            reviewSection: "Under the hood — touching"
        checkpoints:
          - { id: cp-mg2-003-1, label: "Read when a pickup is reached", type: read }
          - { id: cp-mg2-003-2, label: "Read how an area differs from a body", type: read }
          - { id: cp-mg2-003-3, label: "Read the pickup procedure", type: read }
          - { id: cp-mg2-003-4, label: "Complete \"Coins to collect\" in Game Studio", type: lab }
          - { id: cp-mg2-003-5, label: "Add a second coin in Game Studio and collect both", type: lab }
          - { id: cp-mg2-003-6, label: "Work through the round overlap example", type: example }
          - { id: cp-mg2-003-7, label: "Work through the who-counts example", type: example }
          - { id: cp-mg2-003-8, label: "Attempt the wall-that-should-be-a-door challenge", type: challenge }

      # ───────────────────────────────────────────────────────────── 2.4
      - order: 4
        id: mg2-004
        slug: rigid-bodies-and-bouncing
        title: Rigid Bodies and Bouncing
        subtitle: A ball that falls and bounces by itself, with no script.
        tags: [game-studio, physics, rigid-body]
        aliases: rigidbody2d bounce restitution gravityscale reflect velocity ball
        timeToComplete: 25
        coreConcept: >-
          A RigidBody2D moves by itself: the engine adds gravity to its velocity, moves it, and when it hits a solid
          body, reflects the part of its velocity going into the surface, keeping a fraction set by bounce.
        prerequisites: [mg2-003]
        nextLesson: mg2-005
        hook:
          question: >-
            You drop a ball from 300 pixels above the floor, with bounce 0.8. How high does it come back up? And the
            time after that?
          realWorldContext: >-
            Balls, crates, rubble and ragdolls move by physics rather than by script. A designer tunes them with a few
            numbers, such as bounce and gravity scale, instead of writing their motion.
        intuition:
          prose:
            - >-
              Drop a ball from 300 pixels above the floor. Gravity speeds it up until it hits at about 767 pixels a
              second. With bounce 0.8 it leaves the floor at 0.8 × 767 ≈ 614 pixels a second, upwards.
            - >-
              Before reading on, predict: how high does it rise? Height grows with the square of speed (lesson 2.2), so
              0.8 of the speed gives 0.8² = 0.64 of the height: 192 pixels. Then 0.64 × 192 ≈ 123, then 79.
            - >-
              The ball is a **RigidBody2D**. You do not write its motion: the engine adds gravity × dt to its velocity
              every step, moves it, and handles hits. Its `gravityScale` multiplies gravity for it (0 floats).
            - >-
              `bounce` is how much speed it keeps when it hits: 1 leaves as fast as it came, 0 stops dead, 0.8 keeps
              most of it.
            - >-
              It still needs a shape to hit anything: a CollisionShape2D, here a circle of size 26 for a ball 26 pixels
              across.
          callouts:
            - type: procedure
              title: "Procedure: Make a bouncing ball"
              body: |-
                Step 1. Add a RigidBody2D (Ball) where it should start.
                Step 2. Under it, add a CollisionShape2D (shape circle, size the ball's width) and a Sprite2D.
                Step 3. Make sure there is a floor: a StaticBody2D with a shape.
                Step 4. Set bounce in the Inspector: 0 stops dead, 1 bounces back as fast.
                Step 5. Run, and watch each bounce come back lower by bounce².
            - type: warning
              title: Do not move a rigid body yourself
              body: >-
                Setting a RigidBody2D's position every frame fights the engine: it jitters and passes through walls. Set
                its velocity once (a kick), or change gravityScale and bounce, and let physics move it.
          visualizations:
            - id: GameStudioTask
              title: A bouncing ball
              props: { task: bouncing-ball, lesson: mg2-004, checkpoint: cp-mg2-004-4 }
        math:
          prose:
            - >-
              **Under the hood (optional).** Split the velocity at a hit into the part along the surface normal
              $\mathbf{n}$ (length 1, pointing out of the surface) and the rest. The normal part is
              $(\mathbf{v} \cdot \mathbf{n})\,\mathbf{n}$. A bounce with coefficient $e$ reverses it and keeps a
              fraction $e$: $\mathbf{v}' = \mathbf{v} - (1 + e)(\mathbf{v} \cdot \mathbf{n})\,\mathbf{n}$.
            - >-
              Falling onto a floor, $\mathbf{n} = (0, -1)$ and $\mathbf{v} = (0, 767)$, so
              $\mathbf{v} \cdot \mathbf{n} = -767$ and $\mathbf{v}' = (0, 767) - 1.8 \times (-767)(0, -1) = (0, -614)$.
              With $e = 0$ the normal speed becomes 0 (it slides, as moveAndSlide does); with $e = 1$ it is fully reversed.
            - >-
              The heights fall geometrically: $h, e^2 h, e^4 h, \ldots$ The total distance travelled is
              $h + 2e^2 h + 2e^4 h + \cdots = h\,\tfrac{1 + e^2}{1 - e^2}$. For $h = 300$ and $e = 0.8$:
              $300 \times \tfrac{1.64}{0.36} \approx 1367$ px before it comes to rest.
          equations: []
          callouts: []
          visualizations: []
        rigor:
          prose:
            - >-
              Formally, $e$ is the coefficient of restitution, the ratio of the normal speed after an impact to before.
              The tangential part of the velocity is unchanged (no friction in this model).
            - >-
              The invariant through a hit is the tangential velocity, and with $e = 1$ the speed too: a perfectly
              elastic bounce loses no energy.
            - >-
              Geometrically, $\mathbf{v}'$ with $e = 1$ is $\mathbf{v}$ mirrored in the surface's line: the angle out
              equals the angle in, as with a ball off a wall or light off a mirror.
            - >-
              Real engines add friction (which slows the tangential part), spin, and mass, so that two moving bodies
              share an impact. Breakout's ball uses exactly $e = 1$ and no gravity.
          callouts: []
          visualizations: []
        examples:
          - id: mg2-004-ex1
            title: The second height
            difficulty: easy
            problem: A ball dropped from 300 px with bounce 0.8. How high is the first bounce?
            steps:
              - expression: '0.8^2 \times 300 = 0.64 \times 300 = 192'
                annotation: Keeping 0.8 of the speed keeps 0.64 of the height.
                strategyTitle: "Step 1: Square the bounce"
            answer: It bounces back up 192 pixels.
          - id: mg2-004-ex2
            title: Speed at the floor
            difficulty: medium
            problem: How fast is a ball dropped from 300 px moving at the floor, and how fast does it leave with bounce 0.8?
            steps:
              - expression: 'v = \sqrt{2 g h} = \sqrt{2 \times 980 \times 300} \approx 767'
                annotation: The jump formula backwards.
                strategyTitle: "Step 1: Speed at the floor"
              - expression: '0.8 \times 767 \approx 614'
                annotation: Bounce keeps that fraction of the speed into the floor.
                strategyTitle: "Step 2: Speed leaving"
            answer: It hits at about 767 px/s and leaves at about 614 px/s.
          - id: mg2-004-ex3
            title: Off a slanted wall
            difficulty: hard
            problem: A ball moving (300, 0) hits a wall whose normal is (−0.6, −0.8), with bounce 1. What is its new velocity?
            steps:
              - expression: '\mathbf{v} \cdot \mathbf{n} = 300 \times (-0.6) = -180'
                annotation: The part going into the wall.
                strategyTitle: "Step 1: Into the wall"
              - expression: '\mathbf{v}'' = (300, 0) - 2 \times (-180)(-0.6, -0.8) = (300, 0) - (216, 288) = (84, -288)'
                annotation: With e = 1, subtract twice the normal part.
                strategyTitle: "Step 2: Reflect"
            answer: It leaves at (84, −288), still 300 px/s fast, heading up and slightly right.
        challenges:
          - id: mg2-004-ch1
            title: Half bounce
            difficulty: easy
            problem: Bounce 0.5, dropped from 200 px. How high is the first bounce?
            hint: Square the bounce.
            answer: 50 pixels, because 0.5² × 200 = 50.
            walkthrough:
              - expression: '0.25 \times 200 = 50'
                annotation: A quarter of the height.
          - id: mg2-004-ch2
            title: Which bounce?
            difficulty: medium
            problem: A ball dropped from 400 px first bounces to 100 px. What is its bounce?
            hint: The height ratio is bounce squared.
            answer: 0.5, because 100/400 = 0.25 and √0.25 = 0.5.
            walkthrough: []
          - id: mg2-004-ch3
            title: Debug the jittery ball
            difficulty: hard
            problem: >-
              A learner's ball shakes and sometimes falls through the floor. Its script sets this.position.y += 5
              every frame. What is wrong?
            hint: Who moves a rigid body?
            answer: >-
              The script fights the engine, which also moves the ball; remove the script line and let gravity move it,
              or set velocity once.
            walkthrough: []
        semantics:
          core:
            - { symbol: "RigidBody2D", meaning: "A body the engine moves itself, with gravity, velocity and bounces." }
            - { symbol: "bounce", meaning: "The fraction of speed into a surface kept on a hit: 0 stops, 1 bounces fully." }
            - { symbol: "gravityScale", meaning: "Multiplies gravity for this body: 0 floats, 2 falls twice as hard." }
            - { symbol: "v′ = v − (1+e)(v·n)n", meaning: "The velocity after a bounce off a surface with normal n." }
            - { symbol: "e²", meaning: "The fraction of the height each bounce keeps." }
          rulesOfThumb:
            - Let physics move rigid bodies; kick them with velocity, do not drag them.
            - Each bounce keeps bounce² of the height.
            - Use bounce 1 and gravityScale 0 for a Breakout ball.
            - Give it a circle shape if it is round, so it rolls off corners properly.
        misconceptions:
          - falseBelief: Bounce 0.5 keeps half the height.
            whyStudentsThinkIt: The number looks like a fraction of everything.
            correctionExample: Dropped from 200 px with bounce 0.5, it rises to 50 px, a quarter.
            contrastCase: Bounce is a fraction of speed, and height goes with speed squared.
          - falseBelief: A rigid body needs a script to fall.
            whyStudentsThinkIt: The CharacterBody2D needed gravity in its script.
            correctionExample: A RigidBody2D with no script falls and bounces as soon as the game runs.
            contrastCase: A CharacterBody2D only moves when its script calls moveAndSlide.
        transferPrompts:
          - situation: Crates should tumble off a ledge when pushed.
            competingTechniques:
              - RigidBody2D crates
              - CharacterBody2D crates with gravity scripts
            whyThisTechniqueWins: Rigid bodies fall and bounce on their own; scripting each crate's fall is work the engine already does.
          - situation: A pinball must keep its speed off every wall.
            competingTechniques:
              - bounce 1
              - bounce 0.8
            whyThisTechniqueWins: With bounce 1 the reflected speed equals the incoming speed; 0.8 slows it every hit.
        debugging:
          - commonError: Forgetting a floor under the ball.
            symptom: The ball falls off the bottom of the screen and is gone.
            whyItHappened: Nothing solid is there to hit.
            repairStrategy: Add a StaticBody2D floor with a shape wide enough.
          - commonError: A circle shape's size set to the radius instead of the width.
            symptom: The ball sinks halfway into the floor before it bounces.
            whyItHappened: The shape is half the picture's size.
            repairStrategy: Set the circle's size to the ball's full width (26 for a 26-pixel ball).
        mastery:
          targetLevel: 3
          solveIndependently: Make a rigid body fall and bounce, and predict its bounce heights.
          explainVerbally: Explain why each bounce keeps bounce² of the height.
          detectIncorrectApplication: Spot scripts that fight the physics of a rigid body.
          transferToUnfamiliar: Reflect a velocity off any slanted surface.
        assessment:
          questions:
            - id: mg2-004-assess-1
              type: choice
              text: Bounce 0.8, dropped from 300 px. How high is the first bounce?
              options: ["192 px", "240 px", "300 px", "150 px"]
              answer: "192 px"
              hint: 0.8² × 300.
        quiz:
          - id: mg2-004-quiz-1
            type: choice
            text: What does bounce 0 do?
            options: ["Stops the speed into the surface dead", "Bounces back fully", "Makes it fall faster", "Removes gravity"]
            answer: "Stops the speed into the surface dead"
            hints:
              - It keeps none of it.
            reviewSection: "Intuition — the bounce paragraph"
          - id: mg2-004-quiz-2
            type: choice
            text: Bounce 0.5, dropped from 400 px. First bounce?
            options: ["100 px", "200 px", "50 px", "400 px"]
            answer: "100 px"
            hints:
              - 0.25 of the height; 200 is the near-miss of halving the height.
            reviewSection: "Examples — The second height"
          - id: mg2-004-quiz-3
            type: choice
            text: What does gravityScale 0 do?
            options: ["The body floats: no gravity for it", "It falls twice as fast", "It cannot bounce", "It stops moving"]
            answer: "The body floats: no gravity for it"
            hints:
              - It multiplies gravity.
            reviewSection: "Intuition — the RigidBody2D paragraph"
          - id: mg2-004-quiz-4
            type: choice
            text: With e = 1, a ball hits a wall. What stays the same?
            options: ["Its speed", "Its direction", "Its x velocity always", "Nothing"]
            answer: "Its speed"
            hints:
              - A perfectly elastic bounce mirrors the direction and keeps the speed.
            reviewSection: "Rigor — the mirror"
          - id: mg2-004-quiz-5
            type: choice
            text: Which of these should NOT be done to a RigidBody2D?
            options: ["Set its position every frame", "Set its velocity once to kick it", "Change its bounce", "Change its gravityScale"]
            answer: "Set its position every frame"
            hints:
              - It fights the engine.
            reviewSection: "Intuition — Warning: do not move a rigid body yourself"
          - id: mg2-004-quiz-6
            type: choice
            text: Velocity (0, 500) into a floor with normal (0, −1), bounce 0.6. New velocity?
            options: ["(0, −300)", "(0, −500)", "(0, 300)", "(0, −800)"]
            answer: "(0, −300)"
            hints:
              - v − 1.6 × (−500)(0, −1) = (0, −300).
            reviewSection: "Under the hood — the reflection"
        checkpoints:
          - { id: cp-mg2-004-1, label: "Read how bounce heights shrink", type: read }
          - { id: cp-mg2-004-2, label: "Read what a rigid body does by itself", type: read }
          - { id: cp-mg2-004-3, label: "Read the bouncing-ball procedure", type: read }
          - { id: cp-mg2-004-4, label: "Complete \"A bouncing ball\" in Game Studio", type: lab }
          - { id: cp-mg2-004-5, label: "Try bounce 1 and 0.5 in Game Studio and compare", type: lab }
          - { id: cp-mg2-004-6, label: "Work through the speed-at-the-floor example", type: example }
          - { id: cp-mg2-004-7, label: "Work through the slanted-wall example", type: example }
          - { id: cp-mg2-004-8, label: "Attempt the jittery-ball challenge", type: challenge }

      # ───────────────────────────────────────────────────────────── 2.5
      - order: 5
        id: mg2-005
        slug: layers-and-masks
        title: Collision Layers and Masks
        subtitle: Decide exactly what collides with what, with two rows of tick boxes.
        tags: [game-studio, physics, layers]
        aliases: collision layer mask bits bitmask and operator binary collisionlayer collisionmask
        timeToComplete: 25
        coreConcept: >-
          Every body is on some collision layers and scans some others (its mask). A body stops at another only if its
          mask includes a layer the other is on. Layers are bits of a number, and the test is mask AND layer ≠ 0.
        prerequisites: [mg2-004]
        nextLesson: mg3-001
        hook:
          question: >-
            A ball should fall through a glass shelf but land on the floor beneath it. Both are StaticBody2Ds. How can
            the ball treat them differently?
          realWorldContext: >-
            Bullets that pass through their own team, ghosts that walk through walls, a player who can drop through
            thin platforms: all are collision layers. Every major engine has them.
        intuition:
          prose:
            - >-
              The floor and the glass both start on layer 1. The ball's mask is layer 1: it scans layer 1. So it hits
              both, and lands on the glass at y = 250.
            - >-
              Move the glass to layer 2 only. Before reading on, predict: where does the ball land now? On the floor.
              Its mask still scans layer 1 only, and the glass is no longer on layer 1, so the ball does not see it.
            - >-
              So each body has two settings. `collisionLayer` is what it is: the layers it is on. `collisionMask` is what
              it looks for: the layers it scans. A body stops at another only if its mask includes one of the other's
              layers.
            - >-
              A second ball, Ball2, with layers 1 and 2 both ticked in its mask, scans the glass again and lands on it,
              while the first ball still falls through.
            - >-
              The Inspector shows each as a row of numbered tick boxes. Under the hood each row is one number, one bit
              per layer.
          callouts:
            - type: procedure
              title: "Procedure: Make one thing pass through another"
              body: |-
                Step 1. Decide what each layer means (1 world, 2 glass, 3 enemies, …).
                Step 2. Put each body on its layer: Inspector › collisionLayer.
                Step 3. For each moving body, tick the layers it should hit: Inspector › collisionMask.
                Step 4. To pass through something, leave its layer out of your mask.
                Step 5. Run, and check each pair: hits when mask and layer share a tick.
            - type: warning
              title: Layer and mask are different
              body: >-
                Moving the ball to layer 2 does not make it pass through glass on layer 2: what matters for the ball
                stopping is its mask. Ask "what am I?" for the layer and "what do I hit?" for the mask.
          visualizations:
            - id: GameStudioTask
              title: Collision layers
              props: { task: collision-layers, lesson: mg2-005, checkpoint: cp-mg2-005-4 }
        math:
          prose:
            - >-
              **Under the hood (optional).** Layer $k$ is the number $2^{k-1}$: layer 1 is 1, layer 2 is 2, layer 3 is
              4, layer 4 is 8. A set of layers is their sum, so layers 1 and 2 together are 3, written in binary as 11.
            - >-
              The bitwise AND, written $\&$, keeps the bits two numbers share: $3 \,\&\, 2 = 2$ (binary 11 and 10 share
              10), and $1 \,\&\, 2 = 0$ (01 and 10 share nothing). The engine's test is exactly
              $\text{mask} \,\&\, \text{layer} \neq 0$.
            - >-
              For the task: the ball's mask is 1 and the glass's layer is 2, so $1 \,\&\, 2 = 0$ and it passes through.
              Ball2's mask is 3, so $3 \,\&\, 2 = 2 \neq 0$ and it lands. The floor is layer 1: $1 \,\&\, 1 = 1$ and
              $3 \,\&\, 1 = 1$, so both land on it.
          equations: []
          callouts: []
          visualizations: []
        rigor:
          prose:
            - >-
              Formally, with layers as sets $L_A$ and masks as sets $M_A$, body $A$ is stopped by $B$ when
              $M_A \cap L_B \neq \emptyset$. Bitwise AND on the numbers computes that intersection, all layers at once.
            - >-
              The test is not symmetric: $A$ can scan $B$ while $B$ ignores $A$. Breakout uses this: the paddle's mask
              omits the ball's layer, so the ball bounces off the paddle but never pushes it.
            - >-
              Picture a grid of layers against masks: each tick box in the mask row lights up a column of layers it
              scans. A pair collides where a lit column meets the other body's layer.
            - >-
              With 32 bits a number holds 32 layers, which is why engines offer that many. The same bit tricks appear
              everywhere in programming, from file permissions to graphics flags (Tiled stores tile flips this way,
              in chapter 5).
          callouts: []
          visualizations: []
        examples:
          - id: mg2-005-ex1
            title: Layer numbers
            difficulty: easy
            problem: What number stands for layers 1 and 3 together?
            steps:
              - expression: '2^{0} + 2^{2} = 1 + 4 = 5'
                annotation: Layer k is 2 to the power k − 1; a set is the sum.
                strategyTitle: "Step 1: Add the bits"
            answer: Layers 1 and 3 together are 5 (binary 101).
          - id: mg2-005-ex2
            title: Does it land on the glass?
            difficulty: medium
            problem: The glass is on layer 2 only. Ball's mask is 1; Ball2's mask is 3. Which land on the glass?
            steps:
              - expression: '1 \,\&\, 2 = 0'
                annotation: Ball shares no bit with the glass, so it falls through.
                strategyTitle: "Step 1: Ball"
              - expression: '3 \,\&\, 2 = 2 \neq 0'
                annotation: Ball2 shares bit 2, so it lands.
                strategyTitle: "Step 2: Ball2"
            answer: Only Ball2 lands on the glass; Ball falls through to the floor.
          - id: mg2-005-ex3
            title: A team game
            difficulty: hard
            problem: >-
              Walls on layer 1, players on 2, player bullets on 3, enemies on 4. Player bullets should hit walls and
              enemies only. What is their mask?
            steps:
              - expression: '\text{walls} = 1,\ \text{enemies} = 2^{3} = 8'
                annotation: The layers to scan, as bits.
                strategyTitle: "Step 1: The layers to hit"
              - expression: '1 + 8 = 9'
                annotation: A mask of 9 (binary 1001) scans layers 1 and 4.
                strategyTitle: "Step 2: Add them"
            answer: The bullets' mask is 9, ticking layers 1 and 4, so they ignore players and each other.
        challenges:
          - id: mg2-005-ch1
            title: Read a mask
            difficulty: easy
            problem: A mask of 6. Which layers does it scan?
            hint: Write 6 in binary.
            answer: Layers 2 and 3, because 6 = 2 + 4 (binary 110).
            walkthrough:
              - expression: '6 = 4 + 2 = 2^{2} + 2^{1}'
                annotation: Bits for layers 3 and 2.
          - id: mg2-005-ch2
            title: Who sees whom?
            difficulty: medium
            problem: A is on layer 1 with mask 2; B is on layer 2 with mask 4. Does A stop at B? Does B stop at A?
            hint: Test each direction separately.
            answer: A stops at B (2 & 2 = 2), but B does not stop at A (4 & 1 = 0).
            walkthrough: []
          - id: mg2-005-ch3
            title: Debug the ghost ball
            difficulty: hard
            problem: >-
              To make a ball pass through glass, a learner put the ball on layer 2 (where the glass is) and left its
              mask at 1. It still falls through the glass, but now another ball with mask 2 lands on it. Explain.
            hint: Which setting decides what the ball itself hits?
            answer: >-
              The ball's own mask decides what it hits, and 1 & 2 = 0 already made it pass the glass; moving its layer
              only changed what can see it, so another ball with mask 2 now lands on it too.
            walkthrough: []
        semantics:
          core:
            - { symbol: "collisionLayer", meaning: "The layers a body is on: what it is." }
            - { symbol: "collisionMask", meaning: "The layers a body scans: what it hits." }
            - { symbol: "2^(k−1)", meaning: "The number for layer k; a set of layers is the sum." }
            - { symbol: "mask & layer ≠ 0", meaning: "The test for whether a body stops at another." }
            - { symbol: "&", meaning: "Bitwise AND, keeping only the bits two numbers share." }
          rulesOfThumb:
            - Name your layers before using them, and keep a note of the plan.
            - Layer answers "what am I"; mask answers "what do I hit".
            - Test each direction of a pair separately.
            - To ignore something, take its layer out of your mask, not yours out of its.
        misconceptions:
          - falseBelief: Two bodies on the same layer always collide.
            whyStudentsThinkIt: It sounds like being on the same layer means being in the same world.
            correctionExample: Two bodies on layer 2 with masks of 1 ignore each other, because 1 & 2 = 0.
            contrastCase: What matters is each one's mask against the other's layer.
          - falseBelief: Collision is always two-way.
            whyStudentsThinkIt: In real life, if A bumps B, B bumps A.
            correctionExample: In Breakout the ball's mask includes the paddle, but the paddle's mask omits the ball, so the ball bounces and the paddle never moves.
            contrastCase: Each body's own mask decides what stops it.
        transferPrompts:
          - situation: The player should drop through thin platforms but stand on the ground.
            competingTechniques:
              - Put platforms on their own layer and leave it out of the player's mask while dropping
              - Delete the platforms when the player presses down
            whyThisTechniqueWins: Changing the mask is instant and reversible; deleting platforms breaks the level.
          - situation: Enemies should not block each other in a crowded room.
            competingTechniques:
              - Leave the enemy layer out of the enemies' mask
              - Space them out by hand
            whyThisTechniqueWins: One mask setting covers every enemy, however many there are.
        debugging:
          - commonError: Changing the ball's layer instead of the glass's.
            symptom: The ball still lands on the glass, or other things start landing on the ball.
            whyItHappened: The ball's own mask decides what it hits.
            repairStrategy: Move the glass to a layer the ball's mask leaves out, or take the glass's layer out of the ball's mask.
          - commonError: Unticking every layer of a body's own layer row.
            symptom: Nothing ever stops at it; it is invisible to physics.
            whyItHappened: A body on no layers has layer 0, and anything & 0 is 0.
            repairStrategy: Keep at least one layer ticked for anything others should hit.
        mastery:
          targetLevel: 3
          solveIndependently: Set layers and masks so chosen pairs collide and others pass through.
          explainVerbally: Explain the difference between layer and mask, and the AND test.
          detectIncorrectApplication: Spot a fix that changed the wrong body's layer.
          transferToUnfamiliar: Plan layers for a team game with bullets and pickups.
        assessment:
          questions:
            - id: mg2-005-assess-1
              type: choice
              text: Ball mask 1, glass layer 2. Does the ball land on the glass?
              options: ["No, because 1 & 2 = 0", "Yes, because both are bodies", "Yes, because 1 + 2 = 3", "Only with bounce 1"]
              answer: "No, because 1 & 2 = 0"
              hint: The mask and layer share no bit.
        quiz:
          - id: mg2-005-quiz-1
            type: choice
            text: What does a body's collisionMask say?
            options: ["Which layers it hits", "Which layer it is on", "How bouncy it is", "Which group it is in"]
            answer: "Which layers it hits"
            hints:
              - Mask is what it scans.
            reviewSection: "Intuition — the two settings"
          - id: mg2-005-quiz-2
            type: choice
            text: What number is layer 4?
            options: ["8", "4", "16", "3"]
            answer: "8"
            hints:
              - 2 to the power 3; 4 is the near-miss of using k instead of k − 1.
            reviewSection: "Under the hood — bits"
          - id: mg2-005-quiz-3
            type: choice
            text: What is 5 & 3?
            options: ["1", "7", "8", "0"]
            answer: "1"
            hints:
              - 101 and 011 share only the last bit.
            reviewSection: "Under the hood — AND"
          - id: mg2-005-quiz-4
            type: choice
            text: A has mask 2; B is on layer 2 with mask 1; A is on layer 4. What happens?
            options: ["A stops at B, B ignores A", "Both stop", "Neither stops", "B stops at A, A ignores B"]
            answer: "A stops at B, B ignores A"
            hints:
              - 2 & 2 ≠ 0, but 1 & 4 = 0.
            reviewSection: "Rigor — not symmetric"
          - id: mg2-005-quiz-5
            type: choice
            text: Which of these does NOT make the ball pass through the glass?
            options: ["Putting the ball on layer 2", "Putting the glass on layer 2 only", "Taking the glass's layer out of the ball's mask", "Leaving the ball's mask at 1 with the glass on layer 2"]
            answer: "Putting the ball on layer 2"
            hints:
              - The ball's layer is about what sees the ball, not what it hits.
            reviewSection: "Intuition — Warning: layer and mask are different"
          - id: mg2-005-quiz-6
            type: choice
            text: Bullets should hit walls (layer 1) and enemies (layer 4). Their mask?
            options: ["9", "5", "4", "14"]
            answer: "9"
            hints:
              - 1 + 8.
            reviewSection: "Examples — A team game"
        checkpoints:
          - { id: cp-mg2-005-1, label: "Read what layers and masks are", type: read }
          - { id: cp-mg2-005-2, label: "Read why the ball falls through the glass", type: read }
          - { id: cp-mg2-005-3, label: "Read the pass-through procedure", type: read }
          - { id: cp-mg2-005-4, label: "Complete \"Collision layers\" in Game Studio", type: lab }
          - { id: cp-mg2-005-5, label: "Make a third ball that ignores the floor in Game Studio", type: lab }
          - { id: cp-mg2-005-6, label: "Work through the glass example", type: example }
          - { id: cp-mg2-005-7, label: "Work through the team-game example", type: example }
          - { id: cp-mg2-005-8, label: "Attempt the ghost-ball challenge", type: challenge }

  # ═══════════════════════════════════════════════════════════════ Chapter 3: Camera and HUD
  - number: 3
    slug: camera-and-hud
    lessons:
      # ───────────────────────────────────────────────────────────── 3.1
      - order: 1
        id: mg3-001
        slug: a-camera-that-follows
        title: A Camera That Follows
        subtitle: Scroll a level longer than the screen, smoothly, the same on every screen.
        tags: [game-studio, camera]
        aliases: camera2d follow smoothing scroll view exponential smoothing lerp frame rate independent
        timeToComplete: 25
        coreConcept: >-
          A Camera2D decides which part of the world the screen shows: its position is the centre of the view. Under
          a node, it goes where the node goes. With smoothing k, the view closes a fraction 1 − e^(−k·dt) of the gap
          each frame, which feels the same at any frame rate.
        prerequisites: [mg2-005]
        nextLesson: mg3-002
        hook:
          question: >-
            A level is 3000 pixels long and the screen 960 wide. How does the screen show the part where the player is,
            and how do you make it glide instead of jump?
          realWorldContext: >-
            Nearly every game that is bigger than one screen has a camera that follows the player. How it follows,
            snapping, lagging or leading, is one of the first things players feel.
        intuition:
          prose:
            - >-
              The world is 3000 pixels wide; the screen shows 960 of them. If the camera is at x = 1500, the screen
              shows world x from 1500 − 480 = 1020 to 1500 + 480 = 1980: the camera's position is the middle of the view.
            - >-
              Put the Camera2D under Player. A child goes where its parent goes, so the camera is always at Player's
              position, and Player is always in the middle of the screen.
            - >-
              Snapping like that can feel stiff. Set the camera's `smoothing` to 5. Now the view does not jump to the
              camera; each frame it moves part of the way there.
            - >-
              Before reading on, predict: with smoothing 5, how much of a sudden 100-pixel gap is left after one
              second? Each second leaves e^(−5) ≈ 0.007 of it: under 1 pixel. Half the gap goes in about 0.14 seconds.
            - >-
              The fraction moved each frame is 1 − e^(−k·dt), not a fixed 10%, so a 144 fps screen catches up exactly
              as fast as a 60 fps one.
          callouts:
            - type: procedure
              title: "Procedure: Make the view follow the player"
              body: |-
                Step 1. Add a Camera2D as a child of Player.
                Step 2. Leave current ticked: the current camera is the one the screen uses.
                Step 3. Run, and walk: the view keeps Player in the middle.
                Step 4. Set smoothing (5 is gentle, 10 is snappy, 0 snaps) and run again.
                Step 5. Check how quickly it catches up when Player stops.
            - type: warning
              title: A camera beside the player does nothing
              body: >-
                A Camera2D added to the scene root stays where you put it, and the player walks off the screen. It must be
                under Player in the scene tree (indented beneath it) to follow.
          visualizations:
            - id: GameStudioTask
              title: A camera that follows
              props: { task: follow-camera, lesson: mg3-001, checkpoint: cp-mg3-001-4 }
        math:
          prose:
            - >-
              **Under the hood (optional).** Let $g$ be the gap between where the view is and where the camera is. Each
              frame of length $\Delta t$ the view moves a fraction $f = 1 - e^{-k\,\Delta t}$ of the gap, so the gap
              becomes $g\,e^{-k\,\Delta t}$.
            - >-
              After frames of lengths $\Delta t_1, \ldots, \Delta t_n$ the gap is
              $g\,e^{-k\Delta t_1} \cdots e^{-k\Delta t_n} = g\,e^{-k(\Delta t_1 + \cdots + \Delta t_n)} = g\,e^{-k t}$.
              It depends only on the elapsed time $t$: that is why it is frame-rate independent.
            - >-
              A fixed fraction per frame, say 10%, would leave $0.9^n$ after $n$ frames: $0.9^{60} \approx 0.002$ after a
              second at 60 fps, but $0.9^{144} \approx 0.0000025$ at 144 fps. The half-life of $e^{-kt}$ is
              $\ln 2 / k$: 0.139 s for $k = 5$.
          equations: []
          callouts: []
          visualizations: []
        rigor:
          prose:
            - >-
              Formally, the view $p$ follows the target $c$ by $\dot{p} = k(c - p)$, whose exact solution over one step is
              $p \leftarrow c + (p - c)e^{-k\Delta t}$. Using $1 - e^{-k\Delta t}$ as the step's fraction is that exact
              solution, not an approximation.
            - >-
              The invariant is the decay per unit time: whatever the frame lengths, the gap shrinks by $e^{-k}$ each
              second.
            - >-
              Geometrically, the view's distance from the target against time is an exponential decay curve, steep at
              first and flattening as it closes.
            - >-
              The same smoothing appears for volume fades, health bars that drain, and following enemies. Lerping by a
              fixed fraction per frame, a common shortcut, is the frame-rate-dependent version of it.
          callouts: []
          visualizations: []
        examples:
          - id: mg3-001-ex1
            title: What the screen shows
            difficulty: easy
            problem: The camera is at x = 1500 and the screen is 960 wide. Which world x does the screen show?
            steps:
              - expression: '1500 - \tfrac{960}{2} = 1020'
                annotation: The camera is the middle; half the screen is to its left.
                strategyTitle: "Step 1: Left edge"
              - expression: '1500 + 480 = 1980'
                annotation: And half to its right.
                strategyTitle: "Step 2: Right edge"
            answer: The screen shows world x from 1020 to 1980.
          - id: mg3-001-ex2
            title: How fast it catches up
            difficulty: medium
            problem: With smoothing 5, the view is 100 px behind when Player stops. How far behind is it after 0.2 s?
            steps:
              - expression: '100 \times e^{-5 \times 0.2} = 100 \times e^{-1} \approx 36.8'
                annotation: The gap shrinks by e to the minus k times the time.
                strategyTitle: "Step 1: Decay over the time"
            answer: About 37 pixels behind after 0.2 seconds.
          - id: mg3-001-ex3
            title: The same on two screens
            difficulty: hard
            problem: Show that with smoothing 5, one second leaves the same gap at 60 fps and at 144 fps.
            steps:
              - expression: '(e^{-5/60})^{60} = e^{-5}'
                annotation: Sixty frames, each leaving e^(−5/60).
                strategyTitle: "Step 1: 60 fps"
              - expression: '(e^{-5/144})^{144} = e^{-5}'
                annotation: The exponents add to −5 either way.
                strategyTitle: "Step 2: 144 fps"
            answer: Both leave e^(−5) ≈ 0.7% of the gap, so the camera feels the same on both screens.
        challenges:
          - id: mg3-001-ch1
            title: A wider screen
            difficulty: easy
            problem: A 1280-wide screen with the camera at x = 800. Which world x does it show?
            hint: Half the width each side.
            answer: From 160 to 1440.
            walkthrough:
              - expression: '800 \pm 640'
                annotation: Half of 1280 is 640.
          - id: mg3-001-ch2
            title: Half-life
            difficulty: medium
            problem: With smoothing 10, how long until a gap halves?
            hint: The half-life is ln 2 ÷ k.
            answer: About 0.069 seconds, because 0.693 ÷ 10 ≈ 0.069.
            walkthrough: []
          - id: mg3-001-ch3
            title: Debug the runaway player
            difficulty: hard
            problem: A learner added a Camera2D, ran, and the player walked off the screen. The camera is at the scene root. Fix it.
            hint: Where must the camera be in the tree?
            answer: Drag the Camera2D onto Player so it is Player's child; then it moves with Player.
            walkthrough: []
        semantics:
          core:
            - { symbol: "Camera2D", meaning: "Decides what the screen shows: its position is the middle of the view." }
            - { symbol: "current", meaning: "The camera the screen uses; only one is current at a time." }
            - { symbol: "smoothing", meaning: "How quickly the view catches up: 0 snaps, bigger is snappier." }
            - { symbol: "1 − e^(−k·dt)", meaning: "The fraction of the gap closed in a frame of length dt." }
            - { symbol: "ln 2 / k", meaning: "How long it takes to close half the gap." }
          rulesOfThumb:
            - Put the camera under what it follows.
            - Smoothing 5 is gentle, 10 is snappy; above 20 feels like no smoothing.
            - Scale each frame's fraction by dt, never use a fixed fraction.
            - Check smoothing by stopping suddenly and watching the catch-up.
        misconceptions:
          - falseBelief: The camera's position is the top-left corner of the screen.
            whyStudentsThinkIt: The game area's own origin is its top-left corner.
            correctionExample: A camera at (1500, 270) on a 960 × 540 screen shows x 1020 to 1980.
            contrastCase: Only with no camera does the screen show the world from (0, 0).
          - falseBelief: Smoothing 0.1 per frame works the same everywhere.
            whyStudentsThinkIt: The code looks the same on every screen.
            correctionExample: After 1 s, 10% per frame leaves 0.2% of the gap at 60 fps but 0.0003% at 144 fps.
            contrastCase: 1 − e^(−k·dt) leaves e^(−k) after one second on any screen.
        transferPrompts:
          - situation: A health bar should drain smoothly towards the real health.
            competingTechniques:
              - Move it by 1 − e^(−k·dt) of the gap each frame
              - Move it 10% of the gap each frame
            whyThisTechniqueWins: The exponential form drains at the same speed whatever the frame rate.
          - situation: A boss arena should stay still on screen while the player moves inside it.
            competingTechniques:
              - A Camera2D placed in the arena, not under the player
              - A Camera2D under the player
            whyThisTechniqueWins: A camera that is not a child of the player stays put and frames the arena.
        debugging:
          - commonError: Two cameras both ticked current.
            symptom: The view follows the wrong one.
            whyItHappened: The screen can use only one camera.
            repairStrategy: Untick current on the camera you are not using.
          - commonError: Smoothing set very high to "make it smooth".
            symptom: It feels exactly like no smoothing.
            whyItHappened: A big k closes the gap almost entirely every frame.
            repairStrategy: Lower smoothing to between 3 and 10.
        mastery:
          targetLevel: 3
          solveIndependently: Make a camera follow, with chosen smoothing.
          explainVerbally: Explain what the camera's position means and why the smoothing formula is frame-rate independent.
          detectIncorrectApplication: Spot fixed-fraction smoothing and replace it.
          transferToUnfamiliar: Use exponential smoothing for other values that should glide.
        assessment:
          questions:
            - id: mg3-001-assess-1
              type: choice
              text: Camera at x = 1000, screen 960 wide. What is the screen's left edge in the world?
              options: ["520", "1000", "40", "0"]
              answer: "520"
              hint: The camera is the middle.
        quiz:
          - id: mg3-001-quiz-1
            type: choice
            text: Where must a Camera2D be to follow Player?
            options: ["Under Player in the scene tree", "At the scene root", "Anywhere, if current is ticked", "Under the floor"]
            answer: "Under Player in the scene tree"
            hints:
              - A child goes where its parent goes.
            reviewSection: "Intuition — Warning: a camera beside the player"
          - id: mg3-001-quiz-2
            type: choice
            text: With smoothing k, what fraction of the gap is closed in a frame of length dt?
            options: ["1 − e^(−k·dt)", "k·dt always", "10%", "e^(−k)"]
            answer: "1 − e^(−k·dt)"
            hints:
              - k·dt is close for small values but can exceed 1.
            reviewSection: "Under the hood — the fraction"
          - id: mg3-001-quiz-3
            type: choice
            text: Smoothing 5, a 100 px gap. How much is left after 1 s?
            options: ["Under 1 px", "50 px", "20 px", "0 px exactly"]
            answer: "Under 1 px"
            hints:
              - 100 × e^(−5) ≈ 0.67.
            reviewSection: "Intuition — the prediction paragraph"
          - id: mg3-001-quiz-4
            type: choice
            text: What is the half-life with smoothing 5?
            options: ["About 0.14 s", "About 0.2 s", "5 s", "About 0.7 s"]
            answer: "About 0.14 s"
            hints:
              - ln 2 ÷ 5.
            reviewSection: "Under the hood — half-life"
          - id: mg3-001-quiz-5
            type: choice
            text: Which of these is NOT frame-rate independent?
            options: ["Closing 10% of the gap every frame", "Closing 1 − e^(−k·dt) of it", "Moving speed × dt", "Counting a timer down by dt"]
            answer: "Closing 10% of the gap every frame"
            hints:
              - More frames close more.
            reviewSection: "Misconceptions — fixed fractions"
          - id: mg3-001-quiz-6
            type: choice
            text: Smoothing 0 means what?
            options: ["The view snaps to the camera", "The camera never moves", "The view never catches up", "Smoothing is maximal"]
            answer: "The view snaps to the camera"
            hints:
              - No smoothing at all.
            reviewSection: "Intuition — Procedure"
        checkpoints:
          - { id: cp-mg3-001-1, label: "Read what the screen shows for a camera position", type: read }
          - { id: cp-mg3-001-2, label: "Read why the camera goes under Player", type: read }
          - { id: cp-mg3-001-3, label: "Read how smoothing closes the gap", type: read }
          - { id: cp-mg3-001-4, label: "Complete \"A camera that follows\" in Game Studio", type: lab }
          - { id: cp-mg3-001-5, label: "Try smoothing 2 and 15 in Game Studio and compare", type: lab }
          - { id: cp-mg3-001-6, label: "Work through the catch-up example", type: example }
          - { id: cp-mg3-001-7, label: "Work through the two-screens example", type: example }
          - { id: cp-mg3-001-8, label: "Attempt the runaway-player challenge", type: challenge }

      # ───────────────────────────────────────────────────────────── 3.2
      - order: 2
        id: mg3-002
        slug: camera-limits
        title: Camera Limits
        subtitle: Never show the empty space past the level's edges.
        tags: [game-studio, camera]
        aliases: camera limits clamp limittopleft limitbottomright level bounds edges
        timeToComplete: 20
        coreConcept: >-
          Camera limits are the edges of the level. The view's centre is clamped so the screen never reaches past them:
          between the left limit plus half the screen and the right limit minus half the screen.
        prerequisites: [mg3-001]
        nextLesson: mg3-003
        hook:
          question: >-
            Player starts at x = 100 in a level that begins at x = 0. With the camera centred on Player, the left 380
            pixels of the screen show nothing. How do you stop that, without moving the player?
          realWorldContext: >-
            Showing past the edge of a level breaks the illusion of a world. Every side-scroller clamps its camera to the
            level's bounds.
        intuition:
          prose:
            - >-
              The screen is 960 wide. If the view's centre is at x = 100, the screen's left edge is at 100 − 480 = −380:
              380 pixels of nothing left of the level.
            - >-
              Set `limitTopLeft` x to 0. Before reading on, predict: where does the view's centre go? The screen's left edge
              may not go below 0, so the centre may not go below 0 + 480 = 480. The view sits at 480 while Player walks
              the first 480 pixels.
            - >-
              The same holds on the right: with `limitBottomRight` x at 3000, the centre may not pass 3000 − 480 = 2520.
              Past that, Player walks towards the right edge of the screen while the view stays still.
            - >-
              And the bottom: `limitBottomRight` y at 540 keeps the view from showing below the floor.
            - >-
              This is a **clamp**: keep a number between a low and a high value. The view is clamped to
              [limit + half the screen, limit − half the screen] on each axis.
          callouts:
            - type: procedure
              title: "Procedure: Keep the view inside the level"
              body: |-
                Step 1. Find the level's edges in world pixels (left, top, right, bottom).
                Step 2. Select the Camera2D and set limitTopLeft to the left and top edges.
                Step 3. Set limitBottomRight to the right and bottom edges.
                Step 4. Run, and walk to each end: the edges of the screen stop at the edges of the level.
            - type: warning
              title: A level smaller than the screen
              body: >-
                If the level is narrower than the screen, no centre satisfies both limits. The engine then centres the
                view on the level, and its edges show past it on both sides.
          visualizations:
            - id: GameStudioTask
              title: Camera limits
              props: { task: camera-limits, lesson: mg3-002, checkpoint: cp-mg3-002-4 }
        math:
          prose:
            - >-
              **Under the hood (optional).** With limits $L$ (low) and $H$ (high) on one axis and half the screen
              $h = W / (2 \times \text{zoom})$, the view's centre is $\text{clamp}(c, L + h, H - h) = \min(H - h, \max(L + h, c))$.
            - >-
              For $L = 0$, $H = 3000$ and $h = 480$: the centre stays in $[480, 2520]$. Player at 100 gives 480; Player at
              1500 gives 1500; Player at 2900 gives 2520.
            - >-
              When $L + h > H - h$, that is when the level is narrower than $2h$, the interval is empty and the centre is
              $(L + H)/2$. Zooming in (zoom 2) halves $h$, so a small level can fill the screen.
          equations: []
          callouts: []
          visualizations: []
        rigor:
          prose:
            - >-
              Formally, the clamp is the projection of $c$ onto the interval $[L + h, H - h]$: the nearest point of the
              interval to $c$. It is applied to each axis independently.
            - >-
              The invariant: whatever the target, the visible rectangle $[c - h, c + h]$ stays inside $[L, H]$ whenever the
              level is at least as wide as the screen.
            - >-
              Geometrically, the camera's centre moves freely inside a smaller rectangle, the level shrunk by half the
              screen on every side, and slides along its edges when the target is outside it.
            - >-
              Smoothing and limits combine: the engine clamps the target and smooths towards the clamped point, so the
              view eases into an edge instead of bouncing off it.
          callouts: []
          visualizations: []
        examples:
          - id: mg3-002-ex1
            title: Near the start
            difficulty: easy
            problem: Level from x = 0 to 3000, screen 960. Player at x = 100. Where is the view's centre?
            steps:
              - expression: '\max(0 + 480, 100) = 480'
                annotation: The centre may not go below the left limit plus half the screen.
                strategyTitle: "Step 1: Clamp from below"
            answer: The view's centre stays at x = 480.
          - id: mg3-002-ex2
            title: Near the end
            difficulty: medium
            problem: Same level, Player at x = 2900. Where is the centre, and where is Player on the screen?
            steps:
              - expression: '\min(3000 - 480, 2900) = 2520'
                annotation: The centre may not pass the right limit minus half the screen.
                strategyTitle: "Step 1: Clamp from above"
              - expression: '2900 - (2520 - 480) = 860'
                annotation: The screen's left edge is at world 2040, so Player is 860 pixels into the screen.
                strategyTitle: "Step 2: Player on screen"
            answer: The centre is at 2520 and Player appears 860 pixels from the screen's left edge.
          - id: mg3-002-ex3
            title: A small room
            difficulty: hard
            problem: A room 600 wide (x 0 to 600) and a 960 screen. Where is the centre? What if the camera's zoom is 2?
            steps:
              - expression: '0 + 480 > 600 - 480 \Rightarrow c = 300'
                annotation: No centre fits, so the view is centred on the room.
                strategyTitle: "Step 1: Too small"
              - expression: 'h = \tfrac{960}{2 \times 2} = 240,\ c \in [240, 360]'
                annotation: At zoom 2 the screen covers 480 world pixels, and the room is wide enough.
                strategyTitle: "Step 2: Zoom in"
            answer: At zoom 1 the view centres on x = 300 with gaps either side; at zoom 2 the centre moves within 240 to 360 and no gap shows.
        challenges:
          - id: mg3-002-ch1
            title: Vertical limits
            difficulty: easy
            problem: A level from y = 0 to 540 and a 540-tall screen. Where can the view's centre be vertically?
            hint: Half the screen is 270.
            answer: "Only at y = 270: the level is exactly one screen tall."
            walkthrough:
              - expression: '[0 + 270, 540 - 270] = [270, 270]'
                annotation: The interval is a single point.
          - id: mg3-002-ch2
            title: Where the view stops scrolling
            difficulty: medium
            problem: Level 0 to 4000, screen 960. Between which Player positions does the view scroll?
            hint: Inside the clamp interval, the centre follows Player.
            answer: Between x = 480 and x = 3520; outside that the view stays still.
            walkthrough: []
          - id: mg3-002-ch3
            title: Debug the gap at the bottom
            difficulty: hard
            problem: >-
              A learner set limitTopLeft (0, 0) and limitBottomRight (3000, 0), and now the view shows the level's top
              half only and cannot move down. What went wrong?
            hint: What does a bottom limit of 0 allow?
            answer: >-
              The bottom limit 0 makes the level 0 tall, so the view is centred at y = 0 and shows below and above it;
              set limitBottomRight y to the level's real bottom, 540.
            walkthrough: []
        semantics:
          core:
            - { symbol: "limitTopLeft", meaning: "The level's left and top edges; the view never shows past them." }
            - { symbol: "limitBottomRight", meaning: "The level's right and bottom edges." }
            - { symbol: "clamp(c, lo, hi)", meaning: "c kept between lo and hi: min(hi, max(lo, c))." }
            - { symbol: "h = W / (2 × zoom)", meaning: "Half the screen in world pixels." }
          rulesOfThumb:
            - Set limits to the level's real edges, in world pixels.
            - The view scrolls only while the player is more than half a screen from an edge.
            - A level smaller than the screen gets centred; zoom in to fill it.
            - Check each edge by walking to it.
        misconceptions:
          - falseBelief: Limits stop the player at the edges.
            whyStudentsThinkIt: They are called limits.
            correctionExample: With limits 0 to 3000, Player can still walk to x = −50 if no wall stops it; only the view stops.
            contrastCase: Walls stop the player; limits stop the camera.
          - falseBelief: With limits, Player always stays in the middle of the screen.
            whyStudentsThinkIt: The camera follows Player.
            correctionExample: At x = 2900, Player is 860 px from the screen's left edge, not in the middle (480).
            contrastCase: Only while the view is not clamped does Player stay in the middle.
        transferPrompts:
          - situation: A minimap marker must stay inside its frame however far the player goes.
            competingTechniques:
              - Clamp the marker's position to the frame
              - Hide the marker when it leaves
            whyThisTechniqueWins: Clamping keeps it visible at the nearest edge, which tells the player the direction.
          - situation: A small puzzle room should fill the screen.
            competingTechniques:
              - Zoom the camera so the room is at least a screen wide
              - Set limits wider than the room
            whyThisTechniqueWins: Limits wider than the room would show past it; zoom makes the room fill the view.
        debugging:
          - commonError: Setting limits on a camera that is not current.
            symptom: Nothing changes.
            whyItHappened: The screen uses the current camera.
            repairStrategy: Select the current camera, or tick current on the one you set.
          - commonError: Using screen sizes instead of the level's edges.
            symptom: The view stops scrolling after 960 pixels.
            whyItHappened: limitBottomRight x was set to the screen width, not the level width.
            repairStrategy: Use the level's right edge in world pixels (3000).
        mastery:
          targetLevel: 3
          solveIndependently: Set limits so the view never shows past a level's edges.
          explainVerbally: Explain the clamp interval and why the player leaves the middle near the ends.
          detectIncorrectApplication: Spot limits that confuse screen and level sizes.
          transferToUnfamiliar: Handle levels smaller than the screen with zoom.
        assessment:
          questions:
            - id: mg3-002-assess-1
              type: choice
              text: Level 0 to 3000, screen 960. Player at 2900. Where is the view's centre?
              options: ["2520", "2900", "3000", "2040"]
              answer: "2520"
              hint: The right limit minus half the screen.
        quiz:
          - id: mg3-002-quiz-1
            type: choice
            text: What do camera limits stop?
            options: ["The view going past the level's edges", "The player going past them", "Enemies", "The game"]
            answer: "The view going past the level's edges"
            hints:
              - Walls stop the player.
            reviewSection: "Misconceptions — limits and walls"
          - id: mg3-002-quiz-2
            type: choice
            text: Level 0 to 3000, screen 960. What range can the view's centre take?
            options: ["480 to 2520", "0 to 3000", "960 to 2040", "480 to 3000"]
            answer: "480 to 2520"
            hints:
              - Half the screen in from each edge.
            reviewSection: "Under the hood — the clamp"
          - id: mg3-002-quiz-3
            type: choice
            text: What is clamp(700, 480, 2520)?
            options: ["700", "480", "2520", "1500"]
            answer: "700"
            hints:
              - It is already inside.
            reviewSection: "Intuition — the clamp paragraph"
          - id: mg3-002-quiz-4
            type: choice
            text: A level 600 wide on a 960 screen at zoom 1. Where is the centre?
            options: ["In the middle of the level", "At 480", "At 0", "It follows the player"]
            answer: "In the middle of the level"
            hints:
              - No centre fits both limits.
            reviewSection: "Intuition — Warning: a level smaller than the screen"
          - id: mg3-002-quiz-5
            type: choice
            text: Which of these is NOT a camera limit setting?
            options: ["The player's speed", "limitTopLeft x", "limitBottomRight x", "limitBottomRight y"]
            answer: "The player's speed"
            hints:
              - Limits are edges.
            reviewSection: "Semantics"
          - id: mg3-002-quiz-6
            type: choice
            text: Zoom 2 on a 960 screen. Half the screen in world pixels?
            options: ["240", "480", "960", "120"]
            answer: "240"
            hints:
              - 960 ÷ (2 × 2).
            reviewSection: "Under the hood — zoom"
        checkpoints:
          - { id: cp-mg3-002-1, label: "Read where the view stops near the start", type: read }
          - { id: cp-mg3-002-2, label: "Read the clamp", type: read }
          - { id: cp-mg3-002-3, label: "Read the limits procedure", type: read }
          - { id: cp-mg3-002-4, label: "Complete \"Camera limits\" in Game Studio", type: lab }
          - { id: cp-mg3-002-5, label: "Walk to both ends of the level in Game Studio and watch the view stop", type: lab }
          - { id: cp-mg3-002-6, label: "Work through the near-the-end example", type: example }
          - { id: cp-mg3-002-7, label: "Work through the small-room example", type: example }
          - { id: cp-mg3-002-8, label: "Attempt the gap-at-the-bottom challenge", type: challenge }

      # ───────────────────────────────────────────────────────────── 3.3
      - order: 3
        id: mg3-003
        slug: a-hud-on-a-canvaslayer
        title: A HUD on a CanvasLayer
        subtitle: A score that stays in the corner while the level scrolls.
        tags: [game-studio, hud, ui]
        aliases: hud canvaslayer label score screen coordinates world coordinates ui overlay
        timeToComplete: 20
        coreConcept: >-
          Nodes in the world are drawn where the camera puts them; nodes under a CanvasLayer are drawn at fixed places on
          the screen. A HUD (score, health, messages) goes under a CanvasLayer so it never scrolls.
        prerequisites: [mg3-002]
        nextLesson: mg4-001
        hook:
          question: >-
            You put a "Score: 0" label at (16, 12). When Player walks right and the camera follows, the score slides off
            the screen. Why, and how do you pin it to the corner?
          realWorldContext: >-
            Scores, health bars, ammo counts and pause menus are drawn over the game, fixed to the screen. Every engine
            separates the world from the screen this way.
        intuition:
          prose:
            - >-
              A Label at world position (16, 12). With the camera centred at x = 1500, the screen's left edge is world x
              1020, so the label is 1004 pixels off the left of the screen. It scrolled away with the level.
            - >-
              Before reading on, predict: how do you keep it at the corner without moving it every frame? Put it under a
              **CanvasLayer**. A CanvasLayer's children are placed in screen coordinates: (16, 12) means 16 pixels from
              the screen's left and 12 from its top, wherever the camera is.
            - >-
              So a game has two coordinate systems. **World coordinates** are where things are in the level; the camera
              decides which part shows. **Screen coordinates** are where things are on the screen; (0, 0) is always the
              screen's top-left corner.
            - >-
              A script updates the label's text: `scene.get('HUD/Score').text = 'Score: ' + score`. The path goes through
              the CanvasLayer's name, because the label is its child.
          callouts:
            - type: procedure
              title: "Procedure: Make a HUD"
              body: |-
                Step 1. Add a CanvasLayer to the scene's root, and name it HUD.
                Step 2. Add a Label under HUD for each thing to show (Score, Health), at screen positions.
                Step 3. From a script, set its text: scene.get('HUD/Score').text = ...
                Step 4. Run and walk: the HUD stays put while the world scrolls.
            - type: warning
              title: A HUD in the world
              body: >-
                A Label that is not under a CanvasLayer is part of the world. It looks right until the camera moves, then
                scrolls away. If a HUD scrolls, check its parent in the scene tree.
          visualizations:
            - id: GameStudioTask
              title: A HUD that stays put
              props: { task: hud, lesson: mg3-003, checkpoint: cp-mg3-003-4 }
        math:
          prose:
            - >-
              **Under the hood (optional).** With the camera's view centred at $(c_x, c_y)$, zoom $z$ and a screen $W$ by
              $H$, a world point $(x, y)$ appears on the screen at
              $\big((x - c_x) z + \tfrac{W}{2},\ (y - c_y) z + \tfrac{H}{2}\big)$.
            - >-
              For the label at world $(16, 12)$ with the view at $(1500, 270)$, $z = 1$ on a $960 \times 540$ screen:
              $(16 - 1500 + 480,\ 12 - 270 + 270) = (-1004, 12)$. Off the left of the screen.
            - >-
              A CanvasLayer's children skip that conversion: their positions are already screen coordinates. Converting
              back, a screen point $(s_x, s_y)$ is world $\big((s_x - W/2)/z + c_x,\ (s_y - H/2)/z + c_y\big)$, which is
              how a mouse click finds what it hit.
          equations: []
          callouts: []
          visualizations: []
        rigor:
          prose:
            - >-
              Formally, the world-to-screen map is an affine transformation: a scale by $z$ and a translation. A
              CanvasLayer replaces it with the identity for its subtree.
            - >-
              The invariant of a HUD is its screen position under every camera movement; the invariant of a world node is
              its world position.
            - >-
              Geometrically, the screen is a window sliding over the world; the HUD is painted on the window's glass.
            - >-
              CanvasLayers have a layer number: higher layers are drawn over lower ones, so a pause menu can sit over the
              HUD. Parallax backgrounds are the in-between case: layers that scroll at a fraction of the camera's speed.
          callouts: []
          visualizations: []
        examples:
          - id: mg3-003-ex1
            title: Where a world label appears
            difficulty: easy
            problem: The view is centred at x = 480 (no scrolling yet). A world label is at x = 16. Where is it on the screen?
            steps:
              - expression: '16 - 480 + 480 = 16'
                annotation: With the view at the start, world and screen agree.
                strategyTitle: "Step 1: Convert"
            answer: At screen x = 16, which is why it looked right before walking.
          - id: mg3-003-ex2
            title: After walking
            difficulty: medium
            problem: The view is now centred at x = 1500. Where is the world label at x = 16 on the screen?
            steps:
              - expression: '16 - 1500 + 480 = -1004'
                annotation: Negative means left of the screen.
                strategyTitle: "Step 1: Convert"
            answer: "At screen x = −1004, off the left edge: it has scrolled away."
          - id: mg3-003-ex3
            title: Where did the player click?
            difficulty: hard
            problem: The view is at (1500, 270), zoom 1, screen 960 × 540. A click at screen (100, 300). Which world point is it?
            steps:
              - expression: 'x = 100 - 480 + 1500 = 1120'
                annotation: Screen to world adds the camera back.
                strategyTitle: "Step 1: Across"
              - expression: 'y = 300 - 270 + 270 = 300'
                annotation: The camera is at the default height.
                strategyTitle: "Step 2: Down"
            answer: The click is at world (1120, 300).
        challenges:
          - id: mg3-003-ch1
            title: Corner positions
            difficulty: easy
            problem: On a 960 × 540 screen, what screen position puts a 100-wide label 16 pixels from the right edge?
            hint: The label's position is its left edge for text.
            answer: x = 844, because 960 − 16 − 100 = 844.
            walkthrough:
              - expression: '960 - 16 - 100 = 844'
                annotation: Measured from the right.
          - id: mg3-003-ch2
            title: Zoomed world
            difficulty: medium
            problem: View at (1000, 270), zoom 2, screen 960 × 540. Where does world (1100, 270) appear?
            hint: Multiply the offset by the zoom.
            answer: At screen (680, 270), because (1100 − 1000) × 2 + 480 = 680.
            walkthrough: []
          - id: mg3-003-ch3
            title: Debug the missing score
            difficulty: hard
            problem: >-
              After moving Score under HUD, the script's line scene.get('Score').text = ... throws "no node at Score".
              Why, and what is the fix?
            hint: Paths follow the tree.
            answer: >-
              Score is now HUD's child, so its path is HUD/Score; use scene.get('HUD/Score').
            walkthrough: []
        semantics:
          core:
            - { symbol: "CanvasLayer", meaning: "Draws its children in screen coordinates, so they never scroll." }
            - { symbol: "world coordinates", meaning: "Where things are in the level; the camera picks what shows." }
            - { symbol: "screen coordinates", meaning: "Where things are on the screen; (0, 0) is its top-left." }
            - { symbol: "Label", meaning: "A node that draws text; set its text from a script." }
            - { symbol: "scene.get('HUD/Score')", meaning: "A node by its path from the scene root." }
          rulesOfThumb:
            - Anything that should not scroll goes under a CanvasLayer.
            - Update the HUD's text when the value changes, not every frame, if you can.
            - Paths change when you move nodes; update scene.get calls.
            - Keep the HUD's labels clear of the screen's edges by at least 10 pixels.
        misconceptions:
          - falseBelief: Positions mean the same thing for every node.
            whyStudentsThinkIt: Every node has a position property.
            correctionExample: (16, 12) under HUD is always the screen's corner; in the world it is near the level's start.
            contrastCase: A CanvasLayer changes the meaning of its children's positions.
          - falseBelief: A HUD must be moved with the camera every frame.
            whyStudentsThinkIt: That is how you would keep something on screen by hand.
            correctionExample: Under a CanvasLayer, the label at (16, 12) stays put with no script at all.
            contrastCase: Moving it by hand works but jitters with smoothing and is easy to get wrong.
        transferPrompts:
          - situation: A "Paused" banner must cover the middle of the screen whatever the camera shows.
            competingTechniques:
              - A Label under a CanvasLayer at the screen's middle
              - A Label at the camera's world position, moved each frame
            whyThisTechniqueWins: The CanvasLayer keeps it fixed with no code; the camera-following label lags when smoothing is on.
          - situation: Damage numbers should float up from enemies and scroll with the world.
            competingTechniques:
              - Labels in the world, at the enemy's position
              - Labels under the HUD
            whyThisTechniqueWins: They belong to a place in the level, so they should move with it; HUD labels would stay on screen as the enemy scrolls away.
        debugging:
          - commonError: Making the Label a child of the camera instead of a CanvasLayer.
            symptom: It nearly stays put but drifts and wobbles with smoothing.
            whyItHappened: The camera's position is not the view's position while smoothing.
            repairStrategy: Put HUD labels under a CanvasLayer.
          - commonError: Forgetting to update the path after moving a label.
            symptom: An error, no node at "Score".
            whyItHappened: The path now goes through HUD.
            repairStrategy: Use the full path, scene.get('HUD/Score').
        mastery:
          targetLevel: 3
          solveIndependently: Build a HUD that shows a value and never scrolls.
          explainVerbally: Explain world and screen coordinates and what a CanvasLayer changes.
          detectIncorrectApplication: Spot a HUD in the world, and labels that should be in the world.
          transferToUnfamiliar: Convert between screen and world, for clicks.
        assessment:
          questions:
            - id: mg3-003-assess-1
              type: choice
              text: Where should a score label go so it never scrolls?
              options: ["Under a CanvasLayer", "Under the camera", "Under Player", "At the scene root"]
              answer: "Under a CanvasLayer"
              hint: Its children use screen coordinates.
        quiz:
          - id: mg3-003-quiz-1
            type: choice
            text: What does a CanvasLayer change for its children?
            options: ["Their positions are screen coordinates", "Their colour", "Their collision layers", "Nothing"]
            answer: "Their positions are screen coordinates"
            hints:
              - Painted on the window's glass.
            reviewSection: "Intuition — the CanvasLayer paragraph"
          - id: mg3-003-quiz-2
            type: choice
            text: View at x = 1500, screen 960. Where is a world label at x = 16 on the screen?
            options: ["−1004", "16", "1004", "496"]
            answer: "−1004"
            hints:
              - 16 − 1500 + 480.
            reviewSection: "Examples — After walking"
          - id: mg3-003-quiz-3
            type: choice
            text: Score is under HUD. Its path?
            options: ["HUD/Score", "Score", "Score/HUD", "Main/Score"]
            answer: "HUD/Score"
            hints:
              - Parent first.
            reviewSection: "Challenges — the missing score"
          - id: mg3-003-quiz-4
            type: choice
            text: A click at screen (480, 270), view at (2000, 270), zoom 1. Which world point?
            options: ["(2000, 270)", "(480, 270)", "(2480, 540)", "(1520, 270)"]
            answer: "(2000, 270)"
            hints:
              - The middle of the screen is the view's centre.
            reviewSection: "Under the hood — screen to world"
          - id: mg3-003-quiz-5
            type: choice
            text: Which of these does NOT belong on a CanvasLayer?
            options: ["A coin in the level", "The score", "A health bar", "A pause menu"]
            answer: "A coin in the level"
            hints:
              - It belongs to a place in the world.
            reviewSection: "Transfer — damage numbers"
          - id: mg3-003-quiz-6
            type: choice
            text: Why does a label under the camera wobble with smoothing?
            options: ["The camera's position is not the view's position while smoothing", "Labels cannot be children", "The text changes", "Zoom"]
            answer: "The camera's position is not the view's position while smoothing"
            hints:
              - The view lags the camera.
            reviewSection: "Debugging — child of the camera"
        checkpoints:
          - { id: cp-mg3-003-1, label: "Read why a world label scrolls away", type: read }
          - { id: cp-mg3-003-2, label: "Read world and screen coordinates", type: read }
          - { id: cp-mg3-003-3, label: "Read the HUD procedure", type: read }
          - { id: cp-mg3-003-4, label: "Complete \"A HUD that stays put\" in Game Studio", type: lab }
          - { id: cp-mg3-003-5, label: "Add a Health label to the HUD in Game Studio", type: lab }
          - { id: cp-mg3-003-6, label: "Work through the after-walking example", type: example }
          - { id: cp-mg3-003-7, label: "Work through the click example", type: example }
          - { id: cp-mg3-003-8, label: "Attempt the missing-score challenge", type: challenge }

  # ═══════════════════════════════════════════════════════════════ Chapter 4: Animation
  - number: 4
    slug: animation
    lessons:
      # ───────────────────────────────────────────────────────────── 4.1
      - order: 1
        id: mg4-001
        slug: sprite-animation
        title: Sprite Animation
        subtitle: A character that walks when it moves and stands when it stops.
        tags: [game-studio, animation, sprites]
        aliases: animatedsprite2d frames fps walk idle play animation flipbook
        timeToComplete: 25
        coreConcept: >-
          An AnimatedSprite2D shows a list of pictures one after another, at a number of frames per second. It holds
          several named animations (walk, idle), and a script chooses which one plays with play(name).
        prerequisites: [mg3-003]
        nextLesson: mg4-002
        hook:
          question: >-
            Your character slides across the floor like a statue. You have two pictures of it mid-step. How do you make it
            walk, and only while it is moving?
          realWorldContext: >-
            Sprite animation is a flipbook: games from the 1980s to today draw characters this way. Choosing the right
            animation for what the character is doing is called an animation state.
        intuition:
          prose:
            - >-
              The walk animation has two pictures, A and B, at 8 frames per second. Each picture shows for 1/8 = 0.125
              seconds: A from 0 to 0.125 s, B to 0.25 s, then A again. Four steps a second.
            - >-
              Before reading on, predict: which picture shows at t = 0.3 s? 0.3 ÷ 0.125 = 2.4, so it is in its third
              slot, counting from 0 that is slot 2, and slot 2 of a two-picture loop is A again.
            - >-
              An **AnimatedSprite2D** holds several named animations, each a list of pictures with its own fps and whether
              it loops. `walk` has two pictures at 8 fps; `idle` has one.
            - >-
              The script picks one every frame: `this.get('Sprite').play(moving ? 'walk' : 'idle')`. Calling play with the
              animation that is already playing does nothing, so the walk keeps going instead of restarting each frame.
            - >-
              "Moving" is a question about the body: `this.velocity.x !== 0`. The animation follows the physics, not the
              keys, so a player pushed by something also walks.
          callouts:
            - type: procedure
              title: "Procedure: Animate a character"
              body: |-
                Step 1. Replace the character's Sprite2D with an AnimatedSprite2D named Sprite.
                Step 2. In the Inspector, add an animation, name it walk, add its pictures in order, and set its fps.
                Step 3. Add idle with one picture.
                Step 4. In the character's script, each frame: this.get('Sprite').play(moving ? 'walk' : 'idle').
                Step 5. Run and check: walking plays walk, stopping shows idle.
            - type: warning
              title: An animation name must exist
              body: >-
                play('Walk') when the animation is called walk is an error: names are case-sensitive, and the message lists
                the animations it does have.
          visualizations:
            - id: GameStudioTask
              title: A walking character
              props: { task: walk-animation, lesson: mg4-001, checkpoint: cp-mg4-001-4 }
        math:
          prose:
            - >-
              **Under the hood (optional).** At $f$ frames per second each picture lasts $1/f$ seconds. After $t$ seconds
              of a looping animation of $n$ pictures, the picture showing is number $\lfloor t f \rfloor \bmod n$, counting
              from 0. The floor $\lfloor x \rfloor$ rounds down; $\bmod$ is the remainder.
            - >-
              For walk: $f = 8$, $n = 2$, $t = 0.3$: $\lfloor 2.4 \rfloor = 2$ and $2 \bmod 2 = 0$, picture A. At
              $t = 0.4$: $\lfloor 3.2 \rfloor = 3$, $3 \bmod 2 = 1$, picture B.
            - >-
              The engine adds each frame's dt to a timer and moves to the next picture each time the timer passes
              $1/f$, keeping the leftover. So it stays in time however uneven the frames are: the same idea as speed × dt.
          equations: []
          callouts: []
          visualizations: []
        rigor:
          prose:
            - >-
              Formally, the picture index is a function of elapsed time, $i(t) = \lfloor t f \rfloor \bmod n$ for a loop,
              and $\min(\lfloor t f \rfloor, n - 1)$ for an animation that plays once and stops.
            - >-
              The invariant is the animation's period, $n / f$ seconds: two pictures at 8 fps repeat every 0.25 s on every
              screen, because the timer counts seconds, not frames.
            - >-
              Picture the timeline as slots of width $1/f$; the playhead slides along it at one second per second and
              wraps at the end.
            - >-
              Animation states grow into state machines (idle, walk, jump, fall, hurt) with rules for moving between them,
              chosen from the body's velocity and isOnFloor(). The same choose-and-play pattern scales up.
          callouts: []
          visualizations: []
        examples:
          - id: mg4-001-ex1
            title: How long each picture lasts
            difficulty: easy
            problem: An animation runs at 8 fps. How long does each picture show?
            steps:
              - expression: '\tfrac{1}{8} = 0.125\ \text{s}'
                annotation: Eight pictures share each second.
                strategyTitle: "Step 1: One over the rate"
            answer: Each picture shows for 0.125 seconds.
          - id: mg4-001-ex2
            title: Which picture now?
            difficulty: medium
            problem: A loop of 4 pictures at 10 fps. Which picture shows after 0.75 s?
            steps:
              - expression: '\lfloor 0.75 \times 10 \rfloor = 7'
                annotation: Seven whole pictures have passed.
                strategyTitle: "Step 1: Pictures passed"
              - expression: '7 \bmod 4 = 3'
                annotation: The loop wraps every 4.
                strategyTitle: "Step 2: Wrap round"
            answer: Picture 3, the last of the four (counting from 0).
          - id: mg4-001-ex3
            title: Matching feet to speed
            difficulty: hard
            problem: >-
              Each walk cycle (2 pictures) moves the feet 24 pixels along the ground. Player walks at 96 px/s. What fps
              stops the feet sliding?
            steps:
              - expression: '\tfrac{96}{24} = 4\ \text{cycles a second}'
                annotation: The feet should complete one cycle per 24 pixels.
                strategyTitle: "Step 1: Cycles per second"
              - expression: '4 \times 2 = 8\ \text{fps}'
                annotation: Two pictures per cycle.
                strategyTitle: "Step 2: Pictures per second"
            answer: 8 fps, so the feet move with the ground instead of skating over it.
        challenges:
          - id: mg4-001-ch1
            title: The period
            difficulty: easy
            problem: How long is one loop of 6 pictures at 12 fps?
            hint: Pictures ÷ rate.
            answer: Half a second, because 6 ÷ 12 = 0.5.
            walkthrough:
              - expression: '\tfrac{6}{12} = 0.5'
                annotation: The animation's period.
          - id: mg4-001-ch2
            title: Running faster
            difficulty: medium
            problem: The player now runs at 144 px/s with the same 24-pixel cycle. What fps should walk use?
            hint: Cycles per second, times pictures per cycle.
            answer: 12 fps, because 144 ÷ 24 = 6 cycles a second, times 2 pictures.
            walkthrough: []
          - id: mg4-001-ch3
            title: Debug the frozen walk
            difficulty: hard
            problem: >-
              A learner's script calls this.get('Sprite').stop(); this.get('Sprite').play('walk') every frame while moving,
              and the character never moves its feet. Why?
            hint: What does stop() do to the picture and the timer?
            answer: >-
              stop() goes back to the first picture and resets the timer every frame, so the second picture is never
              reached; call only play('walk'), which carries on if it is already playing.
            walkthrough: []
        semantics:
          core:
            - { symbol: "AnimatedSprite2D", meaning: "Shows a named animation's pictures one after another." }
            - { symbol: "fps", meaning: "Pictures per second; each shows for 1/fps seconds." }
            - { symbol: "play(name)", meaning: "Starts that animation, or carries on if it is already playing." }
            - { symbol: "⌊t·f⌋ mod n", meaning: "The picture showing after t seconds of a loop." }
            - { symbol: "loop", meaning: "Whether the animation starts again after its last picture." }
          rulesOfThumb:
            - Choose the animation from the body's state, not the keys.
            - Call play every frame; it does not restart a running animation.
            - Match the walk's fps to the speed so the feet do not slide.
            - Keep names short and lower-case, and use them exactly.
        misconceptions:
          - falseBelief: Calling play('walk') every frame restarts the walk.
            whyStudentsThinkIt: Playing something usually starts it from the beginning.
            correctionExample: play('walk') while walk plays changes nothing, so both pictures keep alternating.
            contrastCase: play('idle') then play('walk') does restart walk, because the animation changed.
          - falseBelief: A faster screen plays animations faster.
            whyStudentsThinkIt: More frames a second sounds like faster motion.
            correctionExample: At 8 fps, two pictures loop every 0.25 s on 60 Hz and 144 Hz screens alike.
            contrastCase: The animation's timer counts seconds with dt, as movement does.
        transferPrompts:
          - situation: A coin should spin all the time.
            competingTechniques:
              - An AnimatedSprite2D with a looping spin animation
              - Changing the sprite's texture in a script
            whyThisTechniqueWins: The animated sprite does the timing; a script would repeat what it already does.
          - situation: The player should show a jump picture while in the air.
            competingTechniques:
              - Play 'jump' when not isOnFloor(), else walk or idle
              - Play 'jump' when Space is pressed
            whyThisTechniqueWins: The body's state covers falling off ledges too; the key only covers jumping.
        debugging:
          - commonError: Pictures added in the wrong order.
            symptom: The walk looks like a stagger.
            whyItHappened: Frames play in list order.
            repairStrategy: Reorder the pictures in the Inspector.
          - commonError: Checking velocity before moveAndSlide.
            symptom: Walk plays for a moment when walking into a wall.
            whyItHappened: The velocity is reduced only by moveAndSlide.
            repairStrategy: Choose the animation after moveAndSlide, or in update.
        mastery:
          targetLevel: 3
          solveIndependently: Animate a character with walk and idle chosen by its state.
          explainVerbally: Explain fps, the picture index, and why play does not restart a running animation.
          detectIncorrectApplication: Spot code that restarts the animation every frame.
          transferToUnfamiliar: Match an animation's fps to a movement speed.
        assessment:
          questions:
            - id: mg4-001-assess-1
              type: choice
              text: Two pictures at 8 fps. Which shows at 0.3 s (counting from 0)?
              options: ["Picture 0", "Picture 1", "Picture 2", "Neither"]
              answer: "Picture 0"
              hint: ⌊2.4⌋ = 2, and 2 mod 2 = 0.
        quiz:
          - id: mg4-001-quiz-1
            type: choice
            text: How long does each picture of a 12 fps animation show?
            options: ["1/12 s", "12 s", "1/60 s", "0.12 s"]
            answer: "1/12 s"
            hints:
              - One over the rate; 0.12 is the near-miss.
            reviewSection: "Examples — How long each picture lasts"
          - id: mg4-001-quiz-2
            type: choice
            text: What does play('walk') do while walk is already playing?
            options: ["Nothing: it carries on", "Restarts it", "Stops it", "Plays it twice as fast"]
            answer: "Nothing: it carries on"
            hints:
              - Only a different animation restarts.
            reviewSection: "Intuition — the play paragraph"
          - id: mg4-001-quiz-3
            type: choice
            text: What should choose between walk and idle?
            options: ["The body's velocity", "Which key is held", "The frame number", "The camera"]
            answer: "The body's velocity"
            hints:
              - Follow the physics.
            reviewSection: "Intuition — the moving paragraph"
          - id: mg4-001-quiz-4
            type: choice
            text: 4 pictures at 10 fps. Which picture at 0.75 s?
            options: ["3", "7", "0", "2"]
            answer: "3"
            hints:
              - 7 mod 4.
            reviewSection: "Under the hood — the index"
          - id: mg4-001-quiz-5
            type: choice
            text: Which of these does NOT make the walk restart every frame?
            options: ["Calling play('walk') every frame", "Calling stop() then play('walk')", "Calling play('idle') then play('walk')", "Setting frame = 0 each frame"]
            answer: "Calling play('walk') every frame"
            hints:
              - It carries on if already playing.
            reviewSection: "Misconceptions — play every frame"
          - id: mg4-001-quiz-6
            type: choice
            text: A 24-pixel step cycle of 2 pictures at 96 px/s. What fps?
            options: ["8", "4", "12", "96"]
            answer: "8"
            hints:
              - 4 cycles a second, 2 pictures each.
            reviewSection: "Examples — Matching feet to speed"
        checkpoints:
          - { id: cp-mg4-001-1, label: "Read how long each picture shows", type: read }
          - { id: cp-mg4-001-2, label: "Read how a script picks the animation", type: read }
          - { id: cp-mg4-001-3, label: "Read the animation procedure", type: read }
          - { id: cp-mg4-001-4, label: "Complete \"A walking character\" in Game Studio", type: lab }
          - { id: cp-mg4-001-5, label: "Change walk to 12 fps in Game Studio and watch the difference", type: lab }
          - { id: cp-mg4-001-6, label: "Work through the which-picture example", type: example }
          - { id: cp-mg4-001-7, label: "Work through the feet-and-speed example", type: example }
          - { id: cp-mg4-001-8, label: "Attempt the frozen-walk challenge", type: challenge }

      # ───────────────────────────────────────────────────────────── 4.2
      - order: 2
        id: mg4-002
        slug: keyframes-on-a-timeline
        title: Keyframes on a Timeline
        subtitle: A door that slides open, made of two keys and the time between them.
        tags: [game-studio, animation, keyframes]
        aliases: animationplayer keyframes timeline track interpolation lerp autoplay tween
        timeToComplete: 25
        coreConcept: >-
          An AnimationPlayer changes other nodes' properties over time. Each track holds keys, a value at a time;
          between two keys the value is interpolated in a straight line.
        prerequisites: [mg4-001]
        nextLesson: mg4-003
        hook:
          question: >-
            A door should slide up 120 pixels over one second. You could write a script with a timer. Is there a way with
            no code at all?
          realWorldContext: >-
            Doors, moving platforms, flashing pickups, cut-scenes and menu transitions are keyframed, not coded. Animators
            set a few values at a few times, and the engine fills in every frame between.
        intuition:
          prose:
            - >-
              The door starts at y = 340. A key at 0 s says y = 340; a key at 1 s says y = 220. At 0.5 s the door is half
              way: y = 280.
            - >-
              Before reading on, predict: where is it at 0.25 s? A quarter of the way from 340 to 220: 340 − 30 = 310.
              The engine fills every in-between value with a straight line. This is **interpolation**.
            - >-
              An **AnimationPlayer** holds named animations. Each has a length and tracks. A **track** is one property of
              one node (Door's position), with **keys** at chosen times.
            - >-
              In the Animation panel, select the node, move the playhead to a time, set the property, and press ◆ to set a
              key there. Scrubbing the playhead previews it without changing the scene.
            - >-
              **autoplay** starts an animation when the game starts. Paths in tracks start at the AnimationPlayer's parent,
              so `Door` means the Door beside it.
          callouts:
            - type: procedure
              title: "Procedure: Keyframe a property"
              body: |-
                Step 1. Add an AnimationPlayer beside the node to animate (same parent).
                Step 2. In the Animation panel, + New, name the animation and set its length.
                Step 3. Select the node; at 0 s press ◆ beside the property to key its start.
                Step 4. Move the playhead to the end, change the property, press ◆ again.
                Step 5. Scrub to check, tick autoplay (or play it from a script), and run.
            - type: warning
              title: Editing the scene versus setting a key
              body: >-
                While an animation is open, changing a property that has a track sets its key at the playhead, not the
                node's own value. Close the panel to edit the node itself.
          visualizations:
            - id: GameStudioTask
              title: A door that slides open
              props: { task: sliding-door, lesson: mg4-002, checkpoint: cp-mg4-002-4 }
        math:
          prose:
            - >-
              **Under the hood (optional).** Between keys $(t_0, a)$ and $(t_1, b)$, the value at time $t$ is
              $v(t) = a + (b - a)\,s$ with $s = \tfrac{t - t_0}{t_1 - t_0}$, the fraction of the way from $t_0$ to $t_1$.
              This is **linear interpolation**, "lerp".
            - >-
              For the door, $a = 340$, $b = 220$, $t_0 = 0$, $t_1 = 1$: at $t = 0.25$, $s = 0.25$ and
              $v = 340 - 120 \times 0.25 = 310$. Positions interpolate x and y separately.
            - >-
              The speed is constant: $(b - a)/(t_1 - t_0) = -120$ px/s throughout. An easing curve replaces $s$ by a
              function of $s$, such as $s^2$ (start slow) or $3s^2 - 2s^3$ (slow at both ends), to change the feel.
          equations: []
          callouts: []
          visualizations: []
        rigor:
          prose:
            - >-
              Formally, a track is a piecewise-linear function of time through its keys: constant before the first key,
              linear between consecutive keys, constant after the last.
            - >-
              The invariant of linear interpolation is constant speed within each segment; the values at the keys are
              exactly what was set.
            - >-
              Geometrically, the value against time is a polyline through the keys. In 2D, a position track traces
              straight segments through space.
            - >-
              Curves through keys (Bézier or Catmull–Rom splines) give smooth motion with no corners at the keys; the
              same s from 0 to 1 drives them.
          callouts: []
          visualizations: []
        examples:
          - id: mg4-002-ex1
            title: Half way
            difficulty: easy
            problem: Keys y = 340 at 0 s and y = 220 at 1 s. Where is the door at 0.5 s?
            steps:
              - expression: '340 + (220 - 340) \times 0.5 = 280'
                annotation: Half the change, added to the start.
                strategyTitle: "Step 1: Lerp"
            answer: The door is at y = 280.
          - id: mg4-002-ex2
            title: Between two later keys
            difficulty: medium
            problem: Keys at 1 s (y 220) and 3 s (y 300). Where is it at 2.5 s?
            steps:
              - expression: 's = \tfrac{2.5 - 1}{3 - 1} = 0.75'
                annotation: Three quarters of the way through the segment.
                strategyTitle: "Step 1: The fraction"
              - expression: '220 + 80 \times 0.75 = 280'
                annotation: Three quarters of the change.
                strategyTitle: "Step 2: Lerp"
            answer: It is at y = 280.
          - id: mg4-002-ex3
            title: Eased
            difficulty: hard
            problem: The same door, but with easing 3s² − 2s³. Where is it at 0.25 s?
            steps:
              - expression: '3(0.25)^2 - 2(0.25)^3 = 0.1875 - 0.03125 = 0.15625'
                annotation: The eased fraction is smaller early on.
                strategyTitle: "Step 1: Ease s"
              - expression: '340 - 120 \times 0.15625 = 321.25'
                annotation: It has moved less than the linear 310.
                strategyTitle: "Step 2: Lerp with it"
            answer: About y = 321, so it starts more gently than the linear door.
        challenges:
          - id: mg4-002-ch1
            title: Three quarters
            difficulty: easy
            problem: Keys x = 0 at 0 s and x = 400 at 2 s. Where at 1.5 s?
            hint: The fraction is 1.5 ÷ 2.
            answer: x = 300.
            walkthrough:
              - expression: '400 \times 0.75 = 300'
                annotation: Three quarters of 400.
          - id: mg4-002-ch2
            title: Speed of the door
            difficulty: medium
            problem: The door moves from y 340 to 220 in 0.5 s instead. How fast does it move?
            hint: Change ÷ time.
            answer: 240 px/s upwards, because 120 ÷ 0.5 = 240.
            walkthrough: []
          - id: mg4-002-ch3
            title: Debug the door that will not move
            difficulty: hard
            problem: >-
              A learner set both keys with the playhead at 0 s, changing y between them. Running, the door jumps to its
              final place at once. Why?
            hint: When are the two keys?
            answer: >-
              Both keys are at 0 s, so the second replaced the first and there is nothing between; move the playhead to
              1 s before setting the second key.
            walkthrough: []
        semantics:
          core:
            - { symbol: "AnimationPlayer", meaning: "Changes other nodes' properties over time from keyframes." }
            - { symbol: "track", meaning: "One property of one node, with keys." }
            - { symbol: "key", meaning: "A value at a time on a track." }
            - { symbol: "a + (b − a)s", meaning: "Linear interpolation: the value a fraction s of the way from a to b." }
            - { symbol: "autoplay", meaning: "The animation that starts when the game starts." }
          rulesOfThumb:
            - Key the start before changing anything.
            - Move the playhead before setting the next key.
            - Paths start at the AnimationPlayer's parent; keep it beside what it animates.
            - Scrub to preview; the scene is not changed by scrubbing.
        misconceptions:
          - falseBelief: You must key every frame.
            whyStudentsThinkIt: An animation shows a value every frame.
            correctionExample: Two keys, at 0 s and 1 s, give the door 60 positions a second by interpolation.
            contrastCase: Keys are only where the motion changes direction or speed.
          - falseBelief: Scrubbing the timeline moves the door in the scene.
            whyStudentsThinkIt: The door moves in the viewport.
            correctionExample: After scrubbing to 1 s and closing the panel, the door is back at y = 340.
            contrastCase: Only setting a key (or editing without the panel) changes saved values.
        transferPrompts:
          - situation: A platform should move left and right forever.
            competingTechniques:
              - A looping animation with keys at both ends
              - A script that flips direction at each end
            whyThisTechniqueWins: The looping animation needs no code and shows its path on the timeline.
          - situation: A pickup should flash by changing its opacity.
            competingTechniques:
              - A looping track on opacity with keys at 1, 0.2, 1
              - Toggling visibility in update
            whyThisTechniqueWins: The track interpolates smoothly and needs no timing code.
        debugging:
          - commonError: The AnimationPlayer is under the door instead of beside it.
            symptom: The track says there is no node Door.
            whyItHappened: Paths start at the player's parent, which is now the door.
            repairStrategy: Move the AnimationPlayer to the door's parent, or change the track's path.
          - commonError: Forgetting autoplay (or a play call).
            symptom: Nothing happens when the game runs.
            whyItHappened: An animation does not play by itself.
            repairStrategy: Tick autoplay, or call play from a script (next lesson).
        mastery:
          targetLevel: 3
          solveIndependently: Keyframe a property and play it.
          explainVerbally: Explain tracks, keys and linear interpolation.
          detectIncorrectApplication: Spot keys set at the same time, or a misplaced player.
          transferToUnfamiliar: Compute values between keys, with and without easing.
        assessment:
          questions:
            - id: mg4-002-assess-1
              type: choice
              text: Keys y 340 at 0 s and y 220 at 1 s. Where at 0.25 s?
              options: ["310", "280", "250", "330"]
              answer: "310"
              hint: A quarter of the way.
        quiz:
          - id: mg4-002-quiz-1
            type: choice
            text: What is a track?
            options: ["One property of one node, with keys", "A list of pictures", "A sound", "A camera path"]
            answer: "One property of one node, with keys"
            hints:
              - Door's position is a track.
            reviewSection: "Intuition — the AnimationPlayer paragraph"
          - id: mg4-002-quiz-2
            type: choice
            text: What fills in the values between keys?
            options: ["Linear interpolation", "The script", "Random values", "Nothing; it jumps"]
            answer: "Linear interpolation"
            hints:
              - A straight line between them.
            reviewSection: "Under the hood — lerp"
          - id: mg4-002-quiz-3
            type: choice
            text: Keys at 1 s (0) and 3 s (100). Value at 2 s?
            options: ["50", "66.7", "100", "33.3"]
            answer: "50"
            hints:
              - Half way through the segment; 66.7 is the near-miss of dividing by 3.
            reviewSection: "Examples — Between two later keys"
          - id: mg4-002-quiz-4
            type: choice
            text: Track paths start where?
            options: ["At the AnimationPlayer's parent", "At the scene root always", "At the AnimationPlayer", "At the camera"]
            answer: "At the AnimationPlayer's parent"
            hints:
              - Door means the Door beside it.
            reviewSection: "Intuition — the autoplay paragraph"
          - id: mg4-002-quiz-5
            type: choice
            text: Which of these does NOT change the saved scene?
            options: ["Scrubbing the playhead", "Setting a key", "Editing a property with the panel closed", "Adding a track"]
            answer: "Scrubbing the playhead"
            hints:
              - Scrubbing previews.
            reviewSection: "Misconceptions — scrubbing"
          - id: mg4-002-quiz-6
            type: choice
            text: With linear keys, how fast does a door move from 340 to 220 over 1 s?
            options: ["120 px/s all the way", "Fast then slow", "Slow then fast", "60 px/s"]
            answer: "120 px/s all the way"
            hints:
              - Linear means constant speed.
            reviewSection: "Rigor — constant speed"
        checkpoints:
          - { id: cp-mg4-002-1, label: "Read where the door is between keys", type: read }
          - { id: cp-mg4-002-2, label: "Read tracks and keys", type: read }
          - { id: cp-mg4-002-3, label: "Read the keyframe procedure", type: read }
          - { id: cp-mg4-002-4, label: "Complete \"A door that slides open\" in Game Studio", type: lab }
          - { id: cp-mg4-002-5, label: "Add a third key so the door comes back down, in Game Studio", type: lab }
          - { id: cp-mg4-002-6, label: "Work through the later-keys example", type: example }
          - { id: cp-mg4-002-7, label: "Work through the eased example", type: example }
          - { id: cp-mg4-002-8, label: "Attempt the door-that-will-not-move challenge", type: challenge }

      # ───────────────────────────────────────────────────────────── 4.3
      - order: 3
        id: mg4-003
        slug: animation-from-scripts
        title: Animation from Scripts
        subtitle: Play the door's animation when the player steps on a switch.
        tags: [game-studio, animation, scripting]
        aliases: animationplayer play from script switch trigger animationfinished
        timeToComplete: 20
        coreConcept: >-
          An animation can wait until the game asks for it. A script finds the AnimationPlayer with scene.get and calls
          play(name) when something happens, such as a body entering a switch's area.
        prerequisites: [mg4-002]
        nextLesson: mg5-001
        hook:
          question: >-
            The door opens on its own as the game starts. It should open only when the player stands on a switch. What
            joins the switch to the door?
          realWorldContext: >-
            Levels are full of cause and effect: pressure plates, levers, keys and doors. The pattern is always an event
            (something entered) starting an animation somewhere else.
        intuition:
          prose:
            - >-
              The switch is an Area2D on the floor at x = 420. Player walks right from x = 200. When their shapes overlap,
              the switch's `bodyEntered(body)` runs, with `body` set to Player.
            - >-
              In it: `scene.get('DoorAnimation').play('open')`. Before reading on, predict: what happens if Player walks
              onto the switch twice? The second time, the open animation has already finished, so play starts it again
              from the start and the door snaps down and slides up again.
            - >-
              To open only once, remember it: a field `used = false`, and in bodyEntered, `if (this.used) return; this.used = true`.
            - >-
              Untick autoplay first: otherwise the door opens when the game starts, before anyone touches the switch.
            - >-
              The switch does not need to know how the door opens. It only says "play open". The animation could slide,
              fade or swing; the switch's code stays the same.
          callouts:
            - type: procedure
              title: "Procedure: Trigger an animation"
              body: |-
                Step 1. Untick the animation's autoplay so it waits.
                Step 2. Make the trigger: an Area2D (Switch) with a CollisionShape2D.
                Step 3. In its script's bodyEntered(body), check the body is Player.
                Step 4. Call scene.get('DoorAnimation').play('open').
                Step 5. Run, walk onto the switch, and watch the door.
            - type: warning
              title: Paths from the scene root
              body: >-
                scene.get takes a path from the scene's root: 'DoorAnimation' works when it is the root's child. If it is
                inside another node, include it: 'Level/DoorAnimation'.
          visualizations:
            - id: GameStudioTask
              title: A switch that opens the door
              props: { task: door-switch, lesson: mg4-003, checkpoint: cp-mg4-003-4 }
        math:
          prose:
            - >-
              **Under the hood (optional).** An AnimationPlayer keeps an elapsed time $e$ for the playing animation, adding
              $\Delta t$ each frame. For an animation of length $L$ that does not loop, the time used is $\min(e, L)$; at
              $e \geq L$ it stops and calls animationFinished.
            - >-
              play(name) starts a new or finished animation from $e = 0$ (one already playing just carries on). So playing at
              $t_p$ puts the door at $v(t - t_p)$ from the track:
              stepping on the switch at 3 s, the door is at $340 - 120(t - 3)$ until $t = 4$, then stays at 220.
            - >-
              This is an event-driven design: nothing checks every frame whether the player is on the switch; the area's
              set difference (lesson 2.3) produces one event, and the event starts a process that runs itself.
          equations: []
          callouts: []
          visualizations: []
        rigor:
          prose:
            - >-
              Formally, the door's position is $v(\min(t - t_p, L))$ for $t \geq t_p$, where $t_p$ is when play was called
              and $v$ the track's interpolation.
            - >-
              The invariant is the animation itself: the same keys play the same way whenever they start. Only the start
              time comes from the game.
            - >-
              Picture two timelines, the game's and the animation's; play pins the animation's 0 to the game's $t_p$.
            - >-
              Signals (chapter 6) generalise this: the switch emits "pressed", and any number of things connect to it
              without the switch naming them.
          callouts: []
          visualizations: []
        examples:
          - id: mg4-003-ex1
            title: When the door finishes
            difficulty: easy
            problem: Player steps on the switch at t = 3 s. The animation is 1 s long. When is the door fully open?
            steps:
              - expression: '3 + 1 = 4\ \text{s}'
                annotation: The animation starts when play is called and lasts its length.
                strategyTitle: "Step 1: Start plus length"
            answer: At t = 4 s.
          - id: mg4-003-ex2
            title: Where the door is
            difficulty: medium
            problem: Same switch at 3 s. Where is the door at t = 3.5 s?
            steps:
              - expression: 't - t_p = 0.5'
                annotation: Half a second into the animation.
                strategyTitle: "Step 1: Animation time"
              - expression: '340 - 120 \times 0.5 = 280'
                annotation: The track at 0.5 s.
                strategyTitle: "Step 2: Read the track"
            answer: It is at y = 280, half way up.
          - id: mg4-003-ex3
            title: Opening once
            difficulty: hard
            problem: Player walks off the switch and back on at t = 6 s. Without a used field, what happens to the door?
            steps:
              - expression: '\texttt{play("open")} \Rightarrow e = 0'
                annotation: The finished animation starts again.
                strategyTitle: "Step 1: Play restarts it"
              - expression: 'v(0) = 340'
                annotation: The door jumps down to its first key, then slides up again.
                strategyTitle: "Step 2: The first key"
            answer: The door snaps shut and opens again; a used field stops the second play.
        challenges:
          - id: mg4-003-ch1
            title: A slower door
            difficulty: easy
            problem: The open animation is 2 s long. The switch is pressed at 5 s. When is the door open?
            hint: Start plus length.
            answer: At 7 s.
            walkthrough:
              - expression: '5 + 2 = 7'
                annotation: It starts when played.
          - id: mg4-003-ch2
            title: Two switches
            difficulty: medium
            problem: Two switches should both open the same door. What changes in the door's animation?
            hint: Who calls play?
            answer: Nothing; both switch scripts call scene.get('DoorAnimation').play('open').
            walkthrough: []
          - id: mg4-003-ch3
            title: Debug the door that opens at the start
            difficulty: hard
            problem: The door opens as soon as the game starts, before anyone touches the switch. The switch's script is right. Why?
            hint: What else starts animations?
            answer: autoplay is still set to open; untick it so only the switch plays it.
            walkthrough: []
        semantics:
          core:
            - { symbol: "scene.get('DoorAnimation')", meaning: "The node at that path from the scene root." }
            - { symbol: "play('open')", meaning: "Starts the animation from its beginning (or carries on if it is playing)." }
            - { symbol: "animationFinished(name)", meaning: "Called when an animation that does not loop ends." }
            - { symbol: "event-driven", meaning: "Acting when something happens, instead of checking every frame." }
          rulesOfThumb:
            - Untick autoplay for animations a trigger starts.
            - Check who entered before playing.
            - Guard one-off triggers with a field.
            - Let the trigger say what to play, and the animation say how.
        misconceptions:
          - falseBelief: The switch must move the door itself.
            whyStudentsThinkIt: Something has to change the door's position.
            correctionExample: One line, play('open'), and the existing track moves the door 120 px over 1 s.
            contrastCase: Moving it in the switch's script would duplicate the animation in code.
          - falseBelief: play on a finished animation does nothing.
            whyStudentsThinkIt: It is already done.
            correctionExample: Stepping on again at 6 s restarts it from the first key.
            contrastCase: play only carries on when the animation is still playing.
        transferPrompts:
          - situation: A chest should open when the player presses a key near it.
            competingTechniques:
              - An Area2D to know the player is near, and play('open') when the key is pressed
              - Check distance to every chest every frame in the player
            whyThisTechniqueWins: The area tracks nearness by itself; the player script stays simple.
          - situation: A cut-scene should play when the player enters a room.
            competingTechniques:
              - A trigger area that plays the cut-scene animation
              - A timer that starts it after some seconds
            whyThisTechniqueWins: The trigger ties it to the player arriving, whenever that is.
        debugging:
          - commonError: Misspelling the animation name.
            symptom: An error saying the player has no animation by that name.
            whyItHappened: Names are exact.
            repairStrategy: Copy the name from the Animation panel.
          - commonError: Playing the animation every frame while on the switch.
            symptom: The door opens, then snaps shut and opens again, over and over, while the player stands there.
            whyItHappened: play carries on while it is playing, but once it has finished, the next frame's play starts it again from the first key.
            repairStrategy: Play it in bodyEntered, which runs once per entry, and guard it with a used field.
        mastery:
          targetLevel: 3
          solveIndependently: Trigger an animation from an area, once.
          explainVerbally: Explain how play sets the animation's start time.
          detectIncorrectApplication: Spot autoplay or per-frame play bugs.
          transferToUnfamiliar: Wire any trigger to any animation.
        assessment:
          questions:
            - id: mg4-003-assess-1
              type: choice
              text: Switch pressed at 3 s, a 1 s animation. Where is the door (340 → 220) at 3.25 s?
              options: ["310", "280", "220", "340"]
              answer: "310"
              hint: A quarter of a second in.
        quiz:
          - id: mg4-003-quiz-1
            type: choice
            text: Where does the switch call play?
            options: ["In bodyEntered", "In update, every frame", "In ready", "In the door's script"]
            answer: "In bodyEntered"
            hints:
              - Once per entry.
            reviewSection: "Intuition — the switch paragraph"
          - id: mg4-003-quiz-2
            type: choice
            text: Why untick autoplay?
            options: ["So the door waits for the switch", "So the door moves faster", "So the switch works at all", "It does not matter"]
            answer: "So the door waits for the switch"
            hints:
              - Otherwise it opens at the start.
            reviewSection: "Intuition — the autoplay paragraph"
          - id: mg4-003-quiz-3
            type: choice
            text: What does play do to a finished animation?
            options: ["Starts it again from the beginning", "Nothing", "Plays it backwards", "Removes it"]
            answer: "Starts it again from the beginning"
            hints:
              - It is not playing any more.
            reviewSection: "Examples — Opening once"
          - id: mg4-003-quiz-4
            type: choice
            text: How do you make a switch work only once?
            options: ["A field set to true the first time, checked first", "Calling play twice", "Unticking loop", "A bigger shape"]
            answer: "A field set to true the first time, checked first"
            hints:
              - Remember it was used.
            reviewSection: "Intuition — the used paragraph"
          - id: mg4-003-quiz-5
            type: choice
            text: Which of these is NOT needed to open the door from a switch?
            options: ["A script on the door", "An Area2D switch", "A play call", "The open animation"]
            answer: "A script on the door"
            hints:
              - The door has no code at all.
            reviewSection: "Misconceptions — the switch moves the door"
          - id: mg4-003-quiz-6
            type: choice
            text: Pressed at 2 s, length 1 s. Where is the door at 5 s?
            options: ["220, fully open", "340", "280", "100"]
            answer: "220, fully open"
            hints:
              - It stays at the last key.
            reviewSection: "Under the hood — after the end"
        checkpoints:
          - { id: cp-mg4-003-1, label: "Read how the switch plays the door", type: read }
          - { id: cp-mg4-003-2, label: "Read how to open only once", type: read }
          - { id: cp-mg4-003-3, label: "Read the trigger procedure", type: read }
          - { id: cp-mg4-003-4, label: "Complete \"A switch that opens the door\" in Game Studio", type: lab }
          - { id: cp-mg4-003-5, label: "Make the switch work only once in Game Studio", type: lab }
          - { id: cp-mg4-003-6, label: "Work through the where-is-the-door example", type: example }
          - { id: cp-mg4-003-7, label: "Work through the opening-once example", type: example }
          - { id: cp-mg4-003-8, label: "Attempt the door-opens-at-start challenge", type: challenge }

  # ═══════════════════════════════════════════════════════════════ Chapter 5: Tilemaps
  - number: 5
    slug: tilemaps
    lessons:
      # ───────────────────────────────────────────────────────────── 5.1
      - order: 1
        id: mg5-001
        slug: tilesets-and-painting
        title: Tilesets and Painting
        subtitle: Cut a sheet of art into numbered tiles, and paint a floor with them.
        tags: [game-studio, tilemaps]
        aliases: tileset tilemaplayer tile sheet tile id margin spacing paint grid cells
        timeToComplete: 25
        coreConcept: >-
          A tileset cuts one image into a grid of equal tiles, numbered left to right, top to bottom, from 0. A
          TileMapLayer is a grid of cells, each showing one tile number, so a whole level is a list of small numbers.
        prerequisites: [mg4-003]
        nextLesson: mg5-002
        hook:
          question: >-
            A dungeon level is 20 by 12 squares, each 16 pixels. Drawing it as one big picture means 320 × 192 pixels to
            paint by hand. How do games build levels from a few dozen small pictures instead?
          realWorldContext: >-
            From Super Mario Bros. to Stardew Valley, 2D levels are tilemaps: a small sheet of art reused across a grid.
            It saves memory, makes levels quick to change, and lets the game ask "what is at this cell?".
        intuition:
          prose:
            - >-
              Kenney's Tiny Dungeon sheet is 192 × 176 pixels, cut into 16 × 16 tiles: 192 ÷ 16 = 12 across and
              176 ÷ 16 = 11 down, 132 tiles. They are numbered along each row: 0 to 11 on the first row, 12 to 23 on the
              second, and so on.
            - >-
              Before reading on, predict: where is tile 40 in the sheet? 40 ÷ 12 = 3 remainder 4: row 3, column 4,
              counting from 0. That is the grey brick wall.
            - >-
              A **tileset** records the image and the tile size (and any margin round the edge or spacing between tiles).
              It is a project file, shared by every layer that uses it.
            - >-
              A **TileMapLayer** is a grid of cells. Each cell holds a tile number, or nothing. With the layer at
              (0, 0), cell (5, 3) is drawn at (80, 48): 5 × 16 across and 3 × 16 down.
            - >-
              In the TileMap panel you pick a tile in the palette and paint cells in the viewport: dragging paints one at a
              time, Rectangle fills a block.
          callouts:
            - type: procedure
              title: "Procedure: Paint a floor"
              body: |-
                Step 1. Add a TileMapLayer (Floor); selecting it opens the TileMap panel.
                Step 2. + New tileset…: choose the sheet and its tile size (16 × 16 for Tiny Dungeon), and Create.
                Step 3. Pick a floor tile in the palette.
                Step 4. Paint in the viewport, or choose Rectangle and drag a block.
                Step 5. Run to see it in the game.
            - type: warning
              title: The wrong tile size scrambles everything
              body: >-
                Cutting an 18-pixel sheet into 16-pixel tiles makes every tile a slice of two pictures. Use the size the
                art was drawn at; Kenney's packs say it in their names and in the starter art notes.
          visualizations:
            - id: GameStudioTask
              title: A tileset and a floor
              props: { task: paint-a-floor, lesson: mg5-001, checkpoint: cp-mg5-001-4 }
        math:
          prose:
            - >-
              **Under the hood (optional).** With an image $W$ pixels wide, tiles $t$ wide, a margin $m$ round the edge and
              spacing $s$ between tiles, the number of columns is $C = \left\lfloor \tfrac{W - 2m + s}{t + s} \right\rfloor$.
              For Tiny Dungeon: $\lfloor 192 / 16 \rfloor = 12$.
            - >-
              Tile $i$ is at column $i \bmod C$ and row $\lfloor i / C \rfloor$, and its top-left pixel in the image is
              $(m + (i \bmod C)(t + s),\ m + \lfloor i / C \rfloor (t + s))$. Tile 40: column 4, row 3, pixel (64, 48).
            - >-
              Going the other way, a world point $(x, y)$ is in cell $(\lfloor x / t \rfloor, \lfloor y / t \rfloor)$ of a
              layer at the origin: (85, 50) is cell (5, 3). That is how a game asks what is under the player.
          equations: []
          callouts: []
          visualizations: []
        rigor:
          prose:
            - >-
              Formally, numbering tiles row by row is the map $(c, r) \mapsto rC + c$, with inverse
              $i \mapsto (i \bmod C, \lfloor i / C \rfloor)$. The same row-major order stores any 2D grid in a list.
            - >-
              The invariant is the tile's identity: tile 40 is the brick wall in every layer that uses this tileset, which
              is why changing a tileset's image restyles every map at once.
            - >-
              Geometrically, a layer is a lattice of squares; a cell's world rectangle is $[ct, (c+1)t) \times [rt, (r+1)t)$.
            - >-
              Storing only the painted cells, as Game Studio does, is a sparse representation: an empty 1000 × 1000 map
              costs nothing. Dense arrays (Tetris, chapter 7) suit small grids where every cell matters.
          callouts: []
          visualizations: []
        examples:
          - id: mg5-001-ex1
            title: How many tiles
            difficulty: easy
            problem: A sheet 192 × 176 pixels with 16 × 16 tiles. How many tiles?
            steps:
              - expression: '\tfrac{192}{16} \times \tfrac{176}{16} = 12 \times 11 = 132'
                annotation: Columns times rows.
                strategyTitle: "Step 1: Columns times rows"
            answer: 132 tiles, 12 across and 11 down.
          - id: mg5-001-ex2
            title: Where is tile 40?
            difficulty: medium
            problem: In that sheet, where is tile 40, in the grid and in pixels?
            steps:
              - expression: '40 \bmod 12 = 4,\ \lfloor 40 / 12 \rfloor = 3'
                annotation: Column is the remainder, row is the whole part.
                strategyTitle: "Step 1: Column and row"
              - expression: '(4 \times 16, 3 \times 16) = (64, 48)'
                annotation: No margin or spacing in this sheet.
                strategyTitle: "Step 2: Pixels"
            answer: Column 4, row 3, starting at pixel (64, 48).
          - id: mg5-001-ex3
            title: A sheet with spacing
            difficulty: hard
            problem: A sheet 379 pixels wide has 18-pixel tiles with 1 pixel between them and no margin. How many columns?
            steps:
              - expression: 'C = \left\lfloor \tfrac{379 + 1}{18 + 1} \right\rfloor = \left\lfloor 20 \right\rfloor = 20'
                annotation: Adding one spacing to the width makes every tile plus its gap fit evenly.
                strategyTitle: "Step 1: Columns"
            answer: 20 columns (Pixel Platformer's unpacked sheet).
        challenges:
          - id: mg5-001-ch1
            title: Tile number from place
            difficulty: easy
            problem: In a 12-column sheet, which number is the tile at column 7, row 2?
            hint: Row × columns + column.
            answer: Tile 31, because 2 × 12 + 7 = 31.
            walkthrough:
              - expression: '2 \times 12 + 7 = 31'
                annotation: Row-major numbering.
          - id: mg5-001-ch2
            title: Which cell?
            difficulty: medium
            problem: 16-pixel tiles, layer at the origin. Which cell holds the point (200, 37)?
            hint: Divide and round down.
            answer: Cell (12, 2), because ⌊200/16⌋ = 12 and ⌊37/16⌋ = 2.
            walkthrough: []
          - id: mg5-001-ch3
            title: Debug the sliced tiles
            difficulty: hard
            problem: >-
              A learner's tiles each show the edges of two pictures. The sheet is Pixel Platformer's packed sheet,
              360 × 162. They chose 16 × 16. What is wrong?
            hint: What size divides 360 and 162 evenly?
            answer: The tiles are 18 × 18 (360 ÷ 18 = 20 and 162 ÷ 18 = 9); make a new tileset at 18.
            walkthrough: []
        semantics:
          core:
            - { symbol: "tileset", meaning: "An image cut into a grid of equal, numbered tiles." }
            - { symbol: "TileMapLayer", meaning: "A grid of cells, each showing one tile number." }
            - { symbol: "tile i → (i mod C, ⌊i/C⌋)", meaning: "The column and row of tile i in a sheet C tiles wide." }
            - { symbol: "cell (c, r) → (c·t, r·t)", meaning: "Where a cell is drawn, for tiles t pixels wide." }
            - { symbol: "margin and spacing", meaning: "Pixels round the sheet's edge and between its tiles." }
          rulesOfThumb:
            - Use the tile size the art was drawn at.
            - Count columns first; everything else follows from it.
            - Use Rectangle for big areas and the brush for details.
            - Keep floors and walls on separate layers.
        misconceptions:
          - falseBelief: Tiles are numbered down each column.
            whyStudentsThinkIt: Either order seems possible.
            correctionExample: In a 12-wide sheet, tile 12 is the first tile of the second row, not the second tile of the first column.
            contrastCase: Numbering is left to right, then top to bottom, from 0.
          - falseBelief: Each cell stores its own copy of the picture.
            whyStudentsThinkIt: Every cell shows a picture.
            correctionExample: A floor of 200 cells stores 200 small numbers and one shared image.
            contrastCase: Change the tileset's image and every one of those cells changes.
        transferPrompts:
          - situation: A game needs to know what the player is standing on.
            competingTechniques:
              - Convert the player's feet to a cell and read its tile
              - Give every floor tile its own Area2D
            whyThisTechniqueWins: One division finds the cell; hundreds of areas would be slow and fiddly.
          - situation: A level must be reskinned for a snow world.
            competingTechniques:
              - Swap the tileset's image for a snow sheet with the same layout
              - Repaint the level with new tiles
            whyThisTechniqueWins: The cells keep their numbers, so the same level appears in snow at once.
        debugging:
          - commonError: Painting on the wrong layer.
            symptom: Walls appear behind the floor, or the floor shows over the player.
            whyItHappened: The TileMap panel paints the selected layer.
            repairStrategy: Select the layer in the scene tree before painting.
          - commonError: A layer with no tileset.
            symptom: The palette is empty and nothing paints.
            whyItHappened: A layer needs a tileset to draw from.
            repairStrategy: Choose a tileset in the TileMap panel, or make one with + New tileset….
        mastery:
          targetLevel: 3
          solveIndependently: Make a tileset and paint a floor.
          explainVerbally: Explain tile numbering and how cells map to the world.
          detectIncorrectApplication: Spot a wrong tile size from scrambled tiles.
          transferToUnfamiliar: Find the cell under any point, and the tile under any number.
        assessment:
          questions:
            - id: mg5-001-assess-1
              type: choice
              text: In a 12-column sheet, where is tile 40?
              options: ["Column 4, row 3", "Column 3, row 4", "Column 40, row 0", "Column 0, row 40"]
              answer: "Column 4, row 3"
              hint: 40 = 3 × 12 + 4.
        quiz:
          - id: mg5-001-quiz-1
            type: choice
            text: How many 16-pixel tiles across a 192-pixel sheet?
            options: ["12", "16", "11", "192"]
            answer: "12"
            hints:
              - 192 ÷ 16.
            reviewSection: "Intuition — the sheet paragraph"
          - id: mg5-001-quiz-2
            type: choice
            text: Where is cell (5, 3) drawn with 16-pixel tiles?
            options: ["(80, 48)", "(5, 3)", "(48, 80)", "(16, 16)"]
            answer: "(80, 48)"
            hints:
              - Times 16 each way; (48, 80) swaps them.
            reviewSection: "Intuition — the cell paragraph"
          - id: mg5-001-quiz-3
            type: choice
            text: What does a TileMapLayer's cell store?
            options: ["A tile number", "A copy of the picture", "A node", "A colour"]
            answer: "A tile number"
            hints:
              - Small numbers, one shared image.
            reviewSection: "Misconceptions — copies"
          - id: mg5-001-quiz-4
            type: choice
            text: Which cell holds point (85, 50) with 16-pixel tiles?
            options: ["(5, 3)", "(85, 50)", "(6, 4)", "(5, 4)"]
            answer: "(5, 3)"
            hints:
              - Round down.
            reviewSection: "Under the hood — world to cell"
          - id: mg5-001-quiz-5
            type: choice
            text: Which of these is NOT part of a tileset?
            options: ["The player's speed", "The image", "The tile size", "The spacing"]
            answer: "The player's speed"
            hints:
              - A tileset describes the sheet.
            reviewSection: "Intuition — the tileset paragraph"
          - id: mg5-001-quiz-6
            type: choice
            text: A 360 × 162 sheet. Which tile size fits evenly?
            options: ["18", "16", "20", "32"]
            answer: "18"
            hints:
              - 360 ÷ 18 = 20 and 162 ÷ 18 = 9.
            reviewSection: "Challenges — the sliced tiles"
        checkpoints:
          - { id: cp-mg5-001-1, label: "Read how a sheet is numbered", type: read }
          - { id: cp-mg5-001-2, label: "Read what a layer's cells hold", type: read }
          - { id: cp-mg5-001-3, label: "Read the painting procedure", type: read }
          - { id: cp-mg5-001-4, label: "Complete \"A tileset and a floor\" in Game Studio", type: lab }
          - { id: cp-mg5-001-5, label: "Paint a second room with Rectangle in Game Studio", type: lab }
          - { id: cp-mg5-001-6, label: "Work through the tile-40 example", type: example }
          - { id: cp-mg5-001-7, label: "Work through the spacing example", type: example }
          - { id: cp-mg5-001-8, label: "Attempt the sliced-tiles challenge", type: challenge }

      # ───────────────────────────────────────────────────────────── 5.2
      - order: 2
        id: mg5-002
        slug: solid-walls
        title: Solid Walls
        subtitle: Walls on their own layer, made solid by marking their tile.
        tags: [game-studio, tilemaps, collision]
        aliases: solid tiles tile collision walls layer merged rectangles seams
        timeToComplete: 25
        coreConcept: >-
          A tileset marks some tiles as solid. Every layer that uses those tiles then blocks bodies there. The engine
          merges neighbouring solid cells into a few rectangles, so bodies slide smoothly along a wall of many tiles.
        prerequisites: [mg5-001]
        nextLesson: mg5-003
        hook:
          question: >-
            You painted a wall of 60 brick tiles round a room. The player walks straight through them. Do you need 60
            collision shapes?
          realWorldContext: >-
            Tile collision is how almost every 2D level stops its characters. Marking tiles solid once, in the tileset,
            means every level painted with them is solid too.
        intuition:
          prose:
            - >-
              The room's wall is a border 20 cells wide and 12 tall: 20 on the top row, 20 on the bottom, and 10 on each
              side between them. That is 60 brick cells.
            - >-
              Mark the brick tile, tile 40, as solid: TileMap panel › ■ Solid tiles, then click it in the palette. Every
              layer using this tileset now blocks bodies wherever tile 40 is.
            - >-
              Before reading on, predict: how many collision rectangles does the engine make for the 60 cells? Four. The
              top row is one 20-cell rectangle, the bottom another, and each side is one tall 1-by-10 rectangle.
            - >-
              Why merge? With 60 separate squares, a body sliding along the top wall would cross 19 joins between squares,
              and at each one it can catch on a corner. One long rectangle has no joins.
            - >-
              Keep walls on their own layer: a Walls layer over the Floor. The floor's tiles stay walkable, and the walls
              can be repainted without touching the floor.
          callouts:
            - type: procedure
              title: "Procedure: Make walls that stop the player"
              body: |-
                Step 1. Add a second TileMapLayer (Walls) using the same tileset.
                Step 2. Paint the wall tiles where the walls go.
                Step 3. In the TileMap panel, press ■ Solid tiles and click the wall tile in the palette.
                Step 4. Run, and walk into a wall: the player stops at it.
            - type: warning
              title: Solid belongs to the tile, not the layer
              body: >-
                Marking tile 40 solid makes it solid in every layer that uses the tileset, the floor included. Do not paint
                the wall tile into the floor layer, or the floor gets walls you cannot see the reason for.
          visualizations:
            - id: GameStudioTask
              title: Walls that stop the player
              props: { task: solid-walls, lesson: mg5-002, checkpoint: cp-mg5-002-4 }
        math:
          prose:
            - >-
              **Under the hood (optional).** The engine merges in two passes. First, along each row, it joins consecutive
              solid cells into runs: the top row of 20 becomes one run $(x = 0, w = 20)$; a side row becomes two runs,
              $(0, 1)$ and $(19, 1)$.
            - >-
              Second, a run directly below an identical run (same $x$ and $w$) extends it downwards. The ten side runs at
              $x = 0$ stack into one rectangle $1 \times 10$; likewise at $x = 19$. Total: 4 rectangles for 60 cells.
            - >-
              Each rectangle is then an ordinary shape for collisions (lesson 2.1): a body overlapping it is pushed out by
              the minimum translation vector. In world pixels a cell rectangle is $(x t, y t, w t, h t)$ for tiles $t$ wide.
          equations: []
          callouts: []
          visualizations: []
        rigor:
          prose:
            - >-
              Formally, the merge covers exactly the solid cells with disjoint rectangles. This greedy pass does not always
              find the fewest possible (that is a harder problem), but it removes every join along rows and down columns of
              equal runs.
            - >-
              The invariant is the solid region itself: merging changes how it is described, not which points are solid.
            - >-
              Geometrically, the wall's outline becomes a few straight edges; the corners that caught bodies were artefacts
              of describing one surface as many squares.
            - >-
              Engines go further, joining edges into chains or polygons, which also handles slopes. The idea is the same:
              describe the solid area by its boundary, not its cells.
          callouts: []
          visualizations: []
        examples:
          - id: mg5-002-ex1
            title: Counting the wall
            difficulty: easy
            problem: How many cells are in the border of a 20 × 12 room?
            steps:
              - expression: '2 \times 20 + 2 \times (12 - 2) = 40 + 20 = 60'
                annotation: Top and bottom rows, plus the sides between them.
                strategyTitle: "Step 1: Rows and sides"
            answer: 60 cells.
          - id: mg5-002-ex2
            title: Merging the border
            difficulty: medium
            problem: Into how many rectangles does the engine merge that border?
            steps:
              - expression: '\text{rows } 0, 11: \text{one run of } 20 \text{ each}'
                annotation: The top and bottom rows are each one run.
                strategyTitle: "Step 1: Full rows"
              - expression: '\text{rows } 1\text{–}10: \text{runs at } x = 0 \text{ and } x = 19, \text{ stacked}'
                annotation: Identical runs below each other stack into two tall rectangles.
                strategyTitle: "Step 2: The sides"
            answer: 4 rectangles.
          - id: mg5-002-ex3
            title: A gap in the wall
            difficulty: hard
            problem: A doorway removes cells (9, 11) and (10, 11) from the bottom row. How many rectangles now?
            steps:
              - expression: '\text{row } 11: (0, 9) \text{ and } (11, 9)'
                annotation: The bottom row splits into two runs of 9.
                strategyTitle: "Step 1: Split the row"
              - expression: '1 + 2 + 2 = 5'
                annotation: The top row, the two sides, and the two halves of the bottom.
                strategyTitle: "Step 2: Count"
            answer: 5 rectangles.
        challenges:
          - id: mg5-002-ch1
            title: A solid floor
            difficulty: easy
            problem: A floor row of 30 solid cells. How many rectangles?
            hint: One run.
            answer: One rectangle, 30 cells wide.
            walkthrough:
              - expression: '1'
                annotation: Consecutive solid cells in a row are one run.
          - id: mg5-002-ch2
            title: A thick wall
            difficulty: medium
            problem: A wall 3 cells wide and 8 tall, all solid. How many rectangles?
            hint: Each row is one run of 3, and they are identical.
            answer: One rectangle, 3 × 8.
            walkthrough: []
          - id: mg5-002-ch3
            title: Debug the invisible wall
            difficulty: hard
            problem: >-
              After marking tile 40 solid, the player is stopped in the middle of the floor. The floor layer looks normal.
              What should the learner check?
            hint: Solid is per tile, in every layer.
            answer: >-
              That no tile 40 was painted into the floor layer; a single brick cell there is solid even if another tile
              covers it from a layer above.
            walkthrough: []
        semantics:
          core:
            - { symbol: "solid tile", meaning: "A tile marked in its tileset to block bodies, in every layer." }
            - { symbol: "run", meaning: "Consecutive solid cells along one row." }
            - { symbol: "merged rectangle", meaning: "Runs stacked down rows into one collision shape." }
            - { symbol: "seam", meaning: "The join between two shapes, where a sliding body can catch." }
          rulesOfThumb:
            - Put walls on their own layer.
            - Mark solid tiles once, in the tileset.
            - Do not paint wall tiles into walkable layers.
            - Test every wall by walking into it.
        misconceptions:
          - falseBelief: Each solid tile gets its own collision square.
            whyStudentsThinkIt: Each tile is painted separately.
            correctionExample: The 60-cell border becomes 4 rectangles.
            contrastCase: Separate squares would leave 56 joins for bodies to catch on.
          - falseBelief: Making a layer solid is a layer setting.
            whyStudentsThinkIt: Walls are on their own layer.
            correctionExample: Marking tile 40 makes it solid on the floor layer too, if painted there.
            contrastCase: Solidity belongs to the tile in the tileset.
        transferPrompts:
          - situation: Water tiles should stop the player but not arrows.
            competingTechniques:
              - Put water on its own layer with a collision layer the arrows' mask leaves out
              - Make water non-solid
            whyThisTechniqueWins: The tile layer has collision layers like a body, so masks decide who it stops.
          - situation: A long floor of many tiles makes the player stutter.
            competingTechniques:
              - Tile collision with merged rectangles
              - A StaticBody2D shape per tile
            whyThisTechniqueWins: Merged rectangles remove the seams that cause the stutter.
        debugging:
          - commonError: Clicking the tile in the palette without ■ Solid tiles on.
            symptom: The brush changes, but nothing becomes solid.
            whyItHappened: Without Solid tiles, clicking picks a tile to paint.
            repairStrategy: Press ■ Solid tiles first; the count of solid tiles shows beside it.
          - commonError: The player has no collision shape.
            symptom: The player walks through solid tiles.
            whyItHappened: Tiles stop bodies by their shapes; a body with no shape is never stopped.
            repairStrategy: Give the player a CollisionShape2D (lesson 2.1).
        mastery:
          targetLevel: 3
          solveIndependently: Paint walls on a layer and make them solid.
          explainVerbally: Explain how solid cells become rectangles and why it matters.
          detectIncorrectApplication: Spot solid tiles in a walkable layer.
          transferToUnfamiliar: Count the rectangles for a given wall shape.
        assessment:
          questions:
            - id: mg5-002-assess-1
              type: choice
              text: Into how many rectangles is a 20 × 12 border merged?
              options: ["4", "60", "2", "20"]
              answer: "4"
              hint: Two full rows and two stacked sides.
        quiz:
          - id: mg5-002-quiz-1
            type: choice
            text: Where is a tile marked solid?
            options: ["In its tileset", "On each layer", "On each cell", "In the player's script"]
            answer: "In its tileset"
            hints:
              - Solid belongs to the tile.
            reviewSection: "Intuition — Warning: solid belongs to the tile"
          - id: mg5-002-quiz-2
            type: choice
            text: Why does the engine merge solid cells?
            options: ["So sliding bodies do not catch on seams", "To save colours", "To draw faster", "To make walls thicker"]
            answer: "So sliding bodies do not catch on seams"
            hints:
              - One long edge has no joins.
            reviewSection: "Intuition — the why-merge paragraph"
          - id: mg5-002-quiz-3
            type: choice
            text: A doorway splits the bottom row of a 20 × 12 border. How many rectangles?
            options: ["5", "4", "6", "60"]
            answer: "5"
            hints:
              - The bottom row becomes two runs.
            reviewSection: "Examples — A gap in the wall"
          - id: mg5-002-quiz-4
            type: choice
            text: A side of 10 single cells, one above another. How many rectangles?
            options: ["1", "10", "2", "5"]
            answer: "1"
            hints:
              - Identical runs stack.
            reviewSection: "Under the hood — stacking"
          - id: mg5-002-quiz-5
            type: choice
            text: Which of these does NOT make a wall stop the player?
            options: ["Painting it on its own layer only", "Marking its tile solid", "The player having a shape", "Using moveAndSlide"]
            answer: "Painting it on its own layer only"
            hints:
              - A layer alone is not solid.
            reviewSection: "Misconceptions — layer setting"
          - id: mg5-002-quiz-6
            type: choice
            text: How many cells in the border of a 10 × 6 room?
            options: ["28", "60", "32", "24"]
            answer: "28"
            hints:
              - 2 × 10 + 2 × 4.
            reviewSection: "Examples — Counting the wall"
        checkpoints:
          - { id: cp-mg5-002-1, label: "Read how solid tiles work", type: read }
          - { id: cp-mg5-002-2, label: "Read why solid cells are merged", type: read }
          - { id: cp-mg5-002-3, label: "Read the walls procedure", type: read }
          - { id: cp-mg5-002-4, label: "Complete \"Walls that stop the player\" in Game Studio", type: lab }
          - { id: cp-mg5-002-5, label: "Add a doorway to the wall in Game Studio and walk through it", type: lab }
          - { id: cp-mg5-002-6, label: "Work through the merging example", type: example }
          - { id: cp-mg5-002-7, label: "Work through the doorway example", type: example }
          - { id: cp-mg5-002-8, label: "Attempt the invisible-wall challenge", type: challenge }

      # ───────────────────────────────────────────────────────────── 5.3
      - order: 3
        id: mg5-003
        slug: maps-from-tiled
        title: Maps from Tiled and Tile Mapper
        subtitle: Bring in levels made in other editors, and edit them round trip.
        tags: [game-studio, tilemaps, tiled]
        aliases: tiled tmx tmj import gid firstgid flip flags tile mapper send to game studio
        timeToComplete: 20
        coreConcept: >-
          Levels are often made in a dedicated map editor. Game Studio imports Tiled's .tmx and .tmj files, turning their
          tilesets and layers into its own; Tile Mapper sends maps straight in and edits them again.
        prerequisites: [mg5-002]
        nextLesson: mg6-001
        hook:
          question: >-
            Kenney's Tiny Dungeon comes with a sample level made in Tiled, a free map editor used by thousands of games. Can
            you use it as it is, rather than repainting it?
          realWorldContext: >-
            Tiled's file format is read by Godot, Phaser, Unity plugins and many more. Being able to bring maps in (and send
            them out) means a level is not locked into one tool.
        intuition:
          prose:
            - >-
              The sample map has three layers and one tileset, the same 192 × 176 sheet. Import it from Starter art ›
              Tiny Dungeon: Game Studio adds the sheet as an image, makes a tileset, and adds one TileMapLayer per layer.
            - >-
              Tiled numbers tiles from 1, not 0, and 0 means an empty cell. So Tiled's tile 41 is Game Studio's tile 40,
              the brick wall. Each tileset starts at a **firstgid**; tile = gid − firstgid.
            - >-
              Before reading on, predict: how can Tiled store a tile flipped left to right, in one number? It sets the
              number's highest bit. The top three bits mean flipped across, flipped down, and flipped diagonally.
            - >-
              Game Studio keeps those flips, so a mirrored torch still faces the right way. Tiles given a solid (or collides)
              property in Tiled come in as solid tiles in the tileset.
            - >-
              Tile Mapper, the app's own map editor, connects directly: TileMap panel › New map… opens it, and Send to Game
              Studio puts the map back in, repainting the same layers each time.
          callouts:
            - type: procedure
              title: "Procedure: Bring in a map"
              body: |-
                Step 1. From Tiled: Import… in Files, choosing the .tmx or .tmj (and its tileset files and image together).
                Step 2. Or from the starter art: Starter art › the pack › Import beside its Tiled map.
                Step 3. Or from Tile Mapper: TileMap panel › New map… (or Edit in Tile Mapper), paint, then Send to Game Studio.
                Step 4. Check the layers in the scene tree, and the solid tiles in the TileMap panel.
            - type: warning
              title: The image must come too
              body: >-
                A Tiled map names its tileset's image. Import the image with it (or first), or Game Studio says which image
                it is missing and imports nothing.
          visualizations:
            - id: GameStudioTask
              title: A map from Tiled
              props: { task: tiled-map, lesson: mg5-003, checkpoint: cp-mg5-003-4 }
        math:
          prose:
            - >-
              **Under the hood (optional).** Tiled stores each cell as a 32-bit global tile id. The low bits are the gid;
              bit 31 ($2^{31}$) is flipped across, bit 30 ($2^{30}$) flipped down, bit 29 ($2^{29}$) flipped diagonally.
            - >-
              To read a cell, mask off the flags: $\text{gid} = n \,\&\, (2^{29} - 1)$, then $\text{tile} = \text{gid} - \text{firstgid}$.
              For $n = 2^{31} + 41$ with firstgid 1: gid 41, tile 40, flipped across.
            - >-
              A layer's data is row-major, like a tileset: cell $(x, y)$ is entry $y W + x$ for a map $W$ cells wide, the
              same numbering as in lesson 5.1.
          equations: []
          callouts: []
          visualizations: []
        rigor:
          prose:
            - >-
              Formally, each cell value $n$ decodes to $(\text{gid}, h, v, d)$ with $h = \lfloor n / 2^{31} \rfloor$, and so on;
              the gid selects the tileset with the largest firstgid not above it.
            - >-
              The invariant through import is the picture: every cell shows the same tile, flipped the same way, at the same
              place. Game Studio keeps the flags, so a round trip through Tiled changes nothing.
            - >-
              The diagonal flip swaps x and y; combined with the other two, the three flags give all eight ways to turn and
              mirror a square tile.
            - >-
              Bit packing like this appeared in collision layers (lesson 2.5): small facts stored as bits of one number,
              read with AND.
          callouts: []
          visualizations: []
        examples:
          - id: mg5-003-ex1
            title: From Tiled's number
            difficulty: easy
            problem: A cell holds gid 41 and the tileset's firstgid is 1. Which Game Studio tile is it?
            steps:
              - expression: '41 - 1 = 40'
                annotation: Tiled counts from firstgid; Game Studio from 0.
                strategyTitle: "Step 1: Subtract firstgid"
            answer: Tile 40, the brick wall.
          - id: mg5-003-ex2
            title: A flipped tile
            difficulty: medium
            problem: A cell holds 2147483689 (that is 2³¹ + 41). What is it?
            steps:
              - expression: '2147483689 - 2^{31} = 41'
                annotation: "The top bit is set: flipped across."
                strategyTitle: "Step 1: Remove the flag"
              - expression: '41 - 1 = 40'
                annotation: Then subtract firstgid.
                strategyTitle: "Step 2: The tile"
            answer: Tile 40, mirrored left to right.
          - id: mg5-003-ex3
            title: Two tilesets
            difficulty: hard
            problem: A map has tilesets starting at firstgid 1 (132 tiles) and 133. A cell holds gid 140. Which tileset and tile?
            steps:
              - expression: '140 \geq 133'
                annotation: The tileset with the largest firstgid not above the gid.
                strategyTitle: "Step 1: Pick the tileset"
              - expression: '140 - 133 = 7'
                annotation: Subtract that tileset's firstgid.
                strategyTitle: "Step 2: The tile"
            answer: Tile 7 of the second tileset.
        challenges:
          - id: mg5-003-ch1
            title: Empty cell
            difficulty: easy
            problem: What does gid 0 mean in Tiled?
            hint: Tiled counts tiles from 1.
            answer: An empty cell, with no tile.
            walkthrough:
              - expression: '0'
                annotation: Tiles start at firstgid, at least 1.
          - id: mg5-003-ch2
            title: Which entry?
            difficulty: medium
            problem: A map 30 cells wide. Which entry of a layer's data is cell (4, 2)?
            hint: Row-major.
            answer: Entry 64, because 2 × 30 + 4 = 64.
            walkthrough: []
          - id: mg5-003-ch3
            title: Debug the failed import
            difficulty: hard
            problem: Importing a .tmx alone says the tileset uses an image that is not in the project. What should the learner do?
            hint: What does the map refer to?
            answer: Import the tileset's image too (with the map, or before it), then import the map again.
            walkthrough: []
        semantics:
          core:
            - { symbol: "Tiled", meaning: "A free map editor whose .tmx and .tmj files many engines read." }
            - { symbol: "gid", meaning: "Tiled's global tile number: tileset's firstgid plus the tile, 0 for empty." }
            - { symbol: "firstgid", meaning: "The gid of a tileset's tile 0." }
            - { symbol: "flip flags", meaning: "The top three bits of a cell: flipped across, down, diagonally." }
            - { symbol: "Send to Game Studio", meaning: "Tile Mapper's way to put a map into the open project." }
          rulesOfThumb:
            - Import the map's images with it.
            - Subtract firstgid to get Game Studio's tile.
            - Mask off the flags before reading a gid.
            - Edit maps in Tile Mapper, or Tiled, and send them back rather than repainting.
        misconceptions:
          - falseBelief: Tiled's tile numbers are the same as Game Studio's.
            whyStudentsThinkIt: Both number the same sheet.
            correctionExample: Tiled's 41 is Game Studio's 40 with firstgid 1.
            contrastCase: Tiled reserves 0 for empty, so its numbering starts at 1.
          - falseBelief: A flipped tile needs a separate flipped picture in the sheet.
            whyStudentsThinkIt: The picture looks different.
            correctionExample: Gid 2³¹ + 41 is the same tile 40, drawn mirrored.
            contrastCase: Three bits give all eight orientations of one picture.
        transferPrompts:
          - situation: A designer builds levels in Tiled while you program in Game Studio.
            competingTechniques:
              - Import their .tmx files
              - Rebuild each level by hand
            whyThisTechniqueWins: Import keeps the levels exactly, and can be repeated when they change.
          - situation: You want autotiled terrain in a level.
            competingTechniques:
              - Paint it in Tile Mapper and Send to Game Studio
              - Pick each edge tile by hand
            whyThisTechniqueWins: Tile Mapper's autotiling picks the joining tiles for you.
        debugging:
          - commonError: Choosing only the .tmx when it uses a separate .tsx tileset file.
            symptom: An error naming the .tsx it needs.
            whyItHappened: The map refers to the tileset file instead of including it.
            repairStrategy: Select the .tmx and its .tsx files together in Import….
          - commonError: Editing the imported layers and then re-importing.
            symptom: Your changes are gone, or the layers are doubled.
            whyItHappened: Import adds the map's layers again.
            repairStrategy: Edit in one place; for round trips use Tile Mapper's Send, which repaints the same layers.
        mastery:
          targetLevel: 3
          solveIndependently: Import a Tiled map, or send one from Tile Mapper.
          explainVerbally: Explain gids, firstgid and flip flags.
          detectIncorrectApplication: Diagnose a failed import.
          transferToUnfamiliar: Decode any cell value, with several tilesets.
        assessment:
          questions:
            - id: mg5-003-assess-1
              type: choice
              text: Gid 41, firstgid 1. Which Game Studio tile?
              options: ["40", "41", "42", "0"]
              answer: "40"
              hint: Subtract firstgid.
        quiz:
          - id: mg5-003-quiz-1
            type: choice
            text: What does gid 0 mean?
            options: ["An empty cell", "Tile 0", "A flipped tile", "The first tileset"]
            answer: "An empty cell"
            hints:
              - Tiled counts from 1.
            reviewSection: "Intuition — the firstgid paragraph"
          - id: mg5-003-quiz-2
            type: choice
            text: Which bit means flipped across?
            options: ["2³¹", "2²⁹", "2⁰", "2¹⁶"]
            answer: "2³¹"
            hints:
              - The highest of the three.
            reviewSection: "Under the hood — the flags"
          - id: mg5-003-quiz-3
            type: choice
            text: Firstgids 1 and 133; gid 140. Which tile?
            options: ["Tile 7 of the second tileset", "Tile 139 of the first", "Tile 140", "Tile 7 of the first"]
            answer: "Tile 7 of the second tileset"
            hints:
              - Largest firstgid not above the gid.
            reviewSection: "Examples — Two tilesets"
          - id: mg5-003-quiz-4
            type: choice
            text: What must come with a Tiled map when you import it?
            options: ["Its tileset images (and .tsx files)", "A script", "A camera", "Nothing"]
            answer: "Its tileset images (and .tsx files)"
            hints:
              - The map only names them.
            reviewSection: "Intuition — Warning: the image must come too"
          - id: mg5-003-quiz-5
            type: choice
            text: Which of these does NOT bring a map into Game Studio?
            options: ["Copying a screenshot of it", "Import… with the .tmx", "Starter art › Import", "Tile Mapper › Send to Game Studio"]
            answer: "Copying a screenshot of it"
            hints:
              - A picture has no cells.
            reviewSection: "Intuition — Procedure"
          - id: mg5-003-quiz-6
            type: choice
            text: A map 20 wide. Which data entry is cell (3, 5)?
            options: ["103", "53", "23", "100"]
            answer: "103"
            hints:
              - 5 × 20 + 3.
            reviewSection: "Under the hood — row-major"
        checkpoints:
          - { id: cp-mg5-003-1, label: "Read what an import makes", type: read }
          - { id: cp-mg5-003-2, label: "Read gids and flip flags", type: read }
          - { id: cp-mg5-003-3, label: "Read the ways to bring in a map", type: read }
          - { id: cp-mg5-003-4, label: "Complete \"A map from Tiled\" in Game Studio", type: lab }
          - { id: cp-mg5-003-5, label: "Make a map in Tile Mapper and send it to Game Studio", type: lab }
          - { id: cp-mg5-003-6, label: "Work through the flipped-tile example", type: example }
          - { id: cp-mg5-003-7, label: "Work through the two-tilesets example", type: example }
          - { id: cp-mg5-003-8, label: "Attempt the failed-import challenge", type: challenge }

  # ═══════════════════════════════════════════════════════════════ Chapter 6: Scenes
  - number: 6
    slug: scenes
    lessons:
      # ───────────────────────────────────────────────────────────── 6.1
      - order: 1
        id: mg6-001
        slug: scenes-inside-scenes
        title: Scenes Inside Scenes
        subtitle: Make a coin once, use it many times, and change every copy at once.
        tags: [game-studio, scenes, instances]
        aliases: scene instance prefab packed scene override reuse
        timeToComplete: 25
        coreConcept: >-
          A scene can be used inside another scene as an instance. Each instance follows its source scene, so changing the
          source changes every instance; an instance can also override a property, such as its position, for itself.
        prerequisites: [mg5-003]
        nextLesson: mg6-002
        hook:
          question: >-
            A level has 40 coins. You decide they should spin and be a little bigger. Do you edit 40 coins?
          realWorldContext: >-
            Every game reuses things: enemies, pickups, doors, whole rooms. Godot calls a reusable scene a scene instance;
            Unity calls it a prefab. Building from reusable pieces is how levels stay easy to change.
        intuition:
          prose:
            - >-
              Make coin.scene: an Area2D root named Coin, with a Sprite2D and a CollisionShape2D. Then put three instances
              of it in main.scene at x = 400, 500 and 600.
            - >-
              Each instance saves only two things: which scene it is (scenes/coin.scene), and what it changes, its
              position. Everything else comes from coin.scene.
            - >-
              Before reading on, predict: you open coin.scene and give it a script that removes the coin when Player
              touches it. How many coins now have the script? All three: they are all coin.scene.
            - >-
              An **override** is a property an instance sets for itself. Each coin's position is an override. If one coin
              overrides its sprite's texture, it keeps its own picture while the others follow the source.
            - >-
              Instances show ⧉ in the scene tree. Their insides come from the source scene, so edit them there: open the
              source scene.
          callouts:
            - type: procedure
              title: "Procedure: Reuse a thing as a scene"
              body: |-
                Step 1. Files › + beside scenes/: choose the root type (Area2D for a coin), and name the scene.
                Step 2. Build the thing in its own scene: picture, shape, script on the root.
                Step 3. Open the level, and press ⧉ beside the scene in Files to add an instance; place it.
                Step 4. Add as many as you need; change the source scene to change them all.
                Step 5. For one-off differences, change a property on that instance only (an override).
            - type: warning
              title: Edit the source, not a copy
              body: >-
                Changing something inside one instance is an override for that coin alone. To change every coin, open
                coin.scene and change it there.
          visualizations:
            - id: GameStudioTask
              title: One coin, many times
              props: { task: scene-instances, lesson: mg6-001, checkpoint: cp-mg6-001-4 }
        math:
          prose:
            - >-
              **Under the hood (optional).** When a scene runs, each instance is expanded: the source scene's tree is copied
              in, then the instance's overrides are applied on top. Overrides are keyed by a path inside the instance,
              such as Sprite.texture.
            - >-
              So the value a coin shows for a property is the override if there is one, else the source's value: an
              override wins. With 40 coins and 1 override, changing the source changes 39 of them for that property.
            - >-
              Storing instances this way is compact: a coin instance saves a path and a position, about 60 characters,
              while a full copy of the coin would save every node and property. And nothing can drift out of step.
          equations: []
          callouts: []
          visualizations: []
        rigor:
          prose:
            - >-
              Formally, an instance is a function of its source: expand(source, overrides) = source with each override's
              property replaced. Expansion happens whenever the scene is built, so it always reflects the current source.
            - >-
              The invariant is the source's single definition: there is one coin, and many references to it.
            - >-
              Picture the scene tree with some branches drawn faintly: those are borrowed from source scenes, and only the
              overridden leaves are drawn in the instance's own ink.
            - >-
              Instances can contain instances (a room scene with coin instances inside), and the same expansion applies
              recursively; a scene that contains itself would never finish, so that is refused.
          callouts: []
          visualizations: []
        examples:
          - id: mg6-001-ex1
            title: What an instance saves
            difficulty: easy
            problem: A coin instance at (500, 389). What does main.scene save for it?
            steps:
              - expression: '\text{instance: scenes/coin.scene},\ \text{position: } (500, 389)'
                annotation: The source scene's path, and its own position.
                strategyTitle: "Step 1: Path and overrides"
            answer: The path of coin.scene and its position override; everything else comes from coin.scene.
          - id: mg6-001-ex2
            title: Who follows the change?
            difficulty: medium
            problem: Three coins; coin 2 overrides its sprite's texture. You change the texture in coin.scene. Which coins change?
            steps:
              - expression: '\text{coins 1, 3: no override} \Rightarrow \text{follow the source}'
                annotation: They show the source's new texture.
                strategyTitle: "Step 1: Coins without an override"
              - expression: '\text{coin 2: override wins}'
                annotation: It keeps its own texture.
                strategyTitle: "Step 2: The overridden coin"
            answer: Coins 1 and 3 change; coin 2 keeps its own picture.
          - id: mg6-001-ex3
            title: A room of coins
            difficulty: hard
            problem: room.scene contains 5 coin instances; the level contains 4 room instances. How many coins, and how many change when coin.scene changes?
            steps:
              - expression: '4 \times 5 = 20'
                annotation: Each room expands to 5 coins.
                strategyTitle: "Step 1: Count"
              - expression: '20'
                annotation: All of them, unless some override the changed property.
                strategyTitle: "Step 2: Who follows"
            answer: 20 coins, all of which follow coin.scene except for overridden properties.
        challenges:
          - id: mg6-001-ch1
            title: Bigger coins
            difficulty: easy
            problem: How do you make all 40 coins 20% bigger at once?
            hint: Where does the coin's picture live?
            answer: Open coin.scene and set its sprite's scale to 1.2; every instance follows.
            walkthrough:
              - expression: '\text{edit coin.scene}'
                annotation: One change in the source.
          - id: mg6-001-ch2
            title: One gold coin
            difficulty: medium
            problem: One coin should be gold while the rest stay as they are. How?
            hint: An override is for one instance.
            answer: Change that instance's sprite texture only; it becomes an override for that coin.
            walkthrough: []
          - id: mg6-001-ch3
            title: Debug the stubborn coin
            difficulty: hard
            problem: After changing coin.scene's picture, one coin still shows the old one. Why?
            hint: What wins over the source?
            answer: That coin has an override for its picture; remove the override (or set it to the new picture).
            walkthrough: []
        semantics:
          core:
            - { symbol: "instance", meaning: "A use of a scene inside another; it follows its source." }
            - { symbol: "source scene", meaning: "The scene an instance is made from." }
            - { symbol: "override", meaning: "A property an instance sets for itself; it wins over the source." }
            - { symbol: "expand", meaning: "Build the full tree from the source plus overrides." }
          rulesOfThumb:
            - Anything used twice deserves its own scene.
            - Edit the source to change every copy.
            - Override only what really differs.
            - Put the script on the source scene's root.
        misconceptions:
          - falseBelief: An instance is a copy that stops following the source.
            whyStudentsThinkIt: Copy and paste works that way.
            correctionExample: Adding a script to coin.scene gives it to all three coins at once.
            contrastCase: Only overridden properties stop following.
          - falseBelief: Every property of an instance is an override.
            whyStudentsThinkIt: Each coin shows all its properties in the Inspector.
            correctionExample: A coin saves only its position; its picture, shape and script come from coin.scene.
            contrastCase: Only properties changed on the instance are saved as overrides.
        transferPrompts:
          - situation: A level needs 12 identical enemies.
            competingTechniques:
              - An enemy scene with 12 instances
              - Duplicate one enemy 11 times
            whyThisTechniqueWins: The instances all follow one scene, so fixing the enemy fixes all 12.
          - situation: Every room of a dungeon shares a door design.
            competingTechniques:
              - A door scene instanced in each room
              - Building the door in each room
            whyThisTechniqueWins: The door changes in one place for every room.
        debugging:
          - commonError: Editing inside an instance to change every coin.
            symptom: Only one coin changes.
            whyItHappened: Changes on an instance are overrides for it alone.
            repairStrategy: Open the source scene and make the change there.
          - commonError: The scene's root is the wrong type.
            symptom: The coin cannot notice the player.
            whyItHappened: A Node2D root has no bodyEntered; the coin needs an Area2D root.
            repairStrategy: Make the scene again with Area2D as its root.
        mastery:
          targetLevel: 3
          solveIndependently: Make a scene and use it as many instances.
          explainVerbally: Explain what an instance saves and why overrides win.
          detectIncorrectApplication: Spot an override hiding a source change.
          transferToUnfamiliar: Plan nested scenes for rooms and their contents.
        assessment:
          questions:
            - id: mg6-001-assess-1
              type: choice
              text: Three coin instances; you add a script to coin.scene. How many coins have it?
              options: ["All three", "None", "Only the first", "Only new ones"]
              answer: "All three"
              hint: They are all coin.scene.
        quiz:
          - id: mg6-001-quiz-1
            type: choice
            text: What does an instance save?
            options: ["Its source scene and its overrides", "A full copy of the scene", "Only its name", "Nothing"]
            answer: "Its source scene and its overrides"
            hints:
              - The rest comes from the source.
            reviewSection: "Intuition — the instance paragraph"
          - id: mg6-001-quiz-2
            type: choice
            text: When an instance overrides a property, what happens when the source changes it?
            options: ["The override wins", "The source wins", "Both are averaged", "It is an error"]
            answer: "The override wins"
            hints:
              - Overrides are applied on top.
            reviewSection: "Under the hood — expansion"
          - id: mg6-001-quiz-3
            type: choice
            text: How do you change every coin?
            options: ["Edit coin.scene", "Edit one instance", "Edit main.scene's root", "Duplicate a coin"]
            answer: "Edit coin.scene"
            hints:
              - The source.
            reviewSection: "Intuition — Warning: edit the source"
          - id: mg6-001-quiz-4
            type: choice
            text: 4 rooms, each with 5 coin instances. How many coins?
            options: ["20", "9", "5", "4"]
            answer: "20"
            hints:
              - 4 × 5.
            reviewSection: "Examples — A room of coins"
          - id: mg6-001-quiz-5
            type: choice
            text: Which of these is NOT an override?
            options: ["A coin's picture set in coin.scene", "One coin's position", "One coin's picture changed on the instance", "One coin's scale changed on the instance"]
            answer: "A coin's picture set in coin.scene"
            hints:
              - That is the source's value.
            reviewSection: "Misconceptions — overrides"
          - id: mg6-001-quiz-6
            type: choice
            text: What root does a coin scene need to notice the player?
            options: ["Area2D", "Node2D", "Sprite2D", "Label"]
            answer: "Area2D"
            hints:
              - It notices bodies.
            reviewSection: "Debugging — the root type"
        checkpoints:
          - { id: cp-mg6-001-1, label: "Read what an instance saves", type: read }
          - { id: cp-mg6-001-2, label: "Read what an override is", type: read }
          - { id: cp-mg6-001-3, label: "Read the reuse procedure", type: read }
          - { id: cp-mg6-001-4, label: "Complete \"One coin, many times\" in Game Studio", type: lab }
          - { id: cp-mg6-001-5, label: "Make one gold coin with an override in Game Studio", type: lab }
          - { id: cp-mg6-001-6, label: "Work through the who-follows example", type: example }
          - { id: cp-mg6-001-7, label: "Work through the room-of-coins example", type: example }
          - { id: cp-mg6-001-8, label: "Attempt the stubborn-coin challenge", type: challenge }

      # ───────────────────────────────────────────────────────────── 6.2
      - order: 2
        id: mg6-002
        slug: making-things-while-running
        title: Making Things While the Game Runs
        subtitle: A gun that fires bullets, each a new copy of a scene.
        tags: [game-studio, scenes, spawning]
        aliases: instantiate addchild spawn bullets cooldown queuefree lifetime
        timeToComplete: 25
        coreConcept: >-
          scene.instantiate(path) makes a new copy of a scene while the game runs; addChild puts it in the game. A
          cooldown timer limits how often it happens, and each copy removes itself when its job is done.
        prerequisites: [mg6-001]
        nextLesson: mg6-003
        hook:
          question: >-
            A gun fires while Space is held. You cannot place bullets in the editor, because nobody knows when they will be
            fired. Where do they come from?
          realWorldContext: >-
            Bullets, particles, enemies arriving in waves, pickups dropped by enemies: games create things as they play.
            Spawning from a scene, with a limit on how often, is the standard pattern.
        intuition:
          prose:
            - >-
              bullet.scene is an Area2D with a picture, a shape, and a script that moves it right at 400 pixels a second
              and removes it after 1.5 seconds. So a bullet travels 400 × 1.5 = 600 pixels, then is gone.
            - >-
              When Space is pressed, Player makes one: `const b = scene.instantiate('scenes/bullet.scene')`, sets
              `b.position` just right of itself, and `scene.root.addChild(b)`. Until it is added, it is not in the game.
            - >-
              Before reading on, predict: with a cooldown of 0.25 seconds while Space is held, how many bullets are flying
              at once? Four a second, each living 1.5 seconds: about 6.
            - >-
              The **cooldown** is a timer counting down by dt. Fire only when it is at or below 0, then set it back to 0.25.
              That limits the rate whatever the frame rate.
            - >-
              Each bullet removes itself with queueFree when its life runs out or it hits something, so they do not pile up
              forever.
          callouts:
            - type: procedure
              title: "Procedure: Spawn things from a scene"
              body: |-
                Step 1. Build the thing as its own scene, with a script that moves it and removes it (queueFree) when done.
                Step 2. To make one: const b = scene.instantiate('scenes/bullet.scene').
                Step 3. Place it: b.position = this.position.add({ x: 20, y: 0 }).
                Step 4. Add it to the game: scene.root.addChild(b).
                Step 5. Limit the rate with a cooldown that counts down by dt.
            - type: warning
              title: Things that never leave
              body: >-
                A bullet that never calls queueFree flies off the screen forever. After a minute of firing there are
                hundreds, and the game slows down. Give every spawned thing a way to remove itself.
          visualizations:
            - id: GameStudioTask
              title: A gun that fires
              props: { task: spawn-bullets, lesson: mg6-002, checkpoint: cp-mg6-002-4 }
        math:
          prose:
            - >-
              **Under the hood (optional).** With a cooldown $c$ seconds, the fire rate is $1/c$ per second: $c = 0.25$
              gives 4. Each bullet lives $L$ seconds, so in a steady stream the number alive is about rate × lifetime,
              $L / c = 1.5 / 0.25 = 6$. This is Little's law: items in a system = arrival rate × time each spends there.
            - >-
              The range is speed × lifetime: $400 \times 1.5 = 600$ px. To reach the far side of a 960-pixel screen from
              its middle, a bullet needs $480 / 400 = 1.2$ s of life.
            - >-
              Counting the cooldown down by $dt$ (rather than by frames) keeps the rate at $1/c$ on every screen, the same
              reasoning as speed × dt in lesson 1.3.
          equations: []
          callouts: []
          visualizations: []
        rigor:
          prose:
            - >-
              Formally, with cooldown $c$ and Space held from $t = 0$, shots occur at $t = 0, c, 2c, \ldots$, rounded up to
              the next physics or frame step; the long-run rate is exactly $1/c$.
            - >-
              The invariant is the cap: however long Space is held, no more than $\lceil L/c \rceil$ bullets exist at once.
            - >-
              Picture each bullet as a segment of length $L$ on a timeline, starting every $c$: the number of segments over
              any instant is about $L/c$.
            - >-
              Games that spawn thousands of things reuse them instead of making and freeing each one ("object pools"); the
              rate and lifetime arithmetic is the same.
          callouts: []
          visualizations: []
        examples:
          - id: mg6-002-ex1
            title: Fire rate
            difficulty: easy
            problem: A cooldown of 0.25 s. How many shots a second?
            steps:
              - expression: '\tfrac{1}{0.25} = 4'
                annotation: One shot per cooldown.
                strategyTitle: "Step 1: One over the cooldown"
            answer: 4 shots a second.
          - id: mg6-002-ex2
            title: Bullets in the air
            difficulty: medium
            problem: 4 shots a second, each bullet living 1.5 s. How many are flying at once?
            steps:
              - expression: '4 \times 1.5 = 6'
                annotation: Rate times lifetime.
                strategyTitle: "Step 1: Little's law"
            answer: About 6 bullets at once.
          - id: mg6-002-ex3
            title: Choosing a lifetime
            difficulty: hard
            problem: Bullets fly at 400 px/s and should just leave a 960-wide screen when fired from its middle. What lifetime?
            steps:
              - expression: '\tfrac{960}{2} = 480\ \text{px to the edge}'
                annotation: From the middle to the edge.
                strategyTitle: "Step 1: Distance"
              - expression: '\tfrac{480}{400} = 1.2\ \text{s}'
                annotation: Distance ÷ speed.
                strategyTitle: "Step 2: Time"
            answer: A lifetime of 1.2 s (a little more, to be safe).
        challenges:
          - id: mg6-002-ch1
            title: Faster gun
            difficulty: easy
            problem: What cooldown gives 10 shots a second?
            hint: One over the rate.
            answer: 0.1 s.
            walkthrough:
              - expression: '\tfrac{1}{10} = 0.1'
                annotation: Seconds per shot.
          - id: mg6-002-ch2
            title: Range
            difficulty: medium
            problem: Bullets at 300 px/s living 2 s. How far do they go?
            hint: Speed × time.
            answer: 600 pixels.
            walkthrough: []
          - id: mg6-002-ch3
            title: Debug the invisible bullets
            difficulty: hard
            problem: A learner's code instantiates a bullet and sets its position when Space is pressed, but no bullet appears. What is missing?
            hint: When is a new node part of the game?
            answer: "It was never added: call scene.root.addChild(b) after setting its position."
            walkthrough: []
        semantics:
          core:
            - { symbol: "scene.instantiate(path)", meaning: "A new copy of a scene, not yet in the game." }
            - { symbol: "addChild(node)", meaning: "Puts a node under another, into the running game; its ready() runs." }
            - { symbol: "cooldown", meaning: "A timer that must reach 0 before the next shot; it limits the rate." }
            - { symbol: "rate × lifetime", meaning: "How many spawned things are alive at once." }
          rulesOfThumb:
            - Every spawned thing needs a way to remove itself.
            - Set the position before adding, so it never appears at (0, 0) for a frame.
            - Count timers down by dt.
            - Keep the spawned thing's behaviour in its own scene's script.
        misconceptions:
          - falseBelief: instantiate puts the copy straight into the game.
            whyStudentsThinkIt: The copy exists as soon as it is made.
            correctionExample: Without addChild, the bullet is never drawn or moved.
            contrastCase: addChild is what attaches it to the running tree.
          - falseBelief: Holding Space with isPressed fires once per frame no matter what.
            whyStudentsThinkIt: isPressed is true every frame.
            correctionExample: With a 0.25 s cooldown, it fires 4 times a second, not 60.
            contrastCase: The cooldown decides the rate.
        transferPrompts:
          - situation: An enemy should drop a coin when it dies.
            competingTechniques:
              - Instantiate coin.scene at the enemy's position and add it
              - Hide a coin inside every enemy
            whyThisTechniqueWins: Spawning makes coins only when needed, wherever the enemy was.
          - situation: Enemies arrive every 3 seconds.
            competingTechniques:
              - A spawner with a 3 s timer counting down by dt
              - Placing 100 enemies off screen
            whyThisTechniqueWins: The spawner makes exactly as many as needed, as long as the game lasts.
        debugging:
          - commonError: Adding the bullet as a child of Player.
            symptom: Bullets move with the player and turn when it turns.
            whyItHappened: A child's position is relative to its parent.
            repairStrategy: Add it to scene.root, at the player's position.
          - commonError: Resetting the cooldown every frame.
            symptom: The gun never fires again after the first shot.
            whyItHappened: The timer is set back to 0.25 before it reaches 0.
            repairStrategy: Set it only when you fire.
        mastery:
          targetLevel: 3
          solveIndependently: Spawn things from a scene at a controlled rate.
          explainVerbally: Explain instantiate, addChild and the cooldown.
          detectIncorrectApplication: Spot spawned things that never leave.
          transferToUnfamiliar: Size rates and lifetimes with rate × lifetime.
        assessment:
          questions:
            - id: mg6-002-assess-1
              type: choice
              text: Cooldown 0.25 s, lifetime 1.5 s. About how many bullets fly at once?
              options: ["6", "4", "1.5", "60"]
              answer: "6"
              hint: Rate × lifetime.
        quiz:
          - id: mg6-002-quiz-1
            type: choice
            text: What makes a new copy of a scene while running?
            options: ["scene.instantiate(path)", "scene.change(path)", "queueFree()", "duplicate in the editor"]
            answer: "scene.instantiate(path)"
            hints:
              - scene.change replaces the whole scene.
            reviewSection: "Intuition — the instantiate paragraph"
          - id: mg6-002-quiz-2
            type: choice
            text: What puts the copy into the game?
            options: ["addChild", "instantiate alone", "ready()", "position"]
            answer: "addChild"
            hints:
              - Until added, it is not in the game.
            reviewSection: "Misconceptions — instantiate"
          - id: mg6-002-quiz-3
            type: choice
            text: A 0.2 s cooldown. Shots a second?
            options: ["5", "2", "20", "0.2"]
            answer: "5"
            hints:
              - 1 ÷ 0.2.
            reviewSection: "Under the hood — rate"
          - id: mg6-002-quiz-4
            type: choice
            text: Speed 400, lifetime 1.5 s. Range?
            options: ["600 px", "400 px", "267 px", "1.5 px"]
            answer: "600 px"
            hints:
              - Speed × time.
            reviewSection: "Under the hood — range"
          - id: mg6-002-quiz-5
            type: choice
            text: Which of these is NOT a way a bullet should leave the game?
            options: ["Flying off the screen forever", "queueFree when its life runs out", "queueFree when it hits something", "Both queueFree cases"]
            answer: "Flying off the screen forever"
            hints:
              - It must remove itself.
            reviewSection: "Intuition — Warning: things that never leave"
          - id: mg6-002-quiz-6
            type: choice
            text: Why add bullets to scene.root, not Player?
            options: ["So they do not move with the player", "So they are faster", "So they can be freed", "It does not matter"]
            answer: "So they do not move with the player"
            hints:
              - A child moves with its parent.
            reviewSection: "Debugging — child of Player"
        checkpoints:
          - { id: cp-mg6-002-1, label: "Read how bullets are made", type: read }
          - { id: cp-mg6-002-2, label: "Read how the cooldown limits the rate", type: read }
          - { id: cp-mg6-002-3, label: "Read the spawning procedure", type: read }
          - { id: cp-mg6-002-4, label: "Complete \"A gun that fires\" in Game Studio", type: lab }
          - { id: cp-mg6-002-5, label: "Change the cooldown to 0.1 s in Game Studio and count the bullets", type: lab }
          - { id: cp-mg6-002-6, label: "Work through the bullets-in-the-air example", type: example }
          - { id: cp-mg6-002-7, label: "Work through the lifetime example", type: example }
          - { id: cp-mg6-002-8, label: "Attempt the invisible-bullets challenge", type: challenge }

      # ───────────────────────────────────────────────────────────── 6.3
      - order: 3
        id: mg6-003
        slug: groups
        title: Groups
        subtitle: Bullets that hit only enemies, by asking what group a body is in.
        tags: [game-studio, scenes, groups]
        aliases: groups addtogroup isingroup getnodesingroup callgroup tags
        timeToComplete: 20
        coreConcept: >-
          A group is a label any node can carry, such as enemies. Code asks body.isInGroup('enemies') instead of checking
          names, and scene.getNodesInGroup or callGroup reach every member at once.
        prerequisites: [mg6-002]
        nextLesson: mg6-004
        hook:
          question: >-
            Bullets should destroy enemies but not the floor or the player. There are two enemies now, and twenty later,
            named Enemy, Enemy2, Bat, Ghost. How does a bullet know what to hit?
          realWorldContext: >-
            Games sort things into kinds: enemies, pickups, hazards, interactables. Groups (tags in Unity) let code talk
            about a kind without knowing every name.
        intuition:
          prose:
            - >-
              Enemy and Enemy2 are in the group enemies: Inspector › Groups, type enemies, press Enter, for each.
            - >-
              In bullet.js's bodyEntered: `if (body.isInGroup('enemies')) body.queueFree()`, then the bullet removes itself.
              The floor is not in the group, so it survives; the bullet still stops at it.
            - >-
              Before reading on, predict: you add a Bat and put it in enemies. Do you change the bullet's code? No: the
              bullet asks about the group, not the name.
            - >-
              Groups also reach many at once. `scene.getNodesInGroup('enemies')` gives every member, and
              `scene.callGroup('enemies', 'freeze')` calls freeze() on each that has it.
            - >-
              A node can be in several groups (enemies and flying), and a group can hold any kind of node.
          callouts:
            - type: procedure
              title: "Procedure: Act on a kind of thing"
              body: |-
                Step 1. Choose a group name for the kind (enemies).
                Step 2. Add each member to it: Inspector › Groups (or this.addToGroup in a script).
                Step 3. Where it matters, ask body.isInGroup('enemies') instead of checking names.
                Step 4. To reach them all, use scene.getNodesInGroup or scene.callGroup.
            - type: warning
              title: Group names are exact
              body: >-
                enemies and Enemies are different groups. A typo makes isInGroup quietly false, so nothing happens and no
                error says why. Copy the name.
          visualizations:
            - id: GameStudioTask
              title: Bullets that hit only enemies
              props: { task: enemy-group, lesson: mg6-003, checkpoint: cp-mg6-003-4 }
        math:
          prose:
            - >-
              **Under the hood (optional).** Each node keeps a set of group names. isInGroup is a set membership test,
              $g \in G_n$; adding is $G_n \leftarrow G_n \cup \{g\}$. Sets make the test take the same time however many
              groups there are.
            - >-
              getNodesInGroup walks the tree and keeps the nodes whose sets contain the name: about one test per node, so a
              scene of 500 nodes costs 500 tests. Calling it every frame is fine for small scenes; for big ones, do it when
              something changes.
            - >-
              Compared with names: a check like `name === 'Enemy' || name === 'Enemy2' || …` grows with every new enemy,
              while the group test stays one line.
          equations: []
          callouts: []
          visualizations: []
        rigor:
          prose:
            - >-
              Formally, a group is the set $\{n : g \in G_n\}$ of nodes carrying name $g$. Group operations are set
              operations: membership, union (several groups), intersection (nodes in both).
            - >-
              The invariant is the kind, not the identity: code written against enemies keeps working as enemies are added,
              renamed or removed.
            - >-
              Picture the nodes as dots and each group as a coloured outline round some of them; outlines can overlap.
            - >-
              Groups pair with collision layers: layers decide what physically touches; groups decide what a touch means.
          callouts: []
          visualizations: []
        examples:
          - id: mg6-003-ex1
            title: What survives a hit
            difficulty: easy
            problem: A bullet hits the floor (no groups) and later Enemy (in enemies). What is removed each time?
            steps:
              - expression: '\text{floor: bullet only}'
                annotation: The floor is not in enemies, so only the bullet goes.
                strategyTitle: "Step 1: The floor"
              - expression: '\text{Enemy: Enemy and the bullet}'
                annotation: Enemy is in the group.
                strategyTitle: "Step 2: The enemy"
            answer: The floor survives; Enemy is removed; the bullet is removed both times.
          - id: mg6-003-ex2
            title: Freeze them all
            difficulty: medium
            problem: A power-up should stop every enemy for 3 s. Which call reaches them all?
            steps:
              - expression: '\texttt{scene.callGroup("enemies", "freeze", 3)}'
                annotation: Calls freeze(3) on each member that has a freeze method.
                strategyTitle: "Step 1: Call the group"
            answer: scene.callGroup('enemies', 'freeze', 3), with each enemy's script defining freeze(seconds).
          - id: mg6-003-ex3
            title: Two groups
            difficulty: hard
            problem: Arrows should hit enemies that are not flying. Enemies carry enemies; bats also carry flying. Write the test.
            steps:
              - expression: '\text{isInGroup(enemies)} \wedge \neg\,\text{isInGroup(flying)}'
                annotation: In one group and not the other.
                strategyTitle: "Step 1: Combine the tests"
            answer: if (body.isInGroup('enemies') && !body.isInGroup('flying')) body.queueFree().
        challenges:
          - id: mg6-003-ch1
            title: A new enemy
            difficulty: easy
            problem: You add a Ghost. What makes bullets hit it?
            hint: The bullet asks about a group.
            answer: Add Ghost to the enemies group; no code changes.
            walkthrough:
              - expression: '\text{Groups: enemies}'
                annotation: In the Inspector.
          - id: mg6-003-ch2
            title: Count the enemies
            difficulty: medium
            problem: How does the HUD show how many enemies are left?
            hint: A group gives all its members.
            answer: Use scene.getNodesInGroup('enemies').length.
            walkthrough: []
          - id: mg6-003-ch3
            title: Debug the bullet-proof enemy
            difficulty: hard
            problem: Bullets pass enemies without removing them. bullet.js checks isInGroup('enemy'); the enemies are in "enemies". Fix it.
            hint: Exact names.
            answer: Use the same name everywhere, isInGroup('enemies').
            walkthrough: []
        semantics:
          core:
            - { symbol: "group", meaning: "A name any number of nodes can carry, standing for a kind of thing." }
            - { symbol: "isInGroup(name)", meaning: "Whether this node carries the group name." }
            - { symbol: "scene.getNodesInGroup(name)", meaning: "Every node in the group, in tree order." }
            - { symbol: "scene.callGroup(name, method, …)", meaning: "Calls the method on every member that has it." }
          rulesOfThumb:
            - Ask about kinds (groups), not names.
            - Name groups in the plural and lower case, and reuse the exact name.
            - Use layers for what touches, groups for what a touch means.
            - Put a node in as many groups as describe it.
        misconceptions:
          - falseBelief: A group is a parent node that holds its members.
            whyStudentsThinkIt: Grouping things usually means putting them together.
            correctionExample: Enemy and Enemy2 stay where they are in the tree; each just carries the name enemies.
            contrastCase: A parent changes position and drawing; a group changes nothing but membership.
          - falseBelief: A misspelt group name gives an error.
            whyStudentsThinkIt: Misspelt node paths do.
            correctionExample: isInGroup('enemy') is simply false for nodes in enemies.
            contrastCase: That silence is why group names should be copied, not retyped.
        transferPrompts:
          - situation: Pressing E should open the nearest interactable thing (chests, doors, levers).
            competingTechniques:
              - Put them in a group interactables and search it
              - Check each by name
            whyThisTechniqueWins: The group covers every kind of interactable, present and future.
          - situation: A bomb should damage every enemy within 100 px.
            competingTechniques:
              - Loop over scene.getNodesInGroup('enemies') and check distance
              - Loop over every node in the scene
            whyThisTechniqueWins: The group gives exactly the candidates, no others.
        debugging:
          - commonError: Adding the group to only one of the enemies.
            symptom: Bullets remove Enemy but pass Enemy2.
            whyItHappened: Each node joins the group separately.
            repairStrategy: Add the group to every member, or to the source scene of an enemy instance.
          - commonError: Removing the bullet before checking the group.
            symptom: Works, but code after queueFree runs on a leaving node and is easy to break.
            whyItHappened: The order hides intent.
            repairStrategy: Check and act on the body first, then remove the bullet.
        mastery:
          targetLevel: 3
          solveIndependently: Use a group to decide what a bullet hits.
          explainVerbally: Explain why groups beat name checks.
          detectIncorrectApplication: Spot mismatched group names.
          transferToUnfamiliar: Combine group tests, and reach every member.
        assessment:
          questions:
            - id: mg6-003-assess-1
              type: choice
              text: You add a Bat to enemies. What else must change for bullets to hit it?
              options: ["Nothing", "bullet.js", "The floor", "The camera"]
              answer: "Nothing"
              hint: The bullet asks about the group.
        quiz:
          - id: mg6-003-quiz-1
            type: choice
            text: How does a bullet tell an enemy from the floor?
            options: ["body.isInGroup('enemies')", "body.name === 'Floor'", "body.position", "Its collision layer only"]
            answer: "body.isInGroup('enemies')"
            hints:
              - Ask about the kind.
            reviewSection: "Intuition — the bullet paragraph"
          - id: mg6-003-quiz-2
            type: choice
            text: What does scene.callGroup('enemies', 'freeze') do?
            options: ["Calls freeze() on every enemy that has it", "Freezes the game", "Removes the group", "Calls freeze() once"]
            answer: "Calls freeze() on every enemy that has it"
            hints:
              - One call, every member.
            reviewSection: "Intuition — the reach-many paragraph"
          - id: mg6-003-quiz-3
            type: choice
            text: How many groups can a node be in?
            options: ["As many as you like", "One", "Two", "None, groups hold scenes"]
            answer: "As many as you like"
            hints:
              - enemies and flying.
            reviewSection: "Intuition — several groups"
          - id: mg6-003-quiz-4
            type: choice
            text: What happens with isInGroup('Enemies') when the group is enemies?
            options: ["It is false, silently", "An error", "It is true", "It adds the group"]
            answer: "It is false, silently"
            hints:
              - Names are exact and there is no error.
            reviewSection: "Intuition — Warning: group names are exact"
          - id: mg6-003-quiz-5
            type: choice
            text: Which of these does a group NOT do?
            options: ["Move its members together", "Let code test a node's kind", "List its members", "Call a method on its members"]
            answer: "Move its members together"
            hints:
              - That is a parent node.
            reviewSection: "Misconceptions — a group is not a parent"
          - id: mg6-003-quiz-6
            type: choice
            text: How do you count the enemies left?
            options: ["scene.getNodesInGroup('enemies').length", "Count names starting with Enemy", "A fixed number", "scene.root.children.length"]
            answer: "scene.getNodesInGroup('enemies').length"
            hints:
              - The group lists its members.
            reviewSection: "Challenges — count the enemies"
        checkpoints:
          - { id: cp-mg6-003-1, label: "Read how a bullet asks about a group", type: read }
          - { id: cp-mg6-003-2, label: "Read how to reach every member", type: read }
          - { id: cp-mg6-003-3, label: "Read the group procedure", type: read }
          - { id: cp-mg6-003-4, label: "Complete \"Bullets that hit only enemies\" in Game Studio", type: lab }
          - { id: cp-mg6-003-5, label: "Add a third enemy to the group in Game Studio and shoot it", type: lab }
          - { id: cp-mg6-003-6, label: "Work through the freeze example", type: example }
          - { id: cp-mg6-003-7, label: "Work through the two-groups example", type: example }
          - { id: cp-mg6-003-8, label: "Attempt the bullet-proof-enemy challenge", type: challenge }

      # ───────────────────────────────────────────────────────────── 6.4
      - order: 4
        id: mg6-004
        slug: signals
        title: Signals
        subtitle: A health display wired to the player with no code joining them.
        tags: [game-studio, scenes, signals]
        aliases: signals emit connect observer pattern events decoupling
        timeToComplete: 25
        coreConcept: >-
          A node emits a signal to say something happened (this.emit('healthChanged', health)); other nodes connect a
          method to it. The emitter does not know who listens, so the player and the display stay independent.
        prerequisites: [mg6-003]
        nextLesson: mg6-005
        hook:
          question: >-
            When the player is hurt, the health display must change. If the player's script updates the label itself, the
            player breaks whenever the HUD is redesigned. Is there a way for the player to just announce it?
          realWorldContext: >-
            Health bars, achievement popups, sound effects and analytics all react to the same events. Signals (events,
            observers) let each listen without the source knowing any of them.
        intuition:
          prose:
            - >-
              Player has health = 3. Spikes call Player's hurt(), which takes 1 and then says so:
              `this.emit('healthChanged', this.health)`. That is all Player does.
            - >-
              The display is a Label at HUD/Health with a method show(health) that sets its text to "Health: " + health.
            - >-
              Connect them in the editor: select Player, Inspector › Signals, signal healthChanged, node HUD/Health, method
              show, Connect. Before reading on, predict: after walking into the spikes, what does the display say?
              "Health: 2": emit called show(2).
            - >-
              Neither script names the other. Player emits whether anyone listens or not; the display only knows it has a
              show method. Add a second listener (a sound, a screen flash) and Player's code does not change.
            - >-
              A connection is saved with the scene, by node, so renaming the display does not break it.
          callouts:
            - type: procedure
              title: "Procedure: Wire a signal"
              body: |-
                Step 1. In the emitter's script, at the moment it happens: this.emit('healthChanged', this.health).
                Step 2. In the listener's script, write the method to call: show(health) { … }.
                Step 3. Select the emitter; Inspector › Signals: signal name, listener node, method; Connect.
                Step 4. Run and make it happen; the listener reacts.
            - type: warning
              title: The method must exist
              body: >-
                Connecting to a method the listener does not have is an error when the signal fires, naming the node and
                the method. Write the method first, with the same spelling.
          visualizations:
            - id: GameStudioTask
              title: A health display wired with a signal
              props: { task: health-signal, lesson: mg6-004, checkpoint: cp-mg6-004-4 }
        math:
          prose:
            - >-
              **Under the hood (optional).** Each node keeps, for each signal name, a list of connections (target node,
              method). emit(name, ...args) goes through that list and calls each target's method with the args. With $k$
              listeners, one emit makes $k$ calls; with none, it does nothing.
            - >-
              This is the **observer pattern**: a subject keeps a list of observers and notifies them; observers subscribe
              and unsubscribe. The subject depends only on the list, not on what the observers are.
            - >-
              A mistake in one listener is reported against that listener, and the others still run, so one broken popup
              cannot stop the health display.
          equations: []
          callouts: []
          visualizations: []
        rigor:
          prose:
            - >-
              Formally, a signal is a map from the emitter's events to a set of callbacks; emitting applies each callback to
              the event's arguments, in connection order.
            - >-
              The invariant is the emitter's code: adding or removing listeners never changes it. Dependencies point from
              listeners to the emitter's signal, not the other way.
            - >-
              Picture arrows from the emitter to each listener, drawn in the editor rather than in code.
            - >-
              The engine's own callbacks (bodyEntered, onCollision) are emitted as signals of the same name, so the same
              connection panel can wire them too.
          callouts: []
          visualizations: []
        examples:
          - id: mg6-004-ex1
            title: What the display shows
            difficulty: easy
            problem: Health starts at 3. Player is hurt once. What does the display show?
            steps:
              - expression: '3 - 1 = 2 \Rightarrow \texttt{show(2)}'
                annotation: hurt() takes 1, then emits the new health.
                strategyTitle: "Step 1: Follow the emit"
            answer: "Health: 2."
          - id: mg6-004-ex2
            title: Two listeners
            difficulty: medium
            problem: healthChanged is connected to HUD/Health.show and Camera.shake. Player is hurt twice. How many calls?
            steps:
              - expression: '2 \text{ emits} \times 2 \text{ listeners} = 4'
                annotation: Each emit calls every connected method.
                strategyTitle: "Step 1: Emits × listeners"
            answer: "4 calls: show twice (with 2, then 1) and shake twice."
          - id: mg6-004-ex3
            title: Changing the HUD
            difficulty: hard
            problem: The designer replaces the Label with a row of heart sprites. What changes in Player's script?
            steps:
              - expression: '\text{Player: emit("healthChanged", health)} \text{ (unchanged)}'
                annotation: Player only announces.
                strategyTitle: "Step 1: The emitter"
              - expression: '\text{Hearts.show(health)} + \text{a new connection}'
                annotation: The new display has its own show method and is connected instead.
                strategyTitle: "Step 2: The listener"
            answer: Nothing in Player's script; only the new display's show method and the connection.
        challenges:
          - id: mg6-004-ch1
            title: Game over
            difficulty: easy
            problem: When health reaches 0, a Message label should say Game over. Which signal could it listen to?
            hint: The same one.
            answer: healthChanged, with a method that checks whether health is 0.
            walkthrough:
              - expression: '\texttt{show(h)}: \text{if } h = 0 \ldots'
                annotation: Listeners can decide for themselves.
          - id: mg6-004-ch2
            title: A new signal
            difficulty: medium
            problem: The player picks up a key. What emit line announces it, carrying the key's colour?
            hint: Name what happened.
            answer: this.emit('keyCollected', colour).
            walkthrough: []
          - id: mg6-004-ch3
            title: Debug the silent display
            difficulty: hard
            problem: The connection exists, but the display never changes. Player's hurt() does this.health -= 1 and nothing else. Why?
            hint: Who starts a signal?
            answer: Nothing emits healthChanged; add this.emit('healthChanged', this.health) after taking the health.
            walkthrough: []
        semantics:
          core:
            - { symbol: "emit(name, …args)", meaning: "Says something happened; calls every connected method with the args." }
            - { symbol: "connect", meaning: "Joins a node's signal to another node's method." }
            - { symbol: "observer pattern", meaning: "A subject notifies a list of observers without knowing them." }
            - { symbol: "listener", meaning: "A node whose method is connected to a signal." }
          rulesOfThumb:
            - Emit what happened, not what others should do.
            - Name signals as events in the past tense (healthChanged, keyCollected).
            - Write the listener's method before connecting.
            - Prefer a signal when two parts of a game should not depend on each other.
        misconceptions:
          - falseBelief: emit fails if nobody is connected.
            whyStudentsThinkIt: Calling something that is not there usually fails.
            correctionExample: Player emits healthChanged with no listeners and nothing happens, without error.
            contrastCase: Connecting to a method that does not exist is the error, when it fires.
          - falseBelief: The emitter must know its listeners' names.
            whyStudentsThinkIt: A direct call needs a path to the other node.
            correctionExample: Player's script never mentions HUD; the connection, made in the editor, does.
            contrastCase: That is what lets the HUD change freely.
        transferPrompts:
          - situation: A score, a sound and an achievement should all react to a coin being collected.
            competingTechniques:
              - The coin emits collected; each connects
              - The coin calls all three directly
            whyThisTechniqueWins: The coin stays simple, and new reactions are added by connecting.
          - situation: A door should open when all three switches are pressed.
            competingTechniques:
              - Each switch emits pressed; a door script counts them
              - Each switch checks the other two
            whyThisTechniqueWins: The switches stay identical and independent; the door owns the rule.
        debugging:
          - commonError: Connecting to show when the method is called showHealth.
            symptom: An error, the node has no method show, when the signal fires.
            whyItHappened: Connections name the method exactly.
            repairStrategy: Use the method's exact name, or rename the method.
          - commonError: Emitting before changing the value.
            symptom: The display is always one step behind.
            whyItHappened: The signal carried the old health.
            repairStrategy: Change health first, then emit it.
        mastery:
          targetLevel: 3
          solveIndependently: Emit a signal and connect a listener in the editor.
          explainVerbally: Explain the observer pattern and why it decouples nodes.
          detectIncorrectApplication: Spot missing emits and wrong method names.
          transferToUnfamiliar: Design signals for coins, switches and achievements.
        assessment:
          questions:
            - id: mg6-004-assess-1
              type: choice
              text: Health 3, hurt once, then emit. What does show receive?
              options: ["2", "3", "1", "Nothing"]
              answer: "2"
              hint: Change, then emit.
        quiz:
          - id: mg6-004-quiz-1
            type: choice
            text: What does emit do with no listeners?
            options: ["Nothing", "Throws an error", "Stops the game", "Calls itself"]
            answer: "Nothing"
            hints:
              - No connections, no calls.
            reviewSection: "Misconceptions — emit with no listeners"
          - id: mg6-004-quiz-2
            type: choice
            text: Where is a connection made in this lesson?
            options: ["In the Inspector's Signals section", "In Player's script", "In the HUD's script", "In Project settings"]
            answer: "In the Inspector's Signals section"
            hints:
              - No code joins them.
            reviewSection: "Intuition — the connect paragraph"
          - id: mg6-004-quiz-3
            type: choice
            text: Two listeners, three emits. Calls?
            options: ["6", "5", "3", "2"]
            answer: "6"
            hints:
              - Emits × listeners.
            reviewSection: "Examples — Two listeners"
          - id: mg6-004-quiz-4
            type: choice
            text: What is this pattern called?
            options: ["The observer pattern", "The singleton pattern", "Recursion", "Polling"]
            answer: "The observer pattern"
            hints:
              - Subject and observers.
            reviewSection: "Under the hood — observer"
          - id: mg6-004-quiz-5
            type: choice
            text: Which of these changes Player's script when the HUD is redesigned?
            options: ["Nothing", "The new label's name", "The new method name", "The HUD's position"]
            answer: "Nothing"
            hints:
              - Player only emits.
            reviewSection: "Examples — Changing the HUD"
          - id: mg6-004-quiz-6
            type: choice
            text: The display lags one step behind. Likely cause?
            options: ["Emitting before changing health", "Two listeners", "A wrong group", "Smoothing"]
            answer: "Emitting before changing health"
            hints:
              - It carried the old value.
            reviewSection: "Debugging — emitting first"
        checkpoints:
          - { id: cp-mg6-004-1, label: "Read how Player emits", type: read }
          - { id: cp-mg6-004-2, label: "Read how a connection joins them", type: read }
          - { id: cp-mg6-004-3, label: "Read the signal procedure", type: read }
          - { id: cp-mg6-004-4, label: "Complete \"A health display wired with a signal\" in Game Studio", type: lab }
          - { id: cp-mg6-004-5, label: "Connect a second listener in Game Studio", type: lab }
          - { id: cp-mg6-004-6, label: "Work through the two-listeners example", type: example }
          - { id: cp-mg6-004-7, label: "Work through the changing-HUD example", type: example }
          - { id: cp-mg6-004-8, label: "Attempt the silent-display challenge", type: challenge }

      # ───────────────────────────────────────────────────────────── 6.5
      - order: 5
        id: mg6-005
        slug: changing-scenes
        title: Changing Scenes
        subtitle: A title screen, a level, and moving between them while keeping the score.
        tags: [game-studio, scenes, game-states]
        aliases: scene change title screen main scene game over level select keep score module
        timeToComplete: 25
        coreConcept: >-
          A game is several scenes: a title, levels, game over. The main scene is where it starts; scene.change(path)
          replaces the running scene with another. What must last between scenes lives in a script module, not a node.
        prerequisites: [mg6-004]
        nextLesson: mg7-001
        hook:
          question: >-
            The game should open on a title screen, start the level when Space is pressed, and show the score on a game-over
            screen afterwards. The level's nodes are thrown away when the scene changes. Where does the score survive?
          realWorldContext: >-
            Every finished game moves between screens: menus, levels, cut-scenes, results. Godot does it with
            change_scene; Unity with LoadScene. Keeping state across them is a classic first problem.
        intuition:
          prose:
            - >-
              Make title.scene: a Node2D root named Title with a Label saying the game's name. Mark it as the main scene
              (☆ in Files): Run starts there now.
            - >-
              Title's script: in update, `if (input.isJustPressed('jump')) scene.change('scenes/main.scene')`. The title's
              nodes are removed, main.scene is built fresh, and its ready() methods run.
            - >-
              Before reading on, predict: Player keeps score = 7 in a field, and the level changes to gameover.scene. What
              is score there? There is no Player any more: its field went with it.
            - >-
              To keep it, put it in a script module: `scripts/state.js` exports an object, `export const state = { score: 0 }`.
              Any script imports it, `import { state } from './state.js'`. Modules load once per game, so the object
              survives every scene change.
            - >-
              The game over scene reads `state.score` to show it; pressing Space sets `state.score = 0` and changes back to
              the title.
          callouts:
            - type: procedure
              title: "Procedure: Move between scenes"
              body: |-
                Step 1. Make each screen its own scene (title, level, game over).
                Step 2. Mark the first as the main scene (☆ beside it in Files).
                Step 3. Where the screen should end, call scene.change('scenes/next.scene').
                Step 4. Keep anything that must last in a module (scripts/state.js) and import it where needed.
                Step 5. Run from the start and go round the whole loop.
            - type: warning
              title: Nodes do not survive a change
              body: >-
                After scene.change, every node of the old scene is gone, with its fields. Keep a reference to an old node
                and using it fails. Store values, not nodes, in the state module.
          visualizations:
            - id: GameStudioTask
              title: A title screen
              props: { task: title-scene, lesson: mg6-005, checkpoint: cp-mg6-005-4 }
        math:
          prose:
            - >-
              **Under the hood (optional).** A game's screens form a **state machine**: states (title, level, game over) and
              transitions (Space on the title → level; out of health → game over; Space → title). At any time exactly one
              state is active.
            - >-
              scene.change is a transition: it ends the current state (freeing its nodes at the end of the frame) and
              enters the next (building it and calling ready). Nothing of the old state's nodes remains.
            - >-
              Data with a longer life than a state lives outside it. Modules are loaded once per run, so their top-level
              objects last as long as the game does; this is the same idea as Godot's autoloads.
          equations: []
          callouts: []
          visualizations: []
        rigor:
          prose:
            - >-
              Formally, the screen flow is a finite automaton $(S, s_0, \delta)$: screens $S$, start $s_0$ (the main scene),
              and transitions $\delta$ triggered by events.
            - >-
              The invariant across transitions is the module state; everything owned by a scene is recreated from the
              scene's file on entry, so each level starts the same way.
            - >-
              Draw each scene as a box and each scene.change as an arrow labelled with what triggers it; the whole game's
              structure fits on one page.
            - >-
              Inside a scene, the same pattern recurs: a player has states (idle, running, jumping), a boss has phases.
              Chapter 7's Tetris has playing and over.
          callouts: []
          visualizations: []
        examples:
          - id: mg6-005-ex1
            title: Where the game starts
            difficulty: easy
            problem: title.scene is marked ☆ and main.scene is not. Which scene does Run show first?
            steps:
              - expression: '\text{main scene} = \text{title.scene}'
                annotation: The starred scene is where Run begins.
                strategyTitle: "Step 1: The main scene"
            answer: The title screen.
          - id: mg6-005-ex2
            title: Keeping the score
            difficulty: medium
            problem: Player adds 10 to state.score for each coin (state from scripts/state.js). After 3 coins the game changes to gameover.scene. What can it show?
            steps:
              - expression: '3 \times 10 = 30'
                annotation: The module's object kept counting.
                strategyTitle: "Step 1: The count"
              - expression: '\texttt{state.score} = 30 \text{ after the change}'
                annotation: Modules survive scene changes.
                strategyTitle: "Step 2: Across the change"
            answer: "Score: 30, read from state.score."
          - id: mg6-005-ex3
            title: The whole loop
            difficulty: hard
            problem: Title → level → game over → title. Write the transitions and what resets.
            steps:
              - expression: '\text{title} \xrightarrow{\text{Space}} \text{level} \xrightarrow{\text{health} = 0} \text{game over} \xrightarrow{\text{Space}} \text{title}'
                annotation: Each arrow is a scene.change in the scene it leaves.
                strategyTitle: "Step 1: Transitions"
              - expression: '\text{state.score} \leftarrow 0 \text{ when leaving game over}'
                annotation: The level's nodes reset by themselves; the module's score must be reset on purpose.
                strategyTitle: "Step 2: What resets"
            answer: Three scene.change calls; reset state.score when a new game starts, since only it survives.
        challenges:
          - id: mg6-005-ch1
            title: A second level
            difficulty: easy
            problem: Reaching a flag should start level 2. What call goes in the flag's bodyEntered?
            hint: Change scene.
            answer: scene.change('scenes/level2.scene').
            walkthrough:
              - expression: '\texttt{scene.change("scenes/level2.scene")}'
                annotation: A transition to the next state.
          - id: mg6-005-ch2
            title: Lives across levels
            difficulty: medium
            problem: Lives should carry from level 1 to level 2. Where do they live?
            hint: What survives a change?
            answer: In the state module (state.lives), not in Player.
            walkthrough: []
          - id: mg6-005-ch3
            title: Debug the forgotten score
            difficulty: hard
            problem: The game over screen always shows Score 0. The score was a field on Player. Why, and what fixes it?
            hint: What happens to Player's fields on a scene change?
            answer: Player was freed with the level, taking its field; keep the score in scripts/state.js and read it there.
            walkthrough: []
        semantics:
          core:
            - { symbol: "main scene", meaning: "The scene Run starts with (☆ in Files)." }
            - { symbol: "scene.change(path)", meaning: "Replaces the running scene with another, built fresh." }
            - { symbol: "script module", meaning: "A script file loaded once per game; its exports survive scene changes." }
            - { symbol: "state machine", meaning: "States with transitions between them; exactly one is active." }
          rulesOfThumb:
            - One screen, one scene.
            - Keep values that must last in a state module.
            - Reset the module's values when a new game starts.
            - Draw the screen flow before building it.
        misconceptions:
          - falseBelief: A node's fields survive scene.change.
            whyStudentsThinkIt: The game is still running.
            correctionExample: Player.score = 7 is gone after changing to gameover.scene, with Player.
            contrastCase: state.score in a module is still 7.
          - falseBelief: scene.change keeps the old scene and adds the new one.
            whyStudentsThinkIt: instantiate adds things.
            correctionExample: After the change, none of the title's nodes exist.
            contrastCase: To add things to the current scene, use instantiate and addChild.
        transferPrompts:
          - situation: The game should remember the highest score while it runs.
            competingTechniques:
              - A best field in the state module, updated at game over
              - A field on the game-over scene's root
            whyThisTechniqueWins: The module survives every change; the game-over scene is rebuilt each time.
          - situation: A pause menu should appear over the level without losing it.
            competingTechniques:
              - A CanvasLayer menu shown in the same scene
              - scene.change to a pause scene
            whyThisTechniqueWins: Changing scene would throw the level away; an overlay keeps it.
        debugging:
          - commonError: Forgetting to mark the title as the main scene.
            symptom: Run starts on the level, skipping the title.
            whyItHappened: Run starts at the main scene.
            repairStrategy: Press ☆ beside title.scene in Files.
          - commonError: Mistyping the path in scene.change.
            symptom: An error that there is no such scene, when Space is pressed.
            whyItHappened: Paths are exact and include scenes/ and .scene.
            repairStrategy: Copy the path from Files.
        mastery:
          targetLevel: 3
          solveIndependently: Build a title, a level and a game over, with the score kept between them.
          explainVerbally: Explain scene.change and why modules survive it.
          detectIncorrectApplication: Spot state kept in nodes that a change will free.
          transferToUnfamiliar: Design a game's screen flow as a state machine.
        assessment:
          questions:
            - id: mg6-005-assess-1
              type: choice
              text: Where should the score live to survive scene changes?
              options: ["In a script module", "On Player", "In a Label", "On the camera"]
              answer: "In a script module"
              hint: Modules load once per game.
        quiz:
          - id: mg6-005-quiz-1
            type: choice
            text: What does scene.change do?
            options: ["Replaces the running scene with another", "Adds a scene on top", "Saves the scene", "Restarts the editor"]
            answer: "Replaces the running scene with another"
            hints:
              - The old nodes are gone.
            reviewSection: "Intuition — the change paragraph"
          - id: mg6-005-quiz-2
            type: choice
            text: Which scene does Run start with?
            options: ["The main scene", "The scene open in the editor", "The first scene alphabetically", "The newest scene"]
            answer: "The main scene"
            hints:
              - ☆ in Files.
            reviewSection: "Examples — Where the game starts"
          - id: mg6-005-quiz-3
            type: choice
            text: Why does state.score survive a scene change?
            options: ["Modules load once per game", "Labels remember it", "scene.change copies fields", "It is saved to disk"]
            answer: "Modules load once per game"
            hints:
              - The module is not part of any scene.
            reviewSection: "Under the hood — longer life"
          - id: mg6-005-quiz-4
            type: choice
            text: How many screens are active at once in a state machine?
            options: ["Exactly one", "All of them", "Two", "None"]
            answer: "Exactly one"
            hints:
              - One state at a time.
            reviewSection: "Under the hood — state machine"
          - id: mg6-005-quiz-5
            type: choice
            text: Which of these does NOT survive scene.change?
            options: ["A field on Player", "state.score in a module", "An exported constant", "The project's settings"]
            answer: "A field on Player"
            hints:
              - Player goes with its scene.
            reviewSection: "Misconceptions — fields"
          - id: mg6-005-quiz-6
            type: choice
            text: A pause menu should keep the level. Which approach?
            options: ["A CanvasLayer overlay in the same scene", "scene.change to a pause scene", "queueFree the level", "A new main scene"]
            answer: "A CanvasLayer overlay in the same scene"
            hints:
              - Changing scene throws the level away.
            reviewSection: "Transfer — pause menu"
        checkpoints:
          - { id: cp-mg6-005-1, label: "Read how scene.change works", type: read }
          - { id: cp-mg6-005-2, label: "Read where state survives", type: read }
          - { id: cp-mg6-005-3, label: "Read the scene-flow procedure", type: read }
          - { id: cp-mg6-005-4, label: "Complete \"A title screen\" in Game Studio", type: lab }
          - { id: cp-mg6-005-5, label: "Add a game over scene with the score in Game Studio", type: lab }
          - { id: cp-mg6-005-6, label: "Work through the keeping-the-score example", type: example }
          - { id: cp-mg6-005-7, label: "Work through the whole-loop example", type: example }
          - { id: cp-mg6-005-8, label: "Attempt the forgotten-score challenge", type: challenge }

  # ═══════════════════════════════════════════════════════════════ Chapter 7: Tetris
  - number: 7
    slug: tetris
    lessons:
      # ───────────────────────────────────────────────────────────── 7.1
      - order: 1
        id: mg7-001
        slug: the-board
        title: "Tetris 1: The Board"
        subtitle: A grid of numbers, 10 across and 20 down, and a grid of pictures that shows it.
        tags: [game-studio, tetris, arrays]
        aliases: tetris board 2d array grid cells sprites draw numbers row column
        timeToComplete: 30
        coreConcept: >-
          The game is numbers; the screen only shows them. Tetris's board is a 2D array, cells[row][col], where 0 is empty
          and 1 to 7 is the colour of what landed there. Every frame, draw() sets each of 200 sprites' pictures from its
          number.
        prerequisites: [mg6-005]
        nextLesson: mg7-002
        hook:
          question: >-
            A Tetris well is 10 cells wide and 20 tall. Is it 200 nodes you move around, or something simpler that the
            game can reason about?
          realWorldContext: >-
            Puzzle games, board games, minesweeper, match-three and level editors all keep their state as a grid of numbers
            and draw it. Separating the data from the picture is the first step of almost any game's design.
        intuition:
          prose:
            - >-
              Start with one row of the board: ten numbers, [0, 0, 0, 3, 3, 3, 0, 0, 0, 0]. The zeros are empty cells; the
              threes are part of a pink piece that has landed. The whole board is twenty such rows: an array of arrays.
            - >-
              `this.cells[19][0]` is the bottom-left cell: row 19 (the last of 20, counting from 0), column 0. Before
              reading on, predict: which cell is `this.cells[0][9]`? The top-right one.
            - >-
              The pictures are 200 Sprite2D nodes made once, in ready(), one per cell, kept in `this.sprites[row][col]`.
              Each is 26 pixels square (the art is 128 pixels, so scale 26/128) with its centre at column × 26 + 13,
              row × 26 + 13.
            - >-
              draw() runs every frame and sets every sprite's texture to `TEXTURES[this.cells[row][col]]`: colour 0 is the
              black empty-cell picture, colours 1 to 7 the pieces'. Change a number and its picture follows on the next frame.
            - >-
              The rule this whole game follows: change the numbers, never the pictures. Moving, landing, clearing and scoring
              will all be changes to `this.cells` and a few other numbers.
          callouts:
            - type: procedure
              title: "Procedure: A board you can see"
              body: |-
                Step 1. Give Board (a Node2D at 350, 10) a script.
                Step 2. In ready(), make this.cells: 20 rows, each new Array(10).fill(0).
                Step 3. In ready(), make 200 Sprite2Ds in two loops, place and scale each, addChild it, and keep it in this.sprites[row][col].
                Step 4. Write draw(): every sprite's texture = TEXTURES[this.cells[row][col]].
                Step 5. Call this.draw() in update(dt), and run.
            - type: warning
              title: Rows first, then columns
              body: >-
                cells[row][col] is down first, then across, the opposite of (x, y). Mixing them up draws the board on its
                side or reads past the end of a row. Name the loop variables row and col, not i and j.
          visualizations:
            - id: GameStudioTask
              title: "Tetris 1: the board"
              props: { task: tetris-board, lesson: mg7-001, checkpoint: cp-mg7-001-4 }
        math:
          prose:
            - >-
              **Under the hood (optional).** A 2D array can also be stored as one list of $R \times C$ numbers: cell
              $(r, c)$ is entry $rC + c$, and entry $i$ is cell $(\lfloor i / C \rfloor, i \bmod C)$. This row-major order is
              how tilesets (lesson 5.1) and Tiled's layers number their cells.
            - >-
              A cell's centre on the screen is $(x_0 + cS + S/2,\ y_0 + rS + S/2)$ for the board at $(x_0, y_0)$ and cells
              $S$ pixels: cell (19, 0) is at $(350 + 13,\ 10 + 494 + 13) = (363, 517)$.
            - >-
              The board is 10 × 26 = 260 pixels wide and 20 × 26 = 520 tall. At (350, 10) it spans x 350 to 610 and y 10 to
              530, centred in the 960 × 540 game area: $350 + 130 = 480$.
          equations: []
          callouts: []
          visualizations: []
        rigor:
          prose:
            - >-
              Formally, the board is a function $\{0..19\} \times \{0..9\} \to \{0..7\}$, and draw() is a function from boards
              to pictures. Keeping the game in the first and only deriving the second is the model–view separation.
            - >-
              The invariant: the pictures always equal draw(cells) at the end of a frame, whatever changed the numbers.
            - >-
              Picture two grids side by side, one of digits and one of coloured squares, with draw() mapping each digit to
              its square.
            - >-
              Because the game is numbers, it can be tested and reasoned about without pictures: the task's checks read
              this.cells directly, and an AI could play it from the numbers alone (chapter 8).
          callouts: []
          visualizations: []
        examples:
          - id: mg7-001-ex1
            title: Reading a cell
            difficulty: easy
            problem: Which cell is cells[19][0], and which is cells[0][9]?
            steps:
              - expression: 'cells[19][0]: \text{row } 19, \text{ column } 0'
                annotation: The last row (bottom) and the first column (left).
                strategyTitle: "Step 1: Row then column"
              - expression: 'cells[0][9]: \text{row } 0, \text{ column } 9'
                annotation: The first row (top) and the last column (right).
                strategyTitle: "Step 2: The other corner"
            answer: cells[19][0] is bottom-left; cells[0][9] is top-right.
          - id: mg7-001-ex2
            title: Where a sprite goes
            difficulty: medium
            problem: The board is at (350, 10) with 26-pixel cells. Where is the centre of cell row 2, column 5?
            steps:
              - expression: 'x = 350 + 5 \times 26 + 13 = 493'
                annotation: Columns go across.
                strategyTitle: "Step 1: Across"
              - expression: 'y = 10 + 2 \times 26 + 13 = 75'
                annotation: Rows go down.
                strategyTitle: "Step 2: Down"
            answer: At (493, 75).
          - id: mg7-001-ex3
            title: One list instead
            difficulty: hard
            problem: If the board were one list of 200 numbers, row by row, which entry is row 7, column 3, and which cell is entry 156?
            steps:
              - expression: '7 \times 10 + 3 = 73'
                annotation: Row times width plus column.
                strategyTitle: "Step 1: Cell to entry"
              - expression: '156 = 15 \times 10 + 6'
                annotation: Divide by the width for the row; the remainder is the column.
                strategyTitle: "Step 2: Entry to cell"
            answer: Entry 73; entry 156 is row 15, column 6.
        challenges:
          - id: mg7-001-ch1
            title: The middle cell
            difficulty: easy
            problem: Which cell is half way down on the left edge?
            hint: 20 rows, counting from 0.
            answer: cells[10][0] (or cells[9][0]; 20 rows have no single middle).
            walkthrough:
              - expression: '20 / 2 = 10'
                annotation: Row 10 is the first of the bottom half.
          - id: mg7-001-ch2
            title: A taller well
            difficulty: medium
            problem: A 22-row well with 24-pixel cells at y = 0. Where is the bottom row's centre?
            hint: Row 21.
            answer: At y = 21 × 24 + 12 = 516.
            walkthrough: []
          - id: mg7-001-ch3
            title: Debug the shared row
            difficulty: hard
            problem: >-
              A learner made the board with const row = new Array(10).fill(0); for 20 rows, this.cells.push(row). Setting
              cells[19][0] = 1 colours the whole left column. Why?
            hint: How many arrays are there?
            answer: >-
              Every row is the same array, so changing one changes all twenty; make a new array for each row inside the loop.
            walkthrough: []
        semantics:
          core:
            - { symbol: "cells[row][col]", meaning: "The board: 0 empty, 1 to 7 the colour of what landed." }
            - { symbol: "sprites[row][col]", meaning: "The picture for each cell, made once." }
            - { symbol: "draw()", meaning: "Sets every sprite's texture from its cell's number." }
            - { symbol: "TEXTURES[n]", meaning: "The picture for colour number n (0 is empty)." }
            - { symbol: "rC + c", meaning: "A cell's position in one row-major list." }
          rulesOfThumb:
            - Change the numbers, never the pictures.
            - Rows first, then columns.
            - Make every row its own array.
            - Draw everything every frame; it is simpler than tracking changes.
        misconceptions:
          - falseBelief: The pieces are moved by moving their sprites.
            whyStudentsThinkIt: That is how Hero moved in chapter 1.
            correctionExample: In Tetris no sprite ever moves; draw() changes which cells show colour.
            contrastCase: The 200 sprites stay where ready() put them for the whole game.
          - falseBelief: cells[x][y] is across then down.
            whyStudentsThinkIt: Positions are (x, y).
            correctionExample: cells[19][0] is row 19 (down), column 0 (across).
            contrastCase: An array of rows is indexed by row first.
        transferPrompts:
          - situation: A minesweeper game needs to know which squares hold mines.
            competingTechniques:
              - A 2D array of numbers, drawn each frame
              - One node per square, each holding its state
            whyThisTechniqueWins: The array is easy to count neighbours in and to reset; nodes would scatter the state.
          - situation: A board game should be saved and loaded.
            competingTechniques:
              - Save the array of numbers
              - Save every sprite's picture
            whyThisTechniqueWins: The numbers are the game; the pictures can always be redrawn from them.
        debugging:
          - commonError: Making the sprites in update instead of ready.
            symptom: The game slows to a crawl and the scene tree fills with thousands of sprites.
            whyItHappened: update runs every frame, making 200 more each time.
            repairStrategy: Make them once, in ready(); only change textures in draw().
          - commonError: Forgetting scale 26/128.
            symptom: Huge overlapping squares fill the screen.
            whyItHappened: The art is 128 pixels and the cells 26.
            repairStrategy: "Set s.scale = { x: 26 / 128, y: 26 / 128 }."
        mastery:
          targetLevel: 3
          solveIndependently: Build a board as a 2D array and draw it with sprites.
          explainVerbally: Explain why the game is the numbers and the pictures only show them.
          detectIncorrectApplication: Spot shared rows and row/column mix-ups.
          transferToUnfamiliar: Convert between cells, list entries and screen positions.
        assessment:
          questions:
            - id: mg7-001-assess-1
              type: choice
              text: Which cell is cells[19][0]?
              options: ["Bottom-left", "Top-left", "Bottom-right", "Top-right"]
              answer: "Bottom-left"
              hint: Row 19 is the last row.
        quiz:
          - id: mg7-001-quiz-1
            type: choice
            text: What does a 0 in cells mean?
            options: ["An empty cell", "The first piece", "Black colour paint", "A wall"]
            answer: "An empty cell"
            hints:
              - 1 to 7 are colours.
            reviewSection: "Intuition — the row paragraph"
          - id: mg7-001-quiz-2
            type: choice
            text: How many sprites does the board make?
            options: ["200", "10", "20", "7"]
            answer: "200"
            hints:
              - One per cell.
            reviewSection: "Intuition — the sprites paragraph"
          - id: mg7-001-quiz-3
            type: choice
            text: Where is the centre of cell row 0, column 0, with the board at (350, 10)?
            options: ["(363, 23)", "(350, 10)", "(376, 36)", "(13, 13)"]
            answer: "(363, 23)"
            hints:
              - Add half a cell to the board's corner.
            reviewSection: "Under the hood — centres"
          - id: mg7-001-quiz-4
            type: choice
            text: Where should the sprites be made?
            options: ["In ready()", "In update()", "In draw()", "In the editor by hand"]
            answer: "In ready()"
            hints:
              - Once.
            reviewSection: "Debugging — sprites in update"
          - id: mg7-001-quiz-5
            type: choice
            text: Which of these is NOT how the board changes in this game?
            options: ["Moving a sprite's position", "Changing a number in cells", "draw() setting a texture", "Making a new row array"]
            answer: "Moving a sprite's position"
            hints:
              - Sprites never move.
            reviewSection: "Misconceptions — moving sprites"
          - id: mg7-001-quiz-6
            type: choice
            text: As one row-major list of width 10, which entry is row 4, column 2?
            options: ["42", "24", "6", "8"]
            answer: "42"
            hints:
              - 4 × 10 + 2.
            reviewSection: "Under the hood — one list"
        checkpoints:
          - { id: cp-mg7-001-1, label: "Read the board as numbers", type: read }
          - { id: cp-mg7-001-2, label: "Read how the sprites show it", type: read }
          - { id: cp-mg7-001-3, label: "Read the board procedure", type: read }
          - { id: cp-mg7-001-4, label: "Complete \"Tetris 1: the board\" in Game Studio", type: lab }
          - { id: cp-mg7-001-5, label: "Set a few cells to colours in ready() and see them", type: lab }
          - { id: cp-mg7-001-6, label: "Work through the sprite-position example", type: example }
          - { id: cp-mg7-001-7, label: "Work through the one-list example", type: example }
          - { id: cp-mg7-001-8, label: "Attempt the shared-row challenge", type: challenge }

      # ───────────────────────────────────────────────────────────── 7.2
      - order: 2
        id: mg7-002
        slug: a-piece
        title: "Tetris 2: A Piece"
        subtitle: A shape, a place and a colour, drawn over the board.
        tags: [game-studio, tetris, objects]
        aliases: tetromino piece cells offsets spawn object type x y
        timeToComplete: 25
        coreConcept: >-
          A falling piece is a small object: its type, its four cells as offsets from a centre, and where that centre is.
          It is kept apart from the board until it lands; draw() paints it over the board each frame.
        prerequisites: [mg7-001]
        nextLesson: mg7-003
        hook:
          question: >-
            The T piece is four cells in a T shape. When it falls one row, do you change four numbers in the board, then four
            more, every half second?
          realWorldContext: >-
            Describing a shape as offsets from a point, then placing it, is how games handle any multi-part thing: pieces,
            ships, brushes, formations.
        intuition:
          prose:
            - >-
              The T piece is four cells around its centre: [−1, 0], [0, 0], [1, 0] and [0, −1], each [x, y]. Put the centre at
              x = 4, y = 1 and the cells are at (3, 1), (4, 1), (5, 1) and (4, 0).
            - >-
              Before reading on, predict: where are its cells if the centre moves to x = 6, y = 5? Add the same offsets:
              (5, 5), (6, 5), (7, 5) and (6, 4). Moving the piece is changing two numbers, x and y.
            - >-
              So `this.piece` is an object: `{ type: 'T', cells: PIECES.T, x: 4, y: 1 }`. spawn(type) makes one at the top
              middle. pieces.js holds all seven shapes, PIECES, and colourOf(type) gives each its colour number.
            - >-
              The piece is not in this.cells. It is still moving, so it is drawn on top: after the board, draw() paints each
              of the piece's cells, at row piece.y + y and column piece.x + x, with TEXTURES[colourOf(piece.type)].
            - >-
              A cell above the top (row −1) is skipped when drawing: pieces come in from above.
          callouts:
            - type: procedure
              title: "Procedure: A piece over the board"
              body: |-
                Step 1. Write spawn(type): this.piece = { type, cells: PIECES[type], x: 4, y: 1 }.
                Step 2. Call this.spawn('T') at the end of ready().
                Step 3. In draw(), after the board, loop over the piece's cells.
                Step 4. For each [x, y]: row = piece.y + y, col = piece.x + x; skip it if it is off the board.
                Step 5. Set that sprite's texture to TEXTURES[colourOf(piece.type)], and run.
            - type: warning
              title: Keep the piece out of the board
              body: >-
                Writing the falling piece into this.cells leaves a trail: each move would leave its old cells coloured.
                The piece joins the board only when it lands (lesson 7.4).
          visualizations:
            - id: GameStudioTask
              title: "Tetris 2: a piece"
              props: { task: tetris-piece, lesson: mg7-002, checkpoint: cp-mg7-002-4 }
        math:
          prose:
            - >-
              **Under the hood (optional).** A piece is a set of offsets $\{(x_i, y_i)\}$ and a position $(p_x, p_y)$; its cells
              are $\{(p_x + x_i, p_y + y_i)\}$. Moving by $(d_x, d_y)$ adds to the position only: a translation.
            - >-
              The seven pieces are the seven tetrominoes: every way of joining four squares edge to edge, counting
              mirror images as different (S and Z, J and L) and turns as the same. There are exactly seven.
            - >-
              Choosing [0, 0] near each piece's middle matters later: turning (lesson 7.5) spins the offsets about [0, 0],
              so a piece turns in place instead of swinging round a corner.
          equations: []
          callouts: []
          visualizations: []
        rigor:
          prose:
            - >-
              Formally, a piece's cells are the translate $P + \mathbf{p}$ of its shape $P$; the board check (next lesson) asks
              whether $P + \mathbf{p}$ lies inside the well and avoids the filled cells.
            - >-
              The invariant of a move is the shape: translating changes where the cells are, never their arrangement.
            - >-
              Picture a stamp (the shape) and where it is pressed (the position); the board is the paper.
            - >-
              Shapes of $n$ squares are polyominoes. Counting mirror images as the same, there are 5 of four squares,
              12 of five and 35 of six; Tetris uses the 7 one-sided tetrominoes, where mirror images count separately.
          callouts: []
          visualizations: []
        examples:
          - id: mg7-002-ex1
            title: Where the T is
            difficulty: easy
            problem: The T at x = 4, y = 1. Where are its cells?
            steps:
              - expression: '(4 - 1, 1), (4, 1), (4 + 1, 1), (4, 1 - 1)'
                annotation: Add each offset to the centre.
                strategyTitle: "Step 1: Add the offsets"
            answer: (3, 1), (4, 1), (5, 1) and (4, 0).
          - id: mg7-002-ex2
            title: After moving
            difficulty: medium
            problem: The T moves to x = 6, y = 5. Which rows and columns light up?
            steps:
              - expression: '(5, 5), (6, 5), (7, 5), (6, 4)'
                annotation: The same offsets from the new centre.
                strategyTitle: "Step 1: New cells"
              - expression: 'cells: \text{row } 5 \text{ cols } 5\text{–}7, \text{ row } 4 \text{ col } 6'
                annotation: In [row][col] terms, y is the row.
                strategyTitle: "Step 2: As rows and columns"
            answer: Row 5, columns 5–7, and row 4, column 6.
          - id: mg7-002-ex3
            title: Spawning off the top
            difficulty: hard
            problem: An L is [1, −1], [−1, 0], [0, 0], [1, 0]. If it spawned at y = 0, what happens to one cell?
            steps:
              - expression: 'y = 0 + (-1) = -1'
                annotation: The [1, −1] cell is above the board.
                strategyTitle: "Step 1: Find the row"
              - expression: '\text{row} < 0 \Rightarrow \text{not drawn}'
                annotation: draw() skips it; that is why pieces spawn at y = 1.
                strategyTitle: "Step 2: Drawing it"
            answer: One cell would be at row −1 and not shown; spawning at y = 1 keeps all four visible.
        challenges:
          - id: mg7-002-ch1
            title: The O
            difficulty: easy
            problem: The O is [0, 0], [1, 0], [0, 1], [1, 1], at x = 4, y = 1. Its cells?
            hint: Add the offsets.
            answer: (4, 1), (5, 1), (4, 2), (5, 2).
            walkthrough:
              - expression: '(4,1),(5,1),(4,2),(5,2)'
                annotation: A 2 × 2 square.
          - id: mg7-002-ch2
            title: Colour numbers
            difficulty: medium
            problem: TYPES is ['I', 'O', 'T', 'S', 'Z', 'J', 'L']. What is colourOf('J')?
            hint: Index plus one.
            answer: 6, because J is at index 5.
            walkthrough: []
          - id: mg7-002-ch3
            title: Debug the trail
            difficulty: hard
            problem: A learner draws the piece by writing it into this.cells each frame. Moving it leaves coloured cells behind. Why?
            hint: Who clears the old cells?
            answer: Nothing clears them; keep the piece out of this.cells and draw it over the board instead.
            walkthrough: []
        semantics:
          core:
            - { symbol: "this.piece", meaning: "The falling piece: { type, cells, x, y }." }
            - { symbol: "offsets", meaning: "The piece's cells relative to its centre [0, 0]." }
            - { symbol: "spawn(type)", meaning: "Makes a new piece of that type at the top middle." }
            - { symbol: "colourOf(type)", meaning: "The colour number for a piece type." }
            - { symbol: "tetromino", meaning: "One of the seven shapes of four squares joined edge to edge." }
          rulesOfThumb:
            - Describe shapes as offsets from a centre.
            - Move a piece by changing its x and y only.
            - Keep the falling piece out of the board until it lands.
            - Skip cells above the top when drawing.
        misconceptions:
          - falseBelief: Moving a piece means moving four cells' numbers.
            whyStudentsThinkIt: Four cells change colour on screen.
            correctionExample: Changing x from 4 to 5 moves all four cells one column.
            contrastCase: The offsets never change for a move.
          - falseBelief: The piece is part of the board while it falls.
            whyStudentsThinkIt: It is drawn in the board's cells.
            correctionExample: this.cells stays all zeros while the first T falls.
            contrastCase: It joins this.cells only when it lands.
        transferPrompts:
          - situation: A paint program's brush should stamp a 3 × 3 pattern where you click.
            competingTechniques:
              - Offsets from the click point
              - Nine separate click handlers
            whyThisTechniqueWins: The same offsets stamp anywhere.
          - situation: A formation of five ships should move together.
            competingTechniques:
              - Ships as offsets from one formation position
              - Moving each ship by hand
            whyThisTechniqueWins: Moving the formation moves them all, and the shape stays exact.
        debugging:
          - commonError: Using piece.x for rows and piece.y for columns.
            symptom: The piece appears turned on its side and in the wrong place.
            whyItHappened: Rows go with y, columns with x.
            repairStrategy: row = piece.y + y, col = piece.x + x.
          - commonError: Drawing the piece before the board.
            symptom: The piece is invisible.
            whyItHappened: The board loop paints over it afterwards.
            repairStrategy: Draw the board first, then the piece.
        mastery:
          targetLevel: 3
          solveIndependently: Represent and draw a piece over the board.
          explainVerbally: Explain offsets and why the piece is kept apart from the board.
          detectIncorrectApplication: Spot trails and x/y mix-ups.
          transferToUnfamiliar: Use offsets for brushes and formations.
        assessment:
          questions:
            - id: mg7-002-assess-1
              type: choice
              text: The T ([−1,0],[0,0],[1,0],[0,−1]) at (4, 1). Which is one of its cells?
              options: ["(4, 0)", "(4, 2)", "(0, 0)", "(1, 4)"]
              answer: "(4, 0)"
              hint: The [0, −1] offset.
        quiz:
          - id: mg7-002-quiz-1
            type: choice
            text: What does moving the piece one column right change?
            options: ["piece.x", "Every offset", "this.cells", "The sprites"]
            answer: "piece.x"
            hints:
              - A translation.
            reviewSection: "Intuition — the moving paragraph"
          - id: mg7-002-quiz-2
            type: choice
            text: Why spawn at y = 1?
            options: ["So cells with offset −1 are on the board", "Because row 0 is a wall", "To fall faster", "No reason"]
            answer: "So cells with offset −1 are on the board"
            hints:
              - Row −1 is not drawn.
            reviewSection: "Examples — Spawning off the top"
          - id: mg7-002-quiz-3
            type: choice
            text: How many tetrominoes are there?
            options: ["7", "5", "4", "19"]
            answer: "7"
            hints:
              - Mirror images count as different.
            reviewSection: "Under the hood — tetrominoes"
          - id: mg7-002-quiz-4
            type: choice
            text: Where is a piece cell drawn?
            options: ["Row piece.y + y, column piece.x + x", "Row piece.x + x, column piece.y + y", "At piece.x, piece.y", "At its offset"]
            answer: "Row piece.y + y, column piece.x + x"
            hints:
              - y goes with rows.
            reviewSection: "Intuition — the draw paragraph"
          - id: mg7-002-quiz-5
            type: choice
            text: Which of these should NOT happen while a piece falls?
            options: ["Writing it into this.cells", "Changing piece.y", "Drawing it over the board", "Reading PIECES"]
            answer: "Writing it into this.cells"
            hints:
              - It would leave a trail.
            reviewSection: "Intuition — Warning: keep the piece out"
          - id: mg7-002-quiz-6
            type: choice
            text: colourOf('I') with TYPES ['I','O','T',...]?
            options: ["1", "0", "2", "7"]
            answer: "1"
            hints:
              - Index 0 plus one; 0 is empty.
            reviewSection: "Challenges — colour numbers"
        checkpoints:
          - { id: cp-mg7-002-1, label: "Read a piece as offsets", type: read }
          - { id: cp-mg7-002-2, label: "Read why the piece stays out of the board", type: read }
          - { id: cp-mg7-002-3, label: "Read the piece procedure", type: read }
          - { id: cp-mg7-002-4, label: "Complete \"Tetris 2: a piece\" in Game Studio", type: lab }
          - { id: cp-mg7-002-5, label: "Spawn each of the seven pieces in turn and look at them", type: lab }
          - { id: cp-mg7-002-6, label: "Work through the after-moving example", type: example }
          - { id: cp-mg7-002-7, label: "Work through the spawning example", type: example }
          - { id: cp-mg7-002-8, label: "Attempt the trail challenge", type: challenge }

      # ───────────────────────────────────────────────────────────── 7.3
      - order: 3
        id: mg7-003
        slug: moving-and-walls
        title: "Tetris 3: Moving, and Walls"
        subtitle: Ask "would it fit?" before every move.
        tags: [game-studio, tetris, collision]
        aliases: canplace move collision check walls isjustpressed grid collision
        timeToComplete: 25
        coreConcept: >-
          Grid collision is a question, not physics: canPlace(cells, x, y) says whether a piece's cells, placed there, are
          all inside the well and on empty cells. move(dx, dy) moves only if the answer is yes.
        prerequisites: [mg7-002]
        nextLesson: mg7-004
        hook:
          question: >-
            In chapter 2 the engine pushed bodies out of walls. Tetris pieces never overlap anything, not even for a frame.
            How?
          realWorldContext: >-
            Grid games (Tetris, Sokoban, roguelikes, chess) check a move before making it. "Would it fit?" is the one rule
            every later rule in this game uses: falling, turning and game over.
        intuition:
          prose:
            - >-
              An O piece sits at x = 0: cells at columns 0 and 1. Pressing ← would put them at columns −1 and 0. Column −1 is
              outside the well, so the move is refused and the piece stays.
            - >-
              canPlace(cells, x, y) checks each cell: column below 0 or above 9, or row below 19, means no. A cell on a
              non-zero number in this.cells means no. Otherwise yes. A row above the top is allowed.
            - >-
              Before reading on, predict: an O at x = 8 (columns 8 and 9). Can it move right? No: column 10 is past the edge.
            - >-
              move(dx, dy) asks canPlace with the moved position; if it fits, it changes x and y and returns true, else it
              returns false and changes nothing. That true or false will matter: next lesson, "could not fall" means "landed".
            - >-
              The keys use isJustPressed: one press, one column. With isPressed the piece would race to the wall in a
              fraction of a second, 60 columns a second.
          callouts:
            - type: procedure
              title: "Procedure: Moves that respect walls"
              body: |-
                Step 1. Write canPlace(cells, x, y): for each [cx, cy], col = x + cx, row = y + cy.
                Step 2. Return false if col < 0, col ≥ 10 or row ≥ 20, or if row ≥ 0 and this.cells[row][col] ≠ 0.
                Step 3. Return true after checking every cell.
                Step 4. Write move(dx, dy): if canPlace at the moved position, change x and y and return true; else return false.
                Step 5. In update: isJustPressed move_left → move(−1, 0); move_right → move(1, 0).
            - type: warning
              title: Check first, then move
              body: >-
                Moving and then checking leaves the piece inside the wall for a moment, and if you forget to move it back
                it stays there. Ask first; move only on yes.
          visualizations:
            - id: GameStudioTask
              title: "Tetris 3: moving, and walls"
              props: { task: tetris-move, lesson: mg7-003, checkpoint: cp-mg7-003-4 }
        math:
          prose:
            - >-
              **Under the hood (optional).** canPlace is a universal statement: every cell $(c, r)$ of the moved piece
              satisfies $0 \leq c < 10$, $r < 20$, and ($r < 0$ or $\text{cells}[r][c] = 0$). It is true only if no cell
              fails, so the loop can stop at the first failure.
            - >-
              Each check is a few comparisons for each of 4 cells, so a move costs about 16 operations, whatever happened
              before. Compare chapter 2's overlap and push: grids make collision exact and cheap.
            - >-
              move returns a boolean, a true-or-false value. Returning what happened, instead of nothing, lets the caller
              decide what to do next: the fall in lesson 7.4 locks the piece when move(0, 1) is false.
          equations: []
          callouts: []
          visualizations: []
        rigor:
          prose:
            - >-
              Formally, the legal positions are those where the piece's cells form a subset of the empty cells of the well
              (with rows above the top allowed). Moves are transitions between legal positions; illegal ones are refused.
            - >-
              The invariant: the piece is in a legal position after every frame. No code path can leave it overlapping.
            - >-
              Picture the empty cells as holes in a board; a legal piece fits entirely into holes.
            - >-
              The same check-before-act shape guards turning, spawning and game over in later lessons; this is the single
              rule the whole game is built on.
          callouts: []
          visualizations: []
        examples:
          - id: mg7-003-ex1
            title: Against the left wall
            difficulty: easy
            problem: An O at x = 0. Can it move left?
            steps:
              - expression: '0 + 0 - 1 = -1 < 0'
                annotation: Its [0, 0] cell would be at column −1.
                strategyTitle: "Step 1: Check the moved cells"
            answer: No; move(−1, 0) returns false and x stays 0.
          - id: mg7-003-ex2
            title: On a filled cell
            difficulty: medium
            problem: cells[5][5] = 2. A single-cell test piece [[1, 0]] at x = 4, y = 5. Can it be placed?
            steps:
              - expression: 'col = 4 + 1 = 5,\ row = 5 + 0 = 5'
                annotation: The cell lands on (5, 5).
                strategyTitle: "Step 1: Where it lands"
              - expression: 'cells[5][5] = 2 \neq 0'
                annotation: Filled, so no.
                strategyTitle: "Step 2: Check the board"
            answer: No, it would overlap a filled cell.
          - id: mg7-003-ex3
            title: Holding the key
            difficulty: hard
            problem: The T starts at x = 4. Holding ← for 0.3 s with isPressed (moving every frame at 60 fps). Where does it end?
            steps:
              - expression: '0.3 \times 60 = 18 \text{ tries}'
                annotation: One move attempt per frame.
                strategyTitle: "Step 1: Count the tries"
              - expression: 'x = 1 \text{ (its } [-1, 0] \text{ cell at column } 0)'
                annotation: It stops at the wall after 3 moves and the rest are refused.
                strategyTitle: "Step 2: Where the wall stops it"
            answer: At x = 1, against the wall; with isJustPressed it would be at x = 3.
        challenges:
          - id: mg7-003-ch1
            title: Right wall
            difficulty: easy
            problem: The I is [−1,0],[0,0],[1,0],[2,0]. What is the largest x it can have?
            hint: Its rightmost offset is 2.
            answer: x = 7, putting its last cell at column 9.
            walkthrough:
              - expression: 'x + 2 \leq 9'
                annotation: The last cell must be at most column 9.
          - id: mg7-003-ch2
            title: The floor
            difficulty: medium
            problem: The O ([0,0],[1,0],[0,1],[1,1]). What is the largest y it can have on an empty board?
            hint: Its lowest offset is 1.
            answer: y = 18, putting its bottom cells in row 19.
            walkthrough: []
          - id: mg7-003-ch3
            title: Debug the stuck piece
            difficulty: hard
            problem: A learner's move does p.x += dx; then if (!canPlace(p.cells, p.x, p.y)) return false. Moving into a wall leaves the piece inside it. Why?
            hint: What happens to x when it does not fit?
            answer: It moved before checking and never moved back; check canPlace at x + dx first and change x only if it fits.
            walkthrough: []
        semantics:
          core:
            - { symbol: "canPlace(cells, x, y)", meaning: "Whether every cell, placed there, is inside the well and on an empty cell." }
            - { symbol: "move(dx, dy)", meaning: "Moves if it fits; returns true if it moved, false if not." }
            - { symbol: "boolean", meaning: "A true-or-false value." }
            - { symbol: "isJustPressed", meaning: "True only on the frame the key goes down." }
          rulesOfThumb:
            - Check first, then move.
            - Return what happened, so callers can react.
            - One press, one step, for grid moves.
            - Allow rows above the top, so pieces can turn as they enter.
        misconceptions:
          - falseBelief: Tetris walls work like chapter 2's physics walls.
            whyStudentsThinkIt: Both stop things.
            correctionExample: A Tetris piece never overlaps a wall even for a frame; the move is refused.
            contrastCase: Physics moves first and pushes out after.
          - falseBelief: A refused move should move the piece as far as it can.
            whyStudentsThinkIt: Sliding up to a wall seems natural.
            correctionExample: Moving by 1 either happens fully or not at all.
            contrastCase: On a grid there is no "partly" a cell.
        transferPrompts:
          - situation: In Sokoban, the player pushes a crate one square.
            competingTechniques:
              - Check the crate's new square is empty, then move both
              - Move both and undo if it overlaps
            whyThisTechniqueWins: Checking first never puts the board in an illegal state.
          - situation: A chess program generates moves.
            competingTechniques:
              - Test each candidate square before allowing it
              - Allow any and fix later
            whyThisTechniqueWins: Only legal positions are ever reached.
        debugging:
          - commonError: Testing col > 10 instead of col >= 10.
            symptom: Pieces can poke one column past the right edge, where there is no sprite.
            whyItHappened: Columns go 0 to 9; 10 is outside.
            repairStrategy: Use col >= COLS.
          - commonError: Reading this.cells[row] for a negative row.
            symptom: An error about reading undefined, when a piece turns near the top.
            whyItHappened: There is no row −1.
            repairStrategy: Only look in this.cells when row >= 0.
        mastery:
          targetLevel: 3
          solveIndependently: Write canPlace and move, and wire the keys.
          explainVerbally: Explain why checking before moving keeps the game legal.
          detectIncorrectApplication: Spot move-then-check code and off-by-one edges.
          transferToUnfamiliar: Apply check-before-act to any grid game.
        assessment:
          questions:
            - id: mg7-003-assess-1
              type: choice
              text: An O at x = 8. Can it move right?
              options: ["No, column 10 is outside", "Yes", "Only on the floor", "Only with isPressed"]
              answer: "No, column 10 is outside"
              hint: Its cells are at 8 and 9.
        quiz:
          - id: mg7-003-quiz-1
            type: choice
            text: What does move return when the piece cannot move?
            options: ["false", "true", "nothing", "the new x"]
            answer: "false"
            hints:
              - It reports what happened.
            reviewSection: "Intuition — the move paragraph"
          - id: mg7-003-quiz-2
            type: choice
            text: Which cell fails canPlace?
            options: ["Column 10", "Row −1", "Row 19, column 9 when empty", "Row 0, column 0 when empty"]
            answer: "Column 10"
            hints:
              - Rows above the top are allowed.
            reviewSection: "Intuition — the canPlace paragraph"
          - id: mg7-003-quiz-3
            type: choice
            text: Why use isJustPressed for ← and →?
            options: ["One press, one column", "It is faster", "isPressed does not work", "To allow turning"]
            answer: "One press, one column"
            hints:
              - isPressed is true every frame.
            reviewSection: "Examples — Holding the key"
          - id: mg7-003-quiz-4
            type: choice
            text: The largest x for the I piece ([−1..2, 0])?
            options: ["7", "9", "8", "6"]
            answer: "7"
            hints:
              - Its last cell at 9.
            reviewSection: "Challenges — right wall"
          - id: mg7-003-quiz-5
            type: choice
            text: Which of these is NOT checked by canPlace?
            options: ["Rows above the top", "The left wall", "The floor", "Filled cells"]
            answer: "Rows above the top"
            hints:
              - They are allowed.
            reviewSection: "Under the hood — the statement"
          - id: mg7-003-quiz-6
            type: choice
            text: A move that would overlap a filled cell does what?
            options: ["Nothing; the piece stays", "Moves part way", "Pushes the piece back", "Ends the game"]
            answer: "Nothing; the piece stays"
            hints:
              - All or nothing.
            reviewSection: "Misconceptions — partial moves"
        checkpoints:
          - { id: cp-mg7-003-1, label: "Read how a move is checked", type: read }
          - { id: cp-mg7-003-2, label: "Read why move returns true or false", type: read }
          - { id: cp-mg7-003-3, label: "Read the moving procedure", type: read }
          - { id: cp-mg7-003-4, label: "Complete \"Tetris 3: moving, and walls\" in Game Studio", type: lab }
          - { id: cp-mg7-003-5, label: "Try isPressed instead in Game Studio and feel the difference", type: lab }
          - { id: cp-mg7-003-6, label: "Work through the filled-cell example", type: example }
          - { id: cp-mg7-003-7, label: "Work through the holding-the-key example", type: example }
          - { id: cp-mg7-003-8, label: "Attempt the stuck-piece challenge", type: challenge }

      # ───────────────────────────────────────────────────────────── 7.4
      - order: 4
        id: mg7-004
        slug: falling-and-landing
        title: "Tetris 4: Falling and Landing"
        subtitle: A timer made from dt, a piece that lands, and the next one.
        tags: [game-studio, tetris, timers]
        aliases: timer interval fall lock soft drop dt accumulate land
        timeToComplete: 25
        coreConcept: >-
          A timer is dt added up. When it reaches the fall interval the piece tries to move down; if move(0, 1) is refused,
          the piece has landed, so lock() copies its cells into the board and a new piece spawns.
        prerequisites: [mg7-003]
        nextLesson: mg7-005
        hook:
          question: >-
            Tetris pieces fall one row every half second, not smoothly. And when one cannot fall any further it becomes part
            of the pile. How does the game know the moment it lands?
          realWorldContext: >-
            Timers made from dt run cooldowns, spawns, day–night cycles and turn clocks. And "the move failed, so something
            happened" is a pattern every grid game uses.
        intuition:
          prose:
            - >-
              Add `timer = 0` and `interval = 0.5` to the class. Each frame, `this.timer += dt`. At 60 frames a second, after
              30 frames the timer reaches 0.5: set it back to 0 and move(0, 1). One row every half second.
            - >-
              Before reading on, predict: starting at row 1, where is the piece after 2.1 seconds? Four falls (at 0.5, 1.0,
              1.5 and 2.0 s): row 5.
            - >-
              When move(0, 1) returns false, the piece cannot fall: it is on the floor or on the pile. That false is the
              landing: `if (!this.move(0, 1)) this.lock()`.
            - >-
              lock() writes the piece into the board: for each of its cells, `this.cells[p.y + y][p.x + x] = colourOf(p.type)`.
              Now those cells are part of the pile, and the next piece will stop on them. Then spawn a new piece.
            - >-
              Soft drop: while ↓ is held, use 0.05 s instead of the interval, so the piece falls ten times as fast.
          callouts:
            - type: procedure
              title: "Procedure: Fall, land and lock"
              body: |-
                Step 1. Fields: timer = 0, interval = 0.5.
                Step 2. In update: this.timer += dt; const wait = input.isPressed('move_down') ? 0.05 : this.interval.
                Step 3. If this.timer >= wait: this.timer = 0, then if (!this.move(0, 1)) this.lock().
                Step 4. lock(): copy each of the piece's cells into this.cells with its colour number, then spawn.
                Step 5. Run: pieces fall, pile up, and ↓ drops them faster.
            - type: warning
              title: Count seconds, not frames
              body: >-
                Falling every 30 frames is half a second at 60 fps but a fifth of a second at 144. Add dt to the timer, as in
                lesson 1.3, so it is half a second everywhere.
          visualizations:
            - id: GameStudioTask
              title: "Tetris 4: falling and landing"
              props: { task: tetris-fall, lesson: mg7-004, checkpoint: cp-mg7-004-4 }
        math:
          prose:
            - >-
              **Under the hood (optional).** The timer after $n$ frames is $\sum dt_i$, the elapsed time. Falling whenever it
              passes the interval $I$ gives $\lfloor t / I \rfloor$ falls in $t$ seconds: $\lfloor 2.1 / 0.5 \rfloor = 4$.
            - >-
              Setting the timer back to 0 (rather than subtracting $I$) loses the leftover each time, up to one frame's
              worth, so over many falls it drifts slightly slow. Subtracting keeps exact time; for Tetris either feels the same.
            - >-
              From row 1, a T (bottom offset 0) falls until its bottom cells reach row 19: 18 falls, $18 \times 0.5 = 9$ s.
              With soft drop, $18 \times 0.05 = 0.9$ s.
          equations: []
          callouts: []
          visualizations: []
        rigor:
          prose:
            - >-
              Formally, the game has two clocks: the frame clock (variable $dt$) and the fall clock (fixed $I$). The timer
              converts one into the other; this is how fixed-rate events are scheduled in a variable-rate loop.
            - >-
              The invariant of lock: after it, the board contains every landed cell exactly once, and the falling piece is a
              new one at the top.
            - >-
              Picture time as a line marked every $I$ seconds; each mark is a fall attempt, and a refused attempt is a landing.
            - >-
              Real Tetris games add "lock delay", a short grace after touching down when the piece can still slide; it is a
              second timer that starts when move(0, 1) first fails.
          callouts: []
          visualizations: []
        examples:
          - id: mg7-004-ex1
            title: Falls in 2.1 seconds
            difficulty: easy
            problem: Interval 0.5 s, starting at row 1. Which row after 2.1 s?
            steps:
              - expression: '\lfloor 2.1 / 0.5 \rfloor = 4'
                annotation: Four whole intervals have passed.
                strategyTitle: "Step 1: Count the falls"
              - expression: '1 + 4 = 5'
                annotation: One row per fall.
                strategyTitle: "Step 2: Add them"
            answer: Row 5.
          - id: mg7-004-ex2
            title: Time to land
            difficulty: medium
            problem: A T spawns at row 1 on an empty board. How long until it locks?
            steps:
              - expression: '19 - 1 = 18 \text{ falls}'
                annotation: Its bottom cells start in row 1 and stop in row 19.
                strategyTitle: "Step 1: Falls needed"
              - expression: '18 \times 0.5 + 0.5 = 9.5\ \text{s}'
                annotation: Plus one more interval for the refused fall that locks it.
                strategyTitle: "Step 2: Time"
            answer: About 9.5 seconds (9 s to arrive, plus the refused fall).
          - id: mg7-004-ex3
            title: What lock writes
            difficulty: hard
            problem: A T (colour 3) locks at x = 4, y = 19. Which cells become 3?
            steps:
              - expression: '(3,19),(4,19),(5,19),(4,18)'
                annotation: The offsets [−1,0],[0,0],[1,0],[0,−1] from (4, 19).
                strategyTitle: "Step 1: The cells"
              - expression: 'cells[19][3..5] = 3,\ cells[18][4] = 3'
                annotation: As rows and columns.
                strategyTitle: "Step 2: Into the board"
            answer: Row 19 columns 3–5 and row 18 column 4 become 3.
        challenges:
          - id: mg7-004-ch1
            title: Faster level
            difficulty: easy
            problem: With interval 0.25 s, how many falls in 3 s?
            hint: Time ÷ interval.
            answer: 12 falls.
            walkthrough:
              - expression: '3 / 0.25 = 12'
                annotation: Whole intervals.
          - id: mg7-004-ch2
            title: Soft drop time
            difficulty: medium
            problem: Holding ↓ the whole way from row 1 to 19, how long does the fall take?
            hint: 18 falls at 0.05 s.
            answer: 0.9 seconds.
            walkthrough: []
          - id: mg7-004-ch3
            title: Debug the hovering pile
            difficulty: hard
            problem: Pieces stop at the bottom, but the next piece falls straight through the last one. lock() only calls this.spawn('T'). What is missing?
            hint: What makes landed cells solid for canPlace?
            answer: lock never writes the piece into this.cells, so canPlace sees empty cells; write each cell's colour before spawning.
            walkthrough: []
        semantics:
          core:
            - { symbol: "timer", meaning: "Seconds added up from dt; reaching the interval triggers a fall." }
            - { symbol: "interval", meaning: "Seconds between falls (0.5)." }
            - { symbol: "lock()", meaning: "Copies the landed piece into the board and spawns the next." }
            - { symbol: "soft drop", meaning: "A shorter wait (0.05 s) while ↓ is held." }
            - { symbol: "⌊t / I⌋", meaning: "How many falls happen in t seconds." }
          rulesOfThumb:
            - Build timers from dt.
            - Treat a refused fall as a landing.
            - Lock, then spawn, in that order.
            - Keep the fall interval in one field, so levels can change it.
        misconceptions:
          - falseBelief: The piece should check every frame whether something is below it.
            whyStudentsThinkIt: Landing seems like something to watch for.
            correctionExample: The landing is simply move(0, 1) returning false at a fall.
            contrastCase: One check per fall attempt is enough, and it is the same check as moving.
          - falseBelief: Landed pieces stay as pieces.
            whyStudentsThinkIt: They still look like their shapes.
            correctionExample: After lock, the T is just four 3s in this.cells; there is no T object any more.
            contrastCase: That is what lets lines clear through the middle of old pieces (next lessons).
        transferPrompts:
          - situation: A turn-based game gives each player 30 seconds.
            competingTechniques:
              - A timer adding dt, compared with 30
              - Counting frames up to 1800
            whyThisTechniqueWins: dt makes it 30 real seconds on any screen.
          - situation: In a match-three game, gems fall into gaps.
            competingTechniques:
              - Try moving each gem down a row each step; stop when refused
              - Animate them smoothly and hope they line up
            whyThisTechniqueWins: The same check-and-move rule keeps the grid exact.
        debugging:
          - commonError: Not resetting the timer.
            symptom: After the first half second the piece falls every frame and slams down.
            whyItHappened: The timer stays above the interval.
            repairStrategy: Set this.timer = 0 when it fires.
          - commonError: Spawning before copying the piece into the board.
            symptom: Nothing locks; pieces vanish when they land.
            whyItHappened: spawn replaced this.piece before its cells were written.
            repairStrategy: Write the cells first, then spawn.
        mastery:
          targetLevel: 3
          solveIndependently: Make pieces fall on a timer, land and lock.
          explainVerbally: Explain timers from dt and why a refused fall means landing.
          detectIncorrectApplication: Spot frame-counted timers and lock order bugs.
          transferToUnfamiliar: Schedule fixed-rate events in any game.
        assessment:
          questions:
            - id: mg7-004-assess-1
              type: choice
              text: Interval 0.5 s from row 1. Row after 2.1 s?
              options: ["5", "4", "3", "6"]
              answer: "5"
              hint: Four falls.
        quiz:
          - id: mg7-004-quiz-1
            type: choice
            text: What makes the timer?
            options: ["Adding dt each frame", "Adding 1 each frame", "The clock on the wall", "physicsUpdate"]
            answer: "Adding dt each frame"
            hints:
              - Seconds, not frames.
            reviewSection: "Intuition — Warning: count seconds"
          - id: mg7-004-quiz-2
            type: choice
            text: What tells the game a piece has landed?
            options: ["move(0, 1) returning false", "Its y reaching 19", "A collision event", "The timer reaching 0"]
            answer: "move(0, 1) returning false"
            hints:
              - It could not fall.
            reviewSection: "Intuition — the landing paragraph"
          - id: mg7-004-quiz-3
            type: choice
            text: What does lock() do first?
            options: ["Writes the piece's cells into the board", "Spawns a new piece", "Clears lines", "Resets the timer"]
            answer: "Writes the piece's cells into the board"
            hints:
              - Then spawn.
            reviewSection: "Intuition — the lock paragraph"
          - id: mg7-004-quiz-4
            type: choice
            text: Soft drop wait?
            options: ["0.05 s", "0.5 s", "0 s", "1 s"]
            answer: "0.05 s"
            hints:
              - Ten times faster.
            reviewSection: "Intuition — soft drop"
          - id: mg7-004-quiz-5
            type: choice
            text: Which of these is NOT left after a T locks?
            options: ["A T object", "Four 3s in this.cells", "A new falling piece", "The pile"]
            answer: "A T object"
            hints:
              - It is just numbers now.
            reviewSection: "Misconceptions — landed pieces"
          - id: mg7-004-quiz-6
            type: choice
            text: Falls in 3 s at interval 0.25 s?
            options: ["12", "4", "6", "0.75"]
            answer: "12"
            hints:
              - 3 ÷ 0.25.
            reviewSection: "Under the hood — counting falls"
        checkpoints:
          - { id: cp-mg7-004-1, label: "Read how the timer works", type: read }
          - { id: cp-mg7-004-2, label: "Read how landing is detected", type: read }
          - { id: cp-mg7-004-3, label: "Read the fall procedure", type: read }
          - { id: cp-mg7-004-4, label: "Complete \"Tetris 4: falling and landing\" in Game Studio", type: lab }
          - { id: cp-mg7-004-5, label: "Stack several pieces in Game Studio", type: lab }
          - { id: cp-mg7-004-6, label: "Work through the time-to-land example", type: example }
