                        // Every move costs 1; the spikes cost 100 and send you back to the start. A state is column × 4 + row.
                        const seeded = (seed) => { let a = seed >>> 0; return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296 } }
                        const MOVES = [[0, -1], [1, 0], [0, 1], [-1, 0]], ARROWS = ['↑', '→', '↓', '←'], START = 0 * 4 + 3, CHEST = 11 * 4 + 3
                        function move(s, a) {
                          const x = Math.min(11, Math.max(0, Math.floor(s / 4) + MOVES[a][0])), y = Math.min(3, Math.max(0, (s % 4) + MOVES[a][1]))
                          if (y === 3 && x > 0 && x < 11) return { next: START, reward: -100, done: false }
                          const next = x * 4 + y
                          return { next, reward: -1, done: next === CHEST }
                        }
                        const greedyOf = (row, rand) => { const best = Math.max(...row), ties = []; row.forEach((q, a) => { if (q === best) ties.push(a) }); return ties[Math.floor(rand() * ties.length)] }
                        // One learner, either update. SARSA chooses A′ before updating and then takes it; Q-learning uses the max.
                        function train(method, { episodes = 500, alpha = 0.5, gamma = 1, eps0 = 0.1, eps1 = 0.1, seed = 1 } = {}) {
                          const rand = seeded(seed), Q = Array.from({ length: 48 }, () => [0, 0, 0, 0]), returns = []
                          const choose = (s, eps) => (rand() < eps ? Math.floor(rand() * 4) : greedyOf(Q[s], rand))
                          for (let ep = 0; ep < episodes; ep++) {
                            const eps = eps0 + (eps1 - eps0) * (ep / Math.max(1, episodes - 1))
                            let s = START, a = choose(s, eps), total = 0
                            for (let t = 0; t < 1000; t++) {
                              const r = move(s, a)
                              total += r.reward
                              const a2 = choose(r.next, eps)
                              const future = r.done ? 0 : method === 'sarsa' ? Q[r.next][a2] : Math.max(...Q[r.next])
                              Q[s][a] += alpha * (r.reward + gamma * future - Q[s][a])
                              if (r.done) break
                              s = r.next
                              a = method === 'sarsa' ? a2 : choose(s, eps)
                            }
                            returns.push(total)
                          }
                          return { Q, returns }
                        }
                        // The greedy walk: the cells it passes and its length.
                        function walk(Q) {
                          let s = START, moves = 0
                          const cells = new Set([s])
                          while (s !== CHEST && moves < 60) { const a = Q[s].indexOf(Math.max(...Q[s])); s = move(s, a).next; cells.add(s); moves++ }
                          return { moves, cells }
                        }
                        const mean = (xs) => xs.reduce((a, b) => a + b, 0) / xs.length

                        // Theory says SARSA reaches the optimal policy if exploration fades towards zero but never stops (GLIE). Here ε
                        // falls in a straight line from 0.1 to exactly 0, so in the last episodes it explores nothing.
                        // Predict first: given 500, 2000 or 5000 episodes, does SARSA switch to the 13-move walk?
                        for (const episodes of [500, 2000, 5000]) {
                          const runs = Array.from({ length: 10 }, (_, k) => train('sarsa', { seed: k + 1, episodes, eps0: 0.1, eps1: 0 }))
                          console.log('SARSA, ε 0.1 → 0 over ' + episodes + ' episodes: greedy walk ' + runs.map((r) => walk(r.Q).moves).join(', ') + ' moves')
                        }
