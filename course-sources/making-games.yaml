                annotation: Two bricks, one lost ball.
                strategyTitle: "Step 1: add"
            answer: −1.
          - id: mg9-003-ex2
            title: An observation
            difficulty: medium
            problem: The ball is at x 300, falling; the paddle at x 420. What does observe() return, and which bin across is it in?
            steps:
