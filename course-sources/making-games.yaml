            title: Why the freeze
            difficulty: hard
            problem: Explain cell 4. Why does ε reaching exactly 0 keep SARSA on the 17-move walk even after 5000 episodes?
            hint: Which state-action pairs get updated after ε is 0?
            answer: >-
              With ε = 0, SARSA only takes greedy actions along its learned walk, so the edge cells are never visited and
              their values are never corrected; nothing tells it the edge is shorter. GLIE needs ε to shrink but stay above
              0 so that every pair keeps being tried.
