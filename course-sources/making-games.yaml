        timeToComplete: 55
        coreConcept: >-
          An agent learns only about what it tries. Always taking the action that currently looks best (exploiting) can
          lock it onto a mediocre choice; trying others (exploring) costs reward now for knowledge later. ε-greedy explores
          at random with probability ε, often decaying ε over time; softmax prefers better-looking actions by a
          temperature τ; optimistic initial values make untried actions look best, so a greedy agent tries them; UCB adds
          a bonus for actions tried rarely. To learn the optimal policy, every action must keep being tried, while the
          policy becomes greedy in the limit (GLIE).
        prerequisites: [mg9-001]
        nextLesson: mg9-003
        hook:
          question: >-
            You find a restaurant you like. Do you go back every time, or try the new place, which might be better or
            worse? An agent faces that choice on every step, and its answer decides what it can ever learn.
          realWorldContext: >-
            Recommendation systems, clinical trials and A/B tests are bandit problems; game AI tuned by learning faces the
            same trade-off. Sutton & Barto, chapter 2, introduces it with the 10-armed testbed used here.
        intuition:
          prose:
            - >-
              **The bandit.** The simplest setting has one state and ten actions, slot machines with unknown average
              payouts. The agent estimates each arm's value from the rewards it gets, $Q(a) \leftarrow Q(a) + \frac{1}{N(a)}[R - Q(a)]$:
              the same "old + step × (target − old)" as TD, with a target that is just the reward (cell 3). Before running
              cell 1, predict whether always taking the best-looking arm (greedy) does well: it does not. Over 200 problems
              it finds the best arm only 42% of the time by the end, and averages 1.01 reward per pull, against ε-greedy's
              82% and 1.25 with ε = 0.1.
            - >-
              **Why greedy fails.** An arm that pays badly on its first pull gets a low estimate and is never tried again,
              so the estimate is never corrected. Exploration is the only way to fix a wrong low estimate. ε = 0.01 explores
              less, so it is slower to find the best arm (61% by 1000 pulls) but wastes fewer pulls once it has: in the long
              run it overtakes ε = 0.1.
            - >-
              **Optimism.** Start every estimate high (Q₀ = 5, above any arm's value). Every arm disappoints when tried, so the
              untried ones look best and a purely greedy agent tries them all. It is the best of cell 2's methods late on
              (1.41). On Cliff Walk every real return is negative, so Q₀ = 0 is already optimistic: greedy Q-learning (ε = 0)
              finds the 13-move walk on all 5 seeds with no random moves at all. With a pessimistic Q₀ = −100 it stops
              exploring early and keeps a longer walk on 3 of 5 seeds (greedy return −14.2 ± 1.1).
            - >-
              **UCB and softmax.** UCB (upper confidence bound) picks $\arg\max_a [Q(a) + c\sqrt{\ln t / N(a)}]$: an arm
              tried rarely gets a large bonus, which shrinks as it is tried. Softmax (Boltzmann) picks $a$ with probability
              $e^{Q(a)/\tau} / \sum_b e^{Q(b)/\tau}$: better-looking arms more often, but every arm sometimes; a high temperature τ
              is nearly random, a low one nearly greedy. Unlike ε-greedy, both explore *in proportion to* what they know.
            - >-
              **Schedules.** In a sequential problem, exploration has a cost every step: on the cliff a random step next to
              the spikes falls off. Comparing over 5 seeds (200 episodes, α 0.5, γ 1), the average return of the last 50
              training episodes is −43.4 ± 7.2 with ε constant at 0.1, −25.9 ± 8.1 with ε falling linearly from 0.3 to 0.01,
              −16.7 ± 2.1 falling exponentially, and −13.0 ± 0 for softmax with τ falling from 5 to 0.1. All of them, played
              greedily at the end, take the 13-move walk. Decaying exploration is how you explore early and exploit late;
              the theory's condition is GLIE: greedy in the limit, with infinite exploration.
          callouts:
            - type: procedure
              title: "Procedure: choosing how to explore"
              body: >-
                Step 1. Start simple: ε-greedy with ε around 0.1.
                Step 2. If exploration is costly during learning (falls, deaths), decay it: linear or exponential, to near 0.
                Step 3. If rewards are all negative and the problem is small, try a greedy agent with optimistic starting
                values.
                Step 4. Compare settings over several seeds; report the mean and spread of both the learning return and the
                final greedy score.
            - type: warning
              title: Two numbers, two questions
              body: >-
                "How well did it do while learning?" (late training return, with exploration on) and "how good is what it
                learned?" (greedy score, exploration off) are different questions. On the cliff ε = 0.1 constant does worst at
                the first and as well as any at the second.
            - type: warning
              title: Optimism only works when it is optimistic
              body: >-
                Q₀ must be above the true values. On the cliff 0 is optimistic and −100 is not. With rewards that can be large
                and positive, a Q₀ of 0 is pessimistic, and a greedy agent stops exploring.
            - type: insight
              title: "What the picture shows (cell 4)"
              body: >-
                Misconception it contradicts: "exploring wastes reward". The greedy line rises fastest at first and then stays
                lowest; the methods that explore pay early and earn more later.
            - type: insight
              title: In the ML Lab
              body: >-
                ML Lab lesson 37.2 derives ε-greedy's probabilities, and lesson 37.4 uses them in Q-learning. [Open the ML
                Lab](#/lab/ml-lab).
