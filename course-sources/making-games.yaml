                      solutionCode: |-
                        // Write the state number for binned readings, as Game Studio does: a reading's bin is how many cuts are below it, and
                        // the readings combine like digits, the first most significant: state = ((b₁ × n₂ + b₂) × n₃ + b₃) …, where n is a
                        // reading's number of bins (cuts + 1).
                        function stateOf(values, bins) {
                          let s = 0
                          bins.forEach((cuts, i) => {
                            if (!cuts.length) return
                            let b = 0
                            while (b < cuts.length && values[i] >= cuts[b]) b++
                            s = s * (cuts.length + 1) + b
                          })
                          return s
                        }

                        // ── The check (leave this part as it is) ──
                        const B = [[-0.25, -0.1, -0.03, 0.03, 0.1, 0.25], [0.5]]
                        const cases = [
                          { args: [[0, 1], B], want: 7, why: 'across 0 is bin 3 (three cuts below it); falling 1 is bin 1; 3 × 2 + 1' },
                          { args: [[-0.9, 1], B], want: 1, why: 'across is in its first bin (0); falling is bin 1: 0 × 2 + 1' },
                          { args: [[0.25, 0], B], want: 12, why: 'a value equal to a cut is in the bin above it: 0.25 is bin 6; 6 × 2 + 0' },
                          { args: [[5, 2, 7], [[3], [], [1, 5, 9]]], want: 6, why: 'a reading with no cuts is not part of the state: bins 1 and 2, with 4 bins in the last: 1 × 4 + 2' },
                        ]
                        let passed = 0
                        for (const [i, c] of cases.entries()) {
                          const got = stateOf(...c.args)
                          const ok = got === c.want
                          passed += ok
                          console.log((ok ? '✓' : '✗') + ' case ' + (i + 1) + ': got ' + got + (ok ? '' : ', want ' + c.want + ': ' + c.why))
                        }
                        console.log(passed === cases.length ? '✓ All 4 cases pass: that is how bins make states.' : passed + ' of 4 cases pass.')
            - id: GameStudioTask
              title: How many states?
              props:
                task: state-design
                lesson: mg9-007
                checkpoint: cp-mg9-007-4
        math:
          prose:
            - >-
              **Under the hood (optional).** Binning is *state aggregation*: a map $\phi$ from situations to a finite set,
              with one value per group. Q-learning on aggregated states converges, but to values of a different (aggregated)
              problem; its greedy policy is optimal for the original only if each group's situations share their best action.
            - >-
              The Markov property, formally: $P(S_{t+1} = s', R_{t+1} = r \mid S_t, A_t) = P(S_{t+1} = s', R_{t+1} = r \mid H_t, A_t)$
              for the whole history $H_t$. When the observation is not Markov, the problem is a POMDP; remedies are
              adding history (velocity, the last few observations) or engineering a sufficient statistic (where the ball
              will land).
            - >-
              With d numbers each in k bins there are $k^d$ states: the curse of dimensionality. A fixed budget of N updates
              gives about $N / k^d$ per state.
          equations:
            - label: Markov property
              latex: 'P(S_{t+1}, R_{t+1} \mid S_t, A_t) = P(S_{t+1}, R_{t+1} \mid S_t, A_t, S_{t-1}, A_{t-1}, \ldots)'
            - label: State count
              latex: '|\mathcal{S}| = \prod_{i=1}^{d} k_i = k^d'
            - label: Updates per state
              latex: '\frac{N}{|\mathcal{S}|}'
          callouts: []
          visualizations: []
        rigor:
          prose:
            - >-
              Formal statement: an aggregation is $Q^*$-irrelevant if situations grouped together have equal optimal action
              values; Q-learning on such an aggregation finds an optimal policy (Li, Walsh & Littman, 2006).
            - >-
              Invariant: refining bins never removes information, so the best achievable policy can only improve; what
              suffers is learning speed.
            - >-
              Geometric picture: bins are a grid over the observation space; aliasing is a cell that straddles a boundary
              where the best action changes.
            - >-
              Where it goes: 9.8 replaces the grid with features that let nearby situations share what they learn.
          callouts: []
          visualizations: []
        examples:
          - id: mg9-007-ex1
            title: A state number
            difficulty: easy
            problem: Across 0.05 with Breakout's cuts, falling 0. Which state?
            steps:
              - expression: '0.05 \to \text{bin } 4'
