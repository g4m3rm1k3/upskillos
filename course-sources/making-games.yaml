      # ───────────────────────────────────────────────────────────── 9.6
      - order: 6
        id: mg9-006
        slug: experiments-that-mean-something
        title: Experiments That Mean Something
        subtitle: One run proves little. Seeds, spread, confidence intervals, parameter studies, and what γ really chooses.
        tags: [game-studio, machine-learning, reinforcement-learning, experiments, hyperparameters, statistics, reporting]
        aliases: seeds variance standard deviation standard error confidence interval parameter study step size alpha discount gamma learning curve report results reproducibility
        timeToComplete: 50
        coreConcept: >-
          A learning run is random: a different seed gives a different result, so one run is one sample. Run every
          setting over several seeds (the same seeds for each), report the mean with its spread, and know how sure the mean
          is: its 95% confidence interval is about mean ± t × sd / √n, which shrinks only like 1/√n. A parameter study
          sweeps one setting at a time this way. Some settings change what the agent wants rather than how well it learns:
          γ decides how much a later reward counts, so it changes the right answer itself.
        prerequisites: [mg9-005]
        nextLesson: mg9-007
        hook:
          question: >-
            You change α from 0.3 to 0.5 and the score goes up by 5. Did α help, or did you get a luckier run? How would you
            know, and what would you write in a report?
          realWorldContext: >-
            Reinforcement learning results are notoriously sensitive to seeds: a 2018 study (Henderson et al., "Deep
            Reinforcement Learning that Matters") showed published comparisons that disappeared over more seeds. Reporting
            means, spreads and the number of runs is now expected, in papers and in assignments.
        intuition:
          prose:
            - >-
              **One run is one sample.** Cell 1 runs the same Q-learning on the cliff with 10 seeds: the average return over
              100 episodes ranges from −73.1 to −92.7 (mean −83.6, sample sd 5.7). A single run tells you the setting can
              give anything in that range. Before running it, predict how far apart the best and worst are.
            - >-
              **How sure is a mean?** Its standard error is $s/\sqrt{n}$; a 95% confidence interval is
              $\bar{x} \pm t_{n-1}\, s/\sqrt{n}$ (t ≈ 2.26 for 10 runs, near 2 for many). Cell 2: ±9.1 with 5 seeds, ±4.1 with
              10, ±3.3 with 20, ±2.0 with 50. Halving the interval takes four times the seeds. Two settings whose intervals
              overlap a lot have not been shown to differ.
            - >-
              **A parameter study** (cell 3, and drawn in cell 5) sweeps one setting with everything else fixed, the same seeds
              each. On the cliff, the bigger α the better over 100 episodes: −209.7 at 0.05, −83.6 at 0.5, −71.2 at 0.9. That
              is because the cliff has no randomness except the agent's own; where rewards or moves are noisy, large α chases
              noise (lesson 9.5: SARSA at α = 1). Conclusions hold for the problem you measured, not in general.
            - >-
              **γ is a choice, not a knob to tune for score.** Cell 4: a corridor with +1 one step away and +10 nine steps the
              other way. The far exit is worth $10\gamma^9$ now, so the agent should go for it only if $\gamma > 0.1^{1/9} \approx 0.774$.
              Learned with exploring starts (each episode in a random cell): γ = 1, 0.9 and 0.8 go right; 0.7 and 0.5 take the
              near +1. Changing γ changes what "best" means. Choose it for what you want, then tune α and exploration.
            - >-
              **What to report.** The setting (every parameter), the number of seeds and that they were shared, the mean and
              its interval (or the sample standard deviation and n), the learning curve averaged over seeds, and both
              questions from lesson 9.2: return while learning, and greedy score after. Game Studio's Compare reports the last
              two as mean ± sample sd over its seeds.
          callouts:
            - type: procedure
              title: "Procedure: an experiment you can report"
              body: >-
                Step 1. Fix everything but the one thing you study.
                Step 2. Choose seeds in advance, the same for every setting; at least 5, more if results are close.
                Step 3. Record each run: the curve, the late learning return, the greedy score.
                Step 4. Report mean ± 95% interval (or sd and n), and the averaged curves.
                Step 5. Claim a difference only if it is larger than the uncertainty.
            - type: warning
              title: Do not tune on the seeds you report
              body: >-
                Trying many settings and reporting the best on the same seeds picks luck. Tune on some seeds, then report on
                fresh ones (Game Studio's greedy checks and final score use different seeds for the same reason).
            - type: warning
              title: Sample, not population, standard deviation
              body: >-
                The spread of runs estimates the spread of all possible runs, so divide by n − 1, not n. With few seeds it
                matters: for 2 runs the two differ by a factor √2.
            - type: insight
              title: "What the picture shows (cell 5)"
              body: >-
                Misconception it contradicts: "a parameter study gives one best value". The curve with its bars shows which
                differences are larger than the uncertainty, and which neighbouring values are indistinguishable.
          visualizations:
            - id: JSNotebook
              title: "Build it: experiments"
              caption: Seeds, intervals, a step-size study, what γ chooses, and the study drawn.
              props:
                lesson:
                  title: Experiments that mean something
                  subtitle: Seeds, spread and parameters.
                  cells:
                    - type: js
                      instruction: |-
                        ### 1. One run is one sample
                        Predict first: how far apart are the best and worst seed?
                      startCode: |-
                        // The cliff and Q-learning, as in lessons 9.4 and 9.5 (12 × 4, −1 a move, −100 and back to the start for the spikes).
                        const seeded = (seed) => { let a = seed >>> 0; return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296 } }
                        const MOVES = [[0, -1], [1, 0], [0, 1], [-1, 0]], START = 3, CHEST = 47
                        function move(s, a) {
                          const x = Math.min(11, Math.max(0, Math.floor(s / 4) + MOVES[a][0])), y = Math.min(3, Math.max(0, (s % 4) + MOVES[a][1]))
                          if (y === 3 && x > 0 && x < 11) return { next: START, reward: -100, done: false }
                          return { next: x * 4 + y, reward: -1, done: x * 4 + y === CHEST }
                        }
                        function train({ alpha = 0.5, gamma = 1, eps = 0.1, episodes = 100, seed = 1 }) {
                          const rand = seeded(seed), Q = Array.from({ length: 48 }, () => [0, 0, 0, 0]), returns = []
                          const greedyOf = (row) => { const best = Math.max(...row), ties = []; row.forEach((q, a) => { if (q === best) ties.push(a) }); return ties[Math.floor(rand() * ties.length)] }
                          for (let ep = 0; ep < episodes; ep++) {
                            let s = START, total = 0
                            for (let t = 0; t < 500; t++) {
                              const a = rand() < eps ? Math.floor(rand() * 4) : greedyOf(Q[s]), r = move(s, a)
                              Q[s][a] += alpha * (r.reward + (r.done ? 0 : gamma * Math.max(...Q[r.next])) - Q[s][a])
                              total += r.reward; s = r.next
                              if (r.done) break
                            }
                            returns.push(total)
                          }
                          // The greedy walk's return (60 moves at most).
                          let s = START, g = 0
                          for (let k = 0; k < 60 && s !== CHEST; k++) { const r = move(s, Q[s].indexOf(Math.max(...Q[s]))); g += r.reward; s = r.next }
                          return { returns, greedy: s === CHEST ? g : null }
                        }
                        const mean = (xs) => xs.reduce((a, b) => a + b, 0) / xs.length
                        const sd = (xs) => Math.sqrt(xs.reduce((a, x) => a + (x - mean(xs)) ** 2, 0) / (xs.length - 1))

                        // One run is one sample. Q-learning, 100 episodes, α 0.5, ε 0.1: the average return over all 100 episodes, for
                        // 10 different seeds. Predict first: how far apart are the best and worst seed?
                        const results = Array.from({ length: 10 }, (_, k) => mean(train({ seed: k + 1 }).returns))
                        console.log('seeds 1–10: ' + results.map((x) => x.toFixed(1)).join(', '))
                        console.log('best ' + Math.max(...results).toFixed(1) + ', worst ' + Math.min(...results).toFixed(1) + ', mean ' + mean(results).toFixed(1) + ', sample sd ' + sd(results).toFixed(1))
                    - type: js
                      instruction: |-
                        ### 2. How sure is a mean?
                        Predict first: how many seeds halve the interval?
                      startCode: |-
                        // The cliff and Q-learning, as in lessons 9.4 and 9.5 (12 × 4, −1 a move, −100 and back to the start for the spikes).
                        const seeded = (seed) => { let a = seed >>> 0; return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296 } }
                        const MOVES = [[0, -1], [1, 0], [0, 1], [-1, 0]], START = 3, CHEST = 47
                        function move(s, a) {
                          const x = Math.min(11, Math.max(0, Math.floor(s / 4) + MOVES[a][0])), y = Math.min(3, Math.max(0, (s % 4) + MOVES[a][1]))
                          if (y === 3 && x > 0 && x < 11) return { next: START, reward: -100, done: false }
                          return { next: x * 4 + y, reward: -1, done: x * 4 + y === CHEST }
                        }
                        function train({ alpha = 0.5, gamma = 1, eps = 0.1, episodes = 100, seed = 1 }) {
                          const rand = seeded(seed), Q = Array.from({ length: 48 }, () => [0, 0, 0, 0]), returns = []
                          const greedyOf = (row) => { const best = Math.max(...row), ties = []; row.forEach((q, a) => { if (q === best) ties.push(a) }); return ties[Math.floor(rand() * ties.length)] }
                          for (let ep = 0; ep < episodes; ep++) {
                            let s = START, total = 0
                            for (let t = 0; t < 500; t++) {
                              const a = rand() < eps ? Math.floor(rand() * 4) : greedyOf(Q[s]), r = move(s, a)
                              Q[s][a] += alpha * (r.reward + (r.done ? 0 : gamma * Math.max(...Q[r.next])) - Q[s][a])
                              total += r.reward; s = r.next
                              if (r.done) break
                            }
                            returns.push(total)
                          }
                          // The greedy walk's return (60 moves at most).
                          let s = START, g = 0
                          for (let k = 0; k < 60 && s !== CHEST; k++) { const r = move(s, Q[s].indexOf(Math.max(...Q[s]))); g += r.reward; s = r.next }
                          return { returns, greedy: s === CHEST ? g : null }
                        }
                        const mean = (xs) => xs.reduce((a, b) => a + b, 0) / xs.length
                        const sd = (xs) => Math.sqrt(xs.reduce((a, x) => a + (x - mean(xs)) ** 2, 0) / (xs.length - 1))

                        // How sure is a mean? Its standard error is sd / √n, and a 95% confidence interval is about mean ± 2 × sd / √n
                        // (more exactly ± t × sd / √n, with t = 2.26 for 10 seeds, 2.09 for 20, 2.01 for 50). Predict first: how many
                        // seeds halve the interval of 5?
                        const t95 = { 5: 2.78, 10: 2.26, 20: 2.09, 50: 2.01 }
                        for (const n of [5, 10, 20, 50]) {
                          const xs = Array.from({ length: n }, (_, k) => mean(train({ seed: k + 1 }).returns))
                          const half = t95[n] * sd(xs) / Math.sqrt(n)
                          console.log(n + ' seeds: mean ' + mean(xs).toFixed(1) + ' ± ' + half.toFixed(1) + ' (95% interval)')
                        }
                    - type: js
                      instruction: |-
                        ### 3. A parameter study
                        Predict first: is the best α the biggest?
                      startCode: |-
                        // The cliff and Q-learning, as in lessons 9.4 and 9.5 (12 × 4, −1 a move, −100 and back to the start for the spikes).
                        const seeded = (seed) => { let a = seed >>> 0; return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296 } }
                        const MOVES = [[0, -1], [1, 0], [0, 1], [-1, 0]], START = 3, CHEST = 47
                        function move(s, a) {
                          const x = Math.min(11, Math.max(0, Math.floor(s / 4) + MOVES[a][0])), y = Math.min(3, Math.max(0, (s % 4) + MOVES[a][1]))
                          if (y === 3 && x > 0 && x < 11) return { next: START, reward: -100, done: false }
                          return { next: x * 4 + y, reward: -1, done: x * 4 + y === CHEST }
                        }
                        function train({ alpha = 0.5, gamma = 1, eps = 0.1, episodes = 100, seed = 1 }) {
                          const rand = seeded(seed), Q = Array.from({ length: 48 }, () => [0, 0, 0, 0]), returns = []
                          const greedyOf = (row) => { const best = Math.max(...row), ties = []; row.forEach((q, a) => { if (q === best) ties.push(a) }); return ties[Math.floor(rand() * ties.length)] }
                          for (let ep = 0; ep < episodes; ep++) {
                            let s = START, total = 0
                            for (let t = 0; t < 500; t++) {
                              const a = rand() < eps ? Math.floor(rand() * 4) : greedyOf(Q[s]), r = move(s, a)
                              Q[s][a] += alpha * (r.reward + (r.done ? 0 : gamma * Math.max(...Q[r.next])) - Q[s][a])
                              total += r.reward; s = r.next
                              if (r.done) break
                            }
                            returns.push(total)
                          }
                          // The greedy walk's return (60 moves at most).
                          let s = START, g = 0
                          for (let k = 0; k < 60 && s !== CHEST; k++) { const r = move(s, Q[s].indexOf(Math.max(...Q[s]))); g += r.reward; s = r.next }
                          return { returns, greedy: s === CHEST ? g : null }
                        }
                        const mean = (xs) => xs.reduce((a, b) => a + b, 0) / xs.length
                        const sd = (xs) => Math.sqrt(xs.reduce((a, x) => a + (x - mean(xs)) ** 2, 0) / (xs.length - 1))

                        // A parameter study: the average return over 100 episodes for several step sizes, 10 seeds each, with its 95%
                        // interval. Predict first: is the best α the biggest? (The cliff has no randomness but the agent's own.)
                        for (const alpha of [0.05, 0.1, 0.3, 0.5, 0.9]) {
                          const xs = Array.from({ length: 10 }, (_, k) => mean(train({ alpha, seed: k + 1 }).returns))
                          console.log('α ' + String(alpha).padEnd(4) + ': ' + mean(xs).toFixed(1) + ' ± ' + (2.26 * sd(xs) / Math.sqrt(10)).toFixed(1))
                        }
                    - type: js
                      instruction: |-
                        ### 4. γ chooses what the agent wants
                        Predict first: which way for each γ.
                      startCode: |-
                        // The discount γ decides what the agent wants. A corridor of 11 cells: the agent starts in cell 1. Stepping off at
                        // cell 0 earns +1 at once; walking to cell 10 earns +10, nine steps later. No other rewards. With γ, the far exit is
                        // worth 10 γ⁹ now, against 1 for the near one: it should go right only if γ > 0.1^(1/9) ≈ 0.774.
                        // Each episode starts in a random cell ("exploring starts"), so the far end is learned too; then we read the
                        // learned choice in cell 1.
                        // Predict first: which way does it learn to go for γ = 1, 0.9, 0.8, 0.7 and 0.5?
                        const seeded = (seed) => { let a = seed >>> 0; return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296 } }
                        function learn(gamma, seed) {
                          const rand = seeded(seed), Q = Array.from({ length: 11 }, () => [0, 0])          // actions: 0 left, 1 right
                          for (let ep = 0; ep < 3000; ep++) {
                            let s = 1 + Math.floor(rand() * 9)
                            for (let t = 0; t < 100; t++) {
                              const a = rand() < 0.2 ? Math.floor(rand() * 2) : Q[s][1] > Q[s][0] ? 1 : Q[s][0] > Q[s][1] ? 0 : Math.floor(rand() * 2)
                              const next = s + (a === 1 ? 1 : -1), done = next === 0 || next === 10, r = next === 0 ? 1 : next === 10 ? 10 : 0
                              Q[s][a] += 0.1 * (r + (done ? 0 : gamma * Math.max(...Q[next])) - Q[s][a])
                              if (done) break
                              s = next
                            }
                          }
                          return Q[1][1] > Q[1][0] ? 'right (+10 later)' : 'left (+1 now)'
                        }
                        for (const gamma of [1, 0.9, 0.8, 0.7, 0.5]) console.log('γ ' + gamma + ': ' + learn(gamma, 1) + ', far exit worth ' + (10 * gamma ** 9).toFixed(2) + ' now')
                    - type: js
                      instruction: |-
                        ### 5. See it
                        The α study with its intervals.
                      startCode: |-
                        // The cliff and Q-learning, as in lessons 9.4 and 9.5 (12 × 4, −1 a move, −100 and back to the start for the spikes).
                        const seeded = (seed) => { let a = seed >>> 0; return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296 } }
                        const MOVES = [[0, -1], [1, 0], [0, 1], [-1, 0]], START = 3, CHEST = 47
                        function move(s, a) {
                          const x = Math.min(11, Math.max(0, Math.floor(s / 4) + MOVES[a][0])), y = Math.min(3, Math.max(0, (s % 4) + MOVES[a][1]))
                          if (y === 3 && x > 0 && x < 11) return { next: START, reward: -100, done: false }
                          return { next: x * 4 + y, reward: -1, done: x * 4 + y === CHEST }
                        }
                        function train({ alpha = 0.5, gamma = 1, eps = 0.1, episodes = 100, seed = 1 }) {
                          const rand = seeded(seed), Q = Array.from({ length: 48 }, () => [0, 0, 0, 0]), returns = []
                          const greedyOf = (row) => { const best = Math.max(...row), ties = []; row.forEach((q, a) => { if (q === best) ties.push(a) }); return ties[Math.floor(rand() * ties.length)] }
                          for (let ep = 0; ep < episodes; ep++) {
                            let s = START, total = 0
                            for (let t = 0; t < 500; t++) {
                              const a = rand() < eps ? Math.floor(rand() * 4) : greedyOf(Q[s]), r = move(s, a)
                              Q[s][a] += alpha * (r.reward + (r.done ? 0 : gamma * Math.max(...Q[r.next])) - Q[s][a])
                              total += r.reward; s = r.next
                              if (r.done) break
                            }
                            returns.push(total)
                          }
                          // The greedy walk's return (60 moves at most).
                          let s = START, g = 0
                          for (let k = 0; k < 60 && s !== CHEST; k++) { const r = move(s, Q[s].indexOf(Math.max(...Q[s]))); g += r.reward; s = r.next }
                          return { returns, greedy: s === CHEST ? g : null }
                        }
                        const mean = (xs) => xs.reduce((a, b) => a + b, 0) / xs.length
                        const sd = (xs) => Math.sqrt(xs.reduce((a, x) => a + (x - mean(xs)) ** 2, 0) / (xs.length - 1))

                        // The parameter study drawn: mean return over 100 episodes against α, with 95% interval bars (10 seeds each).
                        const alphas = [0.05, 0.1, 0.2, 0.3, 0.5, 0.7, 0.9]
                        const points = alphas.map((alpha) => { const xs = Array.from({ length: 10 }, (_, k) => mean(train({ alpha, seed: k + 1 }).returns)); return [alpha, mean(xs), 2.26 * sd(xs) / Math.sqrt(10)] })
                        const canvas = document.createElement('canvas'), W = 420, H = 220
                        canvas.width = W * 2; canvas.height = H * 2; canvas.style.cssText = 'width: ' + W + 'px; height: ' + H + 'px; display: block; margin: 0 auto'
                        document.body.appendChild(canvas)
                        const g = canvas.getContext('2d'); g.scale(2, 2); g.fillStyle = '#0f1923'; g.fillRect(0, 0, W, H)
                        const lo = Math.min(...points.map((p) => p[1] - p[2])), hi = Math.max(...points.map((p) => p[1] + p[2]))
                        const X = (a) => 50 + a * (W - 80), Y = (v) => H - 30 - ((v - lo) / (hi - lo)) * (H - 60)
                        g.strokeStyle = '#60a5fa'; g.lineWidth = 2; g.beginPath(); points.forEach(([a, m], i) => (i ? g.lineTo(X(a), Y(m)) : g.moveTo(X(a), Y(m)))); g.stroke()
                        for (const [a, m, e] of points) { g.strokeStyle = '#94a3b8'; g.lineWidth = 1; g.beginPath(); g.moveTo(X(a), Y(m - e)); g.lineTo(X(a), Y(m + e)); g.stroke(); g.fillStyle = '#60a5fa'; g.beginPath(); g.arc(X(a), Y(m), 3, 0, 2 * Math.PI); g.fill() }
                        g.fillStyle = '#cbd5e1'; g.font = '11px sans-serif'
                        g.fillText('mean return, 100 episodes (95% bars)', 8, 14); g.fillText(hi.toFixed(0), 8, Y(hi) + 4); g.fillText(lo.toFixed(0), 8, Y(lo) + 4)
                        for (const a of [0.1, 0.5, 0.9]) g.fillText('α ' + a, X(a) - 12, H - 10)
                        const best = points.reduce((b, p) => (p[1] > b[1] ? p : b))
                        console.log('best α in this study: ' + best[0] + ' (' + best[1].toFixed(1) + ')')
                      showPreviewByDefault: true
