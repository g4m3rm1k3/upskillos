                      solutionCode: |-
                        // Write TD(0)'s update for a state value: given V(S), the reward R, V(S′) and whether the step ended the episode,
                        // return the new V(S).
                        function tdUpdate(v, reward, vNext, done, alpha, gamma) {
                          const target = reward + (done ? 0 : gamma * vNext)
                          return v + alpha * (target - v)
                        }

                        // ── The check: cases with the answers a correct update gives (leave this part as it is) ──
                        const cases = [
                          { args: [0.5, 0, 0.6, false, 0.1, 1], want: 0.51, why: 'the target is R + γ V(S′); move α of the way from V(S) to it' },
                          { args: [0.5, 1, 0.9, true, 0.1, 1], want: 0.55, why: 'this step ended the episode: the target is R alone, there is no V(S′)' },
                          { args: [2, -1, 4, false, 0.5, 0.9], want: 2.3, why: 'γ discounts V(S′): target −1 + 0.9 × 4 = 2.6, so 2 + 0.5 × 0.6' },
                          { args: [0, 0, 1, false, 1, 0.5], want: 0.5, why: 'with α = 1 the new value is the target itself' },
                        ]
                        let passed = 0
                        for (const [i, c] of cases.entries()) {
                          const got = tdUpdate(...c.args)
                          const ok = typeof got === 'number' && Math.abs(got - c.want) < 1e-9
                          passed += ok
                          console.log((ok ? '✓' : '✗') + ' case ' + (i + 1) + ': got ' + (typeof got === 'number' ? +got.toFixed(6) : got) + (ok ? '' : ', want ' + c.want + ': ' + c.why))
                        }
                        console.log(passed === cases.length ? '✓ All 4 cases pass: that is TD(0).' : passed + ' of 4 cases pass.')
            - id: GameStudioTask
              title: Step through TD updates
              props:
                task: td-step
