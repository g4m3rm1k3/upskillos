                        // ── The check: cases with the answers a correct update gives (leave this part as it is) ──
                        const cases = [
                          { args: [0.5, 0, 0.6, false, 0.1, 1], want: 0.51, why: 'the target is R + γ V(S′); move α of the way from V(S) to it' },
                          { args: [0.5, 1, 0.9, true, 0.1, 1], want: 0.55, why: 'this step ended the episode: the target is R alone, there is no V(S′)' },
