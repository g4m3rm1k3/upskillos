                        const q = 0.5, r = 1, nextRow = [0.8, 0.3], gamma = 0.97, alpha = 0.2
                        const target = r + gamma * Math.max(...nextRow)              // r + γ max_a′ Q(s′, a′)
                        const delta = target - q                                     // the TD error δ
                        console.log('target ' + target.toFixed(4) + ', TD error δ ' + delta.toFixed(4) + ', new Q ' + (q + alpha * delta).toFixed(4))
                    - type: js
                      instruction: |-
                        ### 4. Training
                        Predict first: how many episodes until it catches every ball.
                      startCode: |-
                        // Catch: a ball falls down 4 rows in one of 5 columns; the paddle starts in column 2 and, each step,
                        // moves left, stays, or moves right. Catching earns +1, missing −1. (Game Studio's random-number generator.)
                        const seeded = (seed) => { let a = seed >>> 0; return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296 } }
                        const ROWS = 4, MOVES = [-1, 0, 1], NAMES = ['left', 'stay', 'right']
                        const reset = (rand) => ({ ball: Math.floor(rand() * 5), paddle: 2, row: 0 })
                        function step(g, a) {                              // S_t, A_t → R_{t+1}, S_{t+1}
                          g.paddle += MOVES[a]; g.row++
                          if (g.row < ROWS) return { reward: 0, done: false }
                          return { reward: g.ball === g.paddle ? 1 : -1, done: true }
                        }
                        // The state: how far the ball is across from the paddle (−5 to 5) and its row (0 to 3): 11 × 4 = 44 states.
                        const stateOf = (g) => (g.ball - g.paddle + 5) * ROWS + g.row
                        const greedy = (row) => { let b = 0; for (let a = 1; a < row.length; a++) if (row[a] > row[b]) b = a; return b }
                        // How often a policy catches, over the 5 starting columns (the rest of the game is fixed).
                        function catchRate(policy) {
                          let caught = 0
                          for (let b = 0; b < 5; b++) { const g = { ball: b, paddle: 2, row: 0 }; for (;;) { const r = step(g, policy(stateOf(g))); if (r.done) { caught += r.reward > 0; break } } }
                          return caught / 5
                        }
                        // Q-learning, exactly as Game Studio's ml/qlearning.ts does it: ε-greedy (ties broken at random), ε falling
                        // linearly from 0.3 to 0.02, and the update Q(s, a) ← Q(s, a) + α [r + γ max Q(s′, ·) − Q(s, a)].
                        function train({ episodes, alpha = 0.2, gamma = 0.97, epsilon = 0.3, epsilonEnd = 0.02, seed = 1 }) {
                          const rand = seeded(seed), Q = Array.from({ length: 44 }, () => [0, 0, 0])
                          const pick = (row) => { const best = Math.max(...row), ties = [0, 1, 2].filter((a) => row[a] === best); return ties[Math.floor(rand() * ties.length)] }
                          for (let ep = 0; ep < episodes; ep++) {
                            const eps = epsilon + (epsilonEnd - epsilon) * (episodes > 1 ? ep / (episodes - 1) : 1)
                            const g = reset(rand)
                            let s = stateOf(g)
                            for (;;) {
                              const a = rand() < eps ? Math.floor(rand() * 3) : pick(Q[s])         // A_t, ε-greedy
                              const r = step(g, a), next = stateOf(g)                              // R_{t+1}, S_{t+1}
                              const target = r.reward + (r.done ? 0 : gamma * Math.max(...Q[next]))   // the TD target
                              Q[s][a] += alpha * (target - Q[s][a])                                // α × the TD error δ
                              s = next
                              if (r.done) break
                            }
                          }
                          return Q
                        }

                        // Predict first: after how many episodes does the greedy policy catch every ball?
                        for (const episodes of [0, 10, 25, 50, 300]) {
                          const Q = train({ episodes })
                          console.log(String(episodes).padStart(3) + ' episodes: greedy play catches ' + catchRate((s) => greedy(Q[s])))
                        }
                    - type: js
                      instruction: |-
                        ### 5. The table against Q*
                        Predict first: are they equal after 300 episodes?
                      startCode: |-
                        // Catch: a ball falls down 4 rows in one of 5 columns; the paddle starts in column 2 and, each step,
                        // moves left, stays, or moves right. Catching earns +1, missing −1. (Game Studio's random-number generator.)
                        const seeded = (seed) => { let a = seed >>> 0; return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296 } }
                        const ROWS = 4, MOVES = [-1, 0, 1], NAMES = ['left', 'stay', 'right']
                        const reset = (rand) => ({ ball: Math.floor(rand() * 5), paddle: 2, row: 0 })
                        function step(g, a) {                              // S_t, A_t → R_{t+1}, S_{t+1}
                          g.paddle += MOVES[a]; g.row++
                          if (g.row < ROWS) return { reward: 0, done: false }
                          return { reward: g.ball === g.paddle ? 1 : -1, done: true }
                        }
                        // The state: how far the ball is across from the paddle (−5 to 5) and its row (0 to 3): 11 × 4 = 44 states.
                        const stateOf = (g) => (g.ball - g.paddle + 5) * ROWS + g.row
                        const greedy = (row) => { let b = 0; for (let a = 1; a < row.length; a++) if (row[a] > row[b]) b = a; return b }
                        // How often a policy catches, over the 5 starting columns (the rest of the game is fixed).
                        function catchRate(policy) {
                          let caught = 0
                          for (let b = 0; b < 5; b++) { const g = { ball: b, paddle: 2, row: 0 }; for (;;) { const r = step(g, policy(stateOf(g))); if (r.done) { caught += r.reward > 0; break } } }
                          return caught / 5
                        }
                        // Q-learning, exactly as Game Studio's ml/qlearning.ts does it: ε-greedy (ties broken at random), ε falling
                        // linearly from 0.3 to 0.02, and the update Q(s, a) ← Q(s, a) + α [r + γ max Q(s′, ·) − Q(s, a)].
                        function train({ episodes, alpha = 0.2, gamma = 0.97, epsilon = 0.3, epsilonEnd = 0.02, seed = 1 }) {
                          const rand = seeded(seed), Q = Array.from({ length: 44 }, () => [0, 0, 0])
                          const pick = (row) => { const best = Math.max(...row), ties = [0, 1, 2].filter((a) => row[a] === best); return ties[Math.floor(rand() * ties.length)] }
                          for (let ep = 0; ep < episodes; ep++) {
                            const eps = epsilon + (epsilonEnd - epsilon) * (episodes > 1 ? ep / (episodes - 1) : 1)
                            const g = reset(rand)
                            let s = stateOf(g)
                            for (;;) {
                              const a = rand() < eps ? Math.floor(rand() * 3) : pick(Q[s])         // A_t, ε-greedy
                              const r = step(g, a), next = stateOf(g)                              // R_{t+1}, S_{t+1}
                              const target = r.reward + (r.done ? 0 : gamma * Math.max(...Q[next]))   // the TD target
                              Q[s][a] += alpha * (target - Q[s][a])                                // α × the TD error δ
                              s = next
                              if (r.done) break
                            }
                          }
                          return Q
                        }
                        // Q*: the Bellman optimality equation, solved backwards from the last row (the game always ends after 4 steps).
                        //   Q*(s, a) = R + γ · max_a′ Q*(s′, a′)      (the max term is 0 when the step ends the game)
                        function qStar(gamma = 0.97) {
                          const Q = Array.from({ length: 44 }, () => [0, 0, 0])
                          for (let row = ROWS - 1; row >= 0; row--) for (let off = -5; off <= 5; off++) for (let a = 0; a < 3; a++) {
                            const off2 = off - MOVES[a], s = (off + 5) * ROWS + row        // the paddle moves, so the offset changes
                            if (row === ROWS - 1) Q[s][a] = off2 === 0 ? 1 : -1              // this step ends it: catch or miss
                            else Q[s][a] = Math.abs(off2) > 5 ? -1 : gamma * Math.max(...Q[(off2 + 5) * ROWS + row + 1])
                          }
                          return Q
                        }

                        // The table learned in 300 episodes against Q*. Predict first: are they equal?
                        const Q = train({ episodes: 300 }), S = qStar()
                        const f = (row) => row.map((x) => x.toFixed(3).padStart(6)).join(' ')
                        console.log('state (offset, row)    learned Q (left stay right)   Q*')
                        for (const [off, row] of [[2, 0], [1, 2], [0, 3], [1, 3]]) {
                          const s = (off + 5) * ROWS + row
                          console.log('(' + String(off).padStart(2) + ', ' + row + ')            ' + f(Q[s]) + '      ' + f(S[s]))
                        }
                        // With exploration that never stops (ε = 1: every action random), every reachable pair keeps being tried.
                        const reach = []
                        for (let b = 0; b < 5; b++) { const go = (off, row) => { if (row >= ROWS) return; reach.push((off + 5) * ROWS + row); for (const m of MOVES) go(off - m, row + 1) }; go(b - 2, 0) }
                        const states = [...new Set(reach)]
                        for (const episodes of [1000, 20000]) {
                          const R = train({ episodes, epsilon: 1, epsilonEnd: 1 })
                          let worst = 0
                          for (const s of states) for (let a = 0; a < 3; a++) worst = Math.max(worst, Math.abs(R[s][a] - S[s][a]))
                          console.log('ε = 1, ' + episodes + ' episodes: largest |Q − Q*| ' + worst.toFixed(4) + ', greedy catches ' + catchRate((s) => greedy(R[s])))
                        }
