                      solutionCode: |-
                        // Write the Q-learning update. Given Q(s, a), the reward r, the next state's row of Q values and whether the step
                        // ended the episode, return the new Q(s, a).
                        function qUpdate(q, reward, nextRow, done, alpha, gamma) {
                          const target = reward + (done ? 0 : gamma * Math.max(...nextRow))
                          return q + alpha * (target - q)
                        }

                        // ── The check: cases with the answers a correct update gives (leave this part as it is) ──
                        const cases = [
                          { args: [0.4, 0, [1.2, 0.9], false, 0.2, 0.97], want: 0.5528, why: 'the target is r + γ · (the largest Q in the next row); move α of the way from q to it' },
                          { args: [0, 1, [5, 5], true, 0.2, 0.97], want: 0.2, why: 'this step ended the episode: there is no future, so the target is r alone' },
                          { args: [1, 0, [0.3, 0.8, -1], false, 0.5, 0.9], want: 0.86, why: 'use the largest Q in the next row (0.8), not the first' },
                          { args: [-0.5, -1, [2, 2], true, 1, 0.97], want: -1, why: 'with α = 1 the new value is the target itself, and this step ended the episode, so the target is r alone' },
                        ]
                        let passed = 0
                        for (const [i, c] of cases.entries()) {
                          const got = qUpdate(...c.args)
                          const ok = typeof got === 'number' && Math.abs(got - c.want) < 1e-9
                          passed += ok
                          console.log((ok ? '✓' : '✗') + ' case ' + (i + 1) + ': got ' + (typeof got === 'number' ? +got.toFixed(6) : got) + (ok ? '' : ', want ' + c.want + ': ' + c.why))
                        }
                        console.log(passed === cases.length ? '✓ All 4 cases pass: that is the Q-learning update.' : passed + ' of 4 cases pass.')
            - id: GameStudioTask
              title: Train an agent with Q-learning
              props:
                task: q-agent
                lesson: mg8-001
                checkpoint: cp-mg8-001-4
        math:
          prose:
            - >-
              **Under the hood (optional).** A game seen this way is a Markov decision process: states, actions, rewards, and
              dynamics $p(s', r \mid s, a)$, here hidden in the game's code. The Markov property says the next state and
              reward depend only on the current state and action. Catch's state (offset and row) has it exactly; Breakout's
              binned state does not, which is why its table is noisy.
            - >-
              The action value of a policy $\pi$ is $Q^\pi(s, a) = \mathbb{E}_\pi[G_t \mid S_t = s, A_t = a]$, and
              $Q^*(s, a) = \max_\pi Q^\pi(s, a)$. Splitting the return as $G_t = R_{t+1} + \gamma G_{t+1}$ and noting that an
              optimal policy takes the best action from $S_{t+1}$ on gives the Bellman optimality equation. For Catch it can
              be solved backwards from the last row, because every game ends after 4 steps; cell 5's qStar does exactly that.
            - >-
              Q-learning replaces the expectation with one sample per step and averages with step size $\alpha$: a
              stochastic-approximation method. Watkins and Dayan (1992) proved that the table converges to $Q^*$ with
              probability 1 when every state–action pair is tried infinitely often and the step sizes satisfy
              $\sum_t \alpha_t = \infty$, $\sum_t \alpha_t^2 < \infty$. Game Studio and the notebook keep $\alpha$ fixed,
              which is common in practice and still converges here because Catch's steps are deterministic (cell 5: within
              0.0002 of $Q^*$ after 20000 random episodes).
            - >-
              Choosing the best of several greedy checks is model selection: the checks use games the agent did not train on,
              and the final score is measured on others again, so the score is not flattered by the choice.
          equations:
            - label: Return
              latex: 'G_t = R_{t+1} + \gamma R_{t+2} + \gamma^2 R_{t+3} + \cdots = R_{t+1} + \gamma G_{t+1}'
            - label: Bellman optimality
              latex: 'Q^*(s, a) = \mathbb{E}[R_{t+1} + \gamma \max_{a''} Q^*(S_{t+1}, a'') \mid S_t = s, A_t = a]'
            - label: TD error
              latex: '\delta_t = R_{t+1} + \gamma \max_{a''} Q(S_{t+1}, a'') - Q(S_t, A_t)'
            - label: Q-learning update
              latex: 'Q(S_t, A_t) \leftarrow Q(S_t, A_t) + \alpha\,\delta_t'
            - label: ε-greedy
              latex: '\pi(a \mid s) = \begin{cases} 1 - \varepsilon + \varepsilon / |\mathcal{A}| & a = \arg\max_{b} Q(s, b) \\ \varepsilon / |\mathcal{A}| & \text{otherwise} \end{cases}'
          callouts: []
          visualizations: []
        rigor:
          prose:
            - >-
              Formal statement: for a finite MDP with $\gamma < 1$, the Bellman optimality operator
              $(TQ)(s, a) = \mathbb{E}[R + \gamma \max_{a'} Q(S', a')]$ is a contraction in the max norm with factor
              $\gamma$, so it has exactly one fixed point, $Q^*$. Q-learning is a noisy, one-entry-at-a-time application of
              $T$.
            - >-
              Invariant: the greedy policy of $Q^*$ is optimal, and any table whose largest entry in each row is in the same
              place as $Q^*$'s plays just as well. That is why cell 4 catches every ball long before cell 5's numbers agree.
            - >-
              Geometric picture: think of the table as a point in a space of 132 numbers (Catch) or 28 (Breakout). Each update
              moves one coordinate a step towards a target that itself depends on the others; the contraction pulls the
              whole point towards $Q^*$.
            - >-
              Where it goes next: when the states are too many for a table (pixels, many readings), a neural network
              estimates $Q(s, a)$ from the numbers instead (deep Q-networks). The ML Lab's lab 58 covers policy gradients,
              the other family, which learns the policy directly.
          callouts: []
          visualizations: []
        examples:
          - id: mg8-001-ex1
            title: One update
            difficulty: easy
            problem: >-
              Q(s, right) = 0.4. The agent holds right, breaks no brick, and lands in s′ whose row is [1.2, 0.9]. γ = 0.97,
              α = 0.2. What is the new Q(s, right)?
            steps:
              - expression: '\text{target} = 0 + 0.97 \times 1.2 = 1.164'
                annotation: The reward plus the discounted best of the next row.
                strategyTitle: "Step 1: The target"
              - expression: '\delta = 1.164 - 0.4 = 0.764'
                annotation: How far the estimate is from it.
                strategyTitle: "Step 2: The TD error"
              - expression: '0.4 + 0.2 \times 0.764 = 0.5528'
                annotation: Move α of the way.
                strategyTitle: "Step 3: The update"
            answer: 0.5528 (the challenge's first case).
          - id: mg8-001-ex2
            title: Counting states
            difficulty: medium
            problem: >-
              Breakout's environment bins "ball minus paddle" with 6 cut points and velocity.y with 1. You add "bins": [0] to
              velocity.x as well. How many states, and how many numbers in the table?
            steps:
              - expression: '(6 + 1)(1 + 1)(1 + 1) = 28'
                annotation: Each binned reading multiplies the count by its number of bins.
                strategyTitle: "Step 1: States"
              - expression: '28 \times 2 = 56'
                annotation: One value per state and action.
                strategyTitle: "Step 2: Q values"
            answer: 28 states and 56 Q values; each is visited about half as often as with 14 states.
          - id: mg8-001-ex3
            title: Q* by hand
            difficulty: hard
            problem: >-
              In Catch the ball is one column right of the paddle, in row 2 (two steps left). With γ = 0.97, what is Q*(s, a)
              for left, stay and right?
            steps:
              - expression: 'Q^*(\text{offset } 0, \text{row } 3, \text{stay}) = 1'
                annotation: Under the ball at the last step, staying catches it.
                strategyTitle: "Step 1: The last row"
              - expression: 'Q^*(s, \text{right}) = 0 + 0.97 \times 1 = 0.97'
                annotation: Moving right reaches offset 0 at row 3; then stay. Staying also works (move right next step).
                strategyTitle: "Step 2: Right and stay"
              - expression: 'Q^*(s, \text{left}) = 0.97 \times (-1) = -0.97'
                annotation: Offset 2 at row 3 cannot be caught.
                strategyTitle: "Step 3: Left"
            answer: Left −0.97, stay 0.97, right 0.97, as cell 5 prints for (1, 2).
        challenges:
          - id: mg8-001-ch1
            title: The discount
            difficulty: easy
            problem: With γ = 0, what does a Breakout agent care about?
            hint: Only R_{t+1} is left in the return.
            answer: Only the next step's reward. Catching the ball earns nothing at once, so with γ = 0 it cannot learn to catch; only avoiding the −3 at the very last moment counts.
            walkthrough:
              - expression: 'G_t = R_{t+1}'
                annotation: Every later term has a factor of 0.
          - id: mg8-001-ch2
            title: Why not learn only from greedy play?
            difficulty: medium
            problem: Explain why cell 4 at 0 episodes catches nothing, and why exploration fixes it.
            hint: What does an all-zero row choose?
            answer: >-
              With every Q equal, the first action (left) wins every row, so the paddle always goes left and only catches a
              ball that happens to be there. Random actions (ε, and random tie-breaking) visit other states and actions, whose
              rewards then show up in the table.
            walkthrough: []
          - id: mg8-001-ch3
            title: Design states for another game
            difficulty: hard
            problem: >-
              For a platformer where the player must jump over a rolling barrel, which readings would you bin, and where would
              you put the cut points?
            hint: Bin the numbers that decide when to jump.
            answer: >-
              The barrel's x minus the player's x, cut where a jump must start (say at the distance the barrel covers during
              a jump, and a little either side), and whether the player is on the ground (one cut). Leave out what does not
              change the right action, such as the score.
            walkthrough: []
        semantics:
          core:
            - { symbol: "S_t, A_t, R_{t+1}", meaning: "The state seen, the action taken, the reward that follows." }
            - { symbol: "G_t", meaning: "The return: all later rewards, each discounted by γ per step." }
            - { symbol: "Q(s, a)", meaning: "The return expected from taking a in s and acting well after." }
            - { symbol: "Q*", meaning: "The best possible action values; greedy on Q* is optimal." }
            - { symbol: "δ", meaning: "The TD error: target minus the current estimate." }
            - { symbol: "α, γ, ε", meaning: "Step size, discount, exploration." }
            - { symbol: "bins", meaning: "Cut points that turn a number into one of a few states." }
          rulesOfThumb:
            - Bin the numbers that decide the action, and cut where the right action changes.
            - Make losing costly in the reward, and check random play scores badly.
            - Explore early, exploit late.
            - Judge the agent by greedy play on games it did not train on.
            - Read the table where it was visited often.
        misconceptions:
          - falseBelief: The agent learns rules like "move towards the ball".
            whyStudentsThinkIt: That is how a person describes good play.
            correctionExample: It learns a number for each state and action; cell 7's arrows are only where the biggest is.
            contrastCase: A hand-written policy is a rule; a Q table only becomes one when you take its argmax.
          - falseBelief: When the agent plays well, its table equals Q*.
            whyStudentsThinkIt: The values should be right if the play is right.
            correctionExample: Cell 5 at 300 episodes catches every ball with many entries far from Q*.
            contrastCase: With exploration that never stops, the table does converge (cell 5, ε = 1).
          - falseBelief: Training should only take the actions it thinks best.
            whyStudentsThinkIt: Why waste moves?
            correctionExample: Cell 4 at 0 episodes always goes left and catches nothing.
            contrastCase: After training, the greedy policy is what plays.
        transferPrompts:
          - situation: You want an enemy that learns when to dodge the player's shots.
            competingTechniques:
              - Q-learning, with the nearest shot's distance and direction binned as the state, and survival rewarded
              - Hand-written dodging rules
            whyThisTechniqueWins: Training can find dodges you did not think of, provided the state shows the shot and the reward makes surviving pay.
          - situation: Training stalls near random play.
            competingTechniques:
              - Check the bins (does the state show what decides the action?) and the reward (does random play already score well?)
              - Train for much longer
            whyThisTechniqueWins: If the state hides what matters or the reward does not reward it, more episodes cannot help.
        debugging:
          - commonError: No bins on any reading.
            symptom: Train an agent says Q-learning needs bins.
            whyItHappened: Without bins there are no states for the table.
            repairStrategy: Add "bins" to the reading that decides the action.
          - commonError: Cut points that do not go up.
            symptom: Values land in the wrong bins; some bins never used.
            whyItHappened: A value's bin is the count of cuts below it.
            repairStrategy: List each reading's cuts in increasing order.
          - commonError: Too many bins on too many readings.
            symptom: The learning curve barely rises; many grey rows.
            whyItHappened: Each state is visited too rarely to learn.
            repairStrategy: Bin fewer readings, or train for more episodes.
        mastery:
          targetLevel: 3
          solveIndependently: Write the Q-learning update, and train a Q-learning agent on a Game Studio game.
          explainVerbally: Explain states from bins, the return, Q and Q*, the TD error, and ε-greedy exploration.
          detectIncorrectApplication: Spot states that hide what decides the action, and rewards random play already earns.
          transferToUnfamiliar: Design states, actions and rewards for another game.
        assessment:
          questions:
            - id: mg8-001-assess-1
              type: choice
              text: "Q(s, a) = 0, r = 1, the step ended the episode, α = 0.5. The new Q(s, a) is:"
              options: ["0.5", "1", "0", "1.5"]
              answer: "0.5"
              hint: No future term; move halfway to 1.
        quiz:
          - id: mg8-001-quiz-1
            type: choice
            text: What does Q(s, a) estimate?
            options: ["The return from taking a in s and acting well afterwards", "The reward of the next step only", "How often a was taken in s", "The probability of winning"]
            answer: "The return from taking a in s and acting well afterwards"
            hints:
              - It counts later rewards too.
            reviewSection: "Intuition — what an action is worth"
          - id: mg8-001-quiz-2
            type: choice
            text: The TD target for a step that does not end the episode is
            options: ["r + γ max Q(s′, ·)", "r", "max Q(s′, ·)", "Q(s, a) + r"]
            answer: "r + γ max Q(s′, ·)"
            hints:
              - The reward, then the discounted best of the next state.
            reviewSection: "Intuition — the update"
          - id: mg8-001-quiz-3
            type: choice
            text: How many states do Breakout's bins make (7 bins across, 2 for velocity.y)?
            options: ["14", "9", "28", "4"]
            answer: "14"
            hints:
              - Multiply the bin counts.
            reviewSection: "Cell 6"
          - id: mg8-001-quiz-4
            type: choice
            text: Why does an untrained greedy agent catch nothing in Catch?
            options: ["Every row is all zeros, so it always picks the first action", "γ is too small", "α is too big", "The ball is too fast"]
            answer: "Every row is all zeros, so it always picks the first action"
            hints:
              - Cell 4 at 0 episodes.
            reviewSection: "Cell 4"
          - id: mg8-001-quiz-5
            type: choice
            text: Q-learning is off-policy because
            options: ["Its target uses the best next action, not the one it will take", "It never explores", "It ignores rewards", "It uses a neural network"]
            answer: "Its target uses the best next action, not the one it will take"
            hints:
              - Cell 5 learns Q* while acting at random.
            reviewSection: "Intuition — what the table holds"
          - id: mg8-001-quiz-6
            type: choice
            text: With 3 bins across instead of 7, the Breakout agent scored
            options: ["Worse (34 instead of 48)", "Better", "The same", "Nothing: it cannot train"]
            answer: "Worse (34 instead of 48)"
            hints:
              - The table cannot tell "just off the edge" from "far away".
            reviewSection: "Warning — a table only knows the states you give it"
        checkpoints:
          - { id: cp-mg8-001-1, label: "Read the loop, states and the return", type: read }
          - { id: cp-mg8-001-2, label: "Read the Bellman equation and the Q-learning update", type: read }
          - { id: cp-mg8-001-3, label: "Run the notebook: train Catch and compare with Q*", type: read }
          - { id: cp-mg8-001-4, label: "Complete \"Train an agent with Q-learning\" in Game Studio", type: lab }
          - { id: cp-mg8-001-5, label: "Watch your trained agent play Breakout", type: lab }
          - { id: cp-mg8-001-6, label: "Work through the one-update example", type: example }
          - { id: cp-mg8-001-7, label: "Work through the Q* by hand example", type: example }
          - { id: cp-mg8-001-8, label: "Pass the write-the-update challenge", type: challenge }

  # ═══════════════════════════════════════════════════════════════ Chapter 9: Game AI that learns
  - number: 9
    slug: game-ai-that-learns
    lessons:
      # ───────────────────────────────────────────────────────────── 9.1
      - order: 1
        id: mg9-001
        slug: learning-from-every-step
        title: Learning from Every Step
        subtitle: Temporal-difference learning, against Monte Carlo, worked by hand and then watched update by update in Game Studio.
        tags: [game-studio, machine-learning, reinforcement-learning, temporal-difference, td-learning, monte-carlo]
        aliases: td learning temporal difference td(0) monte carlo bootstrapping prediction control td error random walk value function step size alpha
        timeToComplete: 60
        coreConcept: >-
          To learn a value you need a target to move it towards. Monte Carlo waits until the episode ends and uses the
          return it actually got, G_t. Temporal-difference learning (TD) uses one step of experience and its own estimate
          of what comes next, R_{t+1} + γ V(S_{t+1}): it learns from every step, before the episode ends, by
          bootstrapping. The difference between that target and the current estimate is the TD error, δ; every TD method
          moves its estimate α δ. Q-learning is the same idea for the value of each action.
        prerequisites: [mg8-001]
        nextLesson: mg9-002
        hook:
          question: >-
            A game of Breakout lasts 80 seconds. Should the agent wait until the end to learn anything, or can it learn from
            each moment, guessing how the rest will go and correcting the guess as it plays?
          realWorldContext: >-
            TD learning (Sutton, 1988) is how most reinforcement learning learns: TD-Gammon learned backgammon from it,
            Q-learning and DQN are TD methods, and neuroscientists found that dopamine neurons signal something very like
            the TD error. Sutton & Barto, chapter 6, is this lesson's reference, and its examples are the ones used here.
        intuition:
          prose:
            - >-
              **Prediction and control.** Two problems share these ideas. *Prediction*: for a fixed way of acting (a policy
              π), how good is each state? That is the state-value function $V^\pi(s) = \mathbb{E}_\pi[G_t \mid S_t = s]$,
              the expected return from s. *Control*: find the best way of acting. Control (Q-learning, the bonus lesson) is
              built on prediction, so this lesson starts there.
            - >-
              **The random walk** (Sutton & Barto, Example 6.2) is the standard test. Five states, A to E, in a row; each
              episode starts at C and steps left or right with equal chance. Off the left end it ends with reward 0, off the
              right with reward 1. With $\gamma = 1$, a state's value is the chance of ending on the right: 1/6, 2/6, …, 5/6.
              Before running cell 1, predict V(C): 1/2, by symmetry.
            - >-
              **Monte Carlo** waits for the end of the episode and moves each visited state towards the return it got:
              $V(S_t) \leftarrow V(S_t) + \alpha[G_t - V(S_t)]$. The target $G_t$ is real, an actual outcome, but it is
              only known at the end, and it carries all the randomness of the rest of the episode. (Updating every visit to a
              state is *every-visit* MC; updating only its first visit is *first-visit* MC. Both converge.)
            - >-
              **TD(0)** updates after every step, towards one real reward plus its *estimate* of the next state:
              $V(S_t) \leftarrow V(S_t) + \alpha[R_{t+1} + \gamma V(S_{t+1}) - V(S_t)]$, with $V$ of a terminal state 0.
              Using an estimate inside the target is **bootstrapping**. The bracket is the **TD error**
              $\delta_t = R_{t+1} + \gamma V(S_{t+1}) - V(S_t)$: how much better or worse the step turned out than predicted.
              Before running cell 2, predict which states one episode changes under each: Monte Carlo changes every state it
              visited; TD(0), starting from equal values, changes only the state next to the end, because only there does the
              target differ from the estimate.
            - >-
              **Which learns faster?** TD's target has less variance (one step of randomness instead of a whole episode's), but
              it is biased by the current estimates; Monte Carlo's is unbiased but noisy. On the random walk TD wins (cell 3):
              after 100 episodes, averaged over 100 runs, TD(0) with $\alpha = 0.05$ has an error of 0.035 against Monte
              Carlo's 0.090. A large $\alpha$ learns fast and then jitters: TD with $\alpha = 0.1$ is ahead at 25 episodes
              (0.056) but levels off near 0.05, because each update chases the latest sample.
            - >-
              **From prediction to control.** Learn the value of each *action* instead, $Q(s, a)$, and use the best next
              action in the target: $Q(S_t, A_t) \leftarrow Q(S_t, A_t) + \alpha[R_{t+1} + \gamma \max_{a'} Q(S_{t+1}, a') - Q(S_t, A_t)]$.
              That is Q-learning, a TD method. Cell 4 does one update by hand, exactly as Game Studio's Step shows it; the
              Try it card then has you step through and predict updates on Cliff Walk.
          callouts:
            - type: procedure
              title: "Procedure: one TD update"
              body: >-
                Step 1. Read the step: S, A, R and S′ (and whether S′ ends the episode).
                Step 2. The target: R + γ × (the estimate of S′: V(S′) for prediction, max Q(S′, ·) for Q-learning), or R
                alone if S′ is terminal.
                Step 3. The TD error: δ = target − current estimate.
                Step 4. Move the estimate: new = old + α δ.
            - type: warning
              title: A terminal state has no future
              body: >-
                The commonest bug in TD code: bootstrapping from the state after the end. When S′ is terminal the target is R
                alone. (An episode cut short by a step limit is different: the game had not ended, so you still bootstrap.)
            - type: warning
              title: The step size is a trade-off
              body: >-
                α = 1 replaces the estimate with the last target; a tiny α barely moves. On Cliff Walk, Q-learning with
                α = 0.5 finds the 13-move walk in 200 episodes; with α = 0.05 its greedy walk does not reach the chest at all
                (−200, the step limit). Theory asks for a step size that shrinks (Σα = ∞, Σα² < ∞); in practice a constant
                α tracks a changing problem and is tuned.
            - type: insight
              title: "What the picture shows (cell 5)"
              body: >-
                Misconception it contradicts: "waiting for the real outcome must be more accurate". Monte Carlo's target is
                exact on average, yet TD's error falls faster: averaging one step of noise at a time beats averaging whole
                episodes of it.
            - type: insight
              title: In the ML Lab
              body: >-
                The ML Lab's lab 37 covers the same ground in its own gridworld: lesson 37.2 the Bellman expectation equation
                and policy evaluation, 37.4 the Q-learning update. [Open the ML Lab](#/lab/ml-lab).
          visualizations:
            - id: JSNotebook
              title: "Build it: Monte Carlo and TD(0)"
              caption: The random walk, one episode learned two ways, error curves over 100 runs, and one Q-learning update.
              props:
                lesson:
                  title: Learning from every step
                  subtitle: Monte Carlo against TD(0).
                  cells:
                    - type: js
                      instruction: |-
                        ### 1. The random walk
                        Predict first: V(C).
                      startCode: |-
                        // The random walk: five states A to E in a row, starting at C. Each step goes left or right with equal chance.
                        // Off the left end the episode ends with reward 0, off the right end with reward 1; every other step earns 0.
                        // With γ = 1 a state's value is the chance of ending on the right. (Game Studio's random-number generator.)
                        const seeded = (seed) => { let a = seed >>> 0; return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296 } }
                        const NAMES = ['A', 'B', 'C', 'D', 'E']
                        // One episode: the states visited (0 to 4) and the rewards after each step.
                        function episode(rand) {
                          let s = 2
                          const states = [], rewards = []
                          for (;;) {
                            states.push(s)
                            s += rand() < 0.5 ? -1 : 1
                            if (s < 0) { rewards.push(0); return { states, rewards } }
                            if (s > 4) { rewards.push(1); return { states, rewards } }
                            rewards.push(0)
                          }
                        }

                        // Before running: predict V(C), the chance of ending on the right from the middle.
                        // The true values satisfy V(s) = ½ V(left) + ½ V(right) (the Bellman equation for this policy), with the ends 0
                        // and 1. Solve it by sweeping until nothing changes:
                        let V = [0.5, 0.5, 0.5, 0.5, 0.5]
                        for (let k = 0; k < 2000; k++) V = V.map((_, s) => 0.5 * (s === 0 ? 0 : V[s - 1]) + 0.5 * (s === 4 ? 1 : V[s + 1]))
                        console.log('true values: ' + V.map((v, s) => NAMES[s] + ' ' + v.toFixed(4)).join(', '))
                        const e = episode(seeded(3))
                        console.log('one episode: ' + e.states.map((s) => NAMES[s]).join(' → ') + ' → ' + (e.rewards.at(-1) ? 'right (reward 1)' : 'left (reward 0)'))
                    - type: js
                      instruction: |-
                        ### 2. One episode, two ways
                        Predict first: which states TD(0) changes.
                      startCode: |-
                        // The random walk: five states A to E in a row, starting at C. Each step goes left or right with equal chance.
                        // Off the left end the episode ends with reward 0, off the right end with reward 1; every other step earns 0.
                        // With γ = 1 a state's value is the chance of ending on the right. (Game Studio's random-number generator.)
                        const seeded = (seed) => { let a = seed >>> 0; return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296 } }
                        const NAMES = ['A', 'B', 'C', 'D', 'E']
                        // One episode: the states visited (0 to 4) and the rewards after each step.
                        function episode(rand) {
                          let s = 2
                          const states = [], rewards = []
                          for (;;) {
                            states.push(s)
                            s += rand() < 0.5 ? -1 : 1
                            if (s < 0) { rewards.push(0); return { states, rewards } }
                            if (s > 4) { rewards.push(1); return { states, rewards } }
                            rewards.push(0)
                          }
                        }

                        // The same episode, learned two ways, starting from V = 0.5 everywhere, α = 0.1, γ = 1.
                        // Monte Carlo waits for the episode's end, then moves each visited state towards the return G it actually got:
                        //   V(S_t) ← V(S_t) + α [G_t − V(S_t)]
                        // TD(0) updates after every step, towards the reward plus its estimate of the next state (bootstrapping):
                        //   V(S_t) ← V(S_t) + α [R_{t+1} + γ V(S_{t+1}) − V(S_t)]      (V of a terminal state is 0)
                        // Predict first: after this one episode, which states does TD(0) change?
                        const e = episode(seeded(3)), alpha = 0.1
                        const mc = [0.5, 0.5, 0.5, 0.5, 0.5], td = [0.5, 0.5, 0.5, 0.5, 0.5]
                        // Monte Carlo: G_t is the sum of the rewards from t on (γ = 1).
                        for (let t = 0; t < e.states.length; t++) {
                          const G = e.rewards.slice(t).reduce((a, b) => a + b, 0)
                          mc[e.states[t]] += alpha * (G - mc[e.states[t]])
                        }
                        // TD(0): each step's target is R + V(next), or R alone when the step ends the episode.
                        for (let t = 0; t < e.states.length; t++) {
                          const next = t + 1 < e.states.length ? td[e.states[t + 1]] : 0
