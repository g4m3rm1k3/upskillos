      # ───────────────────────────────────────────────────────────── 9.4
      - order: 4
        id: mg9-004
        slug: sarsa-and-q-learning
        title: SARSA and Q-learning
        subtitle: On-policy and off-policy learning, and why one walks the cliff edge while the other keeps away from it.
        tags: [game-studio, machine-learning, reinforcement-learning, sarsa, q-learning, on-policy, off-policy]
        aliases: sarsa q-learning on-policy off-policy behaviour policy target policy cliff walking expected sarsa glie td control
        timeToComplete: 55
        coreConcept: >-
          SARSA and Q-learning make the same TD update with different targets. SARSA uses the value of the action it
          will actually take next, R + γ Q(S′, A′), so it learns the value of the policy it follows, exploration included
          (on-policy). Q-learning uses the best next action, R + γ max Q(S′, ·), so it learns the value of acting
          greedily while it explores (off-policy). On the cliff that difference is visible: SARSA learns a safe walk away
          from the edge, because its own random steps make the edge dangerous; Q-learning learns the shortest walk along
          the edge, and pays for it while it explores.
        prerequisites: [mg9-003]
        nextLesson: mg9-005
        hook:
          question: >-
            Two agents learn the same cliff with the same exploration. One ends up walking right along the edge, the other
            takes the long way round. Neither is wrong: they are answering different questions. Which questions?
          realWorldContext: >-
            The on-policy/off-policy distinction runs through all of reinforcement learning: SARSA and policy-gradient
            methods are on-policy; Q-learning, DQN and learning from recorded data are off-policy. Sutton & Barto, section
            6.4–6.5 and Example 6.6, is the source of this lesson's cliff.
        intuition:
          prose:
            - >-
              **One step, two targets.** After S, A, R, S′, both learners move Q(S, A) towards a target. SARSA's is
              $R + \gamma Q(S', A')$, where A′ is the action it has already chosen for S′ (with its ε-greedy policy) and will
              take next: S, A, R, S′, A′, hence the name. Q-learning's is $R + \gamma \max_{a'} Q(S', a')$, whatever it does
              next. Before running cell 1, predict both for a step next to the spikes where the exploring policy picked
              "down" for A′: Q-learning's target is −9, SARSA's −41.
            - >-
              **What each learns.** SARSA estimates $Q^\pi$ for the policy it follows, random steps and all: **on-policy**.
              Q-learning estimates $Q^*$, the greedy policy's values, while following an exploring one: **off-policy**
              (the policy it learns about, the *target* policy, is not the one it acts with, the *behaviour* policy).
            - >-
              **On the cliff** (cell 2, 10 seeds, α 0.5, ε 0.1, 500 episodes): Q-learning's greedy walk is the shortest, 13
              moves, on every seed, but it earns −50.4 per episode while learning, because its walk is next to the spikes
              and ε sends it over. SARSA earns −27.2 while learning, and its greedy walk is the long way round along the top,
              17 moves on most seeds. In Game Studio's Cliff Walk you see the two sets of arrows on the grid.
            - >-
              **Why** (cell 3): along the edge, SARSA's Q(edge, right) is lower than Q-learning's (−20.4 against −11.0 at
              column 1), because SARSA's values include the falls its own ε-greedy steps cause there. Moving away from the
              edge is the best policy *for an agent that keeps exploring*. Q-learning's values assume it will act greedily,
              so the edge looks as good as it is for a greedy walker.
            - >-
              **When exploration stops.** Theory says SARSA reaches the optimal policy if exploration fades but never stops
              (GLIE). Cell 4 stops it: ε falling in a straight line to exactly 0. Even with 5000 episodes SARSA keeps its
              17-move walk: once it no longer explores, it never tries the edge again, so it never learns the edge is
              better. Stopping exploration freezes what was learned.
          callouts:
            - type: procedure
              title: "Procedure: choosing SARSA or Q-learning"
              body: >-
                Step 1. Will the agent keep exploring while it acts (training in the real world, a live game)? SARSA learns
                values that account for that.
                Step 2. Do you want the best policy for when exploring stops, or to learn from another policy's experience
                (recorded play)? Q-learning.
                Step 3. Compare both over seeds, on the learning return and the greedy score (lesson 9.2's two questions).
            - type: warning
              title: SARSA chooses A′ before the update, and then takes it
              body: >-
                The commonest SARSA bug is to choose the next action again after updating. Choose A′, use Q(S′, A′) in the
                target, then take that same A′. Otherwise it is neither SARSA nor Q-learning.
            - type: warning
              title: Greedy tables can loop
              body: >-
                In cell 2 two SARSA seeds' greedy walks never reach the chest (60 moves, the limit): two cells point at each
                other. A table read greedily is only a policy where it was learned well; judge it by playing it, and keep the
                best table seen (Game Studio's greedy checks do).
            - type: insight
              title: "What the picture shows (cell 5)"
              body: >-
                Misconception it contradicts: "the shortest path is always what an agent should learn". Green (Q-learning)
                hugs the spikes; blue (SARSA) keeps a row away. Each is right for the question it answers.
            - type: insight
              title: In the ML Lab
              body: >-
                ML Lab lesson 37.4 contrasts Q-learning with SARSA on its own gridworld with a ditch. [Open the ML
                Lab](#/lab/ml-lab).
          visualizations:
            - id: JSNotebook
              title: "Build it: SARSA against Q-learning"
              caption: The two targets, both learners on the cliff over 10 seeds, the values along the edge, stopping exploration, the two walks.
              props:
                lesson:
                  title: SARSA and Q-learning
                  subtitle: On-policy and off-policy.
                  cells:
                    - type: js
                      instruction: |-
                        ### 1. One step, two targets
                        Predict first: both targets.
                      startCode: |-
                        // One step, two targets. The Walker is next to the spikes at (column 4, row 2), moves right (R = −1) to
                        // (column 5, row 2). There Q(S′, ·) = [−9, −8, −40, −10] (up, right, down, left). Exploring with ε = 0.1, the
                        // action it will take next turned out to be A′ = down (a random step, into the spikes). γ = 1.
                        // Predict first: the two targets.
                        const r = -1, nextRow = [-9, -8, -40, -10], aNext = 2, gamma = 1
                        console.log('Q-learning target: R + γ max Q(S′, ·) = ' + (r + gamma * Math.max(...nextRow)))
                        console.log('SARSA target:      R + γ Q(S′, A′)    = ' + (r + gamma * nextRow[aNext]))
                        // Expected SARSA (lesson 9.4) averages over the policy instead: ε/4 for each action, plus 1 − ε for the best.
                        const probs = nextRow.map((q) => 0.1 / 4 + (q === Math.max(...nextRow) ? 0.9 : 0))
                        console.log('Expected SARSA:    R + γ Σ π Q(S′, ·) = ' + +(r + gamma * nextRow.reduce((s, q, i) => s + probs[i] * q, 0)).toFixed(3))
                    - type: js
                      instruction: |-
                        ### 2. Both on the cliff
                        Predict first: which earns more while learning, and whose walk is shorter.
                      startCode: |-
                        // The cliff, as in Game Studio's Cliff Walk: 12 × 4 cells, start bottom-left, chest bottom-right, spikes between.
                        // Every move costs 1; the spikes cost 100 and send you back to the start. A state is column × 4 + row.
                        const seeded = (seed) => { let a = seed >>> 0; return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296 } }
                        const MOVES = [[0, -1], [1, 0], [0, 1], [-1, 0]], ARROWS = ['↑', '→', '↓', '←'], START = 0 * 4 + 3, CHEST = 11 * 4 + 3
                        function move(s, a) {
                          const x = Math.min(11, Math.max(0, Math.floor(s / 4) + MOVES[a][0])), y = Math.min(3, Math.max(0, (s % 4) + MOVES[a][1]))
                          if (y === 3 && x > 0 && x < 11) return { next: START, reward: -100, done: false }
                          const next = x * 4 + y
                          return { next, reward: -1, done: next === CHEST }
                        }
                        const greedyOf = (row, rand) => { const best = Math.max(...row), ties = []; row.forEach((q, a) => { if (q === best) ties.push(a) }); return ties[Math.floor(rand() * ties.length)] }
                        // One learner, either update. SARSA chooses A′ before updating and then takes it; Q-learning uses the max.
                        function train(method, { episodes = 500, alpha = 0.5, gamma = 1, eps0 = 0.1, eps1 = 0.1, seed = 1 } = {}) {
                          const rand = seeded(seed), Q = Array.from({ length: 48 }, () => [0, 0, 0, 0]), returns = []
                          const choose = (s, eps) => (rand() < eps ? Math.floor(rand() * 4) : greedyOf(Q[s], rand))
                          for (let ep = 0; ep < episodes; ep++) {
                            const eps = eps0 + (eps1 - eps0) * (ep / Math.max(1, episodes - 1))
                            let s = START, a = choose(s, eps), total = 0
                            for (let t = 0; t < 1000; t++) {
                              const r = move(s, a)
                              total += r.reward
                              const a2 = choose(r.next, eps)
                              const future = r.done ? 0 : method === 'sarsa' ? Q[r.next][a2] : Math.max(...Q[r.next])
                              Q[s][a] += alpha * (r.reward + gamma * future - Q[s][a])
                              if (r.done) break
                              s = r.next
                              a = method === 'sarsa' ? a2 : choose(s, eps)
                            }
                            returns.push(total)
                          }
                          return { Q, returns }
                        }
                        // The greedy walk: the cells it passes and its length.
                        function walk(Q) {
                          let s = START, moves = 0
                          const cells = new Set([s])
                          while (s !== CHEST && moves < 60) { const a = Q[s].indexOf(Math.max(...Q[s])); s = move(s, a).next; cells.add(s); moves++ }
                          return { moves, cells }
                        }
                        const mean = (xs) => xs.reduce((a, b) => a + b, 0) / xs.length

                        // Both learners, 500 episodes, α 0.5, ε 0.1 constant, γ 1, over 10 seeds. Predict first: which earns more per
                        // episode while learning, and whose greedy walk is shorter?
                        for (const method of ['q', 'sarsa']) {
                          const runs = Array.from({ length: 10 }, (_, k) => train(method, { seed: k + 1 }))
                          const late = mean(runs.map((r) => mean(r.returns.slice(-100))))
                          const lengths = runs.map((r) => walk(r.Q).moves)
                          console.log((method === 'q' ? 'Q-learning' : 'SARSA     ') + ': return per episode (last 100) ' + late.toFixed(1) + ', greedy walk ' + lengths.join(', ') + ' moves')
                        }
                    - type: js
                      instruction: |-
                        ### 3. Why: the values along the edge
                        Predict first: whose Q(edge, right) is lower.
                      startCode: |-
                        // The cliff, as in Game Studio's Cliff Walk: 12 × 4 cells, start bottom-left, chest bottom-right, spikes between.
                        // Every move costs 1; the spikes cost 100 and send you back to the start. A state is column × 4 + row.
                        const seeded = (seed) => { let a = seed >>> 0; return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296 } }
                        const MOVES = [[0, -1], [1, 0], [0, 1], [-1, 0]], ARROWS = ['↑', '→', '↓', '←'], START = 0 * 4 + 3, CHEST = 11 * 4 + 3
                        function move(s, a) {
                          const x = Math.min(11, Math.max(0, Math.floor(s / 4) + MOVES[a][0])), y = Math.min(3, Math.max(0, (s % 4) + MOVES[a][1]))
                          if (y === 3 && x > 0 && x < 11) return { next: START, reward: -100, done: false }
                          const next = x * 4 + y
                          return { next, reward: -1, done: next === CHEST }
                        }
                        const greedyOf = (row, rand) => { const best = Math.max(...row), ties = []; row.forEach((q, a) => { if (q === best) ties.push(a) }); return ties[Math.floor(rand() * ties.length)] }
                        // One learner, either update. SARSA chooses A′ before updating and then takes it; Q-learning uses the max.
                        function train(method, { episodes = 500, alpha = 0.5, gamma = 1, eps0 = 0.1, eps1 = 0.1, seed = 1 } = {}) {
                          const rand = seeded(seed), Q = Array.from({ length: 48 }, () => [0, 0, 0, 0]), returns = []
                          const choose = (s, eps) => (rand() < eps ? Math.floor(rand() * 4) : greedyOf(Q[s], rand))
                          for (let ep = 0; ep < episodes; ep++) {
                            const eps = eps0 + (eps1 - eps0) * (ep / Math.max(1, episodes - 1))
                            let s = START, a = choose(s, eps), total = 0
                            for (let t = 0; t < 1000; t++) {
                              const r = move(s, a)
                              total += r.reward
                              const a2 = choose(r.next, eps)
                              const future = r.done ? 0 : method === 'sarsa' ? Q[r.next][a2] : Math.max(...Q[r.next])
                              Q[s][a] += alpha * (r.reward + gamma * future - Q[s][a])
                              if (r.done) break
