  # ═══════════════════════════════════════════════════════════════ Chapter 8: Bonus
  - number: 8
    slug: bonus-a-game-that-learns
    lessons:
      # ───────────────────────────────────────────────────────────── 8.1
      - order: 1
        id: mg8-001
        slug: a-game-that-learns
        title: "Bonus: A Game That Learns to Play Itself"
        subtitle: Q-learning from the ground up, in a notebook and then in Game Studio, where it learns Breakout from a score alone.
        tags: [game-studio, machine-learning, reinforcement-learning, q-learning]
        aliases: reinforcement learning q-learning q table bellman equation td error temporal difference epsilon greedy discount return environment agent reward state bins train
        timeToComplete: 60
        coreConcept: >-
          An agent learns by trial and error what each action is worth in each state. Q-learning keeps a table of Q(s, a), the
          return it expects from taking action a in state s and playing well afterwards, and after every step nudges one entry
          towards what that step showed: the reward plus the discounted best value of the next state,
          Q(s, a) ← Q(s, a) + α [r + γ max Q(s′, ·) − Q(s, a)]. Acting greedily on the table is the learned policy. In Game Studio
          a game becomes the environment: its numbers, cut into bins, are the states; its controls are the actions; its score
          is the reward.
        prerequisites: [mg7-009]
        nextLesson: mg9-001
        hook:
          question: >-
            Could Breakout learn to play itself, with no rules written for it, only a score to chase? Nobody tells it "move
            towards the ball". How could a table of numbers, updated one step at a time, end up clearing the wall?
          realWorldContext: >-
            Q-learning (Watkins, 1989) is the root of the agents that learned Atari games from the score alone (DQN, 2015, is
            Q-learning with a neural network in place of the table). The ML Lab's lab 37 derives it on a gridworld; this lesson
            builds it again on a game, then trains it on your Breakout in Game Studio with Run › Train an agent….
        intuition:
          prose:
            - >-
              **The loop.** An agent and a game take turns. At step t the agent sees the state $S_t$, picks an action $A_t$,
              and the game answers with a reward $R_{t+1}$ and the next state $S_{t+1}$. An **episode** is one game, from
              reset until it ends. In Game Studio a step is 4 frames, so a Breakout agent decides 15 times a second; its
              actions are the player's controls (hold left, or hold right, with Space so the ball launches), and its reward is
              +1 for every brick and −3 for every lost ball.
            - >-
              **States.** A table needs a finite list of states, and a game's numbers are continuous. So each number the agent
              uses is cut into **bins** by cut points: a value falls in bin $i$ when $i$ of the cuts are below it, and the bins
              of several numbers combine like digits. The notebook's Catch game has 11 offsets (ball minus paddle) times 4 rows:
              44 states. Breakout uses 7 bins of "ball minus paddle" and 2 of "going up or down": 14 states. Before running
              cell 1, predict how often random play catches the ball in Catch: about 1 in 6.
            - >-
              **The return.** What the agent wants is not the next reward but all of them, with later ones counting a little
              less: $G_t = R_{t+1} + \gamma R_{t+2} + \gamma^2 R_{t+3} + \cdots$, with discount $0 \le \gamma < 1$. It
              satisfies $G_t = R_{t+1} + \gamma G_{t+1}$: one reward, then the return from the next step on. Before running
              cell 2, predict the return of a catch in Catch, rewards 0, 0, 0, 1 with $\gamma = 0.97$: $0.97^3 \approx 0.913$.
            - >-
              **What an action is worth.** $Q(s, a)$ is the return the agent expects if it takes $a$ in $s$ and plays well
              afterwards. The best possible values, $Q^*$, obey the **Bellman optimality equation**:
              $Q^*(s, a) = \mathbb{E}[R_{t+1} + \gamma \max_{a'} Q^*(S_{t+1}, a') \mid S_t = s, A_t = a]$. One step's reward,
              then the best you can do from where you land. If you had $Q^*$, playing well would be easy: in each state take
              the action with the highest value (act **greedily**).
            - >-
              **The update.** The agent does not know $Q^*$, and the game's rules are hidden in its code. But every step it
              takes is one sample of the right-hand side: it saw $r$ and $s'$. So it moves its estimate a fraction $\alpha$
              towards that sample. The **TD target** is $r + \gamma \max_{a'} Q(s', a')$ (just $r$ when the step ended the
              episode), the **TD error** is $\delta = \text{target} - Q(s, a)$, and $Q(s, a) \leftarrow Q(s, a) + \alpha\delta$.
              Before running cell 3, predict the new value for $Q = 0.5$, $r = 1$, next row $[0.8, 0.3]$, $\gamma = 0.97$,
              $\alpha = 0.2$: the target is $1.776$, $\delta = 1.276$, so $0.7552$.
            - >-
              **Exploring.** A table that starts at all zeros has nothing to prefer, and an agent that only ever does what it
              currently thinks best never finds out about the rest. So it acts **ε-greedily**: with probability ε a random
              action, otherwise the greedy one, ties broken at random. Game Studio lowers ε from 0.3 to 0.02 over training:
              explore first, exploit later. Before running cell 4, predict how many episodes Catch needs before greedy play
              catches every ball: about 25.
            - >-
              **What the table holds.** After training, the greedy choices can be right while many numbers are not yet $Q^*$:
              actions the agent stopped trying keep their old estimates. Cell 5 compares them, then trains with ε = 1 (every
              action random) and the table converges to $Q^*$ anyway. Q-learning learns the best policy's values while
              behaving differently: it is **off-policy**, because its target uses the max, not the action it will actually take.
            - >-
              **In Game Studio.** Run › Train an agent… holds the environment as JSON: what the agent sees (node paths such as
              Ball:position.x, with the bins that make them states), does and earns. Train plays Breakout headless on the real
              engine, about 100 episodes in 15 seconds. Every 10 episodes it plays greedily, without learning, on games it
              did not train on, and keeps the best table: a table on binned states is noisy, and one bin hides details that
              matter. Random play averages −5.3; the trained agent averages 48.0, the whole wall. With only 3 bins across it
              averages 34.0. Try it below.
          callouts:
            - type: procedure
              title: "Procedure: Train a Q-learning agent on a game"
              body: >-
                Step 1. Say what the agent sees: node paths to numbers, scaled to about −1 to 1, and differences (minus) where
                the difference is what decides the move.
                Step 2. Cut the deciding numbers into bins: a cut point at each place the right action changes.
                Step 3. Say what it does (input actions held for a step) and what it earns (how much each value changes).
                Step 4. Train: α 0.2, γ 0.97, ε from 0.3 down; watch the learning curve and the greedy checks. ▶ Train in view
                plays every episode in the game, from real time to as fast as it goes, and learns exactly what Train does headless.
                Step 5. Read the table: rows it visited often, and what it does there.
                Step 6. Watch it play, and change the states or the reward if it plays oddly.
            - type: warning
              title: A table only knows the states you give it
              body: >-
                Two situations in the same bin get the same row, so the agent must do the same in both. In Breakout the state
                leaves out the ball's sideways speed, so "far to the right" mixes a ball flying away with one coming back off
                the wall, and some rows look wrong even after hundreds of visits. Fewer bins make it worse (34 instead of 48);
                more readings with bins make more states, each visited less often.
            - type: warning
              title: Rewards teach exactly what they say
              body: >-
                With +1 per brick and nothing for losing a ball, three training runs scored 43, 1 and 48: catching the ball
                only pays off through later bricks, which a short-sighted or unlucky run misses. With −3 per lost ball all three
                scored 48. An agent chases the reward you wrote, not the one you meant (ML Lab lesson 37.5).
            - type: insight
              title: "What the picture shows (cell 7)"
              body: >-
                Misconception it contradicts: "the agent learns rules". It learns a number for each state and action; the
                arrows are just where the biggest number is. Grey squares were never visited, so their row is still all
                zeros: the table knows nothing there.
            - type: insight
              title: The other button, Cross-entropy
              body: >-
                Run › Train an agent… also has the cross-entropy method: it never learns values, it tries many random
                weightings of a linear rule, keeps the best few, and searches around them (37 on Breakout). Q-learning learns
                from every step; the cross-entropy method only from whole games.
            - type: insight
              title: Where this comes from
              body: >-
                The ML Lab's lab 37 (Reinforcement learning) derives all of this on a gridworld: lesson 37.1 the loop and
                returns, 37.2 value functions and the Bellman equations, 37.3 value iteration, 37.4 Q-learning, 37.5 reward
                misspecification. [Open the ML Lab](#/lab/ml-lab) for the full derivations.
          visualizations:
            - id: JSNotebook
              title: "Build it: Q-learning on a small game"
              caption: States, returns, one update, training, the table against Q*, Breakout's bins, and a picture of what it learned.
              props:
                lesson:
                  title: Q-learning
                  subtitle: A table of values, learned one step at a time.
                  cells:
                    - type: js
