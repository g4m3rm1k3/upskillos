                        ### 3. Many episodes
                        Predict first: which is closer after 100 episodes.
                      startCode: |-
                        // The random walk: five states A to E in a row, starting at C. Each step goes left or right with equal chance.
                        // Off the left end the episode ends with reward 0, off the right end with reward 1; every other step earns 0.
                        // With γ = 1 a state's value is the chance of ending on the right. (Game Studio's random-number generator.)
                        const seeded = (seed) => { let a = seed >>> 0; return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296 } }
                        const NAMES = ['A', 'B', 'C', 'D', 'E']
                        // One episode: the states visited (0 to 4) and the rewards after each step.
                        function episode(rand) {
                          let s = 2
                          const states = [], rewards = []
                          for (;;) {
                            states.push(s)
                            s += rand() < 0.5 ? -1 : 1
                            if (s < 0) { rewards.push(0); return { states, rewards } }
                            if (s > 4) { rewards.push(1); return { states, rewards } }
                            rewards.push(0)
                          }
                        }

                        // Over many episodes. The error is the root mean square of V − true value over A to E, averaged over 100 runs
                        // (each run starts again from 0.5 everywhere). Predict first: after 100 episodes, which is closer?
                        const TRUE = [1, 2, 3, 4, 5].map((k) => k / 6)
                        const rms = (V) => Math.sqrt(V.reduce((a, v, s) => a + (v - TRUE[s]) ** 2, 0) / 5)
                        function learn(method, alpha, episodes, seed) {
                          const rand = seeded(seed), V = [0.5, 0.5, 0.5, 0.5, 0.5], errs = [rms(V)]
                          for (let n = 0; n < episodes; n++) {
                            const e = episode(rand)
                            for (let t = 0; t < e.states.length; t++) {
                              const target = method === 'mc' ? e.rewards.slice(t).reduce((a, b) => a + b, 0) : e.rewards[t] + (t + 1 < e.states.length ? V[e.states[t + 1]] : 0)
                              V[e.states[t]] += alpha * (target - V[e.states[t]])
                            }
                            errs.push(rms(V))
                          }
                          return errs
                        }
                        const average = (method, alpha) => { const runs = Array.from({ length: 100 }, (_, k) => learn(method, alpha, 100, k + 1)); return runs[0].map((_, i) => runs.reduce((a, r) => a + r[i], 0) / runs.length) }
                        for (const [method, alpha] of [['td', 0.1], ['td', 0.05], ['mc', 0.03], ['mc', 0.01]]) {
                          const err = average(method, alpha)
                          console.log((method === 'td' ? 'TD(0)' : 'Monte Carlo') + ' α ' + alpha + ': error ' + [0, 10, 25, 50, 100].map((n) => 'after ' + n + ' ' + err[n].toFixed(3)).join(', '))
