      # ───────────────────────────────────────────────────────────── 9.7
      - order: 7
        id: mg9-007
        slug: bigger-state-spaces
        title: Bigger State Spaces
        subtitle: How many states, and which. Too few blind the agent, too many starve it, and the right number can replace ten.
        tags: [game-studio, machine-learning, reinforcement-learning, state-design, aliasing, markov-property, discretization]
        aliases: state space discretization binning resolution aliasing perceptual aliasing markov property partial observability curse of dimensionality feature engineering
        timeToComplete: 50
        coreConcept: >-
          A table learns one value per state, so the states decide what the agent can tell apart. Too coarse, and two
          situations that need different actions share a state (aliasing): the agent can only learn their average, and
          may get worse with training. Too fine, and each state is visited rarely, so learning is slow: every number
          added multiplies the states. The cure for aliasing is the missing information, and the best cure is often one
          engineered number (where the ball will land) rather than more raw ones.
        prerequisites: [mg9-006]
        nextLesson: mg9-008
        hook:
          question: >-
            You give the agent more detail about the game, and it plays worse. You give it less, and it plays perfectly.
            How can more information hurt, and how do you choose?
          realWorldContext: >-
            Every table-based method faces this; it is why deep reinforcement learning replaced tables with networks that
            generalise between similar states (lesson 9.8), and why feature design still matters there. Sutton & Barto,
            chapter 9 (on-policy prediction with approximation), discusses state aggregation, the formal name for binning.
        intuition:
          prose:
            - >-
              **Resolution** (cell 1, the catch game of lesson 9.3, ball − paddle in different bins). With 2 bins (left, or
              right-or-under), "right under the paddle" shares a state with "to the right", so the agent cannot learn to
              stay; it gets worse the longer it trains (catches 0.45, then 0.10, then 0.00). With 3 or 7 bins it catches
              everything within 100 episodes. With 39 bins (one per possible difference) it is exact but slow: 0.79 after
              100 episodes, 0.67 after 1000, 1.00 only by 5000. Before running it, predict which learns fastest.
            - >-
              **Aliasing** (cell 2). Now each ball drifts sideways (−1, 0 or +1 columns a row). Seeing only ball − paddle, a
              drifting ball and a still one look the same but need different moves: catches 0.46. Adding the drift as a
              second number (21 states) gives 0.84. One engineered number, where the ball will land minus the paddle,
              gives 1.00 with only 7 states: it contains exactly what decides the move.
            - >-
              **The Markov property.** A state is *Markov* if it holds everything about the past that matters for the
              future: $P(S_{t+1}, R_{t+1} \mid S_t, A_t) = P(S_{t+1}, R_{t+1} \mid S_t, A_t, S_{t-1}, \ldots)$. Aliased
              states are not, which is why the drifting agent cannot do better than average. A common fix in games is to add
              velocity (the change since the last frame), as Breakout's "falling" bit does.
            - >-
              **Cost** (cell 3). A budget of 10,000 updates gives 1,429 per state for 7 states but one per state for 10,000.
              Breakout measures it (100 episodes, 3 seeds): 3 bins across score 39, 21, 21; 7 bins 35, 48, 48; 13 bins 38, 46,
              42; adding "ball going right" (28 states) 40, 44, 45. The extra number can help in principle, but not within
              this budget. Start with the fewest states that tell apart the situations needing different actions; add
              numbers when you can show a situation they fix.
          callouts:
            - type: procedure
              title: "Procedure: designing states"
              body: >-
                Step 1. List the situations that need different actions.
                Step 2. Find the fewest numbers that tell them apart; prefer one engineered number to several raw ones.
                Step 3. Bin each where the right action changes, finer where it matters (near the paddle), coarser elsewhere.
                Step 4. Count the states; estimate updates per state from your training budget.
                Step 5. Measure against a coarser and a finer design (Compare, or separate runs over seeds).
            - type: warning
              title: An aliased agent can get worse with training
              body: >-
                If one state covers situations needing opposite actions, the values chase whichever happened recently, and
                the greedy choice can settle on the wrong one (cell 1, 2 bins: 0.45, then 0.10, then 0.00).
            - type: warning
              title: Raw numbers are rarely the best numbers
              body: >-
                Positions and speeds are what the game stores; the agent needs what decides the action. A relative or
                predicted quantity (ball − paddle, where it will land) often replaces several raw ones.
            - type: insight
              title: Why tables give way to networks
              body: >-
                A table cannot share what it learns between neighbouring states: each of 39 bins is learned alone. Function
                approximation (lesson 9.8) lets nearby states share, which is how agents handle millions of states.
          visualizations:
            - id: JSNotebook
              title: "Build it: how many states, and which"
              caption: Resolution, aliasing and its fixes, and what states cost.
              props:
                lesson:
                  title: Bigger state spaces
                  subtitle: Resolution, aliasing, cost.
                  cells:
                    - type: js
                      instruction: |-
                        ### 1. Resolution
                        Predict first: which learns fastest, which ends best.
                      startCode: |-
                        // A wide catch game, as in lesson 9.3: 20 columns, the ball falls 10 rows, the paddle starts in the middle and
                        // moves left, stays or moves right each row. +1 a catch, −1 a miss. This time the ball can drift: each episode it
                        // is given a drift of −1, 0 or +1 columns per row (with "drift" on), so where it lands depends on more than where
                        // it is. (Game Studio's random-number generator.)
                        const seeded = (seed) => { let a = seed >>> 0; return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296 } }
                        const COLS = 20, ROWS = 10
                        const bin = (v, cuts) => { let i = 0; while (i < cuts.length && v >= cuts[i]) i++; return i }
                        function learn(observe, states, { episodes = 3000, drift = false, seed = 1 } = {}) {
                          const rand = seeded(seed), Q = Array.from({ length: states }, () => [0, 0, 0])
                          const pick = (row) => { const best = Math.max(...row), ties = [0, 1, 2].filter((a) => row[a] === best); return ties[Math.floor(rand() * ties.length)] }
                          const newGame = (r) => ({ ball: 4 + Math.floor(r() * 12), paddle: COLS / 2, row: 0, drift: drift ? Math.floor(r() * 3) - 1 : 0 })
                          const step = (g, a) => { g.paddle = Math.min(COLS - 1, Math.max(0, g.paddle + a - 1)); g.ball = Math.min(COLS - 1, Math.max(0, g.ball + g.drift)); g.row++ }
                          for (let ep = 0; ep < episodes; ep++) {
                            const g = newGame(rand)
                            let s = observe(g)
                            for (;;) {
                              const a = rand() < 0.1 ? Math.floor(rand() * 3) : pick(Q[s])
                              step(g, a)
                              const done = g.row === ROWS, r = done ? (g.ball === g.paddle ? 1 : -1) : 0, next = observe(g)
                              Q[s][a] += 0.2 * (r + (done ? 0 : 0.97 * Math.max(...Q[next])) - Q[s][a])
                              if (done) break
                              s = next
                            }
                          }
                          // The greedy catch rate over 300 fresh games.
                          const test = seeded(seed + 1000)
                          let caught = 0
                          for (let k = 0; k < 300; k++) {
                            const g = newGame(test)
                            while (g.row < ROWS) { const q = Q[observe(g)]; step(g, q.indexOf(Math.max(...q))) }
                            caught += g.ball === g.paddle ? 1 : 0
                          }
                          return caught / 300
                        }

                        // Resolution. The difference ball − paddle cut into 2, 3, 7 or 39 bins (39: one per possible difference, exact).
                        // Predict first: which learns fastest, and which ends best?
                        const designs = [['2 bins', [0]], ['3 bins', [-0.5, 0.5]], ['7 bins', [-6, -2, -0.5, 0.5, 2, 6]], ['39 bins', Array.from({ length: 38 }, (_, k) => k - 18.5)]]
                        for (const [name, cuts] of designs) {
                          const rates = [100, 1000, 5000].map((episodes) => learn((g) => bin(g.ball - g.paddle, cuts), cuts.length + 1, { episodes }))
                          console.log(name.padEnd(8) + ': catches after 100 episodes ' + rates[0].toFixed(2) + ', 1000 ' + rates[1].toFixed(2) + ', 5000 ' + rates[2].toFixed(2))
                        }
                    - type: js
                      instruction: |-
                        ### 2. Aliasing
                        Predict first: what does adding the drift do?
                      startCode: |-
                        // A wide catch game, as in lesson 9.3: 20 columns, the ball falls 10 rows, the paddle starts in the middle and
                        // moves left, stays or moves right each row. +1 a catch, −1 a miss. This time the ball can drift: each episode it
                        // is given a drift of −1, 0 or +1 columns per row (with "drift" on), so where it lands depends on more than where
                        // it is. (Game Studio's random-number generator.)
                        const seeded = (seed) => { let a = seed >>> 0; return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296 } }
                        const COLS = 20, ROWS = 10
                        const bin = (v, cuts) => { let i = 0; while (i < cuts.length && v >= cuts[i]) i++; return i }
                        function learn(observe, states, { episodes = 3000, drift = false, seed = 1 } = {}) {
                          const rand = seeded(seed), Q = Array.from({ length: states }, () => [0, 0, 0])
                          const pick = (row) => { const best = Math.max(...row), ties = [0, 1, 2].filter((a) => row[a] === best); return ties[Math.floor(rand() * ties.length)] }
                          const newGame = (r) => ({ ball: 4 + Math.floor(r() * 12), paddle: COLS / 2, row: 0, drift: drift ? Math.floor(r() * 3) - 1 : 0 })
                          const step = (g, a) => { g.paddle = Math.min(COLS - 1, Math.max(0, g.paddle + a - 1)); g.ball = Math.min(COLS - 1, Math.max(0, g.ball + g.drift)); g.row++ }
                          for (let ep = 0; ep < episodes; ep++) {
                            const g = newGame(rand)
                            let s = observe(g)
                            for (;;) {
                              const a = rand() < 0.1 ? Math.floor(rand() * 3) : pick(Q[s])
                              step(g, a)
                              const done = g.row === ROWS, r = done ? (g.ball === g.paddle ? 1 : -1) : 0, next = observe(g)
                              Q[s][a] += 0.2 * (r + (done ? 0 : 0.97 * Math.max(...Q[next])) - Q[s][a])
                              if (done) break
                              s = next
                            }
                          }
                          // The greedy catch rate over 300 fresh games.
                          const test = seeded(seed + 1000)
                          let caught = 0
                          for (let k = 0; k < 300; k++) {
                            const g = newGame(test)
                            while (g.row < ROWS) { const q = Q[observe(g)]; step(g, q.indexOf(Math.max(...q))) }
                            caught += g.ball === g.paddle ? 1 : 0
                          }
                          return caught / 300
                        }

                        // Aliasing. Now the ball drifts. Seeing only ball − paddle, a drifting ball and a still one in the same place are
                        // the same state but need different moves. Predict first: what does adding the drift (one more number, 3 bins) do?
                        const cuts = [-6, -2, -0.5, 0.5, 2, 6]
                        const without = learn((g) => bin(g.ball - g.paddle, cuts), 7, { drift: true, episodes: 5000 })
                        const withDrift = learn((g) => bin(g.ball - g.paddle, cuts) * 3 + (g.drift + 1), 21, { drift: true, episodes: 5000 })
                        // Where it will land (ball + drift × rows left) minus the paddle: one number that already contains the drift.
                        const landing = learn((g) => bin(g.ball + g.drift * (ROWS - g.row) - g.paddle, cuts), 7, { drift: true, episodes: 5000 })
                        console.log('drifting, sees ball − paddle (7 states):               catches ' + without.toFixed(2))
                        console.log('drifting, sees ball − paddle and drift (21 states):    catches ' + withDrift.toFixed(2))
                        console.log('drifting, sees where it will land − paddle (7 states): catches ' + landing.toFixed(2))
                    - type: js
                      instruction: |-
                        ### 3. What states cost
                        Predict first: updates per state for 4 numbers in 10 bins.
