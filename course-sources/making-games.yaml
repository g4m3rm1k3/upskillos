                        // Predict first: the new Q(S, right) under Q-learning.
                        const q = -2, r = -1, nextRow = [-3, -2.5, -50, -4], alpha = 0.5, gamma = 1
                        const target = r + gamma * Math.max(...nextRow)      // R + γ max_a′ Q(S′, a′)
                        const delta = target - q                             // the TD error
                        console.log('target ' + target + ', δ ' + delta + ', new Q(S, right) ' + (q + alpha * delta))
