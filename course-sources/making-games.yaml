                        // The return G_t = R_{t+1} + γ R_{t+2} + γ² R_{t+3} + …, and its recursion G_t = R_{t+1} + γ G_{t+1}.
                        // A catch: rewards 0, 0, 0, then +1. Predict first: G_0 with γ = 0.97.
                        const gamma = 0.97, rewards = [0, 0, 0, 1]                    // R_1 … R_4
                        let G = 0
                        for (let k = 0; k < rewards.length; k++) G += gamma ** k * rewards[k]
                        console.log('G_0 by the sum: ' + G.toFixed(6))
                        let back = 0
                        for (let t = rewards.length - 1; t >= 0; t--) back = rewards[t] + gamma * back   // G_t = R_{t+1} + γ G_{t+1}, from the end
                        console.log('G_0 by the recursion: ' + back.toFixed(6))
                        console.log('a Breakout brick 15 steps (1 second) away is worth ' + (0.97 ** 15).toFixed(3) + ' now')
