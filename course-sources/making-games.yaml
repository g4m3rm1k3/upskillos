            - id: GameStudioTask
              title: SARSA against Q-learning
              props:
                task: sarsa-vs-q
                lesson: mg9-004
                checkpoint: cp-mg9-004-4
        math:
          prose:
            - >-
              **Under the hood (optional).** SARSA's target is a sample of the Bellman expectation equation for the policy
              π it follows, $Q^\pi(s, a) = \mathbb{E}[R + \gamma Q^\pi(S', A') \mid s, a]$ with $A' \sim \pi(\cdot \mid S')$.
              Q-learning's is a sample of the Bellman optimality equation, $Q^*(s, a) = \mathbb{E}[R + \gamma \max_{a'} Q^*(S', a')]$.
            - >-
              Convergence: tabular SARSA converges to $Q^*$ with probability 1 if every pair is visited infinitely often,
              the step sizes satisfy the usual conditions, and the policy is GLIE (Singh et al., 2000). Q-learning converges
              to $Q^*$ with any behaviour policy that visits every pair infinitely often.
            - >-
              Expected SARSA, $R + \gamma \sum_{a'} \pi(a' \mid S') Q(S', a')$, removes the randomness of A′ from SARSA's
              target; with a greedy π it is exactly Q-learning. Lesson 9.5 compares it with the others.
          equations:
            - label: SARSA
              latex: 'Q(S, A) \leftarrow Q(S, A) + \alpha\,[R + \gamma\,Q(S'', A'') - Q(S, A)]'
            - label: Q-learning
              latex: 'Q(S, A) \leftarrow Q(S, A) + \alpha\,[R + \gamma \max_{a''} Q(S'', a'') - Q(S, A)]'
            - label: Expected SARSA
              latex: 'Q(S, A) \leftarrow Q(S, A) + \alpha\,[R + \gamma \textstyle\sum_{a''} \pi(a'' \mid S'')\,Q(S'', a'') - Q(S, A)]'
          callouts: []
          visualizations: []
        rigor:
          prose:
            - >-
              Formal statement: for a fixed ε > 0, SARSA converges to the optimal ε-greedy policy's values (the best policy
              among ε-soft ones), not to $Q^*$; Q-learning's greedy policy converges to an optimal one while its behaviour
              stays ε-greedy.
            - >-
              Invariant: if ε = 0 throughout and ties are broken the same way, SARSA's and Q-learning's updates are
              identical, because A′ is then the greedy action.
            - >-
              Geometric picture: on the cliff, the ε-soft optimal policy trades path length for distance from danger; as ε
              shrinks, the safe path's advantage shrinks with it.
            - >-
              Where it goes: 9.5, Expected SARSA and Double Q-learning, and the bias hidden in Q-learning's max.
          callouts: []
          visualizations: []
