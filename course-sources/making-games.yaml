      # ───────────────────────────────────────────────────────────── 9.3
      - order: 3
        id: mg9-003
        slug: breakout-from-scratch
        title: Breakout from Scratch
        subtitle: The recipe for giving any game a learning agent, done by hand on Breakout, and then a new wall to see it learn again.
        tags: [game-studio, machine-learning, reinforcement-learning, environment-design, state-design, reward-design, agents]
        aliases: environment design state design observation reward design agent script observe act reward done brain breakout apply reinforcement learning to a game
        timeToComplete: 75
        coreConcept: >-
          To give a game a learning agent you answer four questions in its script: what can it do (actions, and act()),
          what does it see (observe(): the few numbers that decide the right action, relative and scaled), what does it
          earn (reward(): what you actually want, with failure costly), and when is it over (done()). Then you choose the
          states (bins), train, check the result against random play, and ship the brain. The answers decide what it can
          ever learn: the same Breakout paddle learns nothing from the ball's and the paddle's positions, and clears the
          wall from their difference.
        prerequisites: [mg9-002]
        nextLesson: mg9-004
        hook:
          question: >-
            Every game you build could have an agent that learns to play it: an enemy, a teammate, a tester that finds
            your level's exploits. What do you actually have to write to make that happen, starting from a game that has
            none?
          realWorldContext: >-
            Game studios use learning agents for testing levels, tuning difficulty and building opponents; robotics and
            recommendation systems face the same design questions. Gymnasium environments, Unity ML-Agents and Game
            Studio's script agents all ask for the same four answers: actions, observations, rewards, and the end of an
            episode.
        intuition:
          prose:
            - >-
              **The recipe.** Open Breakout Lab (Project › Projects and examples…): Breakout with a plain, key-driven paddle,
              and a wall built from a text map. The Try it card takes you through it in Game Studio, one step at a time,
              each step checked by running your own script. This lesson explains every choice.
            - >-
              **1. Actions: what can it do?** The same things a player can, at the rate a player decides. The paddle gets
              actions = ['left', 'stay', 'right'] and act(action), which sets this.move = action − 1 until the next decision
              (decideEvery = 4 frames: 15 decisions a second), and launches the ball when it is resting, the job the Space
              key did. In physicsUpdate the paddle steers with this.move while ai.training, and with the keys otherwise, so
              you can still play it.
            - >-
              **2. Observations: what decides the move?** Ask what a good player looks at. Not the ball's position and the
              paddle's position, but how far the ball is from the paddle, and whether it is coming down. Cell 1 shows why on
              a small catch game: with ball and paddle each cut into 5 bins (25 states) the agent catches 10% of balls; with
              their difference in 6 bins (6 states) it catches every one. In Breakout itself the same mistake (ball x and
              paddle x, 4 bins each, 50 states) leaves the trained agent no better than random. Use relative numbers, scale
              them to about −1 to 1, and give only what decides the action.
            - >-
              **3. Reward: what do you want?** +1 for a brick and −3 for a lost ball (cell 2 reads them from the score and
              lives each decision). Make failure cost something: in the bonus lesson, with no penalty for losing a ball, three
              training runs scored 43, 1 and 48. Then check that random play scores badly (−5 here); if random play already
              scores well, the reward is not rewarding what you want.
            - >-
              **4. The end: done().** The balls are gone or the wall is cleared. A run that hits the step limit (maxSteps)
              is cut short, not ended, and learning treats it that way (lesson 9.1's warning).
            - >-
              **5. States.** Q-learning needs a table, so the numbers are cut into bins: 7 across (the middle one "over the
              paddle", ±0.03 of 480 pixels) × falling or not = 14 states. Every number you add multiplies the count (cell 3),
              and each state is then visited less often. Start small.
            - >-
              **6. Train, judge, ship.** Train (100 episodes, about 15 seconds): random play −5, the trained agent clears all
              48 bricks. Save as brain, give the paddle brain = 'brains/paddle.json', and the game plays itself, also in an
              exported game. If it fails: Step through updates (9.1), check what observe() returns while the game runs, and
              try one change at a time with Compare (9.2).
            - >-
              **A new wall.** Edit the map in scripts/wall.js (# a brick, . a gap) and train again. The agent sees the ball,
              not the bricks, so it learns the same skill, keeping the ball in play, on any wall: trained on the pyramid (20
              bricks) it clears all 20; on two columns at the sides (16) it clears 16 on every seed. The wall changes how
              much that skill earns per step, and so how quickly learning pays off. To aim at bricks it would need to see
              them: an observation for "which side has more bricks left", which is the next design step to try.
          callouts:
            - type: procedure
              title: "Procedure: a learning agent for any game"
              body: >-
                Step 1. Actions: the player's choices, held for decideEvery frames, set in act(action).
                Step 2. Observations: the few numbers that decide the action, relative and scaled, from observe().
                Step 3. Reward: what you want, with failure costly; check random play scores badly.
                Step 4. done(): when the episode is over.
                Step 5. Bins: as few states as tell apart the situations that need different actions.
                Step 6. Train; compare against random; Step through updates if it fails.
                Step 7. Save as brain and set the script's brain field.
            - type: warning
              title: Absolute positions hide the relationship
              body: >-
                "Ball at 300 and paddle at 500" and "ball at 600 and paddle at 800" need the same move, but are different
                states, each learned separately; worse, binning them coarsely mixes "ball left of paddle" with "ball right of
                paddle" in one state. The difference is one number that means the same thing everywhere.
            - type: warning
              title: Training and play must see the same thing
              body: >-
                The engine drives the agent through the same observe() and act() in training and in play. A script that
                reads input while ai.training is true, or acts differently when a brain is set, trains one agent and ships
                another.
            - type: insight
              title: For your own games
              body: >-
                An enemy is the same recipe: its moves as actions, the player's position relative to it as observations,
                reward for what you want it to do (reach the player, survive, guard a spot), and a scripted player to train
                against (ai.training lets the player script play itself). Lessons 9.9 and 9.11 build exactly that.
          visualizations:
            - id: JSNotebook
              title: "Build it: designing what an agent sees and earns"
              caption: Relative against absolute states on a catch game, rewards read from the score, and how states multiply.
              props:
                lesson:
                  title: Breakout from scratch
                  subtitle: The design choices, measured.
                  cells:
                    - type: js
                      instruction: |-
                        ### 1. What decides the move?
                        Predict first: which design catches every ball.
                      startCode: |-
                        // A wide catch game: a ball falls 10 rows in one of 20 columns, starting anywhere; the paddle (one column wide)
                        // starts in the middle and moves left, stays or moves right each row. +1 for a catch, −1 for a miss.
                        // The question is what the agent should see. (Game Studio's random-number generator.)
                        const seeded = (seed) => { let a = seed >>> 0; return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296 } }
                        const COLS = 20, ROWS = 10
                        const bin = (v, cuts) => { let i = 0; while (i < cuts.length && v >= cuts[i]) i++; return i }
                        // Q-learning with a given observe(game) → state number, then the greedy catch rate over every start column.
                        function learn(observe, states, episodes = 3000, seed = 1) {
                          const rand = seeded(seed), Q = Array.from({ length: states }, () => [0, 0, 0])
                          const pick = (row) => { const best = Math.max(...row), ties = [0, 1, 2].filter((a) => row[a] === best); return ties[Math.floor(rand() * ties.length)] }
                          for (let ep = 0; ep < episodes; ep++) {
                            const g = { ball: Math.floor(rand() * COLS), paddle: COLS / 2, row: 0 }
                            let s = observe(g)
                            for (;;) {
                              const a = rand() < 0.1 ? Math.floor(rand() * 3) : pick(Q[s])
                              g.paddle = Math.min(COLS - 1, Math.max(0, g.paddle + a - 1)); g.row++
                              const done = g.row === ROWS, r = done ? (g.ball === g.paddle ? 1 : -1) : 0, next = observe(g)
                              Q[s][a] += 0.2 * (r + (done ? 0 : 0.97 * Math.max(...Q[next])) - Q[s][a])
                              if (done) break
                              s = next
                            }
                          }
                          let caught = 0
                          for (let b = 0; b < COLS; b++) {
                            const g = { ball: b, paddle: COLS / 2, row: 0 }
                            while (g.row < ROWS) { const q = Q[observe(g)], a = q.indexOf(Math.max(...q)); g.paddle = Math.min(COLS - 1, Math.max(0, g.paddle + a - 1)); g.row++ }
                            caught += g.ball === g.paddle ? 1 : 0
                          }
                          return caught / COLS
                        }

                        // Two designs, each 25 or so states. Predict first: which catches every ball?
                        // A: where the ball is and where the paddle is, each cut into 5 bins of 4 columns (25 states).
                        const absolute = (g) => bin(g.ball, [4, 8, 12, 16]) * 5 + bin(g.paddle, [4, 8, 12, 16])
                        // B: how far the ball is across from the paddle, cut at −3, −1, 0, 1, 3 (6 bins; "under it" is its own bin).
                        const relative = (g) => bin(g.ball - g.paddle, [-3, -1, 0, 1, 3])
                        console.log('A, ball and paddle in 5 bins each (25 states): catches ' + learn(absolute, 25))
                        console.log('B, ball minus paddle in 6 bins (6 states):     catches ' + learn(relative, 6))
                    - type: js
                      instruction: |-
                        ### 2. Reward from the score
                        Predict first: the four rewards.
                      startCode: |-
                        // What it earns, read from the game: Breakout's ball keeps score (10 a brick) and lives. Each decision the agent's
                        // reward() reports the change since the last one: +1 a brick, −3 a lost ball. Predict first: the rewards for these
                        // four decisions.
                        const seen = [{ score: 0, lives: 3 }, { score: 20, lives: 3 }, { score: 20, lives: 2 }, { score: 30, lives: 2 }, { score: 30, lives: 2 }]
                        for (let k = 1; k < seen.length; k++) {
                          const r = (seen[k].score - seen[k - 1].score) / 10 - 3 * (seen[k - 1].lives - seen[k].lives)
                          console.log('decision ' + k + ': score ' + seen[k - 1].score + ' → ' + seen[k].score + ', lives ' + seen[k - 1].lives + ' → ' + seen[k].lives + ': reward ' + r)
                        }
                    - type: js
                      instruction: |-
                        ### 3. How states multiply
                        Predict first: the counts.
                      startCode: |-
                        // How many states a design makes: the product of each binned number's bin count (cuts + 1). Predict first:
                        // Breakout's 7 across × 2 falling; then with the ball's sideways direction added (2 more); then with the ball's
                        // height in 4 bins too.
                        const count = (cuts) => cuts.reduce((n, c) => n * (c.length + 1), 1)
                        const across = [-0.25, -0.1, -0.03, 0.03, 0.1, 0.25], falling = [0.5], sideways = [0], height = [0.25, 0.5, 0.75]
                        console.log('across × falling: ' + count([across, falling]) + ' states, ' + count([across, falling]) * 3 + ' Q values')
                        console.log('+ sideways: ' + count([across, falling, sideways]) + ' states')
                        console.log('+ height: ' + count([across, falling, sideways, height]) + ' states: each visited about ' + (count([across, falling]) / count([across, falling, sideways, height])).toFixed(3) + ' as often')
                    - type: challenge
                      instruction: |-
                        ### 4. Challenge: the paddle's observe()
                        The cases below check it.
                      startCode: |-
                        // Write observe() for Breakout's paddle, given the game's state as plain numbers: return
                        // [(ball x − paddle x) / 480, 1 if the ball is falling (velocity y > 0) else 0].
                        function observe(game) {
                          return [0, 0]
                        }

                        // ── The check (leave this part as it is) ──
                        const cases = [
                          { game: { ball: { x: 480, y: 300, vx: 0, vy: 0 }, paddle: { x: 480 } }, want: [0, 0], why: 'resting on the paddle: no difference, not falling' },
                          { game: { ball: { x: 720, y: 300, vx: 200, vy: 300 }, paddle: { x: 480 } }, want: [0.5, 1], why: '(720 − 480) / 480 = 0.5, and velocity y > 0 is falling' },
                          { game: { ball: { x: 100, y: 300, vx: -200, vy: -300 }, paddle: { x: 340 } }, want: [-0.5, 0], why: 'the ball is left of the paddle: (100 − 340) / 480 = −0.5; going up is not falling' },
                          { game: { ball: { x: 500, y: 300, vx: 0, vy: 1 }, paddle: { x: 500 } }, want: [0, 1], why: 'any downward speed is falling' },
                        ]
                        let passed = 0
                        for (const [i, c] of cases.entries()) {
                          const got = observe(c.game)
                          const ok = Array.isArray(got) && got.length === 2 && got.every((x, k) => Math.abs(x - c.want[k]) < 1e-9)
                          passed += ok
                          console.log((ok ? '✓' : '✗') + ' case ' + (i + 1) + ': got ' + JSON.stringify(got) + (ok ? '' : ', want ' + JSON.stringify(c.want) + ': ' + c.why))
                        }
                        console.log(passed === cases.length ? '✓ All 4 cases pass: that is what the paddle should see.' : passed + ' of 4 cases pass.')
                      solutionCode: |-
                        // Write observe() for Breakout's paddle, given the game's state as plain numbers: return
                        // [(ball x − paddle x) / 480, 1 if the ball is falling (velocity y > 0) else 0].
                        function observe(game) {
                          return [(game.ball.x - game.paddle.x) / 480, game.ball.vy > 0 ? 1 : 0]
                        }

                        // ── The check (leave this part as it is) ──
                        const cases = [
                          { game: { ball: { x: 480, y: 300, vx: 0, vy: 0 }, paddle: { x: 480 } }, want: [0, 0], why: 'resting on the paddle: no difference, not falling' },
                          { game: { ball: { x: 720, y: 300, vx: 200, vy: 300 }, paddle: { x: 480 } }, want: [0.5, 1], why: '(720 − 480) / 480 = 0.5, and velocity y > 0 is falling' },
                          { game: { ball: { x: 100, y: 300, vx: -200, vy: -300 }, paddle: { x: 340 } }, want: [-0.5, 0], why: 'the ball is left of the paddle: (100 − 340) / 480 = −0.5; going up is not falling' },
                          { game: { ball: { x: 500, y: 300, vx: 0, vy: 1 }, paddle: { x: 500 } }, want: [0, 1], why: 'any downward speed is falling' },
                        ]
                        let passed = 0
                        for (const [i, c] of cases.entries()) {
                          const got = observe(c.game)
                          const ok = Array.isArray(got) && got.length === 2 && got.every((x, k) => Math.abs(x - c.want[k]) < 1e-9)
                          passed += ok
                          console.log((ok ? '✓' : '✗') + ' case ' + (i + 1) + ': got ' + JSON.stringify(got) + (ok ? '' : ', want ' + JSON.stringify(c.want) + ': ' + c.why))
                        }
                        console.log(passed === cases.length ? '✓ All 4 cases pass: that is what the paddle should see.' : passed + ' of 4 cases pass.')
            - id: GameStudioTask
