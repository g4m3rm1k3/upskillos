                    - type: challenge
                      instruction: |-
                        ### 5. Challenge: ε-greedy's probabilities
                        The cases below check it.
                      startCode: |-
                        // Write the probabilities of ε-greedy: each action gets ε/(number of actions), and the best action (or each of the
                        // tied best, sharing it) also gets 1 − ε. Return a list, one probability per action.
                        function epsilonGreedyProbs(Q, epsilon) {
                          return Q.map(() => 0)
                        }

                        // ── The check (leave this part as it is) ──
                        const near = (a, b) => a.length === b.length && a.every((x, i) => Math.abs(x - b[i]) < 1e-9)
                        const cases = [
                          { args: [[1, 5, 2], 0.3], want: [0.1, 0.8, 0.1], why: 'ε/3 = 0.1 each, and the best (5) also gets 1 − ε = 0.7' },
                          { args: [[0, 0, 0, 0], 0], want: [0.25, 0.25, 0.25, 0.25], why: 'with all tied, the four share 1 − ε equally' },
                          { args: [[3, 7, 7], 0.6], want: [0.2, 0.4, 0.4], why: 'ε/3 = 0.2 each; the two tied best share 0.4: 0.2 more each' },
                          { args: [[9, 1], 1], want: [0.5, 0.5], why: 'ε = 1 is uniformly random' },
                        ]
                        let passed = 0
                        for (const [i, c] of cases.entries()) {
                          const got = epsilonGreedyProbs(...c.args)
                          const ok = Array.isArray(got) && near(got, c.want)
                          passed += ok
                          console.log((ok ? '✓' : '✗') + ' case ' + (i + 1) + ': got [' + (Array.isArray(got) ? got.map((x) => +Number(x).toFixed(4)).join(', ') : got) + ']' + (ok ? '' : ', want [' + c.want.join(', ') + ']: ' + c.why))
                        }
                        console.log(passed === cases.length ? '✓ All 4 cases pass: that is ε-greedy.' : passed + ' of 4 cases pass.')
                      solutionCode: |-
                        // Write the probabilities of ε-greedy: each action gets ε/(number of actions), and the best action (or each of the
                        // tied best, sharing it) also gets 1 − ε. Return a list, one probability per action.
                        function epsilonGreedyProbs(Q, epsilon) {
                          const best = Math.max(...Q), ties = Q.filter((q) => q === best).length
                          return Q.map((q) => epsilon / Q.length + (q === best ? (1 - epsilon) / ties : 0))
                        }

                        // ── The check (leave this part as it is) ──
                        const near = (a, b) => a.length === b.length && a.every((x, i) => Math.abs(x - b[i]) < 1e-9)
                        const cases = [
                          { args: [[1, 5, 2], 0.3], want: [0.1, 0.8, 0.1], why: 'ε/3 = 0.1 each, and the best (5) also gets 1 − ε = 0.7' },
                          { args: [[0, 0, 0, 0], 0], want: [0.25, 0.25, 0.25, 0.25], why: 'with all tied, the four share 1 − ε equally' },
                          { args: [[3, 7, 7], 0.6], want: [0.2, 0.4, 0.4], why: 'ε/3 = 0.2 each; the two tied best share 0.4: 0.2 more each' },
                          { args: [[9, 1], 1], want: [0.5, 0.5], why: 'ε = 1 is uniformly random' },
                        ]
                        let passed = 0
                        for (const [i, c] of cases.entries()) {
                          const got = epsilonGreedyProbs(...c.args)
                          const ok = Array.isArray(got) && near(got, c.want)
                          passed += ok
                          console.log((ok ? '✓' : '✗') + ' case ' + (i + 1) + ': got [' + (Array.isArray(got) ? got.map((x) => +Number(x).toFixed(4)).join(', ') : got) + ']' + (ok ? '' : ', want [' + c.want.join(', ') + ']: ' + c.why))
                        }
                        console.log(passed === cases.length ? '✓ All 4 cases pass: that is ε-greedy.' : passed + ' of 4 cases pass.')
