                      solutionCode: |-
                        // Write the SARSA target: given the reward, the next state's row of Q values, the action A′ that will be taken
                        // there, whether the step ended the episode, and γ.
                        function sarsaTarget(reward, nextRow, aNext, done, gamma) {
                          return reward + (done ? 0 : gamma * nextRow[aNext])
                        }

                        // ── The check (leave this part as it is) ──
                        const cases = [
                          { args: [-1, [-9, -8, -40, -10], 2, false, 1], want: -41, why: 'SARSA uses Q(S′, A′), the action it will take: −1 + (−40)' },
