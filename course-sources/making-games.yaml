        math:
          prose:
            - >-
              **Under the hood (optional).** An environment is a Markov decision process only if the observation carries
              everything that matters for what happens next. Breakout's 14 states do not (they leave out the ball's
              sideways direction and the bricks), so it is partially observable: the table learns the best action *on
              average* over the situations each state lumps together.
            - >-
              Binning is a feature map $\phi(s)$ that is one-hot over bins. The Markov condition fails exactly where two
              situations that need different actions share a bin; that is what the absolute design does when ball and
              paddle fall on either side of each other inside one coarse bin.
            - >-
              Reward shaping: adding $F(s, s') = \gamma\Phi(s') - \Phi(s)$ to every reward, for any function $\Phi$ of the
              state, never changes which policy is optimal (Ng, Harada & Russell, 1999); other added rewards can. That is
              the safe way to give hints, such as rewarding the paddle for being under a falling ball.
          equations:
            - label: Relative observation
              latex: 'o_1 = \frac{x_{\text{ball}} - x_{\text{paddle}}}{480}'
            - label: Reward per decision
              latex: 'r = \frac{\Delta\,\text{score}}{10} - 3\,\Delta\,\text{lives lost}'
            - label: State count
              latex: '|\mathcal{S}| = \prod_i (k_i + 1)'
            - label: Potential-based shaping
              latex: 'r'' = r + \gamma\,\Phi(s'') - \Phi(s)'
          callouts: []
          visualizations: []
        rigor:
          prose:
            - >-
              Formal statement: a state abstraction that maps together only states with the same optimal action values
              ($Q^*$-irrelevance) keeps the optimal policy; coarser abstractions may not (Li, Walsh & Littman, 2006).
            - >-
              Invariant: translating the whole game sideways does not change the relative observation, so a policy learned
              on it is translation-invariant; the absolute observation is not.
            - >-
              Geometric picture: the relative design folds the 2D space of (ball, paddle) positions onto one line, the
              diagonal direction that matters; bins on that line separate "left of" from "right of" exactly.
            - >-
              Where it goes: 9.4 compares SARSA and Q-learning; 9.8 replaces bins with features when a table is too coarse.
          callouts: []
          visualizations: []
        examples:
          - id: mg9-003-ex1
            title: A reward from score and lives
            difficulty: easy
            problem: Between two decisions the score goes from 40 to 60 and the lives from 2 to 1. The reward?
            steps:
