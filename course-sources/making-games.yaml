                              a = method === 'sarsa' ? a2 : choose(s, eps)
                            }
                            returns.push(total)
                          }
                          return { Q, returns }
                        }
                        // The greedy walk: the cells it passes and its length.
                        function walk(Q) {
                          let s = START, moves = 0
                          const cells = new Set([s])
                          while (s !== CHEST && moves < 60) { const a = Q[s].indexOf(Math.max(...Q[s])); s = move(s, a).next; cells.add(s); moves++ }
                          return { moves, cells }
                        }
                        const mean = (xs) => xs.reduce((a, b) => a + b, 0) / xs.length

                        // Why. Along the edge (row 2), how much is moving right worth? Q-learning values the greedy walk: −1 a move to the
                        // chest. SARSA values the walk it actually takes, with ε-random steps, some into the spikes. Predict first: whose
                        // Q(edge, right) is lower?
                        const q = train('q', { seed: 1 }).Q, sarsa = train('sarsa', { seed: 1 }).Q
                        for (const col of [1, 5, 10]) {
                          const s = col * 4 + 2
                          console.log('column ' + col + ', row 2, right: Q-learning ' + q[s][1].toFixed(1) + ', SARSA ' + sarsa[s][1].toFixed(1))
                        }
