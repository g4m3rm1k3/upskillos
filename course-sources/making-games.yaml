                        function run(method, episodes, seed) {
                          const rand = seeded(seed), QA = [[0, 0], new Array(10).fill(0)], QB = [[0, 0], new Array(10).fill(0)], lefts = []
                          const sum = (s) => QA[s].map((q, a) => q + (method === 'double' ? QB[s][a] : 0))
                          const greedyOf = (row) => { const best = Math.max(...row), ties = []; row.forEach((q, a) => { if (q === best) ties.push(a) }); return ties[Math.floor(rand() * ties.length)] }
                          const choose = (s) => (rand() < 0.1 ? Math.floor(rand() * QA[s].length) : greedyOf(sum(s)))
                          for (let ep = 0; ep < episodes; ep++) {
                            const a = choose(0)
                            lefts.push(a === 0 ? 1 : 0)
                            const steps = a === 0 ? [[0, 0, 1], [1, choose(1), -1]] : [[0, 1, -1]]   // [state, action, next state (−1: end)]
                            for (const [s, act, next] of steps) {
                              const r = s === 1 ? -0.1 + normal(rand) : 0
                              if (method === 'double' && rand() < 0.5) {
                                const target = r + (next < 0 ? 0 : QA[next][greedyOf(QB[next])])
                                QB[s][act] += 0.1 * (target - QB[s][act])
                              } else {
                                const target = r + (next < 0 ? 0 : method === 'double' ? QB[next][greedyOf(QA[next])] : Math.max(...QA[next]))
                                QA[s][act] += 0.1 * (target - QA[s][act])
                              }
                            }
                          }
                          return lefts
                        }
                        const share = (method, upTo) => mean(Array.from({ length: 300 }, (_, k) => mean(run(method, 300, k + 1).slice(0, upTo))))

                        // How often each goes left, episode by episode (averaged over 300 runs): Q-learning (orange) against Double
                        // Q-learning (blue). The dashed line is 5%, the best possible while exploring with ε 0.1.
                        const curve = (method) => { const runs = Array.from({ length: 300 }, (_, k) => run(method, 300, k + 1)); return runs[0].map((_, i) => mean(runs.map((r) => r[i]))) }
                        const lines = [[curve('q'), '#f59e0b'], [curve('double'), '#60a5fa']]
                        const canvas = document.createElement('canvas'), W = 420, H = 210
                        canvas.width = W * 2; canvas.height = H * 2; canvas.style.cssText = 'width: ' + W + 'px; height: ' + H + 'px; display: block; margin: 0 auto'
                        document.body.appendChild(canvas)
                        const g = canvas.getContext('2d'); g.scale(2, 2); g.fillStyle = '#0f1923'; g.fillRect(0, 0, W, H)
                        const X = (i) => 40 + (i / 299) * (W - 56), Y = (v) => H - 28 - v * (H - 50)
                        g.strokeStyle = '#475569'; g.setLineDash([4, 3]); g.beginPath(); g.moveTo(X(0), Y(0.05)); g.lineTo(X(299), Y(0.05)); g.stroke(); g.setLineDash([])
                        for (const [c, color] of lines) { g.strokeStyle = color; g.lineWidth = 1.8; g.beginPath(); c.forEach((v, i) => (i ? g.lineTo(X(i), Y(v)) : g.moveTo(X(i), Y(v)))); g.stroke() }
                        g.fillStyle = '#cbd5e1'; g.font = '11px sans-serif'
                        g.fillText('% left from A', 6, 16); g.fillText('100%', 6, Y(1) + 4); g.fillText('5%', 18, Y(0.05) + 4); g.fillText('episodes →', W - 70, H - 8)
                        g.fillText('orange: Q-learning · blue: Double Q-learning', 110, 16)
                        console.log('peak left: Q-learning ' + Math.round(Math.max(...lines[0][0]) * 100) + '%, Double Q-learning ' + Math.round(Math.max(...lines[1][0]) * 100) + '%')
                      showPreviewByDefault: true
