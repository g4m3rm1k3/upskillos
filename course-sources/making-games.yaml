                      instruction: |-
                        ### 1. Greedy against ε-greedy
                        Predict first: does greedy win?
                      startCode: |-
                        // The 10-armed bandit: ten slot machines (actions). Arm a pays a reward drawn around its true value q*(a), with
                        // spread 1; the true values are themselves drawn around 0 (spread 1) for each new problem. The agent does not
                        // know them; it learns estimates Q(a) by trying arms. One "run" is a new problem played for 1000 pulls.
                        const seeded = (seed) => { let a = seed >>> 0; return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296 } }
                        const normal = (rand) => Math.sqrt(-2 * Math.log(1 - rand())) * Math.cos(2 * Math.PI * rand())
                        const argmaxRandom = (row, rand) => { const best = Math.max(...row), ties = []; row.forEach((q, a) => { if (q === best) ties.push(a) }); return ties[Math.floor(rand() * ties.length)] }
                        // One run of a method: average reward and whether the best arm was pulled, at each step.
                        function play(choose, { steps = 1000, q0 = 0, alpha = 0, seed }) {
                          const rand = seeded(seed), truth = Array.from({ length: 10 }, () => normal(rand)), best = truth.indexOf(Math.max(...truth))
                          const Q = new Array(10).fill(q0), N = new Array(10).fill(0), rewards = [], optimal = []
                          for (let t = 1; t <= steps; t++) {
                            const a = choose(Q, N, t, rand)
                            const r = truth[a] + normal(rand)
                            N[a]++
                            Q[a] += (alpha || 1 / N[a]) * (r - Q[a])          // sample average (α = 1/n), or a constant step
                            rewards.push(r); optimal.push(a === best ? 1 : 0)
                          }
                          return { rewards, optimal }
                        }
                        const greedy = (Q, N, t, rand) => argmaxRandom(Q, rand)
                        const epsGreedy = (eps) => (Q, N, t, rand) => (rand() < eps ? Math.floor(rand() * 10) : argmaxRandom(Q, rand))
                        const ucb = (c) => (Q, N, t, rand) => { const u = Q.map((q, a) => (N[a] === 0 ? Infinity : q + c * Math.sqrt(Math.log(t) / N[a]))); return argmaxRandom(u, rand) }
                        const softmax = (tau) => (Q, N, t, rand) => { const m = Math.max(...Q), e = Q.map((q) => Math.exp((q - m) / tau)), z = e.reduce((a, b) => a + b, 0); let u = rand() * z, a = 0; while (a < 9 && u >= e[a]) { u -= e[a]; a++ } return a }
                        // Averaged over runs: the mean reward and % best-arm pulls over steps 901–1000, and over all 1000.
                        function average(choose, opts, runs = 200) {
                          let late = 0, lateOpt = 0, all = 0
                          for (let k = 0; k < runs; k++) {
                            const r = play(choose, { ...opts, seed: k + 1 })
                            late += r.rewards.slice(900).reduce((a, b) => a + b, 0) / 100
                            lateOpt += r.optimal.slice(900).reduce((a, b) => a + b, 0) / 100
                            all += r.rewards.reduce((a, b) => a + b, 0) / 1000
                          }
                          return { late: late / runs, lateOpt: lateOpt / runs, all: all / runs }
                        }
                        const show = (name, r) => console.log(name.padEnd(28) + 'reward (last 100) ' + r.late.toFixed(2) + ', best arm ' + Math.round(r.lateOpt * 100) + '%, reward (all 1000) ' + r.all.toFixed(2))

                        // Greedy against ε-greedy, sample averages, 200 runs. Predict first: does always taking the best-looking arm win?
                        show('greedy (ε = 0)', average(greedy, {}))
                        show('ε-greedy, ε = 0.01', average(epsGreedy(0.01), {}))
                        show('ε-greedy, ε = 0.1', average(epsGreedy(0.1), {}))
