name: Deploy UpSkillOS to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_BASE_URL: /
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      NODE_OPTIONS: '--max-old-space-size=6144'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --prefer-offline

      # Pyodide's package wheels, checksum-verified against its lockfile
      # (scripts/fetch-pyodide-packages.mjs). The build ships them, so the
      # site and the desktop app don't load them from the CDN.
      - name: Cache Pyodide packages
        uses: actions/cache@v4
        with:
          path: .cache/pyodide-packages
          key: pyodide-packages-${{ hashFiles('package-lock.json', 'scripts/pyodide-bundle.mjs') }}
          restore-keys: pyodide-packages-

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
