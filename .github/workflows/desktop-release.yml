name: Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. v0.2.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            # Just --mac: the staged config's dmg target lists x64 and arm64. `--mac dmg` on the
            # command line replaces that with the runner's own arch only (arm64), so no Intel build.
            eb_args: '--mac'
            artifact: 'desktop/dist/*.dmg'
          - os: windows-latest
            platform: win
            eb_args: '--win portable'
            artifact: 'desktop/dist/*.exe'

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # npm ci installs exactly the lockfile (as the PR checks do), so the release
      # is built from the same packages that were tested.
      - name: Install dependencies
        run: npm ci --prefer-offline

      # Pyodide's package wheels, checksum-verified against its lockfile
      # (scripts/fetch-pyodide-packages.mjs). The build ships them, so the
      # site and the desktop app don't load them from the CDN.
      - name: Cache Pyodide packages
        uses: actions/cache@v4
        with:
          path: .cache/pyodide-packages
          key: pyodide-packages-${{ hashFiles('package-lock.json', 'scripts/pyodide-bundle.mjs') }}
          restore-keys: pyodide-packages-

      # Everything the app imports that a fresh checkout lacks: the gitignored
      # codebase graph, concept/practice/post manifests and Game Studio runtime,
      # plus lesson titles, ids, project facts and the Pyodide wheels. The same
      # step `npm run build` and `npm run desktop:build` start with. Without it,
      # every release up to v0.1.5 failed at the Vite step.
      - name: Generate build inputs
        run: npm run build:inputs

      - name: Build frontend (Vite)
        run: node --max-old-space-size=4096 ./node_modules/vite/bin/vite.js build
        env:
          ELECTRON_BUILD: '1'
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Sync desktop package.json
        run: node scripts/sync-desktop-package.mjs

      - name: Stage desktop app
        run: node scripts/prepare-desktop-build.mjs

      - name: Package (${{ matrix.platform }})
        run: node --max-old-space-size=4096 ./node_modules/electron-builder/cli.js --projectDir desktop/staging --publish never ${{ matrix.eb_args }}
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true
          # No signing certificate: don't look for one in the keychain. CSC_LINK and
          # WIN_CSC_LINK must be left unset, not set to '': on macOS electron-builder reads
          # an empty CSC_LINK as a certificate path, resolves it to the project folder and
          # fails with "desktop/staging not a file". Unset, it signs the Mac app ad hoc,
          # which Apple Silicon needs to run it at all.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag }}
          name: UpSkillOS ${{ github.ref_name || inputs.tag }}
          draft: true
          body: |
            ## UpSkillOS ${{ github.ref_name || inputs.tag }}

            ### Downloads
            | Platform | File |
            |---|---|
            | Mac (Intel + Apple Silicon) | `.dmg` below |
            | Windows 10/11 (64-bit) | `.exe` below — no install needed, just run it |

            ### What's new
            See the in-app "What's new" screen on first launch.
          files: |
            artifacts/desktop-mac/*.dmg
            artifacts/desktop-win/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
